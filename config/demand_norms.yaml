  # SUBSTITUTE BASE, peer-reviewed and government-survey derived :
  #   Fiedler & Yadav, "How can we better capture food away from Home?
  #   Lessons from India's linking person-level meal and household-level food
  #   data", Food Policy 72 (2017) 81-93, DOI 10.1016/j.foodpol.2017.08.015
