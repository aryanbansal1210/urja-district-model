# Per-capita and per-worker demand norms.
# Placeholder values shaped from URDPFI 2015 (Urban and Regional Development
# Plans Formulation and Implementation Guidelines, Government of India) and
# common Indian district master-plan practice. Replace with verified values
# when calibrating to a specific city.
# These convert demographic counts into floor-area or facility-count
# requirements, which the optimiser must satisfy when generating layouts.
# ---------------------------------------------------------------------------
# Calibration Status + Stage-F Target Norms (cited).
# Source: DATA/100k_peri_urban_punjab_calibration.md (B1-B5) + DATA/zirakpur_data_sources.md.
# The values BELOW are unchanged so the frozen optimised_sa layout stays valid; the cited
# targets here are to be SWAPPED IN at the Stage F re-anneal (they change facility COUNTS):
#   - Primary school:     1 per 5,000 population   (URDPFI 2014 via secondary)
#   - Senior-secondary:   1 per 7,500 population   (URDPFI 2014 via secondary)
#   - Urban Phc (Uphc):   1 per 50,000 population  (Iphs 2022, MoHFW)
#   - Urban Chc (Uchc):   1 per 2.5-3 lakh pop     (Iphs 2022, MoHFW)
#   LINKED (named-source sweep - IPHS was cited as
#   throughout this file and never once linked, which is the same
#   prose-only pattern behind the Aeee / CGWB / Teri retractions):
#     IPHS portal, MoHFW:  https://iphs.mohfw.gov.in/
#     PHC guidelines 2022: https://nhm.gov.in/images/pdf/guidelines/iphs/iphs-revised-guidlines-2022/03_PHC_IPHS_Guidelines-2022.pdf
#     CHC guidelines 2022: https://nhm.gov.in/images/pdf/guidelines/iphs/iphs-revised-guidlines-2022/02-CHC_IPHS_Guidelines-2022.pdf
#   Revised edition released 16-Apr-2022 by MoHFW, Government of India.
#   DOC-verified (the documents exist and are the right ones); the
#   population-per-facility ratios above have NOT been re-read from
#   them today. CLAIM verification is still outstanding.
#   - Open space:         10-12 m^2/capita         (URDPFI 2014 — matches current 12.0)
#   - Park hierarchy:     housing 0.5 ha/5,000; neighbourhood 1 ha/15,000; community 5 ha/100,000
#   - Convenience retail: ~4 m^2/capita            (URDPFI — matches current 4.0)
#   - Hotels:             NO reliable URDPFI norm found -> treat as market-driven (current 1.5/1,000 is a placeholder)
# IPHS uses FACILITY-per-population; the model currently uses beds & students-per-facility.
# Reconciling the two schemas (and the education divergence: current ~1/school-of-1500-students
# gives ~10 primary schools vs URDPFI's ~20) is a Stage-F task requiring a re-anneal.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Education (URDPFI 2015 Table 4.10)
# ---------------------------------------------------------------------------
education:
  # switched to URDPFI 2014 population-per-facility norms ( guideline).
  # Facility counts at 100k: primary ceil(100k/5000)=20, secondary ceil(100k/7500)=14.
  # Mapped to CELLS via floor-per-facility / floor-per-cell (a 200 m cell hosts a campus
  # of co-located facilities), so ~15 school cells (was ~20 via the legacy 1-school-per-cell).
  population_per_primary_school: 5000     # URDPFI 2014 Table ( via guideline)
  population_per_secondary_school: 7500   # URDPFI 2014 (senior secondary)
  floor_m2_per_primary_school: 2500       # ~0.4 ha site, G+1 building (URDPFI site norm)
  floor_m2_per_secondary_school: 5000     # larger senior-secondary campus
  # legacy: students-per-school derivation. Doc Only - NO Code Reads These Four
  # (verified). "fallback" in the old wording implied a code path
  # that does not exist; school sizing runs off population_per_*_school and
  # floor_m2_per_*_school above. Kept because they record how the frozen
  # seed-42 layout's school counts were originally derived.
  students_per_primary_school: 1500
  students_per_senior_secondary: 1500
  primary_share_of_enrolled: 0.55         # primary + middle
  secondary_share_of_enrolled: 0.45       # senior secondary

# ---------------------------------------------------------------------------
# Healthcare (URDPFI 2015 Table 4.13)
# ---------------------------------------------------------------------------
healthcare:
  # switched to IPHS 2022 (MoHFW) facility-per-population norms.
  # At 100k: Urban PHC ceil(100k/50000)=2; Urban CHC ceil(100k/275000)=1. Mapped to cells
  # via floor-per-facility -> ~2-3 healthcare cells (was ~12 via the beds->dispensary-per-cell
  # over-count). Fewer, larger, consolidated facilities — matches IPHS, more defensible.
  population_per_uphc: 50000              # IPHS 2022 Urban PHC
  population_per_uchc: 275000             # IPHS 2022 Urban CHC (2.5-3 lakh midpoint)
  floor_m2_per_uphc: 1500                 # urban PHC / clinic building
  #.8: 14,000 -> 24,000 m2. URDPFI
  # 2015 at the 2.5-lakh tier provides ONE general hospital (200-300 beds,
  # 4-6 ha campus) - 300 beds x ~80 m2/bed built ( derivation)
  # = 24,000 m2. With 5 UPHC x 1,500 the healthcare stock = 31,500 m2 ->
  # 9 cells at the 3,600 blended divisor: the locked 2x2 hospital CAMPUS
  # (layout/f6_locks.py, arterial-fronted, IPHS ambulance access) + 5
  # road-fronted UPHC clinic cells.
  floor_m2_per_uchc: 24000               # 300-bed general hospital (was 50-100 bed CHC)
  # legacy beds-based. Doc Only - NO Code Reads These Four (verified
  #); there is no beds_total report consuming them. Healthcare
  # sizing runs off population_per_* and floor_m2_per_* above. Kept as the
  # derivation record for the frozen layout's clinic/hospital counts.
  beds_per_1000_population: 3.0
  beds_per_dispensary: 10
  beds_per_hospital: 100
  dispensary_share_of_beds: 0.30
  hospital_share_of_beds: 0.70

# ---------------------------------------------------------------------------
# Retail / commercial (URDPFI 2015 Table 4.11)
# ---------------------------------------------------------------------------
