  # to URDPFI 2015 Table 4.11 and the value is consistent with the commonly
  # quoted 4 m2 per capita retail provision, but the table itself has NOT been
  # opened, so under this project's own rule this is an attribution rather than a
  # citation. The Ministry landing page is a known-degraded source: it returns
  # 200 but renders JS-only with no document links, and the direct upload path
  # 404s (recorded, re-.
  #   URDPFI Guidelines, MoHUA (, Link degraded, Claim unverified):
  #   https://www.mohua.gov.in/link/urdpfi-guidelines.php
  # TO CLOSE: open URDPFI 2015 Volume I Table 4.11 via the Imperial library and
  # confirm the per-capita retail figure. Until then treat 4.0 as a planning
  # ASSUMPTION consistent with URDPFI practice, not as a verified norm.
  # Value unchanged pending that check.
  m2_per_capita: 4.0                      # m2/capita, retail floorspace provision
  share_in_shopping_centre: 0.50          # enclosed malls (was 0.70 before high-street split)
  share_in_highstreet: 0.20               # NEW: linear ground-floor retail along main roads
  m2_per_restaurant_seat: 2.5
  # *** The Trend Statistics Below Are Not IN The Cited Article. Restated
  #. *** The block attributed "eating-out frequency 6.6 -> 7.9x/
  # month (+20% in 5y), organised share -> 52.9% by 2028, tier-2/3 city share
  # 21% -> 32%" to the Restaurant India write-up linked below. That page was
  # fetched and parsed (40,105 characters). Its HEADLINE matches exactly -
  # "India to be the 3rd Largest Food Service Market by 2028 overtaking Japan:
  # Nrai Ifsr 2024" - but "6.6", "7.9", "52.9" and "organised" All return Zero
  # hits; the one "21" is an unrelated passage about staff attrition. The
  # figures presumably live in the NRAI India Food Services Report 2024 itself,
  # which this trade article reports on but does not reproduce.
  # What The 60 Seats/1000 Actually Rests ON, stated plainly: it is an
  # BALLOT.7,), a declared planning decision to double the
  # URDPFI-era 30/1000 for a town whose commercial programme is built around a
  # highstreet spine. The direction is supported by the cited article's own
  # headline claim (India becoming the 3rd largest food service market by
  # 2028). The specific trend numbers are NOT sourced and are retained below
  # only as the reasoning that was in the room, not as citations.
  # TO Close IT: cite the Nrai Ifsr 2024 report directly, or delete the four
  # (unsourced trend figures, retained as decision context:
  # https://www.restaurantindia.in/article/india-to-be-the-3rd-largest-food-service-market-by-2028-overtaking-japan-nrai-ifsr-2024 ).
  # 60/1000 x 250k = 15,000 seats x 2.5 m2 = 37,500 m2 -> 4 cells at the
  # 10,000 m2 F&B-strip class; the LOCKED highstreet chain carries street
  # food-and-beverage frontage ON TOP (the Indian bazaar reality).
  # *** Source Substituted; Declared IN The Thesis AT 6.3.7. ***
  # The NRAI "India Food Services Report 2024" is SOLD, not published, and the
  # statistics attributed to it (eating-out frequency 6.6 -> 7.9/month, tier-2/3
