# Annual climatology.
# — dust_storm_days_annual landed from IMD Climate
# Hazards & Vulnerability Atlas for Chandigarh UT district, 1981-2010
# climatological normal: https://imdpune.gov.in/hazardatlas/dustnew.html
# IMD's own annual map ("Average Number of Dust Storm Days in Annual,
# 1981 to 2010") shows Chandigarh district at 0.2 days/year, with legend
# band 0.01-1.30. That is the authoritative annual figure used here.
# Methodology note: summing the 12 monthly tile values on the same atlas
# (jan 0.01, feb 0.00, mar 0.063, apr 0.10, may 0.10, jun 0.10, jul 0.12,
# aug 0.02, sep 0.12, oct 0.10, nov 0.10, dec 0.10) gives 0.94/yr — an
# inconsistency with the annual map likely due to different IMD
# aggregation (monthly tiles double-count multi-day events crossing
# month boundaries; the annual map is computed directly from event
# records). The annual map is the cleaner phenomenological count, so
# 0.2/yr is the canonical value. Both numbers sit at the conservative
# low end vs. Pratap et al. 2020 NW-India ~4-6/yr, because IMD's strict
# WMO codes 30-35 (sustained visibility reduction) miss minor blowing-
# dust events Chandigarh experiences at the east edge of the main dust
# corridor.
# NOTE (comment: the MONTHLY dust_storm_days values
# above ARE consumed by the A19 soiling multiplier (energy/costs.py
# pv_soiling_multiplier_for_month, landed "Bullet 4"). What is
# NOT consumed is this ANNUAL aggregate below - kept for provenance only
# (the 0.2/yr annual map vs 0.94/yr monthly-tile sum inconsistency is
# documented above).
annual:
  dust_storm_days: 0.2
  # IMD Climate Hazards Atlas (1981-2010) annual map, Chandigarh district.

# ---------------------------------------------------------------------------
# FX-5/B5: projected AMBIENT PM2.5 decline across the model
# horizon, as a scale factor on the monthly pm25_ugm3 values above.
# Consumed by energy/costs.py `pm25_period_soiling_relief` -> multiplies
# per-period PV yields (cleaner air = less panel soiling in later periods;
# the dust-storm term is NOT scaled - wind-blown soil, not combustion PM).
# Basis ( derived from policy trajectories):
#   * NCAP (National Clean Air Programme, MoEFCC) targets a 40% reduction
#     in PM concentrations by 2025-26 vs 2017 in non-attainment cities
#     (https://prana.cpcb.gov.in/  target; achievement partial -
#     IQAir/CPCB monitoring shows IGP improvements lagging targets).
#   * Punjab farm-fire counts fell ~70% 2021->2024 (PPCB/CAQM monitoring,
#), directly cutting the Oct-Nov stubble PM2.5 spike.
#   * CEEW / Iit-Delhi Igp projections under current-policy scenarios show
#     ambient PM2.5 declining ~15-30% by the 2040s.
# Conservative central path: -12% by 2042, -20% by 2055 (the register B5
# "~0.80" landing). Linear interpolation between keys; 1.0 = today's air.
# Yield effect is small by construction (annual-mean soiling loss is only
# ~2-3%): relief ~ +0.4-0.7% on 2042/2055-period PV yields.
# ---------------------------------------------------------------------------
pm25_ambient_scale_by_period:
  "2030": 1.00
  "2042": 0.88
  "2055": 0.80
