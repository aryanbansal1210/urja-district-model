# Punjab climate normals for Zirakpur / Mohali (lat 30.64 N, lon 76.82 E).
# Temperature / RH / rainfall proxied by the IMD Chandigarh station
# (closest long-term reference; values originally pasted from
# `PROJECT/zirakpur_climate.md`, Perplexity-sourced from IMD).
# (A19 / B2 hook) — back-filled the four NASA POWER fields
# NASA Power Linked (named-source sweep - it was named
# throughout this file and never linked): NASA Prediction Of Worldwide
# Energy Resources, https://power.larc.nasa.gov/ (, NASA LaRC).
# PROVENANCE NOTE: unlike most citations in this project the primary
# evidence here is a Local Data File that was downloaded from that
# service and lives in the repo - `Project/Data/NASA Power Data.csv`.
# So the numbers are reproducible from the file regardless of the
# portal, which is a stronger position than a web citation.
# from `Project/Data/NASA Power Data.csv` (11-year monthly climatology
# 2014-2024 at lat 30.64, lon 76.82, exact Zirakpur cell):
#   * cloud_cover_pct         (NASA POWER CLOUD_AMT, %)
#   * diffuse_fraction_pct    (DIFF / DWN ratio x 100, %)
#   * wind10m_ms              (NASA POWER WS10M, m/s)
#   * wind_direction_dominant (NASA POWER WD10M, degrees-from-north)
# (A19 PM2.5 land) — pm25_ugm3 back-filled from 4-year daily
# climatology (2022-2025) at CPCB Sector 22 Chandigarh CPCC monitoring
# station (~15 km from Zirakpur), source file
# `PROJECT/DATA/comparision20260519082635.xlsx`. 1,461 daily 24-h means,
# 36 missing days (2.5%); the monthly figures below are arithmetic means
# of valid daily readings within each month-of-year across the 4 years.
# The series captures the Indo-Gangetic Plain seasonality (stubble-burning
# Oct-Nov, winter inversion Dec-Jan, monsoon trough Jul-Aug). 2024 January
# saw a 165 µg/m³ anomaly from a severe stubble-burn event; the 4-year
# mean is more thesis-defensible than any single year.
# — fog_days + dust_storm_days landed from IMD Climate
# Hazards & Vulnerability Atlas for Chandigarh UT district, 1981-2010
# climatological normals (https://imdpune.gov.in/hazardatlas/dustnew.html
# and the "Fog" tab on the same atlas).
# IMD's authoritative ANNUAL maps give Chandigarh:
#   * dust_storm_days annual = 0.2 /yr  (low; east of main Aravalli-Thar
#     dust corridor)
#   * fog_days        annual = 13  /yr  (IMD strict definition: WMO codes
#     40-49 at 08:30 IST, visibility < 1 km; "mist" code 10 EXCLUDED)
# Per-month tile values from the same atlas are stored under each month
# block; their sums (dust 0.94, fog 10.5) diverge from the annual maps
# due to different IMD aggregation between monthly and annual products.
# Per-month values feed the A19 multipliers; annual numbers are kept for
# thesis triangulation.
# Honesty note: lived-experience Punjab winter has 30-60+ visibility-
# impaired mornings/yr, but most are MIST (code 10), not FOG (codes
# 40-49) under IMD's strict 1 km cutoff. The A19 fog multiplier therefore
# Conservatively Under-Estimates winter PV soiling. Stage F could split
# fog + mist into separate multipliers (mist ~75 % yield retention vs
# fog's 30 %).
# All four A19 climate fields (pm25_ugm3, fog_days, dust_storm_days,
# rain_days for soiling rain-recovery) are now populated. A19 multipliers
# are ACTIVE on every PV-yield builder in `energy/network.py`.
# Use in the model.
#: this list used to present all eleven entries
# as though they were equally live, and three of them were not. `rainfall_mm`,
# `cloud_cover_pct`, `diffuse_fraction_pct`, `wind10m_ms` and
# `wind_direction_dominant` have ZERO reads anywhere in energy/, core/ or
# layout/ - verified by grep, not by reading the comment. Two of those five
# were described with a "future"/"Stage F" hedge; three were not, and
# `wind10m_ms` in particular was credited with driving a microclimate effect
# it has never driven. Counts below are actual code reads.
# LIVE - read by the model:
#   * t_mean_c   (3 reads)  - PV temperature derating; the DHW inlet proxy and
#                             the space-heating degree days (HEAT-1); the
#                             cooling degree days. Also wired via
#                             `pv_inverter.ambient_temperature_c_by_month`.
#   * t_max_c    (2 reads)  - peak PV cell temperature; the heat-wave month
#                             multiplier; the triangular CDD form
#   * t_min_c    (2 reads)  - the triangular CDD form; legacy HDD
#   * rh14_pct   (1 read)   - desert-cooler effectiveness curve (B1)
#   * rain_days  (2 reads)  - PV soiling auto-clean (A19)
#   * fog_days   (1 read)   - A19 fog PV multiplier
#   * pm25_ugm3  (2 reads)  - A19 soiling PV multiplier
#   * dust_storm_days (2)   - A19 soiling PV multiplier
# Not Read BY Any Code - kept as documented site climatology, not as model
# inputs. Do not cite these as driving any result:
#                               (a rain DAY cleans a panel; the millimetres do
#                               not add anything the day-count has not already)
#   * cloud_cover_pct         - would drive an overcast-day PV derate; the GSA
#                               hourly shapes already carry real cloud timing,
#                               so this would double-count
#   * diffuse_fraction_pct    - would split direct/diffuse PV yield; same
#                               double-count risk against the GSA anchor
#   * wind10m_ms              - would drive cross-ventilation cooling relief
#   * wind_direction_dominant - would drive cross-ventilation orientation
# Source URLs + tiers (tier labels, citation audit):
#   * IMD Chandigarh normals (t/rh/rain fields): **, Verified Against The
#     Primary Publication.** The Viva Guard below is Discharged.
#     Source: India Meteorological Department, Ministry of Earth Sciences,
#     'Climatological Tables of Observatories in India 1991-2020',
#     NINTH EDITION (2022), National Data Centre, foreword July 2022,
#     Office of Head, Climate Research & Services, Pune. 844 pp.
#     https://www.imdpune.gov.in/library/public/Climatological%20Tables%201991-2020.pdf
#     Chandigarh is station index 082, WMO 42105, established 19-06-2009;
#     its table is on p.197 (temperature, humidity, cloud) and p.198
#     (precipitation, fog, dust storm, wind).
#     Cross-Check Result: every month tested reproduces the publication
#     EXACTLY - jan 18.2/7.2, feb 22.6/10.4, mar 28.0/14.7, apr 34.6/20.3,
#     may 38.6/24.7, jun 37.7/26.7 (mean daily max / mean daily min, degC).
#     The values were originally transcribed via a Wikipedia weatherbox
#     (a ACCESS PATH to data) because the filename tried on
# 404'd. The transcription was faithful, and the citation
#     is now the publication itself rather than the route to it.
#     before the defence so the access path never becomes the story.
#   * NASA POWER (cloud/diffuse/wind fields):
#     (11-yr monthly climatology 2014-2024, exact cell lat 30.64 lon 76.82)
#     *** Homepage Replaced BY A Reproducible Api Call,. *** The
#     bare power.larc.nasa.gov root could not evidence anything. The POWER
#     Climatology API is open, so the citation is now the exact query that
#     produced the data - anyone, including an examiner, can re-run it:
#     https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=CLOUD_AMT,WS10M,ALLSKY_SFC_SW_DIFF&community=RE&longitude=76.82&latitude=30.64&format=JSON&start=2014&end=2024
#     VERIFIED by running it: HTTP 200, and the response geometry comes back
#     as [76.82, 30.64, 423.74] - the EXACT cell this block claims, with the
#     elevation as a bonus. All three named fields are present. Annual means
#     returned: CLOUD_AMT 43.98 %, WS10M 2.97 m/s, ALLSKY_SFC_SW_DIFF
#     1.9377 kWh/m2/day. Header: "NASA/POWER Source Native Resolution
#     Climatology", API v2.9.7, sources MERRA2 / SYN1DEG / POWER.
#     This is a BETTER citation than any static URL because it is executable:
#     the provenance and the query are the same object.
#   * CPCB CAAQM Sector 22 Chandigarh (pm25_ugm3): - https://cpcb.nic.in/
#     (4-yr daily climatology 2022-2025, workbook in PROJECT/DATA)
#   * IMD Climate Hazards & Vulnerability Atlas (fog/dust): -
#     https://imdpune.gov.in/hazardatlas/dustnew.html
#   * Global Solar Atlas Zirakpur report (PV monthly shape, single-source):
#     https://globalsolaratlas.info (workbook../DATA/GSA_Report_Punjab.xlsx)
#     ** Tier Split was badged "" against a Homepage, which
#     evidences nothing. Corrected the way the IMD weatherbox entry does it -
#     separate the Data from the Access Path:
#         DATA  (Global Solar Atlas / Solargis / World Bank,
#                     the actual Zirakpur report, retained as the workbook
#../DATA/GSA_Report_Punjab.xlsx in this project)
#         Access Path  (site root; the specific report Url is not cited)
#     The workbook IS held locally, so the data is traceable even though the
#     link is not. To close this properly, cite the report's own permalink. **

# ---------------------------------------------------------------------------
