  solar_farm: 0.080                 # STAGE-.1 v2: 200 cells = the 2030
                                    # LAND GRANT (8% of site; was 350/14%, then a 150-ha draft).
                                    # (f3_solar_land_sweep.md: 200 ha -> +6.8% 2030 cost vs 350 ref;
                                    # the last 100 ha of the old grant bought only 1.8% =.
                                    # PHASES to 250 ha (2042) / 300 ha (2055) via solar_expansion_*
                                    # tags; the LP builds within land x TRJ-1 density.

# ---------------------------------------------------------------------------
# Household income mix at the LAND-USE level (3 residential land-uses).
# (Opus 4.8): the 4 demographic tiers EWS/LIG/MIG/HIG live in
# config/demographics.yaml; here we keep the 3 residential LAND-USE shares the
# layout + energy LP read (EWS+LIG -> residential_low, MIG -> mid, HIG -> high).
# So low = EWS(0.20)+LIG(0.20) = 0.40; mid = MIG 0.45; high = HIG 0.15.
# (cfg.income_shares is only validated/printed; the computational shares come
# from demographics.households_by_income aggregated in core/requirements.py.)
# ---------------------------------------------------------------------------
income_shares:
  low: 0.40                         # EWS 0.20 + LIG 0.20 (see demographics.yaml)
  mid: 0.45                         # MIG
  high: 0.15                        # HIG

# ---------------------------------------------------------------------------
# Average floor area per household in m^2 (per residential LAND-USE).
# Semantics: the DEMAND-BEARING dwelling share of cell gross floor area
# (carpet for the PMAY-U-defined low tier, where carpet is the statutory
# measure; built-up for the market-defined mid/high tiers, where W/m2
# cooling/base intensities apply over built-up area).
# norm citations (values unchanged; they already sit inside the cited
# bands - the demand excess sat in the cooling W/m2 target-chase,
# reverted in economics.yaml cooling_technologies):
#   mid 100 m^2 BUILT-UP = low end of the 2-3BHK market band 100-120 m2
#     (~1,075-1,300 sqft): ANAROCK top-7-city average flat size ~1,300 sqft
#     super built-up 2023-24 (https://www.anarock.com - Research section; the
#     /research path 404s as of.
#     ** Tier Downgraded -> Tier 3 (declared). Two reasons,
#     not one: the Url is a Homepage and evidences no flat size, And Anarock is
#     a commercial real-estate consultancy, i.e. trade material rather than a
#     reputable-research under this project's own scheme. The flat-size
#     figure is retained as a declared planning assumption. **);
#     peri-urban Tri-city (Zirakpur/Mohali) 2BHK listings run BELOW metro
#     averages  - hence the low end. Pmay-U Clss MIG-I carpet cap
#     was 160 m2 (ceiling, not typical context).
#   high 200 m^2 BUILT-UP = centre of the premium 3-4BHK band 180-220 m2
#     (~1,950-2,350 sqft; ANAROCK premium-segment sizing).
#   low 42.7 m^2 Carpet = EWS 30 (Pmay-U standard, min 30 max 45)
#     / LIG 55 (CLSS cap 60; built DPRs ~45-55)
#     blended 0.49/0.51 by the EWS/LIG household split.
#     ** TIER SPLIT was "" against the pmaymis.gov.in
#     portal Homepage, which evidences nothing. The EWS 30 / LIG 60 carpet-area
#     caps ARE and are now verified from the real document - PMAY-U
#     Operational Guidelines, opened and parsed, verbatim: "EWS: Annual
#     Household Income up to Rs.3,00,000 and house sizes upto 30 sq.m. -
#     LIG:... upto 60 sq.m", with the Clss table giving EWS 30 / LIG 60.
#     https://pmay-urban.gov.in/uploads/guidelines/Operational-Guidelines-of-PMAY-U.pdf
#     What stays TIER 3 (declared) is the "built DPRs ~45-55" range and the
#     0.49/0.51 blend - neither appears in the guidelines. **
# Persons/household: the Top-Down district figure is 4.6 (MoSPI Nss 78th
# Round, Punjab average) -> site.total_households 21,739. The
# BOTTOM-UP household count from these dwelling sizes over the frozen
# seed-42 floor stock is 19,898 -> 5.03 persons/HH; closing the ~8.5% gap
# at cited dwelling sizes needs MORE residential floor area (a Stage F
# re-anneal item, documented since). Forcing 4.6 bottom-up
# would need mid ~89 / high ~163 m2 - BELOW the cited market bands - so
# the gap is reported, not hidden (FX-3 epistemology: inputs cited,
# outputs emergent). NOTE: demand is floor-area-based, not household-
# count-based (core/building.py), so these per-HH values move household
# counts ONLY; district energy demand is set by floor_area_per_cell_m2
# x the economics.yaml intensity tables.
# ---------------------------------------------------------------------------
household_floor_area_m2:
  low: 42.7                         # EWS 30 / LIG 55 carpet blend; Pmay-U (blend shares survive the
                                    # 250k raise: EWS 10,000 / LIG 10,417 HH = 0.49/0.51, same as at 100k)
  mid: 100                          # 2-3BHK built-up, low end of cited 100-120 band (MIG)
  high: 300                         # Stage-: HIG moves from premium Flats (200 m2)
                                    # to an INDEPENDENT-HOUSE plotted colony ("compact kothi/builder-floor",
                                    # Mumbai-colony ask): 300 m2 built-up per household on ~125-175 sq-yd
                                    # plots, G+2/G+3, net colony FAR 1.2 (floor_area_per_cell below). 300 =
                                    # lands inside his 13-16%-of-site band. Provenance: PUDA plotted-
                                    # residential class ~1.9-2.0 sanctioned FAR ( instrument, exact
                                    # values pending the F0_FAR_TABLE.md section-5 verification prompt);
                                    # 125-250 sq-yd kothi/builder-floor G+3 is the prevailing Zirakpur/
                                    # Mohali plotted pattern (, market listings). Demand consequence
                                    # (FX-3 Option C epistemology - inputs cited, output emergent): HIG
                                    # floor/HH rises 1.5x, so per-capita demand drifts above the pure
                                    # population scaling; reconciled in the Stage- FX-3 check.

# ---------------------------------------------------------------------------
# Building height tiers (m). The MEDIUM tier is the reference; the floor area
# per cell at the medium tier is given below. SHORT and TALL scale that
# baseline by a multiplier that reflects how many floors fit in the tier.
# ---------------------------------------------------------------------------
height_tiers:
  ground: 7.0                       # G+1/G+2 solo house / builder floor (Baseline 2 v7 only)
  short: 12.0                       # 4 storeys
  medium: 18.0                      # 6 storeys (reference)
  tall: 27.0                        # 9 storeys

floor_to_floor_m: 3.0

# Multiplier applied to floor_area_per_cell_m2 when that cell is at the tier.
# Approximately = floors_in_tier / floors_in_medium.
height_multipliers:
  ground: 0.45                      # ~G+1.5 avg on a partially built-out colony (B2 v7 only;
                                    #, satellite built-out share - vacant plots interleaved)
  short: 0.67                       # 4/6 floors
  medium: 1.00
  tall: 1.50                        # 9/6 floors

# ---------------------------------------------------------------------------
# Floor area per 100 m x 100 m cell (1 ha) at the MEDIUM height tier (m^2 gross).
# Stage- RE-Derivation from the Ratified Far (decision A2,
# This REPLACES the legacy 6,000 m2-per-200m-cell stock (implied FAR ~0.15,
# ~13x below the PUDA/GMADA regulatory record - see table section 1).
# How The Classes Map (mechanics in core/building.py):
#     PUDA plotted ~2.0 / URDPFI 1.0-2.5 / Naya Raipur 1.30-1.8 corroboration).
#     The post-anneal spine pass (layout/spine_gradient.py) promotes arterial-
#     adjacent cells to Tall (x1.5 = 30,000 = Net Far 3.0, the Puda 1:3 group-
#     housing envelope on the spine) floor-compensated by SHORT edge demotions
#     (x0.67 = 13,400 = Far 1.34, an under-cap edge build) at 2 Tall : 3 Short,
#     conserving district floor = the FX-3 requirement (Bertaud gradient inside
#   * high residential = the Plotted Hnw Colony: a Fixed
#     built form (12,000 = NET FAR 1.2, G+3 at 12 m via typical_height_m,
#     ~40 kothis of 300 m2 per ha cell, ~30% ground coverage) - excluded from
#     tier scaling in generator/optimiser exactly like facility categories, so
#     requirements' cell arithmetic needs no tier-awareness. PUDA plotted class
#     ( instrument); compact-kothi form (Zirakpur market pattern).
#   * commercial class (office / mall / highstreet / hotel): 30,000 = NET FAR 3.0
#     (multiplier 1.0) and take height from the category's typical_height_m, so
#     these floors are EXACT (no tier drift).
#   * facility-sized categories (count-driven, 1 facility = 1 building = 1 cell):
#     school 3,500 (= 295,000 m2 over 84 URDPFI facilities at 250k: 50 primary
#     x 2,500 + 34 secondary x 5,000; a 1-ha campus at FAR 0.35 with playfields);
#     healthcare 3,600 (= 21,500 m2 over 6 IPHS facilities: 5 UPHC x 1,500 +
#     1 UCHC x 14,000, blended - splits the typologies).
#   * industrial FAR 1.25 (12,500) per URDPFI/state industrial-estate band
#     ( derived); warehouse 0.8 (8,000) single-volume high-bay logistics
#; public services 0.6 (6,000) civic campus with grounds (,
#     URDPFI socio-cultural plot norms); religious 0.4 (4,000) prayer hall +
#     forecourt complex; restaurant/F&B 1.0 (10,000) low-rise strips
#. These below-cap values are USE-DRIVEN forms, legal under the
#     sanctionable envelopes.
# Sanity (checked in the Stage- FX-3 reconciliation): Net Far on the developed
# NOT total-floor / full 25 km2 (that is ~0.4-0.5 at 250k because ~40-45% of the
# site is deliberate public realm / green / solar reserve - register 0e note).
# ---------------------------------------------------------------------------
floor_area_per_cell_m2:
  low_income_residential: 20000     # NET FAR 2.0 (ratified A2 base class)
  mid_income_residential: 20000     # NET FAR 2.0 (ratified A2 base class)
  high_income_residential: 12000    # Net Far 1.2 plotted colony; Fixed Form (no tier scaling):
                                    # height from the category's typical_height_m (12 m G+3),
                                    # same mechanism as non-residential categories
  school: 3500                      # facility-sized campus (URDPFI counts; FAR 0.35)
  office: 30000                     # NET FAR 3.0 (ratified commercial class)
  shopping_centre: 30000            # NET FAR 3.0 (ratified commercial class)
  retail_highstreet: 30000          # NET FAR 3.0 mixed-use bazaar block (ground retail + floors above)
  restaurant_food_service: 10000    # FAR 1.0 low-rise F&B strip
  hotel_guesthouse: 30000           # NET FAR 3.0 (commercial class)
  healthcare: 3600                  # facility-sized (Iphs Uphc/Uchc blend)
  light_industry: 12500             # FAR 1.25 industrial-estate plotted
  warehouse_cold_storage: 8000      # FAR 0.8 high-bay logistics
  public_services: 6000             # FAR 0.6 civic campus with grounds
  religious: 4000                   # FAR 0.4 prayer hall + forecourt complex

# ---------------------------------------------------------------------------
# Rooftop PV acceptance (willingness to host).
# Fraction of usable roof area that is realistically deployable for PV given
# ownership, structural, aesthetic, and behavioural constraints. Without
# subsidy, residential acceptance is much lower than commercial.
# Each fraction below is derived, and its derivation is in the comments on
# the value it belongs to. Sources: CEEW IRES residential energy survey,
# Census 2011 roof-material tables, NITI Aayog India Energy Dashboard 2024.
# ---------------------------------------------------------------------------
pv_acceptance:
  #: AAP is OFF in the production baseline (see
  # economics.yaml grid: import_tariff_subsidy_fraction: 0.0). AAP is a
  # short-tenure state scheme (term ends Mar 2027) and is not defensible
  # over a 2030-2055 capacity-planning horizon, so it is a SENSITIVITY
  # case only. The AAP-interaction calibration is therefore
  # partly superseded; low-income is recalibrated for the AAP-off world.
  # - Low-income: with AAP off, EWS households pay the slab tariff, so
  #   rooftop PV regains a real ROI. Recalibrated 0.15 -> 0.25 BY DERIVATION
  #   (NOT simply reverting to the pre-AAP 0.30): structural ceiling =
  #   home-ownership ~0.70 x PV-suitable RCC-roof fraction ~0.65 ~= 0.45
  #   (Census 2011 roof-durability tables); x post-PMSGY adoption
  #   willingness for capital-constrained EWS ~0.55 (CEEW Ires). 0.45 x
  #   0.55 ~= 0.25..
  # - Mid-income: ~400 kWh/mo. PV Roi without AAP. 0.45. Note: this was
  #   AAP-suppressed from 0.50 and may warrant 0.50 for AAP-off consistency
  # - HIGH-income: ~800 kWh/mo at full tariff. Strong PV ROI + status/
  #   aesthetic factors. 0.70 (empirical high-income North India uptake;
  #   unaffected by AAP removal — high-income always paid full tariff).
  # Sources: Niti Aayog India Energy Dashboard 2024, CEEW Ires / Residential
  # Energy Survey, Census 2011 roof-material tables.
  # Ownership Correction: EWS/LIG rooftop PV is Government-owned under a
  # proposed social-rental "council housing" model (India ARHC + Western council precedent):
  # the gov owns the housing + roof + PV, contracts a RESCO for build + 25-yr O&M, and residents
  # are tenants paying a minimal ~Rs 3/kWh tariff (SECI RESCO L1 anchor). The resident affordability/
  # willingness barrier is REMOVED, so acceptance = the gov-mandated deployment fraction, NOT the old
  # resident-financed 0.45 x 0.55 = 0.25. Capped by roof multi-use (water tanks / clothes-drying /
  # access / future vertical extension) at ~0.70; 0.85 is the elevated-mounting (PV-over-deck) upper
  # case for sensitivity. designed-policy (mechanisms: PMSGY, SECI RESCO, Chandigarh
  low_income_residential: 0.70     # (ownership correction): gov-owned council/ARHC/RESCO
                                   # model — gov deploys EWS rooftop PV (roof-multi-use capped; 0.85 = elevated-
                                   # mounting sensitivity). Financed at the gov/social rate via the per-owner
                                   # blend (see economics.yaml rooftop_owner_weights + building_ownership above).
                                   # EWS residents pay a minimal ~Rs3/kWh tariff (Stage E transfer, NOT a system
                                   # cost). Aggregate impact ~FLAT (saturation finding equity -> Stage E).
  mid_income_residential: 0.45  # HELD at 0.45 rather than raised to 0.50
                                # for AAP-off consistency. 0.45 is the
                                # lower of the two defensible values, so it
                                # understates rooftop on the largest
                                # residential band and therefore understates
                                # the district's own headline. Raising it
                                # would improve the result and would require
                                # re-solving every pinned figure.
  high_income_residential: 0.70
  school: 0.85                      # public mandate raises acceptance
  office: 0.80
  shopping_centre: 0.85
  retail_highstreet: 0.60           # split ownership of strip retail -> moderate
  restaurant_food_service: 0.55
  hotel_guesthouse: 0.55
  healthcare: 0.55
  light_industry: 0.85
  warehouse_cold_storage: 0.90
  public_services: 0.75
  religious: 0.0                    # no rooftop PV on gurudwaras / temples / mosques -
                                    #   dome geometry, aesthetic constraint, sacred-space convention
                                    #. Was 0.50; ~92 religious cells x
                                    #   ~3 kWp/cell = ~280 kWp lost. Compensated by other surfaces.

# ---------------------------------------------------------------------------
# (OWNERSHIP CORRECTION): per-category building/PV owner. Drives the
# rooftop-PV financing discount rate (owner -> actor -> discount_rates) + reflects
# who deploys the PV. gov = government/RESCO (proposed social-rental housing + public
# buildings, cheap social capital); rwa = resident welfare assoc (SolShare apartments);
# private = corporate/individual (self-financed); trust = religious (no PV).
# owner -> actor: gov->social_planner (~5%), rwa->rwa_pooled (8.5%), private->private_high
# (10%), trust->social_planner. Sources: data_calibration_plan.md S11 (ownership tiers);
# financing precedents PMSGY / SECI RESCO / Delhi Rwa subsidy (see QUESTIONS_AND_FIXES_REGISTER.md).
# ---------------------------------------------------------------------------
building_ownership:
  low_income_residential: gov        # social-rental (ARHC/council) + RESCO rooftop PV
  mid_income_residential: rwa        # RWA-pooled apartments (SolShare)
  high_income_residential: private   # residents self-own
  school: gov
  public_services: gov
  healthcare: gov                    # institutional (mandated backup); gov/RESCO PV
  office: private
  shopping_centre: private
  retail_highstreet: private
  restaurant_food_service: private
  hotel_guesthouse: private
  light_industry: private
  warehouse_cold_storage: private
  religious: trust                   # no rooftop PV (pv_acceptance 0.0)

# ---------------------------------------------------------------------------
# PV module efficiency (NEW - replaces the hardcoded "/6.0" rule
# in Building.deployable_pv_kwp).
# Module efficiency converts m^2 of installed panel area into kWp nameplate
# (under STC: 1000 W/m^2 irradiance). For typical mono-Si:
#   * 2024 commodity panels: 18-19%
#   * Modern (TOPCon / HJT): 20-22%
#   * Premium / BIPV-grade: 22-23%
# We use 0.20 as the 2030-real central estimate, defensible for India
# residential and small-commercial deployments (matches MNRE technical
# benchmark trajectory).
# This parameter is ORTHOGONAL to:
#   * pv_acceptance (above) - what fraction of roof is usable for PV given
#     ownership / aesthetics / structural / HVAC routing constraints.
#   * pv_capacity_factor (in economics.yaml) - kWh produced per kWp installed
#     per slice, driven by irradiance + temperature + soiling.
#   * biosolar / vegetation / dust / degradation multipliers (Stage C round 3
#     in economics.yaml) - all multiply YIELD (kWh/kWp), not installed kWp.
# Ground-mount module efficiency is documented in demand_norms.yaml
# (ground_mount_kwp_per_m2 = 0.10 = land-density, NOT pure panel efficiency:
# folds in row-spacing, access roads, inverter pads).
# ---------------------------------------------------------------------------
# FIX: was 0.20, a hand-set scalar that
# disagreed with the model's OWN module mix. economics.yaml
# technologies.rooftop_pv.module_types declares 65% mono-PERC at 0.21,
# 25% poly-Si at 0.17 and 10% thin-film CdTe at 0.14 - a share-weighted
# 0.1930. The A18 mix block claims its blended values "back-feed into"
# the live scalars; they never did (pv_module_mix_summary had zero
# callers). Adopting 0.1930 makes module_types the single source of truth
# and reduces the district rooftop ceiling ~3.5% (133,771 -> ~129,089 kWp),
# i.e. it removes panels that would not physically fit on the roofs.
rooftop_module_efficiency: 0.1930

# ---------------------------------------------------------------------------
# Permeability convention.
# Documents the model's assumption about which cells allow which movements.
# Read by core/config.py and printed in run.py for clarity.
# ---------------------------------------------------------------------------
permeability:
  pedestrian: "all_cells"           # walking distance through any adjacent cells
  bicycle: "all_cells"
  vehicle: "road_only"              # cars / buses follow ROAD cells
  hv_cable: "road_only"             # primary electrical infra on roads
  lv_cable: "all_cells"             # intra-block / intra-cluster wiring

# ---------------------------------------------------------------------------
# Simulated annealing optimiser settings.
# These tune the search but do NOT change the model's physics. Aggressive
# values (more iterations, slower cooling) explore more but cost compute.
# ---------------------------------------------------------------------------
optimisation:
  initial_seed_archetype: chandigarh_sector   # starting point for the search
  # STAGE-: Chandigarh sector size in cells (100 m each) for
  # the PRE-anneal locked collector grid (layout/sector_structure.py laid
  # per arterial band, no sliver sectors). 8 = ~800 m sectors, the winner of
  # scripts/f3_sector_size_sweep.py over {5,6,8,10,12}: total ROW 21.3% of
  # walkability 0.835, and the truest match to the real Chandigarh sector
  # module ~800 x 1200 m (Chandigarh Master Plan 2031 sector grid,
  # https://chandigarh.gov.in/departments/chandigarh-master-plan-2031).
  sector_size_cells: 8
  # STAGE-: 2500 -> 15000 for the 50x50 re-anneal
  # (matches-plus the 200 m moves-per-cell density; measured full-re-evaluation
  # cost at 2,500 cells = 1.39 s/move -> ~5.8 h; probe in
  # scripts/f1_anneal_timing_probe.py). The old 200 m note (~120 ms/move,
  # 2500 iters ~= 5 min) is retained below for the record.
  n_iterations: 15000                         # SA outer-loop iterations @ 50x50)
  initial_temperature: 0.08                   # accept ~50% of moves at start
  final_temperature: 0.0008                   # accept ~0% by the end
  hard_penalty: 40.0                          # heavy weight on hard-constraint gaps (raised from 25 in Stage A to pressure SA toward residual-violation cleanup)
  soft_penalty: 2.0                           # light weight on requirements_satisfied
  constraint_penalty_weight: 2.0              # legacy key (read by older callers)
  rng_seed: 42                                # for reproducibility
  log_every: 250                              # progress printout cadence
  # NOTE (200 m era): production runs can use n_iterations >= 5000 once delta
  # evaluation speedup is in place. Bottleneck is full re-evaluation per move
  # (~120 ms at 625 cells; ~1.39 s at 2,500 cells). 2500 iterations took ~5 min
  # at 200 m.

# ---------------------------------------------------------------------------
# Currency note: ALL cost values in this project are in Indian Rupees (INR).
# The energy MILP (later stage) uses INR/kWh tariffs, INR/kWp CAPEX, etc.
# ---------------------------------------------------------------------------
