# District demographics for the MSc thesis case study.
# All numbers are PLACEHOLDERS shaped from publicly-available Indian sources
# and should be replaced with calibrated district-specific data when available.
# Sources (placeholder shapes):
#   - Census 2011, Punjab District Handbook
#   - URDPFI 2015 (Urban and Regional Development Plans Formulation Guidelines)
#   - Pmay-U 2024 EWS/LIG targets
#   - Punjab Master Plans (Mohali, Zirakpur LPA)
#   - NSSO Rounds 68 / 75 (consumption + employment)
# All values mark "PLACEHOLDER" until verified.

# ---------------------------------------------------------------------------
# Population
# ---------------------------------------------------------------------------
population:
  # STAGE-: RAISED 100,000 -> 250,000 = the 2030
  # + register 0e). 250k on the fixed 25 km2 site = 10,000 persons/km2 gross - the
  # realistic Indian-city density band (Chandigarh ~9,250/km2, Census 2011).
  # *** Sourcing Tightened the censusindia.gov.in Homepage was
  # retired - a root domain cannot evidence a density. The POPULATION half is
  # now verified from a document held in the repo: NCP/MoHFW "Population
  # Projections for India and States 2011-2036", Table 21, which is
  # Census-based and gives Chandigarh 2011 = 1,056 thousand.
  # 1,056,000 / 114 km2 = ~9,263/km2, which reproduces the ~9,250 quoted here.
  # Honest Remainder: the 114 km2 Area is not sourced in that document and is
  # taken as common knowledge. So the density is derived from one
  # verified input and one unsourced one - stated rather than badged
  # as it was before. It is a CONTEXT figure for the density band, not
  # a model parameter; nothing computes from it. ***
  # district FAR ~0.12, ~10x below any regulatory band (the Stage- STOP-gate
  # contradiction, resolved by this raise). The frozen 100k "final 200 m model"
  # remains on record as the LOW-DENSITY comparison point.
  # Growth to 250k is MIGRATION / new-town build-out absorption, NOT natural
  # increase: NCP/MoHFW "Population Projections for India and States 2011-2036"
  # (July 2020) projects Punjab at 3.27 crore by 2036 (+~18% over 2011-36,
  # ~0.4-0.5%/yr in the 2030s, TFR < 2.1):
  # https://nhm.gov.in/New_Updates_2018/Report_Population_Projection_2019.pdf
  # NOTE (double-count guard): the per-period demand multipliers (x1.317/x1.662,
  # district_composition.yaml lifetime_demand_trajectory) already bundle population
  # growth ON TOP of the design year - they ride on the 250k base unchanged.
  total: 250000                   # 2030 DESIGN population (Stage- was 100000)

# ---------------------------------------------------------------------------
# Household composition — 4 income tiers EWS/LIG/MIG/HIG (must sum to 1.0)
# ---------------------------------------------------------------------------
# (Opus 4.8): refactored 3 tiers (low/mid/high) -> 4 PMAY-U tiers
# EWS / LIG / MIG / HIG. This is the "who lives here" demographic layer. The
# energy LP + layout keep 3 residential Land-Uses (EWS+LIG->residential_low,
# MIG->residential_mid, HIG->residential_high) — see core/requirements.py
# _AGG_TIER_TO_LANDUSE. No re-anneal.
# PMAY-U annual HOUSEHOLD income bands (, MoHUA Operational Guidelines
# https://pmay-urban.gov.in/uploads/guidelines/Operational-Guidelines-of-PMAY-U.pdf):
#   EWS <=3 L | LIG 3-6 L | MIG 6-18 L (MIG-I 6-12, MIG-II 12-18) | HIG >18 L (HIG
#   threshold Derived — Pmay has no HIG band).
income_shares:                    # 4-tier (no official Punjab per-band table — see below)
  # SHARES: no source gives the % of urban Punjab households per PMAY band
  # (Perplexity confirmed a negative result; "96% EWS" = housing DEFICIT
  # share, Not household share). Derived via Wef/Bain consumer-class bands mapped to
  # PMAY thresholds + Punjab "richer-than-average" adjustment (lower EWS, higher
  # MIG/HIG). EWS+LIG = 0.40 preserves the prior residential_low share so the frozen
  # layout stays valid. modelling assumption; refine with NSS/ICE360 microdata.
  #   WEF/Bain "Future of Consumption... India": https://www.weforum.org/reports/the-future-of-consumption-in-fast-growth-consumer-markets/
  ews: 0.20
  lig: 0.20
  mig: 0.45
  hig: 0.15

household_size_by_income:         # persons per HH, 4-tier gradient — (NFHS-shaped, peri-urban blend; see below)
  # (Opus 4.8): re-introduced an income gradient (was uniform 4.6) using
  # the NFHS wealth-quintile pattern (poorer = larger; +0.5-1.0 person poorest->richest,
  # Nfhs-4/5 Direction). Magnitudes chosen so the Population-Weighted mean stays
  # = 4.615. No Punjab per-band table exists -> the per-tier VALUES are
  # derived.
  # This block used to call 4.6 "the Punjab anchor (NSS 78th Round
  # 2020-21)". That Was The Rural Row. The MoSPI workbook was downloaded and
  # parsed directly: Table 1 is sectioned Rural / Urban / All and Punjab
  # appears once in each -
  #       Punjab Rural 4.6 | Punjab Urban 4.1 | Punjab All 4.4
  #       (All-India for scale: rural 4.5 | urban 3.9 | all 4.3)
  # NFHS-5 independently agrees on the direction and magnitude for India:
  # urban 4.2 vs rural 4.5 (Table 2.14, 636,699 households).
  # So an all-urban town has NO business anchoring to 4.6, and the model's
  # implied mean is stated here honestly rather than badged as the Punjab
  # figure:
  #       Model Implied Mean 4.56 persons/HH (250,000 / 54,794 households)
  #       official range: urban 4.1... all 4.4... rural 4.6
  # Justification For Sitting Near The Top OF That Range, which is the claim
  # an examiner should test: this is a NEW peri-urban town on the Zirakpur
  # edge absorbing rural in-migration, not mature urban stock. NSS-78's
  # "urban Punjab" is Ludhiana, Amritsar and Jalandhar. New-town in-migration
  # is family-forming, and the master plan documents exactly this pattern for
  # real Zirakpur (population 6x past its own projection, absorbed into a
  # fixed housing stock as rising OCCUPANCY). 4.56 is therefore between the
  # urban and rural figures BY ARGUMENT, and is declared, not.
  # Why IT Was Not Moved: at 4.1 the frozen 54,794 households would house
  # ~224,700 people, contradicting the BINDING Stage- 250,000 design
  # population; holding 250,000 instead would need ~61,000 households and a
  # re-anneal of the frozen seed-42 layout.
  # do not move. The error direction is also benign for the headline - larger
  # households mean FEWER households mean LOWER residential demand, which
  # applies to the town and BAU alike, so the vs-BAU percentage barely moves.
  #   NSS-78 (Punjab rural 4.6 / urban 4.1 / all 4.4): https://www.mospi.gov.in/sites/default/files/reports_and_publication/NSS78-20-21/Table1-Estimated-persons-and-households.xlsx
  #   NFHS-5 India (urban 4.2 / rural 4.5, Table 2.14): https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf
  #   Census 2011 urban mean 4.8 (Housing in India compendium) - 15 years old
  #   and on a falling trend, so NSS-78 urban is both newer and more specific.
  ews: 5.0
  lig: 4.8
  mig: 4.5
  hig: 4.2

# ---------------------------------------------------------------------------
# Age structure (must sum to 1.0)
# ---------------------------------------------------------------------------
# RE-Banded From Census 2011 Punjab C-13, Verified Against The Table
# ( basis re-banding arithmetic). The C-13
# single-year age returns (DDW-0300C-13.xls, "State - PUNJAB (03)",
# age-not-stated excluded from the denominator) give:
#   Punjab TOTAL  0-14 25.58% | 15-59 64.08% | 60+ 10.28%
#   Punjab URBAN  0-14 24.62% | 15-59 66.63% | 60+  8.69%
# This model needs 0-18 / 18-64 / 65+ for an URBAN town. under_18 = urban
# 0-14 (24.62%) plus the 15-17 cohort (~5.7 pp from the single-year rows)
# = ~30.3%, so 0.30 is the census-consistent value for the ONE band that
# is load-bearing (core/requirements.py multiplies under_18 by
# school_enrolment_rate to size school places, and thence school land).
# over_65 at 0.08 sits between urban 60+ (8.69%) and a strict 65+ cut;
# with under_18 fixed at 0.30 and the three summing to 1.0 (asserted in
# core/demographics.validate), age_18_to_64 follows as 0.62.
#   C-13 catalogue: https://censusindia.gov.in/nada/index.php/catalog/1464
#   C-13 table:     https://www.censusindia.gov.in/datagov/C-13/DDW-0300C-13.xls
age_structure:
  under_18: 0.30                  # children + adolescents
  age_18_to_64: 0.62              # working age
  over_65: 0.08

# ---------------------------------------------------------------------------
# Employment / occupation mix (must sum to 1.0; share of workers, not pop)
# ---------------------------------------------------------------------------
worker_share_of_population: 0.36  # Census 2011 Punjab work participation
# placeholder read industrial-heavy for a town on the Mohali IT corridor -
# SAS Nagar is Punjab's IT district (Mohali IT City ~1,700 ac, Rajiv Gandhi
# Chandigarh Technology Park, Quark City; Infosys/TechM/Dell presence -
#, https://marketmystique.com/it-companies-in-mohali/ + Invest
# Punjab corridor material). office 0.20 -> 0.28 and industry 0.18 -> 0.16;
# informal 0.22 -> 0.16 balances (a PLANNED town formalises employment vs
# the state average - stated assumption). Sum stays 1.00. Effect:
# office 6 -> 9 cells, light industry 39 -> ~35 (requirements-derived).
employment_mix:
  professional_office: 0.28       # software, finance, government, education staff
  services_retail: 0.30           # shops, hospitality, food, personal services
  industry: 0.16                  # manufacturing, construction
  healthcare: 0.05
  public_services: 0.05
  informal: 0.16                  # unorganised / agricultural / other

# ---------------------------------------------------------------------------
# School enrolment
# ---------------------------------------------------------------------------
school_enrolment_rate: 0.92       # share of under-18 enrolled (NER, NSSO 75th)
