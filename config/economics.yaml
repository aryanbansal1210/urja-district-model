# Economics inputs for the Stage B energy MILP (Path-1 refactor: 12 x 12 = 144
# representative slices, 5 tariff bands, 5 actor-tier discount rates, 2030-real
# INR base year, heating + EV demand, day-type structure).
# All costs in Indian Rupees (INR) at 2030-real prices (inflation-stripped
# relative to nominal). Calibration sources / placeholder status logged in
# Slice structure (synthesized by `energy.costs.Economics.from_yaml`):
#   slice_id  = "{month}_{daypart}"      e.g. jan_18_20
#   hours/yr  = 2 * days_in_month        (each daypart is 2 h wide; sum = 8760)
#   demand    = peak_kw * month_modifier * (
#                  (wd_days / total_days) * weekday_daypart
#                + (we_days / total_days) * weekend_daypart
#                + (fest_days / total_days) * festival_daypart )
#   pv_cf     = monthly_pv_modifier * pv_daypart_shape
# Currency note: every value here is 2030-real INR.  Do not introduce Gbp/Usd.

# ---------------------------------------------------------------------------
# Currency / base year / financing
# ---------------------------------------------------------------------------
currency: INR
base_year: 2030

# (Claude 2 864-slice refactor, Phase 4 commit):
# slices_per_year selects the representative-day model resolution.
#   144 (legacy) = 12 months × 12 dayparts (2h each); day types weighted-
#                  averaged INSIDE each slice. Used for production until
#                  this commit.
#   864 (production) = 12 months × 3 day types × 24 hours. Unbundles
#                  weekday / weekend / festival into separate slices and
#                  brings hourly diurnal resolution -- academic-standard
#                  representative-days approach (REMix / OSeMOSYS /
#                  Calliope). Unlocks behavioural patterns at hourly
#                  resolution (lighting evening-peak shape, WFH day-of-
#                  week effects, festival modifier). Variable count
#                  ~88k; HiGHS solves alpha=0 in ~10 s.
# Production headline shift on commit (144 -> 864, full_stack alpha=0):
# cost 1,016.21 M -> 956.13 M (-5.91 %); emissions 38,391 -> 44,620 t
# (+16.23 %); rooftop 45,989 -> ~40,000 kWp (binding on cap); carport
# 0 -> 58,560 kWp (unlocked); floating PV 0 -> 3,600 kWp (unlocked).
# Total PV deployed +123 % vs 144 because hourly tariff arbitrage of
# carport + floating PV becomes visible (Brown et al. 2018 literature
# on temporal-resolution effects in ESOMs).
slices_per_year: 864

# (D1(b) —.
# OPT-IN multi-period capacity-expansion. When enabled, the LP solves
# dispatch across `periods` representative years SIMULTANEOUSLY, with
# capacity that VINTAGES (accumulates) across periods, per-period demand
# growth (config/district_composition.yaml:lifetime_demand_trajectory
# interpolated to each period year), grid-EF decarbonisation
# (grid.emission_factor_trajectory), CAPEX learning
# (technologies.*.capex_real_decline_per_year) and per-vintage-age PV
# degradation (technologies.*.degradation_per_year).
# Which Technologies Learn, And Which Deliberately DO Not (audited and
# - previously this was an omission, now it is a
# decision, and the difference matters because a missing decline is a
# silent cost penalty in exactly the periods the LP is choosing between
# technologies).
#   LEARN, declared here:      rooftop_pv 1.2%/yr, solar_farm 1.5%/yr,
#                              li_ion_battery 3.0%/yr
#     *** These Are Very Conservative, And Now Measured Against The Primary
#     SOURCE. *** ITRPV 17th Edition, June 2026 ("International
#     Technology Roadmap for Photovoltaics, Results 2025", VDMA - the industry
#     standard reference, 88 pp,.
#     VERBATIM, section 3 / 9.1 "PV learning curve":
#       "the price experience curve from 1976 to 2025 continued with its
#        historic learning; the new calculated learning rate (LR) is 26%"
#       "The current learning rate is calculated to be 26% using all historic
#        price data points from 1976 to 2025. However, considering only the
#        data points from 2006 - 2025, the learning rate is 40.8%"
#     That IS A Learning Rate Per Doubling of cumulative shipments, not a
#     per-year decline, so it cannot be dropped into this config directly -
#     but it brackets us. 26% per doubling with even three doublings to 2055
#     gives 0.74^3 = 0.41, about -59%; this config's 1.2-1.5%/yr gives -26%
#     to -31% over the same 25 years. **So the model assumes roughly half the
#     cost fall that the measured 50-year module learning curve implies, and
#     under a third of what the 2006-2025 curve implies.** State it that way
#     at viva: the PV economics here are not built on optimistic cost
#     forecasts.
#   LEARN, INHERITED:          bipv_facade (from rooftop_pv), solar_carport,
#                              floating_pv, tracked_pv (all from solar_farm).
#                              These have no `technologies:` entry because
#                              their capex IS the parent's capex times a
#                              constant multiplier, so they must carry the
#                              parent's learning rate - forced by the algebra.
#                              *** IS Inheriting The Full Parent Rate Right?
#                              should carry its OWN sourced rate instead. The
#                              honest answer from ITRPV: inheriting is the
#                              OPTIMISTIC END of a narrow bracket, and it is
#                              declared as such rather than presented as exact.
#                              ITRPV p.65 verbatim - "Module, balance of system
#                              (BOS) components, and project development costs
#                              are the largest contributors to the initial
#                              expense for solar PV systems" - and the 26%
#                              learning rate is for the MODULE, not the BOS.
#                              Carport, floating and Bipv are Mounting-Heavy:
#                              more of their cost is structure, which does not
#                              ride the module curve, so their system cost
#                              should fall somewhat SLOWER than a roof system.
#                              Why Inheriting IS Still Defensible: the parent
#                              rates (1.2-1.5%/yr) are already less than half
#                              what the module learning curve implies, so even
#                              the "optimistic" child rate sits well below any
#                              module-based estimate. The bracket is [0%/yr =
#                              the pre-fix bug] to [parent rate = now], and the
#                              truth is inside it.
#                              SENSITIVITY TO RUN: derived PV at zero decline,
#                              which reproduces the old behaviour and bounds
#                              the whole effect. ***
#                              *** This Was A Bug Until the base
#                              was inherited but the DECLINE was not, so BIPV,
#                              carport and floating PV sat at 1.0000x in 2055
#                              while the identical modules on a roof sat at
#                              0.7395x. See Economics.period_capex_factor. ***
#   DO NOT LEARN, on purpose:  biomass_chp, wte_plant, biogas_plant,
#                              thermal_cold_storage, v2g_charger.
#                              The first four are Mature Combustion And
#                              THERMAL PLANT - boilers, grates, digesters and
#                              insulated tanks are century-old engineering
#                              with no module-style learning curve, and no
#                              published India cost-decline rate was found for
#                              them in the citation sweep.
#                              *** And For Waste-TO-Energy The Direction IS
#                              Probably UP, Not Down. ***
#                              directly whether these costs fall or rise, and
#                              the evidence points the other way: WTE capex
#                              is driven by air-pollution-control equipment,
#                              and CPCB issued tightened WTE operating
#                              guidelines in 2025. Stricter flue-gas limits
#                              add Apc capex. Indian WTE literature (Cse,
#                              Centre for Financial Accountability) notes
#                              cheaper India-specific technology exists only
#                              because its monitoring and control are less
#                              sophisticated - which is exactly what
#                              tightening standards removes.
#                              SO State IT Both Ways, because the reference
#                              point decides the sign:
#                                vs. granting a learning discount, flat is
#                                CONSERVATIVE - these are the town's own
#                                dispatchable non-solar plants, so refusing
#                                them a discount makes the town's case
#                                harder, not easier;
#                                vs. reality, flat may be mildly OPTIMISTIC,
#                                because real WTE costs look set to rise with
#                                emission norms.
#                              Do not claim it is unambiguously conservative.
#                              v2g_charger is power electronics and probably
#                              DOES fall in real terms, but no rate was
#                              sourced, so it is left flat and declared
#                              rather than guessed. Listed as a known
#                              conservatism, not as a gap. The objective is the
# years-represented-weighted sum of per-period annual cost; lifetime_cost
# becomes the objective directly (replaces the post-hoc projection).
# Default enabled:false -> production stays Single-Period (2030 snapshot +
# post-hoc lifetime projection) until the multi-period path is validated
# (D1(b) Phase 4 acceptance). Flip to true to use the multi-period LP.
multi_period:
  # (D1(b) Phase 4 — Claude 2): flipped false -> true after the
  # vintaged LP solved cleanly in 16 s and produced a realistic +64 %
  # as production default (more realistic but ABOVE the brief's +20-35 %
  # band) or revert to false (matches the brief target but under-counts).
  enabled: true
  # Representative years + how many of the 25-yr horizon each stands for
  # (must sum to project_lifetime_years = 25). 2030 covers yrs 1-8, 2042
  # yrs 9-17, 2055 yrs 18-25.
  periods:
    - {year: 2030, represents_years: 8}
    - {year: 2042, represents_years: 9}
    - {year: 2055, represents_years: 8}
  base_year: 2030
  # Real inter-period discount rate for an NPV objective. Default 0.0
  # keeps the lifetime sum directly comparable to the single-period
  # undiscounted-real convention (CAPEX is already CRF-annualised). Set
  # e.g. 0.06 for a social-real-NPV objective in sensitivity runs.
  # - What This Means For The Headline, stated
  # here because the lifetime figure is quoted everywhere and is NOT an NPV.
  # The convention above is internally defensible: capital IS discounted,
  # through actor-specific real CRF rates inside each period. What is NOT
  # discounted is a rupee of 2055 OPERATING cost against a rupee of 2030
  # operating cost. They count equally.
  # That is not neutral between the two scenarios, and the direction is
  # knowable without running anything. The designed town's advantage is
  # BACK-LOADED - the PV fleet grows 201 -> 276 -> 346 MWp, the battery
  # arrives only in 2055, and the grid it displaces decarbonises 69% over the
  # horizon. Undiscounted, 2055 carries full weight. At this project's own
  # `social_planner: 0.05` a 2055 rupee would carry ~0.30 of a 2030 one, and
  # at 6% about 0.23. So discounting REDUCES the town's lifetime advantage.
  # Therefore: the lifetime figure in Claude.md is a 25-year Sum, not a net
  # present value, and must be labelled as such wherever it appears. The
  # sensitivity this comment has proposed since it was written - rerun at
  # 0.06 - has never actually been run. OWED before the write-up quotes a
  # lifetime number; it is one clone-solve, no model change.
  discount_rate_real: 0.0
  # GRANT - the town grants the farm 150 ha in 2030 and unlocks adjacent
  # expansion-reserve parcels to 200 ha (2042) and 250 ha (2055), i.e.
  # 6% -> 8% -> 10% of the 25 km2 site, replacing the flat 350 ha/14%
  # reserve (a government will not allocate ~865 acres of township land up
  # front; land arrives in phases like every other use - the sweep
  # measured the trade: 150 ha costs ~+12% on 2030 annual energy cost vs
  # the 350 ha reference, easing as parcels unlock; the freed ~200 ha is
  # worth ~Rs 500-1,000 crore at peri-urban Punjab land rates - the
  # thesis's land-vs-energy trade, f3_solar_land_sweep.md).
  # This Table IS The Grant Schedule: layout/phased_expansion.py stamps the
  # +50/+50 growth parcels as solar_expansion_2042/2055 tags next to the
  # farm; the energy LP's per-period farm land multiplier is then read FROM
  # THOSE TAGS on the grid (energy/network.py phased_land_multipliers -
  # single source of truth, back-compat 1.0 on untagged layouts).
  # v2 (same day, post-sweep ratification): 150/200/250 -> 200/250/300
  # (8% -> 10% -> 12% of site) -
  # frontier after seeing the sweep table (see demand_norms.yaml solar
  # block for the full rationale + FINDINGS.
  # ===================================================================
  # OPTION A,. The phased grant 200/250/300 ha is
  # replaced by releasing the WHOLE reserve in 2030.
  # WHY. The corrected land density (demand_norms ground_mount_kwp_per_m2
  # 0.10 -> 0.0714, i.e. 2.47 -> 3.46 acres/MWdc) cut the farm ceiling
  # ~29%. Releasing all the reserved land at once restores the 2030
  # capacity: 295 ha x 0.0714 kWp/m2 = 210,630 kWp against the old
  # 201,000. The 2030 headline is protected using land that was ALREADY
  # reserved - no new land is taken from open space.
  # *** And The Cost OF IT, Stated Plainly. *** The farm is now maxed in
  # 2030, so after that capacity grows ONLY by the TRJ-1 density
  # multiplier (x1.10 / x1.15) - about +15% by 2055 - while district
  # demand grows +43% (517 -> 737 GWh). The surplus therefore SHRINKS
  # over the horizon and the data-centre PPA is squeezed in later
  # periods.
  # centre would get squeezed but that's the only option we have, we
  # cant allocate more land." The alternative (+121 ha from open space)
  # was rejected because it breaches the 38% open-space target.
  # 295 not 301: the 100 m buffer below removes 6 cells.
  # Solar-TO-Building Buffer: no farm cell may sit directly
  # against a built cell, including diagonally. One cell = 100 m, which
  # sits inside the standard utility-scale setback band of 100-500 ft
  # (30-152 m) from residential - e.g. Abbeville County SC 100 ft,
  # Weld County CO 500 ft from dwellings.
  # https://legalclarity.org/how-close-can-a-solar-farm-be-to-a-house/
  # MEASURED on the frozen seed-42 layout: only 3 of 201 farm cells
  # touch a built cell edge-on and 6 including diagonals, because the
  # anneal already separated them via the agri belt. So the buffer
  # costs 6 cells, and those 6 become green space.
  # ===================================================================
  #: 295 -> 301, and Option A is FINALLY IN EFFECT.
  # The 295 Never Reached The LP. Farm capacity comes from the layout's
  # expansion tags via energy/network.phased_land_multipliers ("single source
  # of truth with the map"); this key's only other production consumer is
  # Economics.farm_land_rent_annual_inr. So from to the
  # town Paid Rent ON 295 ha While Being Allowed TO Build ON 201/251/301:
  #   2030  +94 ha rented but unusable = Rs 23,500,000/yr for nothing
  #   2042  +44 ha                     = Rs 11,000,000/yr
  #   2055   -6 ha Built ON But Not Rented (the reverse error)
  # Fixed by (a) retagging the 100 reserve cells to `solar_expansion_2030`
  # (scripts/land_a1_release_reserve.py) and (b) teaching
  # phased_land_multipliers a 2030 term. Both consumers now say 301.
  # WHY 301 NOT 295: the 295 assumed the 100 m solar-to-building buffer would
  # cost 6 cells. MEASURED on this layout: ZERO farm or reserve cells touch a
  # built cell on any of 8 sides, so nothing is lost and the reserve is 301 ha.
  # Guarded by tests/test_land_consistency.py, which asserts rented ha ==
  # buildable ha in every period - the class of check a config-key audit
  # cannot make, because this key was never dead, just disagreed with.
  farm_land_cells_by_period: {"2030": 301, "2042": 301, "2055": 301}
  # Trj-1 (trajectory batch,): PV Density Ceiling per vintage.
  # Later vintages pack more kWp onto the SAME roof/land area because module
  # efficiency keeps rising, so every AREA-limited PV cap (rooftop, BIPV,
  # carport, floating, solar-farm land) grows for capacity built in later
  # periods. Sources: ITRPV roadmap (VDMA, 15th ed. 2024).
  # *** Claim-Verified. *** The Url previously cited here was the
  # VDMA topic landing page (German site navigation, no roadmap content, no
  # efficiency figures) - flagged in CITATION_VERIFICATION as evidencing
  # nothing. The actual 15th-edition PDF has now been fetched and parsed (82
  # pp). Fig. 59 "Average module area efficiency in mass production", p.54,
  # gives verbatim: PERC p-type mono-Si "average efficiencies of 21.6% in 2024
  # and up to 22% within the next 10 years"; n-type tunnel-oxide (TOPCon)
  # "22.8% in 2024 and with up to 24% in 10 years"; SHJ 23% -> 24.3% by 2034;
  # n-type back-contact 23.2% -> ~24.7% by 2034. (Tandem after 2026: 27% in
  # 2028, ~30% by 2034.) p.54 also states the identity this model relies on:
  # "a value of 22% corresponds to a power density of 220 W/m2".
  # SO The ~21.5-22% (2024) Figure IS Confirmed - it is the Perc line - and
  # The Derived Multipliers Below Are Conservative Against This Source:
  #   this model assumes a deployed-FLEET average of ~20-21% for 2030 builds,
  #   BELOW ITRPV's 2024 TOPCon 22.8%; ~22.5% for 2042 and ~23.5-24% for 2055,
  #   both below ITRPV's 2034 back-contact 24.7% - and ITRPV does not even
  #   forecast past 2034, while tandem is already heading to ~30%.
  #   x1.10 / x1.15 = 22.5/20.5 and 23.75/20.5, i.e. only +15% of areal
  #   density over 25 years, against +14% that ITRPV shows in 10.
  # Say "conservative" here and it is defensible; do not say "central".
  #, https://www.qualenergia.it/wp-content/uploads/2024/06/ITRPV-15th-Edition-2024-2.pdf
  # (15th ed. 2024 PDF as fetched; VDMA is the publisher, its own landing page
  # is https://www.vdma.eu/en-GB/international-technology-roadmap-photovoltaic );
  # NREL ATB 2024 PV efficiency/cost trajectories (,
  # https://atb.nrel.gov/electricity/2024/utility-scale_pv). Derivation
  # : deployed-FLEET average module efficiency ~20-21% for 2030-built
  # capacity (mix of premium + mid-tier modules on Indian rooftops/farms),
  # ~22.5% for 2042 vintages, ~23.5-24% for 2055 vintages -> kWp/m2 ceilings
  # x1.00 / x1.10 / x1.15 vs the 2030 base (inside the brief's 1.10-1.20
  # 2055 band; conservative tail as the Shockley-Queisser limit bites).
  # Consumed by Economics.pv_density_ceiling_multiplier(year) - scales the
  # CUMULATIVE-installed cap constraints per period in the multi-period LP.
  # 2030 = 1.00 keeps the base year byte-exact; counters the saturation
  # finding (demand growth outrunning a FIXED PV ceiling).
  pv_density_ceiling_multiplier_by_period:
    # The Trj-1 uplifts re-rated Already-Built vintages once
    # flattened the farm's land term (32,237 phantom kWp by 2055),
    # and under the corrected area-budget caps they instead induce a
    # discount (dens1_ab_20260820.txt). Density gains are therefore
    # credited NOWHERE rather than mis-credited somewhere - the
    # conservative direction. The ITRPV/NREL Atb derivation above
    # stays for the Discussion chapter; option C (6.5% inter-period
    # discount, density kept) is the DISC-1 sensitivity, measured in
    # dens1_options_probe_20260820.txt.
    2030: 1.00
    2042: 1.00
    2055: 1.00
  # (,
  # capacity?"). HOW the multipliers above enter the PV surface caps.
  #   false (legacy): sum_v new_kwp[v]           <= base * dens[p] * land[p]
  #   true  (area):   sum_v new_kwp[v] / dens[v] <= base * land[p]
  # The legacy form dates from phased farm land ("more land x better
  # panels") and was correct while land[p] grew;
  # released all 301 ha in 2030, flattening land[p] for the farm - after
  # which dens[p] re-rates ALREADY-BUILT vintages on full land. Measured
  # capacity_cap_audit_20260820.txt): farm +32,237.1 kWp (13.0%), carport
  # +575.0 (3.0%), floating +811.5 (4.3%). The area form conserves surface:
  # each vintage consumes land at its own density (a 2042 build on an EMPTY
  # canal still packs 1.10x - that fill is legitimate and survives), but
  # standing capacity is never re-rated. dens[2030]=1.0, so the 2030 base
  # year - and therefore the pinned annual headline - is IDENTICAL under
  # both forms; only 2042/2055 builds and the lifetime figure move.
  pv_density_area_budget: true    # re-pin

# ---------------------------------------------------------------------------
# SCENARIO HOOKS (trajectory batch,) - A/B stress tests approved
# as Scenarios in register 0e (Dem-3, Dem-8, Rev-3). All default to
# enabled: false -> the production baseline is byte-identical to a build
# without this block. scripts/trajectory_scenarios.py clones the economics
# (deepcopy + force_reload, REV-1-safe), flips one hook, re-solves
# full_stack alpha=0 multi-period, and reports the deltas. NEVER enable
# these in the production config - they are counterfactual stress tests.
# ---------------------------------------------------------------------------
scenario_hooks:
  # Dem-3: Duck-Curve Tariff Drift + Falling Feed-IN (stresses battery
  # timing + export value). As grid solar saturates, midday wholesale
  # prices crash and evening ramps price up; distribution feed-in follows.
  # Evidence: IEX day-ahead MCP already shows midday troughs ~Rs 2.5-3.5 vs
  # evening Rs 6-10 in high-RE months (IEX market data,
  # https://www.iexindia.com/market-data/day-ahead-market/market-snapshot);
  #../DATA/iex_punjab_dam_tariff_notes.md (project-collected); CAISO duck
  # curve as the canonical precedent.
  # *** CLAIM- via an accessible source - nrel.gov does not
  # resolve from this environment (DNS), so the claim was verified through
  # Utility Dive's reporting of the same material, which carries the origin
  # AND the measured numbers: ***
  #   Trabish, "On the duck's 10th birthday, here's how to keep it from
  #   eating the power system", Utility Dive, :
  #     - the curve was "first identified by National Renewable Energy
  #       Laboratory researchers in February 2008", at ~10% solar share of
  #       annual generation on the western US grid;
  #     - CAISO named it in ~2013 - "the deep dip in midday demand for system
  #       power looked like a duck's belly when followed by a sharp evening
  #       demand spike that looked like a duck's neck and bill";
  #     - MEASURED records: midday minimum demand 7,149 MW (18 Feb) and a
  #       three-hour evening ramp of 14,777 MW (4 Mar), both BEYOND CAISO's
  #       own 2020 projections of a 13,000 MW ramp / 12,000 MW minimum.
  #   https://www.utilitydive.com/news/on-the-ducks-10th-birthday-heres-how-to-keep-it-from-eating-the-power-sy/519367/
  # What IT Supports Here: only the Direction and the existence of the
  # precedent - midday net load collapses and evening ramps steepen as solar
  # saturates. The multipliers below remain derived paths for Punjab;
  # Caiso magnitudes are Not transferred. Original NREL feature retained for
  # provenance: https://www.nrel.gov/news/features/2018/10-years-duck-curve.html
  # Multipliers are derived paths on the RETAIL ToD structure:
  # midday bands cheapen 15-40%, evening peak firms +10-25% by 2055;
  # feed-in (export) value falls toward wholesale midday reality
  # (gross/net-metering rates trending down nationally - MNRE/SERC
  # net-billing shift).
  duck_curve_drift:
    enabled: false
    import_multiplier_by_period_daypart:
      2042: {"10_12": 0.85, "12_14": 0.80, "14_16": 0.85, "18_20": 1.10, "20_22": 1.10}
      2055: {"10_12": 0.70, "12_14": 0.60, "14_16": 0.70, "18_20": 1.25, "20_22": 1.25}
    export_multiplier_by_period:
      2030: 1.00
      2042: 0.70
      2055: 0.40
  # Dem-8: Carbon Price From 2042. India's Carbon Credit Trading Scheme
  # (CCTS, notified 2023; compliance market phasing in from 2026) is
  # expected to mature over the horizon. Path (, derived): 2042
  # Rs 2/kgCO2 (~USD 23/t) ~ CCTS mature-phase estimates; 2055 Rs 4/kg
  # (~USD 45/t).
  # *** Sourced And RE-Labelled Against The Actual Weo Table. ***
  # This block said the 2055 figure was "IEA WEO Announced-Pledges-class
  # carbon price for developing Asia by mid-century".
  # World Energy Outlook (2025 edition, 519 pp) and Annex B was read directly.
  # Table B.6, "CO2 prices for electricity in selected regions by scenario,
  # USD (2024, MER) per tonne of CO2":
  #     Stated Policies Scenario   2035  2040  2050
  #       China                      22    26    34
  #       European Union             89    92   174
  #     Net Zero Emissions by 2050 Scenario
  #       Selected emerging markets and developing economies*
  #                                 125   160   200
  #     *footnote: "Includes Brazil, China, India, Indonesia and South Africa"
  # Two Corrections Fall Out.
  # (1) The Label Was Wrong. There is no Announced-Pledges row in this table -
  #     the scenarios are Current Policies, Stated Policies and NZE. The
  #     model's values do not match NZE at all.
  # (2) The Values Are Stated-Policies-Class, And They Hold. India has no
  #     STEPS row; China is the nearest large developing-economy comparator,
  #     at USD 26/t in 2040 and 34/t in 2050. This model uses ~USD 23/t at
  #     2042 and ~USD 45/t at 2055 - the 2042 figure sits just under China's
  #     2040, and 2055 sits above its 2050 but far below NZE.
  #     Against the India-inclusive NZE row (160 at 2040, 200 at 2050) the
  #     model is 7x and 4.4x LOWER, so the carbon adder is deeply conservative
  #     under any decarbonisation-consistent scenario.
  # IEA'S Own Caveat, quoted because it matters for using these as a cost:
  #   "The level of carbon prices included in our scenarios should be
  #    interpreted with caution... As a result, CO2 prices in our scenarios
  #    do not represent the marginal cost of abatement."
  # So these are policy-scenario prices, not shadow prices - which is exactly
  # how this model uses them (a real cost adder on emissions, from 2042).
  # Sources: CCTS notification (MoP/BEE,
  #, https://beeindia.gov.in/en/programmes/carbon-market); IEA carbon
  # price assumptions - See The Block Directly Below, the citation was
  # replaced. Applied as a
  # REAL cost adder price_p x annual emissions_p in the affected periods
  # (2030 = 0 -> the 2030 headline cost is unchanged; the BUILD may shift).
  # =====================================================================
  # *** IEA Citation Replaced And Opened,. ***
  # This block used to cite "IEA WEO 2024 carbon-price assumptions" at
  # https://www.iea.org/reports/world-energy-outlook-2024. That URL is the
  # report LANDING PAGE. It carries a navigation list of past editions and a
  # download prompt, and NO carbon price, so the 2042/2055 path had no opened
  # source. Flagged in CITATION_VERIFICATION as "Landing Page, And This One
  # Feeds A Real Number".
  # The Prices Are IN A Different Document, now downloaded and parsed in full
  # (137 pp): IEA, "Global Energy and Climate Model Documentation 2024",
  # section 2.3.2 "CO2 prices", TABLE 2.4, printed p.20..
  # https://iea.blob.core.windows.net/assets/89a1aa9a-e1bd-4803-b37b-59d6e7fba1e9/GlobalEnergyandClimateModelDocumentation2024.pdf
  # VERBATIM, "CO2 prices for electricity, industry and energy production in
  # selected regions by scenario", USD (2023) per tonne of CO2, Announced
  # Pledges Scenario, row "Emerging market and developing economies with net
  # zero emissions pledges":
  #       2030   2035   2040   2050
  #         40     65    110    160
  # And The Footnote Matters, because it puts India in that row by name -
  # footnote 2 verbatim: "Includes China, India, Indonesia, Brazil and South
  # Africa." So this is the correct row for this model, not a proxy.
  # How This Model Compares, and the direction is worth stating plainly.
  # Every value in this file is 2030-real INR (see the currency note at the
  # head of the file), so the comparison is approximate at any plausible rate
  # of 80-90 INR/USD:
  #   2042  Rs 2.0/kg = Rs 2,000/t = about USD 22-25/t   vs IEA 110 at 2040
  #   2055  Rs 4.0/kg = Rs 4,000/t = about USD 44-50/t   vs IEA 160 at 2050
  # **This model therefore assumes roughly a Fifth to a Third of the IEA
  # Announced-Pledges carbon price for India's own category.** Say
  # "deliberately conservative" and it is defensible; do NOT say the figures
  # follow the IEA path, because they are far below it. A carbon price this
  # low understates the district's carbon advantage, so the conservatism runs
  # against the headline rather than toward it.
  # Note This Lever IS Off IN Production (`enabled: false`), so nothing in the
  # pinned results depends on it. It matters for the sensitivity work only.
  # =====================================================================
  carbon_price:
    enabled: false
    price_inr_per_kgco2_by_period:
      2030: 0.0
      2042: 2.0
      2055: 4.0
  # Rev-3: Reserve Margin / Resilience (pairs Sup-5 shock resistance). A
  # planning-reserve constraint per period: firm capacity (capacity-credit-
  # weighted) >= (1 + margin) x the period's peak hourly load. PV counts 0
  # (evening-peak convention); battery/V2G count at power capability with
  # an availability discount on V2G. margin 0.15 ~ Indian resource-adequacy
  # planning practice (CEA Resource Adequacy Guidelines 2023,
  # https://cea.nic.in/ (Notified Guidelines section; direct path 404s as of); NREL capacity-credit
  # conventions). Capacity credits (derived convention).
  reserve_margin:
    enabled: false
    margin_fraction: 0.15
    capacity_credit:
      grid_import: 1.0
      battery: 1.0
      v2g: 0.5
      biomass: 0.9
      wte: 0.9
      biogas: 0.9
  # Res-1: Unserved Energy / VoLL (resilience stress pack,).
  # Adds an unserved-energy Var priced at VoLL to the multi-period builder
  # so black-swan shocks become measurable load-shed instead of
  # infeasibility. NEVER enable in production (off = the balance stays a
  # hard equality, byte-exact); scripts/res1_black_swan_pack.py enables it
  # on deepcopied clones only. VoLL Rs 140/kWh = the national
  # resource-adequacy planning value (CEA, Draft Guidelines for Resource
  # Adequacy Planning Framework for India, Sep 2022, Annexure C p.21:
  # "Assuming a Value of Lost Load (VoLL) of INR 140/kWh, the optimal PRM
  # would be around 8%",
  # https://cea.nic.in/wp-content/uploads/irp/2022/09/Draft_RA_Guidelines___23_09_2022_final.pdf;
  # adopted MoP framework Jun 2023,
  # https://static.pib.gov.in/WriteReadData/specificdocs/documents/2023/jun/doc2023628218801.pdf;
  # corroboration: Delhi households' revealed WTP ~USD 1.50/kWh ~ Rs 125/kWh,
  # Resource and Energy Economics 2024,
  # https://www.sciencedirect.com/science/article/pii/S0928765524000010;
  # sectoral low end: Karnataka industry Rs 22.1/kWh production-loss (2005
  # rupees), Energy Policy,
  # https://www.sciencedirect.com/science/article/abs/pii/S0301421505002466 ).
  # Shock knobs (all optional, consumed by the multi builder ONLY when
  # enabled): import_cap_multiplier_by_month, export_cap_multiplier_by_month,
  # demand_multiplier_by_period_month, pv_yield_multiplier_by_month,
  # floating_pv_yield_multiplier_by_month, straw_energy_cap_multiplier.
  #; straw case permanent;
  # critical scope + sewage/telecom (critical LEDGER, reporting side only).
  resilience_unserved:
    enabled: false
    # no citation; it now has one and it STANDS - no change to the value.
    # Allcott / Burlig-type field evidence for India: households are willing
    # to pay ~USD 1.50/kWh of lost consumption, "more than 25 times the
    # average price they pay for grid electricity" - "The long-run value of
    # electricity reliability in India", Journal of Development Economics
    # (2024), https://www.sciencedirect.com/science/article/pii/S0928765524000010
    # At ~Rs 83/USD that is ~Rs 125/kWh, so 140 sits ~12% above a measured
    # household willingness-to-pay - the right order, slightly conservative
    # for a mixed district that also carries commercial and healthcare load.
    # SUPPORTING (, older, sector-specific): Karnataka manufacturing
    # cost of unserved power - Rs 22.10/kWh by production-loss, Rs 4.89/kWh
    # by willingness-to-pay, Rs 2.63/kWh by captive-generation
    # (Energy Policy, https://www.sciencedirect.com/science/article/abs/pii/S0301421505002466).
    # Those are INDUSTRIAL and 20 years old; they bracket the low end and
    # explain why an industrial-only VoLL looks far smaller than a
    # household one. Quote the household figure for a residential district.
    voll_inr_per_kwh: 140

# ---------------------------------------------------------------------------
# Stage D — per-cell / multi-bus dispatch.
# district-aggregate Pyomo LP with a per-cell / multi-bus LP. Each built
# cell becomes its own bus with local demand + PV + storage; balance is
# enforced per (cell, period, slice); per-edge cable flows respect KCL +
# DC power-flow approximation; new P2P trading variable exchanges energy
# between cells at a tariff between import and export.
# Bundled from day 1: module-mix mono/poly/thin-film as LP variable;
# per-cell residential/commercial/industrial tariff split; Phase 3C
# industrial cross-subsidy wiring;- PMSGY tier refinements; N9
# EV/V2G placement (home vs workplace); N10 demand-diversity coincidence.
# Gate this with `stage_d.enabled: false` until the per-cell LP is built
# AND validated (single-bus aggregate must reconcile within ~1 % of the
# current 1,276.8 M baseline). When false, `solve_dispatch_pyomo`
# branches to the existing single-bus path byte-for-byte (mirrors the
# D1(b) multi_period gating pattern).
stage_d:
  # Not Yet Built. Stays false until the per-cell LP lands + validates.
  enabled: false
  # Spine components
  # rollout — set true on the spine landing PR, false to revert).
  per_cell_buses: false              # one Pyomo bus per built cell
  per_edge_cable_flow: false         # ROAD-ROAD edges become LP Vars
  dc_power_flow: false               # linearised DC approximation + losses
  p2p_trading: false                 # cell-to-cell exchange at mid-tariff
  bundle_module_mix_lp_var: false    # — module-mix per-cell LP Var
  bundle_per_cell_tariff_split: false  # — res/com/ind tariff split
  bundle_industrial_cross_subsidy: false  # Phase 3C — needs per-cell dispatch
  bundle_pmsgy_tier_refinement: false  #- — per-cell PMSGY tiering
  bundle_ev_placement: false         # N9 — home vs workplace charging
  bundle_demand_diversity: false     # N10 — diversity/coincidence factor
  # Validation knobs — left at conservative defaults; tune as the LP
  # validates.
  reconciliation_tolerance_fraction: 0.01  # per-cell sum must match
                                            # single-bus headline ±1 %
  # Cell decimation for solve-time control. At 864 slices × ~400 built
  # cells × 3 periods, naive Pyomo would have ~1 M Vars. Initial spine
  # may aggregate cells by (land_use, height_tier, microclimate) bucket.
  cell_aggregation_strategy: "none"  # "none" | "by_category" | "k_means"
  # Per-edge DC flow approximation: |f| <= cable_thermal_kw; loss =
  # r_per_m × length_m × f² / V² (linearised by piecewise-linear cut at
  # |f|/cable_thermal in [0, 1]). Conservative cable thermal limit
  # 6 MW per Road-Road link (11 kV Acsr Rabbit ~90 mm² aluminium
  # standard urban feeder). Cite CEA Distribution Code 2018.
  cable_thermal_kw_default: 6000.0
  cable_resistance_ohm_per_km: 0.275  # ACSR Rabbit @ 75 C operating temp
  cable_voltage_kv: 11.0              # PSPCL 11 kV distribution standard
  dc_loss_piecewise_breakpoints: [0.0, 0.5, 1.0]
  # P2P trading tariff (mid-point between import_tariff and export_tariff).
  # 4.5 INR/kWh sits between the off-peak import ~3.5 and the export
  # tariff ~3.5; pegged to PSERC residential first-slab as a clean anchor.
  p2p_trading_tariff_inr_per_kwh: 4.5

# ---------------------------------------------------------------------------
# Electrical Asset Model (Stage D electrical build, Phases B-E) —
# (Opus 4.8). Explicit distribution-network capital + capacity + losses on top
# of the Phase-2 per-edge KCL. Adds infrastructure CAPEX (raises lifetime cost)
# and makes the realistic per-cable cap FEASIBLE via a 33 kV backbone + sized
# substation. OPT-IN: `enabled: false` keeps the production headline byte-exact
# (1,221.2 M); when true it is a scenario (like the DC-PPA / Agile A/B). Tests
# assert DIRECTION + sanity, not byte-exactness.
# Cost basis — TS Southern Power Distribution Co. (TGSPDCL) "Cost Data FY23-24"
# (state-DISCOM regulatory estimate book = for Indian distribution capex):
#   https://tgsouthernpower.org/resources/PDF/Tarrif_Regulations/Cost-data%20FY23-24.pdf
# Cross-ref CEA "Electricity Distribution Network Planning Criteria" 2024 (max
# 33/11 kV substation = 100 MVA): https://cea.nic.in/wp-content/uploads/notification/2024/01/Final_Approved__Revised_Distribution_Planning_Criteria.pdf
electrical_network:
  enabled: false                     # OPT-IN scenario; false => production byte-exact
  # decouple COST from CAPS. When enabled, the capex (B/C/D) always
  # counts; `enforce_thermal_caps` gates ONLY the per-edge voltage-class thermal
  # caps (the Phase-C feasibility limiter). Set false to cost the infrastructure
  # WITHOUT imposing the realistic caps (which currently expose the single-node
  enforce_thermal_caps: true         # true => realistic per-edge caps bind (feasibility test)
  # =====================================================================
  # Internal Network Cost IN Production (,
  # still have the... infra like transmission lines + power stations for
  # BOTH models for completeness").
  # What Was Wrong. `enabled` above is read Only by the Stage-D builders,
  # and `stage_d.enabled` is ALSO false - so the district's cables,
  # substation and distribution transformers were costed in NO production
  # number. The town and BAU both got their internal grid for free. That is
  # the same defect the sized interconnection fixed one level up, except
  # here the charge was not flat, it was ABSENT.
  # Why A Separate Flag rather than flipping `enabled`. `enabled` also
  # switches on distributed plant injection, explicit transformer losses
  # and the I2R layer inside Stage-D (dispatch.py ~3491/3605/4066). Those
  # are a different, unvalidated feature set. This flag adds ONLY the
  # annualised CAPEX, as a parity constant, to the paths that actually run.
  # Parity. Charged to Every scenario including BAU, on the same layout, so
  # it cannot flatter the designed town. It is deliberately NOT scenario-
  # sized: see the substation note below for why that is worth ~0.01%.
  cost_in_production: true           # false => byte-exact to the pre- pins

  # --- Phase B: cable CAPEX per route-km by voltage class (INR/km) ---
  # Overhead (OH) lines + underground (UG) cables, TGSPDCL FY23-24 abstract:
  #   33 kV OH (PSCC pole, 100 mm2 AAAC): Rs 8,85,795/km  (~0.886 M)
  #   11 kV OH (PSCC pole, 55 mm2 AAAC):  Rs 5,44,078/km  (~0.544 M)
  #   11 kV UG (3C x 300 mm2 XLPE, laid): Rs 46,13,879/km (~4.61 M)
  #   33 kV UG (3C x 400 mm2 XLPE, laid): Rs 61,41,627/km (~6.14 M)
  # (regulatory cost book). UG includes trenching/laying; UG/OH ~6.9x.
  cable_capex_inr_per_km:
    backbone_33kv_oh: 885795.0        # 33 kV overhead backbone feeder
    backbone_33kv_ug: 6141627.0       # 33 kV underground (urban core option)
    dist_11kv_oh: 544078.0            # 11 kV overhead distribution
    dist_11kv_ug: 4613879.0           # 11 kV underground distribution
  # Fraction of each voltage class routed UNDERGROUND (rest is overhead). A
  # peri-urban district undergrounds the dense core; arterials stay OH.
  # planning assumption (URDPFI undergrounding in planned townships).
  underground_fraction:
    backbone_33kv: 0.30
    dist_11kv: 0.50
  cable_lifetime_years: 40           # distribution cable design life (CEA/IS)

  # --- Phase C: primary 33/11 kV substation ---
  # CAPEX per MVA from Tgspdcl 2x8 MVA substation (2 Ptr + 6x11 kV feeders,
  # no cap bank) = Rs 2,88,95,847 / 16 MVA = ~Rs 1.81 M/MVA..
  substation:
    capex_inr_per_mva: 1806000.0     # ~Rs 1.81 M/MVA (Tgspdcl 2x8 MVA / 16)
    # RE-SIZED 480 -> 300 MVA. The 480 was derived on
    # from measured peaks of 269.1 / 354.5 / 447.3 MW - peaks belonging to
    # the 910 GWh demand that the parameter audit then cut by
    # 43%. It was never re-derived, so the model was buying a substation
    # 2.7x the one it needs. (Same disease as the 600 MW interconnection
    # basis, found the same day: a capacity constant outliving the demand
    # it was sized against.)
    # RE-DERIVATION from the CURRENT demand (scripts/substation_sizing.py,
    # is read off this model's own slice profile x the audited period
    # demand multipliers (1.0 / 1.1551 / 1.3290), NOT assumed:
    #     2030  525.7 GWh   117.3 MW peak   123.5 MVA   load factor 0.512
    #     2042  620.4 GWh   140.5 MW peak   147.9 MVA   load factor 0.504
    #     2055  734.9 GWh   169.8 MW peak   178.8 MVA   load factor 0.494
    # Design-horizon FIRM requirement = 178.8 MVA at pf 0.95.
    # N-1: 3 x 100 MVA units -> firm 200 MVA >= 178.8 with one unit out,
    # and 100 MVA is Exactly the CEA 2024 ceiling for a 33/11 kV substation
    # *** Verified AT Source. *** The CEA 2024 Distribution
    # Planning Criteria was downloaded and parsed in full (158 pp, archived
    #   "As per latest CEA (Technical Standards for Construction of
    #    Electrical Plants & Electric Lines) Regulations 2022, the maximum
    #    capacity of 33/11 kV, 33/22 kV and 22/11 kV Sub-stations shall be
    #    as 100 MVA, 75 MVA and 75 MVA respectively."
    # DO NOT let anyone "correct" this to 60 MVA. That is the 2010
    # the 2010 figure without flagging it as superseded and briefly made
    # this look non-compliant. The cap is PER SUBSTATION and this model
    # uses 3 x 100 MVA, each exactly at the ceiling.
    # already cited at the head of this block. Installed 300 MVA.
    # (derived from the CEA criterion + this model's measured
    # peaks). Per-MVA capex unchanged at the TGSPDCL rate.
    # CROSS-CHECK, independent of this calculation: the sized-connection LP
    # puts BAU's grid connection at 203.6 MW. 169.8 MW peak load x the
    # model's own 14.5% loss chain = 194.4 MW. Two unrelated routes, ~5%.
    # Not Scenario-Sized, deliberately. The substation sits Below the solar
    # farm and the CHP fleet, so neither reduces what crosses the 33/11 kV
    # transformers - they reduce IMPORT, which is why the interconnection
    # differs 36.4% between town and BAU and this does not. Only rooftop
    # PV, V2G, DSR and the battery cut the crossing, and at the 18:00-22:00
    # peak rooftop is zero and the battery is 2055-only. Ceiling on
    # the difference is DSR's 10% of peak ~ 17 MVA ~ Rs 0.22 cr/yr = 0.01%
    # of town cost. Measured and reported as an output; not worth an LP Var.
    mva_installed: 300.0             # 3x100 MVA, N-1 firm 200 MVA (was 480: stale 910-GWh peaks)
    lifetime_years: 35               # substation design life (CEA)
    power_factor: 0.95               # MVA -> MW conversion for the throughput cap
  # --- Phase C: voltage-tier per-edge thermal caps (kW) ---
  # The Phase-2 KCL reads a per-edge cable_thermal_kw; here it becomes a function
  # of voltage class. 33 kV backbone carries far more than the 6 MW 11 kV feeder,
  # which is what makes the realistic-cap network FEASIBLE (the pure-11 kV 6 MW
  # network was infeasible: substation egress ~24 MW << ~100 MW peak).
  voltage_tiers:
    # 100k -> 250k with the SAME x3 bite ratio used for the register-0f
    # district-absolute caps (import 200->600, export 60->180 MW). Backbone
    # corridor 40 -> 120 MW = a 66 kV double-circuit corridor (2x~63 MVA
    # Zebra class) or 4x parallel 33 kV Panther circuits in the arterial ROW;
    # key NAME kept as backbone_33kv for schema stability (geojson/viewer
    # join on it - rename is a post-freeze rider). Distribution corridor
    # 10 -> 30 MW = 3x parallel 11 kV ACSR-Wolf feeders per road corridor
    # (standard urban practice: multiple feeders share the arterial ROW).
    # (derived); conductor classes per the CEA criteria below.
    backbone_33kv_thermal_kw: 120000.0  # 250k backbone corridor (was 40000 at 100k)
    # (Opus 4.8): RAISED 6000 -> 10000 after the flow-feasibility sweep
    # INFEASIBLE for this peri-urban density (~104 MW peak / 25 km^2): the sweep shows
    # 6 MW NO, 8 MW NO, 10 MW YES (sharp threshold). 10 MW per 11 kV feeder = ACSR-Wolf
    # (~150 mm^2) class, a standard DENSE-URBAN conductor (vs Rabbit = light/rural).
    # This IS the thesis reinforcement finding: the network needs Wolf-class 11 kV
    # feeders + a 33 kV backbone + (now 480 MVA) substation to physically serve this load.
    # CEA distribution-conductor ratings : https://cea.nic.in/wp-content/uploads/notification/2024/01/Final_Approved__Revised_Distribution_Planning_Criteria.pdf
    dist_11kv_thermal_kw: 30000.0       # 250k distribution corridor (was 10000: 1x Wolf at 100k)
  # How backbone edges are chosen: shortest-path trees from the substation to
  # load-zone centroids form the 33 kV backbone; all other ROAD-ROAD edges are
  # 11 kV. "heuristic" = compute it; "none" = all-11kV (legacy Phase-2 behaviour).
  backbone_assignment: "heuristic"      # "heuristic" | "none"
  backbone_n_feeders: 4                 # number of 33 kV feeders out of the substation

  # --- Phase D: distribution transformers (11 kV / 415 V) ---
  # Per-zone (Not per-cell). CAPEX per kVA extrapolated from Tgspdcl Dtr abstract
  # (100 kVA installed Rs 2.11 lakh -> 2113/kVA; falls with size) to larger zone
  # DTRs (200-500 kVA) ~Rs 1,500/kVA.-derived. Losses: BEE star-rating
  # distribution-transformer no-load/load loss (Level-2 ~ no-load 0.4%, load 1.0%
  # at rated). Avoid double-count: the transformer share is REMOVED from
  # ac_loss_fraction when electrical_network.enabled (see costs.py note).
  transformer:
    capex_inr_per_kva: 1500.0        # zone DTR (200-500 kVA), TGSPDCL-derived
    no_load_loss_fraction: 0.004     # core loss, constant (BEE star DTR)
    load_loss_fraction_at_rated: 0.010  # copper loss at rated load (BEE)
    lifetime_years: 25               # Dtr design life (CEA/BEE)
    sizing_headroom: 1.25            # kVA installed >= 1.25 x zone peak kW / pf
    # transformer share of the existing aggregate ac_loss_fraction 0.02 that
    # becomes EXPLICIT here (so we don't double-count). ~half of AC losses are
    # transformer core+copper; the rest is LT cable I2R + reactive overhead.
    share_of_ac_loss_fraction: 0.5

  # --- Phase E: per-cable I2R losses (linearised DC power-flow) ---
  # loss_edge ~ R_per_km x length_km x f^2 / V^2, piecewise-linearised on |f|.
  # R/km by conductor ( datasheet): ACSR Rabbit 0.275 ohm/km (matches the
  # stage_d cable_resistance), 33 kV ACSR Panther ~0.139 ohm/km.
  conductor_resistance_ohm_per_km:
    dist_11kv: 0.275                 # ACSR Rabbit (stage_d default)
    backbone_33kv: 0.139             # ACSR Panther (33 kV feeder)
  loss_piecewise_segments: 3         # SOS2 / piecewise segments on |f|

  # --- Reinforce-over-time: period-dependent per-edge thermal caps-closure) ---
  # (Opus 4.8). The realistic per-edge caps must serve the GROWING district
  # peak: 88.3 MW (2030) -> 116.3 MW (2042) -> 146.7 MW (2055), driven by population +43%
  # + climate-cooling + cooking-electrification + income-mobility (period_demand_multiplier
  # x1.000/1.317/1.662). A single fixed cap that serves 2030 (>=15 MW 11 kV lateral, from
  # the fast flow-feasibility sweep) is INFEASIBLE by 2042/2055. "Reinforce over time" =
  # the distribution network is UPGRADED as load grows, so the per-edge thermal caps SCALE
  # with the period demand multiplier (standard staged distribution planning: size feeders
  # to each period's design peak). CEA Distribution Planning Criteria 2024 :
  # https://cea.nic.in/wp-content/uploads/notification/2024/01/Final_Approved__Revised_Distribution_Planning_Criteria.pdf
  # OPT-IN (default false): when false the flat voltage_tier caps apply (legacy realistic-
  # cap behaviour). When true, the Phase-2 KCL flow bounds = base x period_cap_multiplier.
  reinforcement:
    enabled: false
    # (A4 re-time / register: bases re-derived 100k -> 250k
    # (x3 bite ratio, matching the voltage_tiers re-derivation above; the
    # period_cap_multiplier then stages 45/59/75 MW dist + 120/158/199 MW
    # backbone across 2030/2042/2055 against measured peaks 269/355/447 MW).
    # NOTE: the reinforce-over-time FULL LP itself is documented-intractable
    # at the 100 m grid (register 5 h CPU-pegged) - these
    # bases serve the egress arithmetic + the post-freeze super-cell re-time.
    base_dist_11kv_thermal_kw: 45000      # 2030 base 11 kV corridor (was 15000 at 100k)
    base_backbone_33kv_thermal_kw: 120000 # 2030 base backbone corridor (was 40000 at 100k)
    # Per-period cap multiplier. Absent years fall back to period_demand_multiplier at
    # runtime (the network tracks load growth). Keys are years; values are unitless x-factors.
    period_cap_multiplier:
      2030: 1.000
      2042: 1.317
      2055: 1.662

# (Claude 2 864-slice refactor Phase 5): hourly behavioural
# patches that become MEANINGFUL only at 864-slice resolution. Each
# patch sub-block has an `enabled: true|false` switch so behaviours can
# be turned on individually. Patches apply ONLY when slices_per_year ==
# 864 (the demand-builder gates on `econ.is_864_slice_mode` so a
# revert to 144 has zero effect from these blocks).
# ---------------------------------------------------------------------------
# FX-4: per-(category, month) occupancy scaler applied by
# energy/network.py to BOTH the base/plug term and the cooling term (an
# empty building runs neither). Categories or months not listed = 1.0
# (byte-stable). Currently encodes Punjab school summer vacation:
#   * Punjab Education Department / PSEB summer vacation runs ~1 Jun -
#     30 Jun for government and most private schools, with heatwave
#     extensions into the first week of July common in recent years
#     (Punjab Govt vacation notifications 2023-2025).
#   * jun 0.25: closed weekday operations - skeleton admin/security/
#     summer-camp load only (a closed school still carries ~the weekend
#     profile, whose daily mean is ~0.25 x the weekday mean).
#   * jul 0.60: reopening in the first week + admissions; ~3 of 4 weeks
#     operational -> partial month ( derived).
# Winter break (~24 Dec - 7 Jan, 2 weeks) is NOT modelled: it overlaps
# the low-cooling season so the demand effect is second-order (register
# note). The audit (section 13) should show jun/jul school slices near
# weekend levels after the FX-2..6 regen.
# ---------------------------------------------------------------------------
occupancy_monthly_modifier:
  school:
    jun: 0.25
    jul: 0.60

behavioural_864:
  lighting_evening_peak:
    # BESCOM residential load profiles 2022 show lighting drives 40-55 %
    # of residential evening peak, with the peak running 19:00-22:30.
    # +20 % uplift on residential base demand for hours 19-22 across all
    # day types captures this against the 2-hour daypart-averaged shape
    # that smears 19:00-21:00 evening peak with 18:00 ramp.
    #: this patch is UNCHANGED. Hours 19-22 are dark in
    # every month of the year (verified below), so there is no seasonality
    # for it to carry. The seasonality lives one daypart earlier, at 18:00,
    # and is handled by `lighting_seasonal` at the bottom of this block.
    enabled: true
    hours: [19, 20, 21, 22]
    multiplier: 1.20
    categories: [low_income_residential, mid_income_residential, high_income_residential]
  wfh_day_of_week:
    # Nasscom Indian IT Wfh survey 2024-25: ~40 % of office workers Wfh
    # on Monday + Friday. 2 of 5 weekdays at 15 % office-demand shift to
    # residential daytime = 6 % aggregate weekday office reduction +
    # 6 % weekday residential daytime uplift (hours 10-15). Tue-Thu
    # anchor days carry full office demand; the Mon/Fri effect averages
    # in across our single "weekday" day_type.
    enabled: true
    # SOURCED (uncited-value sweep). Both 0.06 values were
    # uncited; they now DERIVE from measured evidence and stand unchanged.
    # MEASURED, full stay-at-home (US, COVID natural experiment):
    #   residential weekday 09:00-17:00 use +16% (range 15-24%)
    #   commercial -12%, industrial -14%
    #   NBER, "Working from Home's Impact on Electricity Use in the
    #   Pandemic" https://www.nber.org/digest/202012/working-homes-impact-electricity-use-pandemic
    #   (; journal version = JUE Insight: Powering work from home,
    #   Journal of Urban Economics 2022.)
    # This Model IS Not Modelling A Lockdown - it is a Hybrid-Wfh future.
    # Scaling the measured full-time effect to ~2 WFH days in 5:
    #   residential  16% x 2/5 = 6.4%  -> 0.06 used
    #   commercial   12% x 2/5 = 4.8%  -> 0.06 used (slightly above, so the
    #                office saving is NOT understated relative to the
    #                residential penalty; the pair stays near-neutral)
    # as applied (US-measured effect, hybrid-scaled, Indian context).
    office_reduction_fraction: 0.06
    residential_daytime_uplift_fraction: 0.06
    residential_daytime_hours: [10, 11, 12, 13, 14, 15]
    office_categories: [office]
    residential_categories: [low_income_residential, mid_income_residential, high_income_residential]
    day_types: [weekday]
  festival_diwali_evening:
    # Diwali (Oct-Nov) Punjab residential evening +10-20 % from lighting
    # + cooking + community gatherings. CPCB Punjab observed 15-20 % peak
    # bump on Diwali evening; midpoint 15 % applied to residential evening
    # hours 18-22 on festival day_type in Oct + Nov. Other festivals
    # (Holi Mar, Eid year-varying, cricket adhoc) absorbed into the
    # day-type shape via the standard festival multiplier, no separate
    # spike (Perplexity research confirms no comparable single-event peak).
    enabled: true
    months: [oct, nov]
    hours: [18, 19, 20, 21, 22]
    multiplier: 1.15
    categories: [low_income_residential, mid_income_residential, high_income_residential]
    day_types: [festival]

# (Item 2): per-FAITH festival-day demand bumps applied to
# tagged RELIGIOUS cells. Each entry triggers when the cell's `faith`
# matches AND the slice's day_type == "festival" AND the slice's month
# AND hour are in the entry's lists. The multiplier multiplies the
# religious cell's base demand for that (faith, month, hour) bin.
# These are DEMAND-only bumps. Religious roof PV is 0 (HARD constraint
# `religious_no_rooftop_pv`), so faiths never participate on the supply
# side.
# Festival selection: 1 anchor festival per faith, chosen for the most
# distinctive load shape (max divergence from a generic religious-cell
# day). Multipliers are applied on top of the base religious day-type
# shape (already weak — base_load 5.0 W/m², occupants 600/cell, no AC).
# Sources (: utility load studies + religious community schedules):
#   * Sikh Gurpurab (Guru Nanak Jayanti, Kartik Purnima full moon ~Nov):
#     all-night akhand path + langar + early-morning prabhat pheri.
#     Peak load 18-23 (evening kirtan + langar cooking + lighting) AND
#     04-08 (morning ardas + langar).: SGPC daily routine +
#     Times of India Gurpurab 2023 ("temples illuminated through the night").
#     https://www.thetribuneindia.com/news/punjab/guru-nanak-jayanti-shines-bright-in-amritsar
#     Multiplier 1.40 — heavier than generic festival bump because
#     gurdwaras are the SPECIFIC physical site, not residential lighting.
#   * Hindu Diwali (Oct/Nov, Kartik Amavasya new moon): evening Lakshmi
#     puja + diya lighting + fireworks + community feast. Peak 18-23.
#: CPCB Diwali air-quality reports (residential evening surge
#     consistently observed across NCR/Punjab); BESCOM 2022 residential
#     evening +15-20 %. Multiplier 1.35 — comparable evening to Gurpurab,
#     but less of an early-morning bump on the temple itself.
#     https://cpcb.gov.in/ (CPCB moved from cpcb.nic.in; the Diwali NAAQS report is under Air Quality > Reports. Path
#   * Muslim Eid (Eid-al-Fitr May-Jun OR Eid-al-Adha Jul-Aug, lunar):
#     dawn Salat-al-Eid (06-08) + family feast (12-15) + evening
#     gathering (19-22). Eid-al-Fitr month indexed at May (rough 2030
#     equivalent; lunar drift makes the model month a placeholder).
#     Multiplier 1.30.: Indian Express festival coverage +
#     mosque ettiquette guides (mosques peak 30-60 min around obligatory
#     prayer times; Eid is the year's largest single congregation).
#     https://indianexpress.com/section/lifestyle/ (Eid festival coverage; the /eid-festival path 404s as of. anyway - this backs a behavioural multiplier, not a physical quantity)
#   * Christian Christmas (Dec 25): evening Mass (18-22) + family dinner.
#     Multiplier 1.25.: domestic load patterns + church bulletins
#     (mass attendance ~3x normal Sunday). Punjab Christian population is
#     concentrated in border districts (Gurdaspur/Amritsar); the
#     district-floor 1-cell representation is a structural inclusion choice.
# ---------------------------------------------------------------------------
#: Indoor Lighting IS Seasonal.
# The model already accepts that STREET lighting scales with daylength -
# `street_lighting.monthly_modifier` is derived from the site's own solar
# geometry and is enabled. Indoor lighting had no equivalent, so a household's
# 18:00-20:00 demand was identical in July and December.
# It is not. Sunset at Zirakpur (lat 30.640, lon 76.820) runs from 16.94 h in
# December to 19.00 h in July. Dark fraction of each evening daypart, computed
# with `energy/solar_geometry.sun_position` - the SAME engine behind the
# streetlight table and the PV shading model astronomical:
#   daypart   jan    apr    jul    oct    dec    annual mean
#   16_18    0.375  0.000  0.000  0.283  0.533     0.154
#   18_20    1.000  0.808  0.500  1.000  1.000     0.840
#   20_22    1.000  1.000  1.000  1.000  1.000     1.000
#   22_24    1.000  1.000  1.000  1.000  1.000     1.000
# ONLY 18_20 IS TREATED, and that is a deliberate scoping decision:
#   - 20_22 and 22_24 are dark in every month. No seasonality exists there,
#     which is also why `lighting_evening_peak` above is left untouched - its
#     hours 19-22 are dark year-round.
#   - 16_18 IS seasonal (dark only Nov-Feb) but its annual mean dark fraction
#     is 0.154, so a mean-normalised modifier swings from 0.00 to 3.48. That
#     volatility multiplied by a lighting share would be a bigger modelling
#     claim than the physics supports at this resolution. Declared and left.
# MECHANISM: only the LIGHTING portion of the daypart's demand is reshaped.
#   multiplier(month) = 1 - S + S x darkfrac(month) / mean_darkfrac
# with S = 0.45, the midpoint of the 40-55% lighting share of the residential
# evening peak that BESCOM 2022 gives - the SAME citation already used for
# `lighting_evening_peak` above. Because the dark-fraction term is normalised
# to its own annual mean, Annual Energy IS Unchanged and only the seasonal
# distribution moves.
# EFFECT: July 18-20 residential demand -18.2%, December +8.6%. The audit's
# independent bound, computed from the delivered dispatch rather than from
# this table, was -18.7% for July - the two agree to half a percentage point.
# Why IT Matters More Than Its Energy: the July 18-20 block sits at or near
# the annual system peak, and it is the hour that sizes the battery and the
# import connection. An ~11 MW overstatement sat directly on the sizing hour.
# Energy-small, capacity-relevant - so this is annual-neutral but NOT
# design-neutral, and it re-pins.
# ---------------------------------------------------------------------------
lighting_seasonal:
  enabled: true
  lighting_share_of_daypart: 0.45      # BESCOM 2022, 40-55% band midpoint
  categories: [low_income_residential, mid_income_residential, high_income_residential]
  # dark fraction / annual-mean dark fraction, 18_20 only
  dark_fraction_ratio_18_20:
    jan: 1.1901
    feb: 1.1901
    mar: 1.1504
    apr: 0.9620
    may: 0.7736
    jun: 0.6050
    jul: 0.5950
    aug: 0.8033
    sep: 1.1603
    oct: 1.1901
    nov: 1.1901
    dec: 1.1901

religious_festival_bumps:
  enabled: true
  sikh:
    festival: gurpurab
    months: [nov]
    evening_hours: [18, 19, 20, 21, 22]
    morning_hours: [4, 5, 6, 7, 8]
    multiplier: 1.40
  hindu:
    festival: diwali
    months: [oct, nov]
    evening_hours: [18, 19, 20, 21, 22, 23]
    morning_hours: []
    multiplier: 1.35
  muslim:
    festival: eid
    months: [may]
    evening_hours: [19, 20, 21, 22]
    morning_hours: [6, 7, 8]
    multiplier: 1.30
  christian:
    festival: christmas
    months: [dec]
    evening_hours: [18, 19, 20, 21, 22]
    morning_hours: []
    multiplier: 1.25

inflation_assumption_annual: 0.04          # India CPI rolling 10-yr (RBI)
# (B2 —: lowered 0.025 → 0.0 (flat real).
# Computed from PSPCL primary tariff orders FY18-19→FY26-27 deflated by
# MoSPI CPI: published domestic tariff rose ~+1.25-1.4 %/yr nominal
# (₹4.91→₹5.40 first-slab) vs CPI ~+5 %/yr → REAL escalation −3.6 to
# −5.5 %/yr (EXCLUDING subsidy; FY26-27 cut the energy charge itself).
# +2.5 %/yr had the wrong sign. Flat-real (0.0) is the defensible
# central — a 25-yr −4 %/yr extrapolation is implausible. NB: this is
# only the FALLBACK default; the active price trajectory in
# config/price_trajectories.yaml overrides it. Sensitivity −0.005..+0.020.
tariff_escalation_real_annual: 0.0
# audit addition: end-of-life decommissioning + disposal cost as
# a fraction of original CAPEX, applied straight-line over each tech's
# lifetime via `annualised_capex(..., eol_cost_fraction=)`. 0.05 is the
# conservative mid-point across PV-disposal (CPCB ~3-5%), Li-ion recycling
# (~5-10%), and biomass-plant demolition (~3-5%). Per-tech overrides can
# be added later if needed.
end_of_life_cost_fraction: 0.05

# audit A12: electrical losses across the single-bus model.
# `dc_loss_fraction` multiplies every PV-yield builder (rooftop, solar
# farm, BIPV, carport, floating PV, oriented rooftop) -- it represents
# inverter conversion losses + DC string losses + module mismatch.
# `ac_loss_fraction` applies to AC bus deliveries (grid_import, V2G
# discharge, battery_discharge) -- it represents distribution
# transformer losses + cable IxR drops + reactive power overhead.
# Sources: CEA Distribution Loss Report 2023 (AC distribution AT&C
# benchmark ~6% but the technical-only fraction sits ~2%); CEEW Rooftop
# PV Inverter Benchmarking 2022 (string-inverter weighted-eff 96-98%
# i.e. ~2% conversion loss + 0.5% DC string loss); NREL PVWatts default
# AC system loss 14% is gross-of-soiling/snow/mismatch and is
# inappropriate at our level of granularity.
electrical_losses:
  # FIX: was 0.015. Set to 0.0 because the
  # `pv_capacity_factor` annual anchor is GSA **PVOUT_specific** 1517.4
  # kWh/kWp, which the report's own glossary defines as "photovoltaic
  # electricity (AC) delivered by a PV system" - i.e. output AFTER Solargis
  # has already taken DC cabling, combiner and inverter conversion losses.
  # Solargis KB confirms both are in their chain ("DC cable and combiner box
  # losses", 2% default, plus "Inverter DC/AC conversion losses") and that
  # "All listed losses (except unavailability) flow into the final PVOUT
  # specific figure" - https://kb.solargis.com/docs/pv-system-losses.
  # Independent check: PVOUT / GTI_opta = 1517.4 / 1925.4 = a performance
  # ratio of 0.788, only consistent with those losses being counted.
  # Applying them again was a double-derate. The field is KEPT at 0.0 rather
  # than deleted so the mechanism stays available if the anchor ever moves to
  # a pre-loss irradiance basis (see the Option B warning in the audit).
  dc_loss_fraction: 0.0          #: already inside the GSA PVOUT anchor
  ac_loss_fraction: 0.020        # transformer + distribution at single-bus
  # (Phase 1A —: upstream PSPCL
  # transmission + distribution PHYSICAL loss between generating bus and
  # the district receiving substation. Anchor: PSPCL FY 2023-24 audit
  # reports T&D physical loss 10.73 %. The audit AT&C jumped to 34.5 %
  # in Q1 FY24 due to a Rs 4,500 cr state subsidy backlog (collection
  # efficiency, transient — not modelled). 2030 RDSS T&D target ~9-10 %;
  # 10.73 % is the defensible 2030 anchor (slight improvement expected
  # from current). Applied to grid_import only (V2G / battery / biomass
  # / WTE / biogas all sit ON the district bus and pay ac_loss only).
  # Sources: PSPCL FY2023-24 energy audit (docs.pspcl.in), PIB national
  # AT&C 22→16% (PRID 1947709), Tribune India FY24 subsidy backlog note.
  pspcl_grid_loss_fraction: 0.107
  # FIX. The 0.107 above was held FLAT to 2055
  # while `period_emission_factor` decarbonises the same grid by 69%
  # (0.5106 -> 0.2889 -> 0.1605 kgCO2/kWh). Assuming PSPCL rebuilds its
  # generation fleet and does not improve its network by a single percentage
  # point in 25 years is not conservative, it is inconsistent - and it is
  # asymmetric, because BAU imports everything, so it OVERSTATES the value of
  # local generation.
  # The Distinction That Makes This Fix Small. Rdss targets AT&C loss (,
  # verified by opening the PIB launch release:
  #   "Government of India launched the Revamped Distribution Sector Scheme
  #    (RDSS) with an outlay of Rs. 3,03,758 crore... The Scheme aims to
  #    reduce the Aggregate Technical & Commercial (AT&C) losses to pan-India
  #    levels of 12-15%... by 2024-25."
  #   https://www.pib.gov.in/PressReleasePage.aspx?PRID=1897764
  # The powermin.gov.in Homepage Was Retired from this block: a root domain
  # cannot evidence a scheme target, and this comment already admitted its own
  # deep path 404s. The PIB release carries the claim in full, so nothing is
  # lost by dropping it.
  # National actuals, verified separately in PIB PRID 1947709 (opened):
  #   "2020-21 22.32, 2021-22 16.44" (Grand Total row, PFC data).
  #   The FY23 figure of 15.37 previously quoted here is NOT in that release -
  #   it covers FY21 and FY22 only - so it is dropped. Prose context only.
  # *** Punjab-Specific Bound, new, from the same release: Punjab AT&C 18.03%
  # (FY2020-21) -> 11.67% (FY2021-22). Technical-only loss must sit BELOW total
  # AT&C, and this model's 0.107 does. A coherence check the model PASSES
  # against Punjab data, rather than an assumption. ***
  # AT&C is technical PLUS commercial loss, and almost all of that
  # national improvement came from metering, billing and collection, not from
  # copper and iron. The figure above is PHYSICAL/TECHNICAL loss only - the
  # config was already careful about this and says so. Technical loss falls
  # far more slowly, because it needs reconductoring, transformer replacement
  # and voltage upgrades.
  # So this trajectory deliberately does NOT track the RDSS curve down. It
  # runs at roughly 0.09 pp/yr against the ~1.7 pp/yr AT&C achieved on the
  # commercial side. It removes only the indefensible part of which was
  # assuming ZERO network improvement across the horizon.
  # Declared Gap: no PSPCL-specific or PSERC multi-year Technical loss
  # trajectory was found. 2042 and 2055 are a derivation from a
  # scheme target and are labelled as such. 2030 is unchanged and
  # (PSPCL FY2023-24 energy audit).
  # Consumed only by the MULTI-PERIOD builders; year=None returns 0.107, so
  # the single-period and heuristic paths stay byte-exact.
  pspcl_grid_loss_by_period:
    2030: 0.107   #, PSPCL FY2023-24 audit, unchanged
    2042: 0.095   #, RDSS-era network capex working through
    2055: 0.085   #, continued but decelerating improvement

# Actor-tier discount rates (real, inflation-stripped).
# Section 11 + Section 7 for sources.
discount_rates:
  social_planner: 0.05         # Indian Planning Commission convention
  # (DISC-1,: 0.065 is
  # the Real form of CERC's Nominal post-tax Wacc. CERC RE Tariff norms (70:30
  # debt:equity, RoE 14%, debt ~10.99% = avg SBI MCLR + 200 bps) give a
  # post-tax nominal WACC of ~8.77%; CERC's own framework is nominal (it
  # escalates O&M at 5.89%/yr, 60:40 Wpi/Cpi). This model is Flat-Real in
  # every price, so the consistent rate is the real equivalent:
  # 1.0877 / 1.02..1.025 inflation ~= 6.3-6.6% real -> 0.065. Quoting the
  # nominal 8.77% inside a real model would double-count inflation.
  #: https://cercind.gov.in/2024/draft_reg/RE-Tariff-Regulations-EM.pdf
  # (the norms themselves; PDF supplied by
  # *** PV-Tech Link Dropped
  # source"). *** It was trade press carrying a worked 8.77% derivation.
  # Nothing is lost: the deflation is arithmetic on the CERC norms above -
  # 1.0877 / 1.02..1.025 = 6.3-6.6% real - and can be reproduced by any
  # reader from the regulation itself. A secondary source is not needed to
  # divide two numbers.
  # Used by: solar farm, tracked/carport/canal PV, biomass/WTE/biogas CHP,
  # PPA interconnection.
  utility: 0.065               # CERC Wacc, Real form (nominal 8.77% deflated - see note)
  rwa_pooled: 0.085            # cooperative housing loan rate
  private_high_income: 0.10    # SBI/HDFC home loan
  private_ews: 0.125           # microfinance / informal lending (EWS self-financed — SENSITIVITY)
  # (Opus 4.8): government-assisted EWS housing cost of capital. The
  # labour-class / poorest tier largely CANNOT self-finance housing or rooftop PV
  # at the 12.5% microfinance rate; PMAY-U / state housing authorities
  # provide the capital. Rate consistent with PMAY-U CLSS 6.5% interest subsidy
  # for EWS/LIG (Npv@9%: https://pmay-urban.gov.in/credit-linked-subsidy-scheme),
  # sitting between social_planner (0.05) and rwa_pooled (0.085). This is the
  # BASELINE EWS-housing actor; private_ews (0.125) is retained as the
  # self-financed sensitivity. Wires the documented-but-unbuilt "EWS housing
  social_ews: 0.06             # government-assisted EWS housing (Pmay-U Clss)

# ---------------------------------------------------------------------------
# (OWNERSHIP MAP -
# some at private, some are government... would chp, and biomass and wte be
# owned by private or gov").
# The actor tier attached to each technology IS an ownership statement. It is
# set as the DEFAULT ARGUMENT of each annualisation method in energy/costs.py,
# and every caller in energy/dispatch.py uses the default - so this table is
# the complete, authoritative mapping. Verified by reading the call sites
#; no caller overrides.
#   Technology            Actor Tier            Rate    Who Actually Pays
#   rooftop_pv            (4-way BLEND)         8.82%   4 owner classes, see below
#   solar_farm            utility               6.5%    IPP / discom under PPA
#   tracked_pv            utility               6.5%    as solar_farm
#   carport / floating    utility               6.5%    as solar_farm
#   biomass_chp           utility               6.5%    PRIVATE IPP (see below)
#   wte_plant             utility               6.5%    PPP concessionaire (see below)
#   biogas_plant          utility               6.5%    Ulb / municipal (See Caveat)
#   li_ion_battery        rwa_pooled            8.5%    (SEE CAVEAT)
#   thermal_cold_storage  rwa_pooled            8.5%    (SEE CAVEAT)
#   v2g_charger           private_high_income  10.0%    the householder - correct
#   ppa interconnection   utility               6.5%    discom - correct
# Biomass And WTE Are Private, Not Government, And `utility` IS Still Right.
# PEDA Table-I (, https://www.peda.gov.in/biomass-power-projects) lists
# all 11 commissioned Punjab paddy-straw plants: TEN are private limited
# companies; the eleventh is the former PSPCL Jalkheri plant now operated by
# Sukhbir Agro Energy. So this is a private IPP class. That does NOT make
# `utility` wrong: CERC's Wacc IS the regulated return allowed to an Ipp
# selling under a determined tariff (70:30 debt:equity, RoE 14%, debt at SBI
# Mclr + 200bps). The tier is misleadingly Named, not misapplied. Indian WTE
# follows the same pattern - a ULB grants a concession, a private operator
# builds and runs it, and the municipality supplies waste plus a tipping fee
# (represented here by `landfill_diversion_credit_inr_per_kwh: 3.0`).
# Honest Caveat ON Both, worth a limitations sentence: Indian biomass and WTE
# have a poor financial track record - Punjab straw plants have stalled on
# straw-price escalation and several Indian WTE plants have closed. A real
# lender prices that risk Above the regulated Wacc. Using CERC's allowed
# return therefore flatters both technologies. The ownership sensitivity is
# already computed: biomass at private_high_income (10%) costs +Rs 3.81 Cr/yr
# (+10.6%, Lcoe Rs 3.407 -> 3.770); WTE +Rs 0.97 Cr/yr (+17.7%, Lcoe Rs 3.618
# Three Assignments That Look Wrong And Are Flagged, Not Yet Changed (each
# would move the headline, so each needs a chain - do not edit in isolation):
#   1. li_ion_battery @ rwa_pooled 8.5%. The built battery is 493,988 kWh -
#      a district-scale asset, not a housing-society one. `utility` (6.5%) is
#      the defensible tier. Worth -Rs 5.91 Cr/yr (-7.7%). No rationale for
#      rwa_pooled is recorded anywhere in the code or config.
#   2. thermal_cold_storage @ rwa_pooled 8.5%. Its OWN eligible_categories
#      list is shopping_centre, office, hotel, healthcare, school, warehouse,
#      retail_highstreet, public_services - Not One of which is an Rwa. These
#      are commercial (private_high_income 10%) and public (social_planner
#      5%) buildings. rwa_pooled is the one tier that cannot be right. The
#      block's own comment even names the "fragmented-ownership problem
#      (developer pays for tank, tenants get the savings)", which argues for
#      a HIGHER commercial rate, not a pooled residential one.
#   3. biogas_plant @ utility 6.5%. This is the sewage-works digester. Sewage
#      treatment is a municipal function delivered under AMRUT, so the ULB
#      owns it and `social_planner` (5%) is arguably right - worth
#      -Rs 0.14 Cr/yr (-6.1%). Kept at utility pending a decision.
# ---------------------------------------------------------------------------

# (Ownership Correction): rooftop-PV financing = the Deployment-weighted blend
# across building owners, NOT a single flat rate. Weights = each owner class's share of the
# production layout at the corrected pv_acceptance (low_income 0.70). Each class is financed at
# its actor-tier rate (discount_rates above):
#   gov_ews    -> social_ews          (0.06; gov-assisted EWS social-rental housing = low_income)
#   gov_public -> social_planner      (0.05; schools + public services + healthcare)
#   rwa        -> rwa_pooled          (0.085; mid-income RWA-pooled apartments / SolShare)
#   private    -> private_high_income (0.10; high-income homes + commercial + industrial;
#                 CONSERVATIVE - ignores commercial accelerated depreciation, ~ -1 to -2pp -> Stage E)
# private (64.6% of roof area) dominates, so the blend (~9%) sits ABOVE the old flat rwa_pooled
# 8.5% assumption, which under-priced the private-dominated reality. Re-run _diag_owner_weights.py
rooftop_owner_weights:
  gov_ews: 0.0741
  gov_public: 0.1335
  rwa: 0.1463
  private: 0.6461
rooftop_owner_actors:
  gov_ews: social_ews
  gov_public: social_planner
  rwa: rwa_pooled
  private: private_high_income

# Legacy single rate (kept for backward compatibility; tests still read it).
# NO Citation Needed - And That IS The Point. This value
# `discount_rates` / `rooftop_owner_actors` above (social_ews 6%,
# social_planner 5%, rwa_pooled 8.5%, private_high_income 10%). 0.08 is a
# dead default retained only so older tests that read the scalar still load.
# It must NOT be quoted as "the project discount rate" - the blended
# owner-weighted figure is ~9%. Flagged rather than sourced, because
# sourcing a value nothing uses would be worse than deleting it.
discount_rate: 0.08

# ---------------------------------------------------------------------------
# Technology cost tables (2030-real INR).
# ---------------------------------------------------------------------------
technologies:

  rooftop_pv:
    # ===================================================================
    # *** RE-Derived The Teri-Etc Chain IS Gone From The Level
    # Too. *** The retraction further down this block killed Teri-Etc as the
    # source of the DECLINE PATH on, but these lines still
    # derived the CAPEX LEVEL from the same non-existent document:
    #   "calibrated against Teri Etc India PV CAPEX decline path... applying
    #    the TERI path through 2030: 41,640 x 0.97^3 x 0.98^3 x 0.99^3
    #    = Rs 34,700/kW"
    # published benchmarks, which are real, governmental and quotable:
    # ANCHOR 1 (, and the one the old text already leaned on):
    #   MNRE FY2021-22 general-category rooftop benchmark, Rs/kW by capacity
    #   band: 51,100 / 46,980 / 45,760 / 44,640 / 41,640 / 39,080.
    #   The 10-100 kW band = Rs 41,640/kW is the right band for a district
    #   programme of shared and commercial roofs, not 1-3 kW householder kits.
    # Anchor 2 (, Current, and new to this file): MNRE PM-Surya Ghar:
    #   Muft Bijli Yojana benchmark, effective 13-Feb-2024 - Rs 50,000/kW for
    #   the first 2 kW and Rs 45,000/kW for each additional kW (general
    #   category; special-category states 55,000 / 49,500).
    #   https://cdnbbsr.s3waas.gov.in/s3716e1b8c6cd17b771da77391355749f3/uploads/2025/07/202507081690964295.pdf
    #   Note these are Small-System residential benchmarks and sit Above the
    #   10-100 kW band, exactly as scale economics predict - so the two MNRE
    #   series are consistent with each other and bracket this model.
    # The 2030 Level, Stated AS The Assumption IT IS: 41,640 (FY2021-22,
    # 10-100 kW) -> 35,500 (2030) is -14.7% over ~8 years = ~2.0%/yr real.
    # That is a DECLARED trajectory. MNRE publishes the levels; it
    # does not publish a rate, so any %/yr taken from the series is our own
    # derivative - the same honesty the decline-path block below applies to
    # its 1.2%/yr. DO Not RE-Attribute Either TO Teri.
    # Cross-check that it is not optimistic: ITRPV 17th Ed puts the MODULE
    # learning rate at 26%/doubling (1976-2025), which implies a far steeper
    # fall than 2%/yr. This model is on the conservative side of measured
    # module learning, and modules are only part of a rooftop system's cost.
    # ===================================================================
    # FIX: was 35000. 35500 is the share-weighted blend of
    # `module_types` below (0.65x38000 + 0.25x32000 + 0.10x28000), which the
    # A18 block already claimed was back-feeding into this field but never was
    # (pv_module_mix_summary had zero callers). Same single-source-of-truth
    # correction as the module efficiency and temperature coefficient.
    # ⚠ Derived Summary - Not Read ON The Production Path (verified).
    # This is the share-weighted mean of module_types below
    # (38000x0.65 + 32000x0.25 + 28000x0.10 = 35500) and it is correct, but
    # `effective_rooftop_pv_capex_inr_per_kwp` (costs.py ~2168) reads it ONLY
    # as a FALLBACK, when `module_types` is missing or its shares sum to 0.
    # With the three module types present that branch is never taken.
    # SO: Editing This Number Changes Nothing. Proven by multiplying it x10 and
    # watching the annualised rate hold at Rs 2851.38/kWp exactly.
    # A rooftop-PV CAPEX Sensitivity Must Edit All Three module_types values,
    # not this line - otherwise it reads as "rooftop PV is insensitive to
    # capex", which would be a false result. Matters for open item #20.
    capex_inr_per_kwp: 35500        # share-weighted across module_types (MNRE-anchored, see block above)
    opex_fraction_of_capex_per_year: 0.012
    lifetime_years: 25
    operational_emission_kgco2_per_kwh: 0.0
    # (Phase 1B —: bumped 0.006 -> 0.012.
    # Source: Dubey, Chattopadhyay et al. (2017), "Comprehensive study of
    # performance degradation of field-mounted PV modules in India",
    # Energy Science & Engineering, Wiley, doi:10.1002/ese3.150. n=1,148
    # modules across 6 Indian climatic zones. HOT zone (warm-humid +
    # hot-dry + composite) gives 1.42 %/yr Pmax degradation; Zirakpur /
    # Mohali falls in composite-climate → hot zone applies. The 0.6 %/yr
    # we had was Jordan et al. NREL global median — too low for India.
    #: this comment used to read "Not Yet Consumed by the
    # LP (degradation_per_year is reference data; Stage F task to wire into
    # time-averaged lifetime PV yield)". That Was False And Had Been For
    # MONTHS. It is read by `Economics.tech_degradation_per_year` and drives
    # `pv_vintage_yield_factor`, which the multi-period builders apply to
    # every PV vintage in every period (dispatch.py:2351, 2352, 3464, 3474,
    # 3483). At 1.2%/yr a 2030 array delivers ~0.74 of nameplate by 2055, so
    # the label was hiding roughly a 26% yield effect on the largest supply
    # asset in the model. A reader trusting the comment would have concluded
    # the model ignored degradation entirely.
    degradation_per_year: 0.012     # 1.2 %/yr (Dubey 2017 India composite/hot) - LIVE
    # (Phase 1B): CAPEX real-decline path 2030-2055.
    # ===================================================================
    # The line below used to read: "Source: TERI-ETC India PV decline path
    # 3 %/yr 2018-24, 2 %/yr 2024-27, 1 %/yr 2027-30... Beyond 2030, BNEF
    # projects ~30 % cumulative drop 2030-2050 -> ~1.2 %/yr."
    # A dedicated sourcing pass could NOT LOCATE any accessible
    # TERI Energy Transitions Commission publication containing a rooftop PV
    # CAPEX trajectory for India, in Rs/kW or in %/yr. Verdict: Not Found.
    # This is the same failure mode as the AEEE cooling-elasticity band
    #): a real institution, a plausible number, and no document.
    # ***** Why IT Survived The 125-Source Citation Audit: IT Has NO Url.
    # The register is built by scraping URLs out of these comments, so a
    # claim cited as prose ("Teri-Etc", "Bnef") was never in the audited
    # population at all. A sweep for values attributed to a named
    # source with NO link anywhere in the file found 77 such values, 12 of
    # them attributed to BNEF - including this one and the battery rate.
    # "All citations checked" was only ever true of the ones with links. *****
    # What Actually Supports 1.2%/yr Now - and it is Indirect, so it is
    # labelled derived rather than cited:
    #   * MNRE publishes OBSERVED benchmark rooftop costs by financial year
    #     (e.g. FY2021-22 general category, Rs/kW by capacity band:
    #     51100 / 46980 / 45760 / 44640 / 41640 / 39080). That is a real
    #     government series and a decline is visible in it, but MNRE states
    #     no rate - any %/yr from it is our own derivative.
    #   * ITRPV 17th Ed measures the MODULE learning rate at 26% per doubling
    #     (1976-2025), 40.8% (2006-2025) - far steeper than 1.2%/yr implies.
    # So 1.2%/yr is a CONSERVATIVE declared assumption, not a sourced rate,
    # and the thesis must say so. Do not re-attribute it to TERI.
    # ===================================================================
    #: this said "Not Yet Consumed by the LP; data-only
    # scaffold". ALSO FALSE. Read by
    # `Economics.tech_capex_real_decline_per_year` and consumed by
    # `period_capex_factor`, which discounts the capex of every vintage built
    # after the base year - i.e. it is the learning curve, live, in the
    # multi-period objective.
    capex_real_decline_per_year: 0.012   # LIVE - drives period_capex_factor
    #: Inert And Wrong, now corrected to the truth.
    # The slice table integrates to 1,516.4 kWh/kWp/yr = CF 0.1731. This field
    # is NOT multiplied into anything (see the note at the pv_capacity_factor
    # block: "we do NOT also multiply by base_annual_capacity_factor - that
    # field is informational only"), so the old 0.18 cost nothing. But an
    # informational field that misinforms is worse than no field: 0.18 and the
    # farm's 0.20 were both quotable and neither matched the model. Set to the
    # value the slice table actually delivers.
    base_annual_capacity_factor: 0.1731   # INFORMATIONAL ONLY; = the slice table
    # (Realism audit A18): PV module-type mix. Lets the
    # model report a blended CAPEX / efficiency / temperature
    # coefficient sourced from the per-type breakdown rather than a
    # single hand-set scalar. ALL fractions normalised at load time;
    # the BLENDED values back-feed into `capex_inr_per_kwp` (display)
    # while the legacy field above stays for backwards compatibility
    # with tests that pin a specific number. Stage F: expose the mix
    # as an LP variable so the optimiser can pick the module type
    # rather than averaging.
    # Sources: NREL Atb 2024 (India residential PV); MNRE benchmark
    # tariff orders; Csir-Ceeri Pilani thin-film Coe study (2023).
    module_types:
      mono_perc:
        share: 0.65                  # dominant in Indian residential 2030
        efficiency: 0.21             # 21 % AM1.5 STC
        capex_inr_per_kwp: 38000     # premium over poly
        temp_coefficient_per_c: 0.0035  # 0.35 %/C losses above STC
      poly_si:
        share: 0.25                  # legacy installs continuing
        efficiency: 0.17
        capex_inr_per_kwp: 32000     # cheapest mainstream
        temp_coefficient_per_c: 0.0040  # 0.40 %/C
      thin_film_cdte:
        share: 0.10                  # rising in Punjab summer (low temp coeff)
        efficiency: 0.14
        capex_inr_per_kwp: 28000     # cheapest per kWp
        temp_coefficient_per_c: 0.0025  # best heat performance

  solar_farm:
    capex_inr_per_kwp: 27000        # 2030 forecast (drop from 32.5k 2024-25)
    opex_fraction_of_capex_per_year: 0.01
