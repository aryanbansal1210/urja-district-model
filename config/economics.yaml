interconnection:
  # (b) FX-12/AUD-8 made real: the district's grid connection is NOT free.
  # Annualised capex of the district-attributable interconnection assets
  # (the 600 MW import basis = 2-3 substations of the 2 x 160 MVA
  # 220/66 kV class, CLAUDE.md/grid block convention). Anchors :
  # PSTCL 160 MVA 220/66 kV transformer ~Rs 12 cr commissioned Dhandari
  # Kalan Aug-2023 (https://www.millenniumpost.in/business/pstcl-commissions-160-mva-transformer-at-dhandari-kalan-528880);
  # 220 kV DC line project ~Rs 40 cr (https://transformer-magazine.com/news/6811-india-comissions-220-kv-transmission-line-and-transformer-upgrade/).
  # Derivation : 3 GSS x (2 transformers + bays + line share)
  # ~= Rs 90-150 cr -> Rs 120 cr mid. Parity Rule: BAU pays it too.
  # 35-y transmission-asset life, utility actor CRF (~6.5% real).
  enabled: true   # FLIPPED = the re-baseline
  capex_inr: 1200000000
  lifetime_years: 35
  actor: utility
  # =====================================================================
  # Sized Grid Connection. Turns the connection from a
  # FLAT charge into one the scenario actually earns.
  # What Was Wrong. `import_capacity_limit_kw: 600,000` is a hard cap with
  # NO PRICE: a scenario may draw anything up to 600 MW for free, and pays
  # Rs 8.77 crore/yr whether it peaks at 100 MW or at 600. So BAU, which
  # imports ~609 GWh with no local generation, and the designed town, which
  # imports ~240 GWh, are charged IDENTICALLY for the wire between them and
  # the grid. One of the thesis's own claims - that decentralised supply
  # needs less imported infrastructure - was being given away in the cost
  # accounting.
  # What Replaces IT. `m.grid_connection_mw` becomes an LP Variable bounded
  # by the old 600 MW cap, every slice's import is constrained under it, and
  # it is charged per MW:
  #     imp[p,s] <= grid_connection_mw x 1000 x hours_of[s]
  #     cost     += annualised_inr_per_mw x grid_connection_mw
  # The old hard cap becomes the variable's UPPER BOUND rather than a free
  # allowance. Sized ONCE across all periods, because it is a 35-year asset
  # built once - not re-sized per period.
  # The Rate IS Derived From This Block'S Own Numbers, no new source:
  #     Rs 87,674,713/yr annualised / 600 MW design basis = Rs 146,124.5/MW/yr
  # so with the connection sized at the full 600 MW the charge reproduces the
  # flat figure EXACTLY. That is the forced-off equivalence test.
  # fallback): post-hoc records the cost but the model cannot RESPOND to it.
  # As a variable, shaving the evening peak now shrinks a real bill, so
  # batteries and DSR gain a revenue stream they do not currently have -
  # which is what Indian commercial and industrial consumers actually face
  # through demand charges in Rs/kVA/month. If it produces an unstable or
  # perverse build, fall back to post-hoc: set enabled false and compute the
  # charge from the solved peak.
  # What This IS Expected TO Expose, stated in advance so the result is not
  # rationalised afterwards: the town's ENERGY import is ~40% of BAU's, but
  # its PEAK import may not be, because the town's peak is the 18:00-22:00
  # evening when its solar is gone and puts the battery in 2055 only. If
  # the sized connection barely shrinks in 2030, the decentralisation benefit
  # is real on energy and weak on infrastructure - a genuine finding, and one
  # only visible once the peak carries a price.
  # Parity IS Preserved: BAU is sized and charged by the same rule, so the
  # comparison stays like-for-like.
  sizing:
    enabled: true
    design_basis_mw: 600.0   # the basis the Rs 120 cr capex above was costed for
farm_land_rent:
  # (d) TRJ-7 paired into (register B21a: "price the inside option AND
  # hectares per period (multi_period.farm_land_cells_by_period 200/250/300;
  # 1 cell = 1 ha), whether built or not - a grant reserves the land either
  # way. Applies only to scenarios WITH the solar farm (BAU has no farm;
  # asymmetry stated in FINDINGS)..6):
  #   mode agricultural (BASE rec): the belt WAS farm land - Punjab theka
  #     (lease) premium band ~Rs 1 lakh/acre/yr = ~Rs 2.5 lakh/ha/yr
  #     *** Benchmarked Against Government Data, And The Model Sits
  #     ~3.4x ABOVE IT. *** Punjab Rural Development & Panchayats Department
  #     publishes an "Average Lease Rate (In Rs. Per acre)" table for
  #     SHAMLAT (village common) land, opened and read:
  #         2019-20  Rs 26,200/acre      2021-22  Rs 28,404/acre
  #         2020-21  Rs 27,800/acre      2022-23  Rs 29,214/acre
  #       https://rdp.punjab.gov.in/en/our-scheme-list/shamlat-lands-cattle-fair/
  #     Rs 29,214/acre = ~Rs 0.72 lakh/ha, against this model's ~Rs 2.5
  #     lakh/ha. So the model assumes roughly 3.4x the state shamlat average.
  #     Why That IS Not Automatically Wrong, but Must be declared: shamlat is
  #     panchayat-auctioned village common land averaged across all of Punjab,
  #     including remote rural districts. This site is Peri-Urban Zirakpur on
  #     the Chandigarh periphery, where agricultural land carries a large
  #     location premium over the state mean. A 3.4x peri-urban premium is
  #     plausible - but it is an ASSUMPTION about location, not a published
  #     rate, and it should be stated that way rather than as "the Punjab
  #     theka band".
  #     RELABEL: state shamlat average = measured floor; the peri-urban
  #     multiplier on top = declared. The agricultural-rent mode is a
  #     PENDING
  #     right time to settle the basis.
  #     ================================================================
  #     *** The Range. Four Anchors,
  #     Two OF Them Site-Specific And Tier 1. NO Value Changed - the point of
  #     the exercise was to find out whether 250,000 sits somewhere
  #     defensible, and it does. ***
  #     (a) Rs   72,190/ha  Punjab SHAMLAT average, the government floor.
  #         Rs 29,214/acre, Dept of Rural Development & Panchayats, 2022-23
  #         (, table opened). Panchayat-auctioned village common land,
  #         averaged over ALL of Punjab including remote districts.
  #     (b) Rs 1,00,817 - 1,11,891/ha  PRIVATE agricultural theka, measured.
  #         PAU / Krishikosh thesis "Agricultural land lease market in
  #         Punjab": "The average rental value was the highest in zone-II
  #         i.e. Rs 111891 per hectare"; a second Punjab tenant-farming
  #         survey gives Rs 101783 / Rs 100817. (agricultural
  #         university + peer-reviewed survey), Punjab-wide, NOT SAS Nagar.
  #         *** Not Independently Opened - krishikosh.egranth.ac.in returned
  #         a JS shell to every fetch. Quoted here at second hand and
  #         labelled as such. ***
  #     (c) THIS MODEL: Rs 2,50,000/ha = 2.2x the top of (b), 3.4x (a).
  #     (d) Rs 5.4 - 13.6 CRORE/ha  what the land is actually WORTH here.
  #         *** Government Collector Rate For Zirakpur'S Own Tehsil, Tier 1,
  #         Downloaded And Read. *** "Collector Rates of Tehsil
  #         DeraBassi for the year 2025-26 Per Acre/Per Sq.Yrd/Per Sq.ft",
  #         56 pp, signed by the Collector, S.A.S. Nagar; a scan, read by
  #         rendering the page images.
  #         https://cdn.s3waas.gov.in/s394f6d7e04a4d452035300f18b984988c/uploads/2025/10/17607023333390.pdf
  #         AGRICULTURAL rows verbatim (chahi = well-irrigated, barani =
  #         rain-fed), existing 2024-25 -> proposed 2025-26, PER ACRE:
  #           Bahadargarh  chahi/barani  2,000,000 -> 2,200,000
  #           Haripur Hindwan chahi      2,500,000 -> 2,700,000
  #           Nimbua       chahi/barani  3,000,000 -> 3,300,000
  #           Sarsini      chahi/barani  5,000,000 -> 5,500,000
  #         = Rs 2.2-5.5 crore/ACRE = Rs 5.4-13.6 crore/HECTARE.
  #     What (d) Does TO The Argument, and it is the useful part:
  #     at this model's OWN 5% real opportunity rate, the collector floor
  #     implies a land rent of Rs 27 LAKH/ha/yr - about 10.8x what this block
  #     charges. So Rs 2.5 lakh/ha is NOT an aggressive number. It sits
  #     between two defensible bases and much nearer the cheaper one:
  #       2.2x the measured agricultural theka  (because the site is
  #                                              peri-urban Chandigarh fringe)
  #       0.09x the development-value reading    (because the land is GRANTED
  #                                              to the town, not bought)
  #     The Viva Answer: we price the land at its agricultural use value plus
  #     a peri-urban premium, NOT at its development value, because a
  #     government land grant for a new town does not pay the conversion
  #     price. Charging (d) would make the solar farm uneconomic on paper
  #     while pretending the town bought land it was given.
  #     A Separate Problem This Exposed, Flagged Not Fixed: the `market` mode
  #     below uses market_value_inr_per_ha: 30,000,000 (Rs 3 crore/ha). The
  #     government collector FLOOR for this tehsil is Rs 5.4 crore/ha. So the
  #     A/B market scenario UNDERSTATES land value by 1.8-4.5x against a
  # site-specific source. It is a scenario, not the production
  #     run, so nothing in the headline moves - but it should be re-based
  #     before that scenario is quoted.
  #     ================================================================
  #     NOTE the KP Group link previously cited for this band was opened and
  #     contains NO Punjab or Haryana lease data at all (zero hits for
  #     "theka", "lakh", "Punjab", "Haryana"), so this government table is now
  #     the only real evidence in the block.
  #     (KP Group Punjab/Haryana band https://kpgroup.co/blog/land-requirements-for-solar-power-plants-in-india/
  #; Maharashtra MSKVY solar-feeder benchmark Rs 1.25 lakh/ha/yr
  #     https://ornatesolar.com/news/maharashtra-to-lease-farmers-land-at-1-25-lakh-year-to-set-up-solar-feeders
  #). Farm LCOE 1.73 -> ~1.93/kWh.
  #   mode market (the A/B scenario): peri-urban Zirakpur corridor land
  #     value Rs 1-3 cr/acre -> Rs 3 cr/ha mid (the existing "freed 200 ha
  #     ~ Rs 500-1,000 cr" derivation, multi_period block) x 5% real
  #     opportunity rate = Rs 15 lakh/ha/yr -> farm LCOE ~2.9-3.0/kWh =
  #     head-to-head with the delivered external PPA (~4.00 incl. delivery
  #     vs own-farm ~2.9 + no delivery charge) - the endogenous inside-vs-
  #     outside land trade the register asked for.
  enabled: true   # FLIPPED = the re-baseline
  mode: agricultural               # agricultural | market
  # *** Still Not Properly Sourced - And Now Sized, SO The
  # EXPOSURE IS KNOWN. *** Both anchors this value rested on were checked on
  # and neither contains its claim: the KP Group page has ZERO hits
  # for "theka", "lakh", "Punjab" or "Haryana" (the matched digits were
  # postcodes), and the Maharashtra companion gives "Rs 1.25 lakh/year"
  # without naming an area unit while this config reads it as per hectare.
  # A web sweep found only TIER-4 commercial land blogs, which put
  # fertile irrigated Punjab at Rs 30,000-80,000/acre/yr, "sometimes higher
  # for extremely prime plots with assured water and infrastructure".
  # This Value = Rs 250,000/ha = Rs 101,170/acre/yr, i.e. AT OR Above the top
  # of that band. Peri-urban Zirakpur beside Chandigarh is genuinely prime, so
  # it is defensible - but it is not evidenced.
  # Size OF The Exposure at the 301-ha farm:
  #     Rs  30,000/acre -> Rs  22.3 M/yr
  #     Rs  55,000/acre -> Rs  40.9 M/yr   (mid of the band)
  #     Rs  80,000/acre -> Rs  59.5 M/yr
  #     Rs 101,170/acre -> Rs  75.3 M/yr   <- AS MODELLED
  # The Error Direction IS Safe: rent is a Cost charged to the town and BAU
  # pays none of it, so overstating it makes the thesis result WORSE than
  # truth. If this is wrong, the town is cheaper than reported by up to
  # ~Rs 53 M/yr (~3% of annual cost). Say "conservative", not "accurate".
  # *** Sourced - A Real Anchor AT Last, And IT Supports 250,000
  # AS A Peri-Urban Premium. *** Soham Bhattacharya, "Agricultural Tenancy in
  # Contemporary Punjab: A Study Based on National Sample Survey Data",
  # Review of Agrarian Studies - paper computing from unit-level
  # NSSO data (Situation Assessment Survey of Agricultural Households,
  # 70th Round, 2012-13). PDF fetched and parsed.
  # https://ras.org.in/articles/214/pdf/Tenancy_in_Punjab.pdf
  # Table 10, "Annual average rent paid... by class of tenant farmers,
  # regions of Punjab, 2012-13, in Rs/hectare", VERBATIM:
  #     North Punjab   small tenant 28,192      large tenant 77,432.2
  #     South Punjab   small tenant 87,203.8    large tenant 68,454.6
  #     Punjab (all)   small tenant 71,793.7
  # The paper also records that 95% of Punjab tenancy contracts are FIXED-RENT
  # PAID IN CASH - i.e. exactly the theka instrument this config models, not
  # crop-share. **S.A.S. Nagar (Mohali) IS A North Punjab District**, so the
  # site-relevant band is Rs 28,192-77,432/ha at 2012-13 prices.
  # Inflated TO The Model'S 2030-Real Basis (17 years):
  #     north large tenant  @4%/yr -> Rs 150,830/ha
  #                         @5%/yr -> Rs 177,476/ha
  #                         @6%/yr -> Rs 208,507/ha
  # SO Rs 250,000/ha IS ~1.4x The Inflated North-Punjab Large-Tenant Rent.
  # That multiple is the Peri-Urban Premium and it is the defensible reading:
  # this site abuts Zirakpur/Chandigarh, where land carries development option
  # value and supports vegetable/high-value cropping for the city market. The
  # commercial land literature independently puts "near urban centres" plots
  # at up to Rs 1 lakh/acre = Rs 247,100/ha, which brackets 250,000 almost
  # exactly - cited here only as corroboration, NOT as the anchor.
  # How TO Defend IT AT Viva, in one line: the rent is anchored to Nss
  # measured Punjab tenancy rents for the site's own region, escalated to the
  # model's base year, with a ~1.4x peri-urban premium - and it is charged to
  # the Town Only (BAU pays no farm rent), so any overstatement makes the
  # thesis result worse, not better.
  # Still Worth Doing if time allows: a Punjab Dept. of Agriculture or Nabard
  # state focus paper would move the escalation from assumption to instrument.
  # Register: farm_land_rent remains an
  # mode), so nothing is frozen on it.
  agricultural_inr_per_ha_yr: 250000
  market_value_inr_per_ha: 30000000
  market_opportunity_rate_real: 0.05

# ---------------------------------------------------------------------------
# Battery PV-side coupling — Stage C round 3 (Claude 2).
# SigEnergy SigenStor and similar integrated PV+battery systems couple the
# DC bus directly between PV array and battery, skipping a DC->AC->DC
# conversion stage. The measured impact on round-trip efficiency is
# 0.90 (legacy AC-coupled inverter) -> 0.94 (DC-native).
# Per-scenario flag `battery_coupling_mode` selects the mode; "dc_native"
# is enabled in the full_stack scenario only.
# Lenergy bidirectional V2G guide 2026.
# ---------------------------------------------------------------------------
battery_coupling:
  ac_traditional_round_trip_efficiency: 0.90   # legacy AC-coupled
  dc_native_round_trip_efficiency: 0.94        # SigEnergy DC-coupled
  default_mode: ac_traditional
  source: "SigEnergy SigenStor product PDFs; Lenergy bidirectional V2G 2026"
  # =====================================================================
  # (Battery Auxiliary / House Load). Thermal management (Hvac),
  # Bms standby, fire protection and controls. Not covered by the two Rte
  # figures above: their own derivation attributes the entire 0.90 -> 0.94
  # delta to removing a DC->AC->DC CONVERSION stage, so both numbers are on
  # a CONVERSION boundary, not a plant boundary. Confirmed by inspection -
  # `rt_eff` is the only battery loss term in the model and appears in
  # exactly three places (dispatch.py:384, :1165, :1997 plus
  # scripts/res1_autonomy_72h.py:187). There is nothing for this to collide
  # with, so it is additive, not a double-count.
  # VALUE: 5% of charging (input) energy, applied multiplicatively as
  # CERC's own Rte x (1 - Aec) formulation for integrated energy storage.
  # CERC (Terms and Conditions of Tariff) (Second Amendment) Regulations,
  # new Reg 70(FF) "Norms of operation for integrated energy storage
  # system" - AEC 5% of input energy, verified VERBATIM in the
  # DRAFT (https://cercind.gov.in/2025/draft_reg/DN_TC-2nd.pdf, No.
  # L-1/236/2018/CERC). CERC notified the Second Amendment on 20.03.2026
  # and summaries report the same norms carried through, but the
  # final notified PDF has NOT been read (cercind.gov.in refused connection
  # from the research environment). BLOCKER FOR
  # from cercind.gov.in/Current_reg.html on the Imperial network and swap
  # this URL before the viva.
  # Resulting Delivered Efficiency: ac_traditional 0.90 x 0.95 = 0.855;
  # dc_native 0.94 x 0.95 = 0.893. With the model's existing ac_eff 0.98 on
  # discharge, delivered/charged becomes 0.838 - just below PNNL's 2030
  # transformer-level 0.845, which is the right place for a hot-climate
  # district BESS. Sensitivity at 0.03: 0.873 / 0.9118.
  # Anyone Replacing 0.90 OR 0.94 Must Delete This Key. Rte figures lifted
  # from an Indian tender or a CERC Rte clause are commonly defined Net at
  # the metering point, i.e. they already contain auxiliary. Stacking this
  # on such a figure is the exact double-count this project has caught
  # three times on the PV anchor.
  # Declared Limitations: (a) the CERC norm is written for storage
  # INTEGRATED with a generating station or transmission system, so
  # applying it to a standalone urban district BESS is a transfer within
  # India; (b) CERC's Aec is Throughput-proportional while real Hvac and
  # Bms standby is Time-proportional, so this Understates auxiliary during
  # low-utilisation periods - the error has a known direction; (c) no
  # metered Indian BESS auxiliary data exists - searched,
  # Expected TO Stay Unsourced. Do not let anyone fill this with a number
  # from Sandia's 8-34% range, which is for a different duty and climate.
  auxiliary_energy_consumption_fraction: 0.05

