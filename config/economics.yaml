    base_annual_capacity_factor: 0.1731   # INFORMATIONAL ONLY; = the slice table

  li_ion_battery:
    # Calibrated against Prayas/LBNL "Grid-scale Li-ion BESS in
    # India" 2020: 2030 forecast US$103/kWh system-level CAPEX. At ~Rs 85/USD
    # 2030-real FX -> ~Rs 8,800/kWh, matching CEEW 2024 US$100-120/kWh band
    # and BNEF 2030 India forecast of Rs 6-9k/kWh. Was 11k (too high per
    # ===================================================================
    # Bnef Linked And The Value Validated, (named-source sweep).
    # Bnef was named 17 times in this file and Never Once Linked - the same
    # prose-only pattern that produced the Aeee, CGWB and Teri retractions.
    # It is now linked, and unlike those three the figure CHECKS OUT.
    # ===================================================================
    # Primary Source Replaced
    # don't we just use that?"). VALUE UNCHANGED at 9,000 - this replaces the
    # JUSTIFICATION, not the number, so it is byte-neutral on every result.
    # Why Bnef Was Demoted. A parallel session could not retrieve the
    # $110/kWh four-hour turnkey figure from the BNEF page at all; the page
    # returns pack prices ($108, LFP $81, NMC $128) and gives China as $84
    # where this file said $73. So the load-bearing figure was not
    # reproducible from its own citation. Worse, three independent published
    # sources put a complete four-hour system Far higher: NREL Atb 2030
    # mid-case USD 326/kWh (Cole & Karmakar 2023, NREL/TP-6A40-85332,
    # https://www.nrel.gov/docs/fy23osti/85332.pdf), IRENA USD 273/kWh
    # (2023 utility-scale average, duration-UNSPECIFIED - Renewable Power
    # Generation Costs in 2023, exec summary pp. 4/10, VERIFIED;
    # this line used to say "~USD 260", a from-memory approximation).
    # An "IEA 2023 ~USD 290/kWh for 2022 projects" claim also stood here:
    # NO IEA document carrying it could be found and opened,
    # so it is Withdrawn and the thesis cites NREL + IRENA only. Bnef's "turnkey" is evidently a
    # narrower boundary than NREL's overnight capital cost, which carries EPC,
    # land, interconnection and developer cost. Anchoring on the narrow one
    # while calling it a system price is the error this replacement removes.
    # The New Primary Anchor IS Indian, Tier 1, And For A Four-Hour System.
    # SECI RfS ESS-3, "Selection of Bidders for Setting up 125 MW / 500 MWh
    # Standalone Battery Energy Storage System (BESS) in Kerala",.
    #   https://www.seci.co.in/Upload/Tender/SECI000196-9357521-RfSESS3KSEB125MW500MWhfinal.pdf
    # Downloaded And Parsed IN Full, 137 pages,. Extract kept at
    #   "the VGF amount eligible for the Developer shall be limited to the
    #    amount calculated at INR 27 Lakhs/MWh (Rupees Twenty Seven Lakhs per
    #    MWh) or 30% of capital cost for BESS, whichever is lower"
    # The document's own worked example checks: 500 MWh x 27 lakh = Rs 135
    # crore, exactly as it states. So the capex at which the two caps coincide
    # is 27 / 0.30 = Rs 90 lakh/MWh = Rs 9,000/kWh. That is this value exactly.
    # Why This IS AN Inference And Not A Quoted CAPEX, stated plainly because
    # it must be defended as such. The RfS does not print a capital cost. It
    # prints two caps and takes the lower. A per-MWh cap only binds where capex
    # is at or above 90 lakh/MWh; below that the 30% test binds and the per-MWh
    # cap is redundant. So 90 lakh/MWh is the level the scheme is CALIBRATED
    # to, and is a floor on what the Government of India expects a four-hour
    # system to cost. Clause 12(b) also requires capital cost "duly certified
    # by the Statutory Auditors", with VGF recovered if it exceeds 30% of the
    # certified cost, so the scheme is built around an AUDITED capex rather
    # than an assumed one.
    # Where That Leaves The Value. 9,000 sits ON the Indian policy floor and
    # roughly a third of NREL's 2030 mid-case. It is therefore at the
    # OPTIMISTIC end of the published range, which flatters storage: a cheaper
    # battery is built earlier and larger. That direction must be reported, and
    # NREL's 326 USD/kWh is carried as the high case in the sensitivity set.
    # Do NOT describe this value as conservative. The old comment did, on the
    # strength of the BNEF figure that could not be retrieved.
    # Cross-checks retained, both of which contain 9,000: Prayas/LBNL "Grid-
    # scale Li-ion BESS in India" 2020 forecasting USD 103/kWh for 2030, and
    # CEEW's Usd 100-120/kWh band. Bnef is retained below as context only.
    # ===================================================================
    capex_inr_per_kwh: 9000         # = SECI Ess-3 Vgf-implied Rs 90 lakh/MWh (, parsed)
    # REV-5: deployment-envelope cap lifted from the dispatch.py
    # literal - installed battery energy <= this many hours of system peak
    # demand ("8h of peak" upper envelope planning heuristic; never
    # binding: 2055 build is 291 MWh vs a ~1,050 MWh cap).
    max_capacity_hours_of_peak: 8.0
    opex_fraction_of_capex_per_year: 0.02
    lifetime_years: 10
    round_trip_efficiency: 0.90
    max_depth_of_discharge: 0.90
    # FX-1/: real power limit replacing the old hours/24
    # throughput proxy (which implied ~C/27). Indian grid-BESS tenders are
    # typically 2-4 h systems => 0.25-0.5C; 0.5C used (SECI BESS RfS 2023,
    # 2h-duration standard derived).
    c_rate_per_hour: 0.5
    # (Phase 1B): battery learning curve 2030-2050.
    # Source: BNEF 2025 global pack $108/kWh + India BESS auction $125/kWh
    # all-in (Mercom 2025). BNEF 2035 forecasts: $41 (China), $101 (EU),
    # $108 (US). India 2025-2035: $125 -> ~$80 = 36% drop = 4.4 %/yr.
    # LINKED (named-source sweep - BNEF had never been linked):
    #   BNEF 2025 survey: https://about.bnef.com/insights/clean-transport/lithium-ion-battery-pack-prices-fall-to-108-per-kilowatt-hour-despite-rising-metal-prices-bloombergnef/
    #   Mercom India (2024 record low $115/kWh): https://www.mercomindia.com/lithium-ion-battery-historic-low-price
    # Conservatism Confirmed: Bnef measured an 8%/yr fall in pack prices and
    # 45%/yr in turnkey stationary systems over the latest survey year. This
    # model uses 3.0%/yr. That DELAYS battery entry, so's "storage
    # arrives late" finding survives a pessimistic cost path rather than
    # being manufactured by an optimistic one.
    # Maturation 2035-2050 ~ 2 %/yr. 25-yr horizon weighted: ~3.0 %/yr.
    # ===================================================================
    # *** The Most Load-Bearing Uncited Number IN The Model, Now Evidenced
    #. *** FINDING names this rate as its MECHANISM - "the
    # BNEF/Mercom-derived 3.0%/yr real decline is exactly what triggers
    # [battery] entry" - so a published finding rested on a figure whose
    # source nobody had opened. It escaped the 125-source citation audit for
    # the same reason the rooftop rate did: NO URL, so no register entry.
    # What IS Now Verified, verbatim, from Bnef's own battery price survey:
    #   "From the observed historical values, we calculate a learning rate of
    #    around 18%. This means that for every doubling of cumulative volume,
    #    we observe an 18% reduction in price."
    #   "The BNEF battery price survey provides an annual industry average
    #    battery price for EVs and stationary storage. The learning rate (the
    #    price decrease for every doubling of capacity) is 19%."
    #   about.bnef.com/insights/clean-energy/behind-scenes-take-lithium-ion-battery-prices/
    # AND India-specific auction evidence (IEEFA, 2026):
    #   "The lowest tariffs discovered for standalone ESS tenders during the
    #    year were INR1.48 lakh/megawatt/month... and INR2.85 lakhs/MW/month
    #... for the 2-hour and 4-hour storage durations"
    #   ieefa.org - India standalone BESS tariffs, falling sharply 2024->2025.
    # *** Read The Units OR The Number Looks Absurd. *** 18-19% is a Learning
    # RATE - the fall per DOUBLING of cumulative volume - not a per-year
    # decline. Converting needs a deployment-growth assumption, which BNEF
    # does not state. At ~30%/yr deployment growth cumulative volume doubles
    # about every 2.6 years, implying roughly 8-9%/yr. This Config Uses
    # 3.0%/yr - about a THIRD of that.
    # Verdict: 3.0%/yr is a Conservative Judgement anchored to a verified
    # learning rate, NOT a figure any single source states. Say exactly that
    # at viva. It matters in the right direction: a slower battery learning
    # curve DELAYS battery entry, so's "battery enters late" result is
    # not manufactured by an optimistic cost assumption - it survives one.
    # ===================================================================
    # FX-1 correction: this IS consumed by the multi-period LP
    # (Economics.period_capex_factor per build vintage; dispatch.py ~2003).
    # Implied vintage prices: 2030 Rs 9,000 -> 2042 Rs 9,000x0.97^12 = Rs 6,247
    # -> 2055 Rs 9,000x0.97^25 = Rs 4,205 /kWh (2030-real terms). With the
    # FX-1 C-rate fix, the LP first builds battery at the 2042 vintage
    # (133 MWh) and reaches 324 MWh by 2055 - the learning curve is exactly
    # what triggers entry (supervisor question SUP-1).
    capex_real_decline_per_year: 0.030
    calendar_fade_per_year: 0.02
    operational_emission_kgco2_per_kwh: 0.0

