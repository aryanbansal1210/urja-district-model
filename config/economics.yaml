    # Stage C round 3 - Claude 2 additions
    allow_panel_orientation_choice: true
    allow_dsr: true
    allow_solshare: true
    allow_biosolar: true
    allow_bipv: true
    allow_carport: true                    # carports back ON, now sited on dedicated PARKING_LOT cells (~13 lots x 2,000 kWp ceiling)
    allow_floating_pv: true                # Stage C round 5
    # DELETED `allow_street_trees` and `allow_solar_streetlights`
    # used to sit here reading `true`. NO Code Ever Read Either One (verified by
    # grep), so setting them false changed nothing - which made them a trap: a
    # "no street trees" counterfactual would have returned an IDENTICAL answer
    # and invited the conclusion that trees are worth nothing.
    # Both Effects Are Real, Measured, And Stay ON Permanently:
    #   street trees        8.57 GWh/yr = 1.51 % of district demand
    #   solar streetlights  1.47 GWh/yr = 0.26 % (290 grid-lit / 338 solar roads)
    # They stay on because they are LAYOUT physics, not energy-scenario options:
    # both are computed when the network is BUILT (the tree-shading term lands
    # in each cell's cooling peak via `_microclimate_cooling_multiplier`, and
    # the streetlight load is summed in `EnergyNetwork.from_grid`), and
    # `from_grid` takes no scenario argument by design - ONE network is shared
    # by BAU and the designed town, which is what makes the vs-BAU ratio a fair
    # comparison. A per-scenario switch would mean a second 200 s network build
    # and would break that sharing.
    # Quantify them with `scripts/layout_physics_sensitivity.py`, which strips
    # each attribute from the layout, rebuilds, and reproduces the two numbers
    # above. That is the honest way to price a layout feature.
    allow_ev_smart_charging: true          # REV-2: managed EV charging - bounded charge-shift within plug-in windows (ev_adoption.smart_charging). OFF in bau/pv_* so the counterfactuals keep dumb charging.
    allow_green_purchase: true             #: buy-side green open access - the DESIGN package may buy external RE; BAU/pv_* counterfactuals stay grid-only. No-op until green_purchase.enabled flips at the re-pin.
    battery_coupling_mode: dc_native
