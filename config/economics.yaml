# ---------------------------------------------------------------------------
# Per-cell PV panel orientation (Stage C round 3 - Claude 2).
# Each orientation has its own per-daypart yield curve, applied as a
# multiplicative shape on top of the south_fixed pv_capacity_factor
# (monthly_modifier x daypart_shape). yield_multiplier_vs_south is an
# additional whole-day scalar (use ~1.0 when the shape already encodes the
# annual total, or ~1.18 for tracked PV which uniformly out-yields fixed
# south by ~18 percent).
# Sources:
#   - Zinco SolarVert PDF (saddle / butterfly / vertical orientations)
#     and germany.zinco.com green-roof PV cooling data.
#   - NREL India 2024 fixed-vs-tracked PV yield-vs-capex study.
#   - BIPVBOOST 2024 vertical-facade in-situ measurements.
# Annual yield ratios approximate Punjab fixed-tilt benchmarks:
#   south_fixed = 100% (baseline);
#   east_west_split = ~92% of south total but reshapes ~30% from noon
#     to morning + evening (better tariff arbitrage);
#   vertical_facade = ~60% total but much higher at low solar elevation
#     (winter morning / evening); makes sense only where facade area >>
#     roof area;
#   single_axis_tracked = ~118% total, near-flat profile through midday.
# Per-cell defaults below are heuristic seeds chosen so the SA layout
# emergent behaviour matches the design-intent: residential mostly E-W,
# offices and shopping mostly south, high-rise residential blends with
# vertical facade (BIPV feature handles that capacity separately).
# ---------------------------------------------------------------------------
pv_orientations:
  south_fixed:
    yield_multiplier_vs_south: 1.00
    daypart_shape:
      "00_02": 1.00
      "02_04": 1.00
      "04_06": 1.00
      "06_08": 1.00
      "08_10": 1.00
      "10_12": 1.00
      "12_14": 1.00
      "14_16": 1.00
      "16_18": 1.00
      "18_20": 1.00
      "20_22": 1.00
      "22_24": 1.00
  east_west_split:
    # (V-6 fix, from the viewer-QA session's honest
    # flag): annual parity with south was optimistic. PVGIS 5.2 ERA5, lat
    # 30.64/lon 76.82: east 10-deg 1,389.2 + west 10-deg 1,376.5 kWh/kWp
    # (avg 1,382.8) vs south 29-deg 1,610.2 -> ratio 0.86 ( source,
    # one-step derivation; same DB both sides so the ERA5 IGP bias
    # cancels in the ratio). 10 deg = typical Indian flat-roof E-W mounting.
    yield_multiplier_vs_south: 0.86
    # FIX: the shape below is now
    # ENERGY-NEUTRAL, so the cited 0.86 carries the whole annual ratio.
    # Before the fix the raw shape had a PV-energy-weighted mean of 0.9032,
    # which multiplied the 0.86 scalar to an effective 0.7767 of south - a
    # 9.7% under-credit against this block's OWN PVGIS citation, and a
    # violation of the convention stated at the head of `pv_orientations`
    # ("use ~1.0 when the shape already encodes the annual total"). Every
    # value below is the old one divided by 0.903150; the RESHAPING (morning
    # and evening gain, midday loss - the real physics of an E-W split) is
    # preserved exactly, only the spurious second derate is removed.
    # Verified: new energy-weighted mean 1.0000 -> effective 0.8600 of south.
    daypart_shape:
      "00_02": 1.1072
      "02_04": 1.1072
      "04_06": 1.1072
      "06_08": 1.4948
      "08_10": 1.3287
      "10_12": 0.9412
      "12_14": 0.7751
      "14_16": 0.9412
      "16_18": 1.3287
      "18_20": 1.4948
      "20_22": 1.1072
      "22_24": 1.1072
  vertical_facade:
    yield_multiplier_vs_south: 1.00
    daypart_shape:
      "00_02": 1.00
      "02_04": 1.00
      "04_06": 1.00
      "06_08": 1.40
      "08_10": 1.05
      "10_12": 0.45
      "12_14": 0.25
      "14_16": 0.45
      "16_18": 1.05
      "18_20": 1.40
      "20_22": 1.00
      "22_24": 1.00
  single_axis_tracked:
    yield_multiplier_vs_south: 1.18
    daypart_shape:
      "00_02": 1.00
      "02_04": 1.00
      "04_06": 1.00
      "06_08": 1.00
      "08_10": 1.00
      "10_12": 1.00
      "12_14": 1.00
      "14_16": 1.00
      "16_18": 1.00
      "18_20": 1.00
      "20_22": 1.00
      "22_24": 1.00

# ---------------------------------------------------------------------------
# Demand-side response (DSR) — Stage C round 3.
# Three end-use families, each with its own shiftable fraction and shift
# window. The dispatch moves a share of peak-tariff demand into shoulder /
# off-peak slices within the window at a comfort cost.
# Sources for params:
#   - AC pre-cool: Indian concrete-construction thermal mass holds ~2-3 h
#     above setpoint without compressor; ~30% of cooling load shiftable.
#   - Geyser hot water: 80-120 L tank stores 5-15 kWh effective; 50% of
#     residential heating load shiftable within 12 h.
#   - EV charging: full plug-in window 18:00-06:00 = 12 h of flexibility.
# aggregate_shiftable_fraction_in_peak applies to total peak/super_peak
# demand at the district level for the foundation; per-category split is
# documented here for Stage D refinement.
# ---------------------------------------------------------------------------
demand_side_response:
  enabled: true
  # (Realism audit A3): comfort cost split by DSR category.
  # The legacy `comfort_cost_inr_per_kwh` (1.5) was uniform across all
  # shifted load -- unrealistic because AC pre-cool (small temperature
  # bump for ~3 h) is much less discomforting than a geyser shortage
  # (no hot water) or an EV charge delay (range anxiety). The split
  # below is calibrated to behavioural-economics willingness-to-pay
  # literature on demand-flex programmes.
  # `comfort_cost_inr_per_kwh` is the AGGREGATE fallback when a more
  # specific category cost is missing; new dispatchers should look up
  # per-category instead.
  # Why The Comfort Costs DO Not Escalate Over 2042/2055
  #; decided rather than left silent).
  # The intuition for escalating them is real: households get richer across
  # the horizon (income_mobility raises district demand 14.26% by 2055), and
  # richer people demand more to put up with a warm room or a cold shower, so
  # the Rs/kWh needed to buy flexibility should rise in REAL terms.
  # IT IS Still Left Flat, for one decisive reason: Every Other Price IN This
  # Model IS Flat-Real. `tariff_escalation_real_annual` is 0.0 in the
  # production scenario (B2, computed from PSPCL orders deflated by MoSPI
  # capex are quoted in 2030-real INR. Singling out the comfort cost to
  # escalate would make it the only price in the model with a real trend, and
  # would do so on an assumption with no source rather than on a computation.
  # Direction IF IT IS Ever Added: rising comfort cost makes DSR Less
  # attractive in later periods, so flat is the mildly optimistic choice for
  # the town, not the conservative one. Recorded so nobody claims otherwise.
  # NOTE ALSO these three per-category values have NO Indian source - the
  # evidence sweep looked for a Rs/kWh incentive that produced a
  # measured demand response in an Indian pilot and found NONE. They are
  # declared, and only the aggregate fallback is read by the LP anyway.
  comfort_cost_inr_per_kwh: 1.5            # legacy fallback
  comfort_cost_by_category_inr_per_kwh:
    ac_precool: 0.5         # small comfort bump (1-2 C setpoint shift)
    geyser_thermal: 2.0     # high discomfort if hot water unavailable
    ev_charging_window: 1.5 # moderate (range anxiety, but 12 h window)
  # =====================================================================
  # *** 0.18 -> 0.10,. ***
  # This is the ONLY DSR number the LP reads, so it is the whole of
  # the model's demand flexibility. It had NO source: the three citations
  # sitting near it were all opened during the audit and NONE
  # contains a shiftable-fraction percentage.
  # A dedicated evidence sweep then found every measured Indian DSR figure
  # that exists in the public record, and 0.18 was above all of them:
  #   ~10% of peak   Tata Power Delhi Distribution (TPDDL) automated-DR
  #                  pilot, 167 buildings, >25 MW enrolled peak load.
  #                  Verbatim: "a potential average curtailment of nearly
  #                  10 percent of peak electricity demand in the TPDDL
  #                  territory and a conservative estimation of nearly
  #                  eight percent of peak electricity demand in the entire
  #                  Delhi region." US Doe/Eere with Lbnl, 2015.
  #                  LINKED (named-source sweep; both TPDDL
  #                  and LBNL were named across this file and NEVER
  #                  linked): LBNL, "Findings from an Advanced Demand
  #                  Response Smart Grid Project to Improve Electricity
  #                  Reliability in India" -
  #                  https://eta-publications.lbl.gov/publications/findings-advanced-demand-response
  #                  Companion LBNL work on the same deployment:
  #                  https://emp.lbl.gov/publications/estimation-potential-and-value-demand
  #                  *** Verification Status Upgraded
  #                  Claim-Verified. *** Previously "Doc-verified, not
  #                  CLAIM-verified - the sentence has NOT been re-read".
  #                  It has now been read back from the report. The
  #                  finding, verbatim: the aggregated load shed reached
  #                  "up to 10% of the aggregated coincident peak demand"
  #                  across Apr-Oct 2014; the companion analysis gives a
  #                  "75th percentile load reduction of 10%" for 144
  #                  commercial and industrial facilities whose aggregated
  #                  coincident peak was 25 MW. Project scope: ~167 high-
  #                  end industrial/commercial customers over 250+ km2 of
  #                  TPDDL territory.
  #                  Two Things That Follow, both worth saying at viva:
  #                  (a) the source population is EXPLICITLY commercial and
  #                      industrial - confirming the bias note below, not
  #                      merely asserting it;
  #                  (b) 10% is an UPPER/75th-PERCENTILE figure ("up to"),
  #                      not a central estimate. So applying it flat to a
  #                      residential-majority town is generous on BOTH
  #                      counts. Do not call this conservative.
  #   ~8% of peak    the same source's Delhi-wide conservative figure.
  #   1.5% -> 3.5%   MERC Demand Flexibility & DSM Regulations 2024, the
  #                  obligation on Maharashtra distribution licensees over
  #                  five years (Tier b, and a TARGET not a measurement).
  # 0.10 takes the TPDDL measured figure exactly.
  # And Note Which Way The Remaining Bias Runs: the Tpddl 10% is Commercial
  # AND INDUSTRIAL load, which is more controllable than housing (bigger
  # loads, building management systems, a contract). This model applies the
  # fraction to ALL district demand including homes, so even 0.10 is on the
  # generous side for a residential-majority town. Say so rather than
  # claiming it is conservative.
  # Why IT Does Not Ramp Over 2042/2055, which.
  # Two reasons, and the second is the important one:
  #  (1) Nothing TO Ramp IT With. No Indian source gives a Time Path for
  #      demand-response potential. Inventing one would be exactly the
  #      The obvious enabler - smart meters - does not justify a ramp
  #      either: the ToD obligation and the RDSS metering rollout both run
  #      to 2025-27, i.e. they are COMPLETE BEFORE this model's 2030 base
  #      year, so the enabling infrastructure is not the binding constraint
  #      in any period the model runs.
  #  (2) Double-Counting. Flexibility Already grows three separate ways in
  #      this model: EV load grows, V2G grows explicitly (6 -> 8 -> 9.5
  #      kWh/unit/day), and EV smart charging has its own shiftable
  #      fractions. Ramping this fraction on top would count the same
  #      controllable load again.
  # The Flexible Energy Grows Anyway, which is the point worth making at
  # viva: this is a fraction OF PEAK, and peak grows with demand, so a FLAT
  # 10% still delivers 15.5% more flexible energy in 2042 and 32.9% more in
  # 2055 than in 2030. The capability does not need to improve for the
  # resource to grow.
  # Sensitivity TO Run: 0.05 / 0.10 / 0.18 (the Merc-style floor, the Tpddl
  # measurement, and the old declared value) - so the retired 0.18 survives
  # as the optimistic bound rather than vanishing.
  # =====================================================================
  aggregate_shiftable_fraction_in_peak: 0.10   # TPDDL measured; was 0.18 uncited
  shift_window_hours: 4                    # window around the peak slice
  # =====================================================================
  #: This Whole `categories:` Block IS Read BY
  # NOTHING. Verified by grep, not by reading comments: `shiftable_fraction_
  # of_cooling`, `shiftable_fraction_of_dhw` and `kwh_per_session` have ZERO
  # reads across energy/, core/ and scripts/. The flexibility the LP actually
  # dispatches comes from the single scalar
  # `aggregate_shiftable_fraction_in_peak: 0.18` above (1 read) together with
  # `comfort_cost_by_category_inr_per_kwh` (1 read).
  # Kept, Not Deleted, and the reason matters. This block is the Design for
  # per-category DSR, it is individually well-reasoned, and has just
  # corrected the geyser entry so that whoever wires it up cannot inherit the
  # water-heating / space-heating conflation. Deleting it would throw away
  # sound work; leaving it unlabelled would let a methods section quote
  # per-category flexibility figures the model has never used.
  # SO: it is documentation of intended future behaviour, and the thesis must
  # describe DSR as a single aggregate 18%-of-peak pool, NOT as the four
  # differentiated categories below. That is the whole of.
  # =====================================================================
  categories:
    ac_precool:
      applies_to:
        - mid_income_residential
        - high_income_residential
        - office
        - shopping_centre
        - retail_highstreet
        - hotel_guesthouse
      shiftable_fraction_of_cooling: 0.30
      shift_window_hours: 3
      source: "thermal mass of Indian concrete construction"
    geyser_thermal:
      applies_to:
        - low_income_residential
        - mid_income_residential
        - high_income_residential
      # the fourth leg of HEAT-1. This USED TO read
      # `shiftable_fraction_of_heating: 0.50` and was applied to the WHOLE
      # heating load. The justification is a hot-water tank, and a tank IS
      # a real thermal store - you can heat at 03:00 and use it at 07:00.
      # A room heater has no store. Shifting a room heater by 12 hours
      # does not move the load, it removes the heating. On the old
      # 43/57 split that credited 22.67 GWh (2.49% of district demand) of
      # space heating as flexible.
      # Now that heating is two loads, this fraction applies to the WATER
      # HEATING leg only - see heating_loads.dhw_share_of_peak_by_category.
      shiftable_fraction_of_dhw: 0.50
      shift_window_hours: 12
      source: "80-120 L hot-water tank as thermal battery (IS 2082 storage class)"
      # NOTE: this whole `categories` block is still unread by the LP
      # - the flexibility that actually runs comes from
      # aggregate_shiftable_fraction_in_peak above. Renaming the key is
      # therefore worth 0 kWh today; it is fixed so that the methods
      # section quotes a defensible number and so that whoever wires this
      # block up cannot inherit the conflation.
    ev_charging_window:
      applies_to:
        - low_income_residential
        - mid_income_residential
        - high_income_residential
        - office
      shiftable_fraction_of_load: 1.00     # EV plug-in window 18:00-06:00
      shift_window_hours: 12
      source: "12-h plug-in window in residential / office charging"

# ---------------------------------------------------------------------------
# Allume SolShare (apartment PV sharing) — Stage C round 3 (Claude 2).
# Behind-the-meter hardware + software that physically distributes ONE rooftop
# array across many apartment flats in real time (sub-second demand sensing), with
# no per-flat sub-meters. AU/UK/US/DE deployed; NOT yet India-proven, so this is a
# modelling assumption. Full technical/financial/India review + sources:
# Effects modelled:
#   1. CAPEX uplift on apartment (RWA-pooled) rooftop PV: +10%/flat -> +3% district
#      via the multiplier (apartment_roof_share x uptake x premium).
#   2. The single-bus dispatch already pools all PV+demand (= the perfect-sharing
#      ideal), so SolShare's ~55% self-consumption BENEFIT is IMPLICIT; this block
#      only charges the enabling Cost. SolShare/Vnm is what Justifies the pooled-
#      rooftop assumption for apartments.
# Ownership tie-in: mid_income_residential -> owner 'rwa'
#   -> rwa_pooled 8.5% (see discount_rates + rooftop_owner_weights). SUPERSEDES the
#   old "rooftop stays under individual-owner financing" placeholder note.
# India/Punjab: native analogue is Virtual/Group Net Metering (accounting, ~0
#   hardware) - mandatory for group housing in Maharashtra, allowed Rajasthan/Delhi -
#   but Punjab (PSPCL) has no clear Vnm policy, so physical SolShare-style sharing
#   (or common-area-only RWA solar) is the realistic route here.
# Caveat: the +10%/flat below is a Proxy. Real range +0% (Vnm accounting) to +40-55%
#   (SolShare hardware ~A$1,300/flat). Punjab-without-VNM sits HIGH -> Stage E sensitivity.
# ---------------------------------------------------------------------------
allume_solshare:
  capex_premium_fraction: 0.10            # +10% apartment rooftop PV CAPEX (PROXY; see research note)
  default_apartment_uptake_fraction: 0.60  # 60% of apartment roofs adopt
  apartment_roof_share_of_total: 0.50      # apartments approx 50% of district roof
  source: "Allume Energy SolShare (AU/UK); India analogue = VNM/GNM. See _spec/research/allume_solshare.md"

# ---------------------------------------------------------------------------
# Sika + Zinco biosolar roof — Stage C round 3 (Claude 2).
# Green-roof + PV stacked system. Measured benefits (Punjab approx):
#   - 6% rooftop PV yield gain from 13 deg C lower panel-back temperature
#     (Zinco SolarVert + Germany July benchmark; ScienceDirect 2023).
#   - 7% top-floor cooling demand reduction (Sika NatureRoof + UTS Sydney
#     biosolar study 2023).
#   - 35% roof CAPEX premium (substrate + drainage + irrigation install).
# default_built_uptake_fraction: share of built-cell rooftop adopting in
# a given scenario. Aggregate model — Stage D will localise per-cell.
# ---------------------------------------------------------------------------
biosolar_roof:
  pv_yield_multiplier: 1.06               # +6% rooftop PV yield
  cooling_demand_multiplier: 0.93         # -7% top-floor cooling
  roof_capex_multiplier: 1.35             # +35% rooftop installation CAPEX
  default_built_uptake_fraction: 0.30     # 30% of built rooftop adopts
  cooling_share_of_total_demand: 0.30     # ~30% of district annual demand is cooling
  source: "Sika NatureRoof PV (UTS 2023) + Zinco SolarVert (Germany 2023)"

# ---------------------------------------------------------------------------
# BIPV facade — Stage C round 3 (Claude 2).
# Vertical-surface PV on the south / west facades of cells with height
# >= 18 m (high-rise OFFICE / HOTEL / RESIDENTIAL_HIGH). Adds vertical PV
# capacity proportional to facade area; yield = 60% of rooftop south-fixed;
# CAPEX = 2x rooftop. Costly today but BIPVBOOST targets 50% reduction by
# 2030. Per-cell kWp scales with building height as a proxy for facade
# area; uptake fraction caps district-aggregate deployment.
# ---------------------------------------------------------------------------
bipv_facade:
  applies_above_height_m: 18.0
  yield_multiplier_vs_rooftop: 0.60       # vertical south-facade yield = 60% of horizontal
  capex_multiplier_vs_rooftop: 2.00       # 2x rooftop CAPEX
  kwp_per_meter_of_height: 10.0           # ~200 m perimeter x 10% PV per m of height
  default_uptake_fraction: 0.50           # 50% of eligible facade adopts
  source: "BIPVBOOST 2024, Ornate Solar India, Frontiers Energy 2023"

# ---------------------------------------------------------------------------
# Solar carports / parking canopies — Stage C round 3 (Claude 2).
# Multi-purpose canopies: PV + shading + reduced heat-island. Applied on
# cells whose land_use is in eligible_land_uses (ROAD / OFFICE /
# SHOPPING_CENTRE by default). Each eligible cell carries kwp_per_cell of
# PV at +20% CAPEX over ground-mount baseline. Cochin Airport precedent.
# Range 500-1500 kWp per cell typical; default 800 kWp.
# carport plant 2022.
# ---------------------------------------------------------------------------
solar_carport:
  # Extended added healthcare (hospital car parks),
  # public_services (govt-office parking), high-income residential
  # (apartment-block visitor parking).
  #: ROAD removed. A 200 m ROAD cell is for moving
  # traffic, not parking; carports go on dedicated parking lots at the
  # parking-having anchors below. The carport-site cell is intended to
  # fully substitute a parking-lot footprint with PV canopy at the
  # optimal fixed-tilt angle (south, ~25-30 deg for Punjab), NOT a
  # parallel-parking strip alongside a moving road.
  eligible_land_uses:
    - office
    - shopping_centre
    - healthcare
    - public_services
    - high_income_residential
    - hotel_guesthouse
    - light_industry
    - warehouse
  kwp_per_cell_default: 800               # midpoint of 500-1500 spec
  kwp_per_cell_min: 500
  kwp_per_cell_max: 1500
  capex_multiplier_vs_ground_mount: 1.20  # +20% over solar_farm CAPEX
  default_uptake_fraction: 0.40           # 40% of eligible cells adopt
  source: "Cochin Airport CIAL 50 MW carport (2022); model_extensions_backlog #15.6; IEA PVPS Task 13 carport reference designs"

# ---------------------------------------------------------------------------
# Water-surface PV on BLUE_SPACE - Stage C round 5 (revised
# to CANAL-TOP fixed-tilt only per.
# Production Assumption: Canal-Top fixed-tilt PV (Peda Sidhwan Branch Canal
# 2.5 MW + Ghaggar Branch Canal 2.5 MW + 2x 7.5 MW canal-branch projects,
# commissioned 2018; 80%+ performance ratio). Steel framework spans the
# canal banks with south-facing fixed-tilt panels mounted above the water
# surface; panels do NOT float on pontoons. CAPEX premium ~+10% over
# ground-mount (extra steel + bank piers vs saved land-acquisition cost
# because canal corridors are government-owned). Yield bonus +4% from
# water-cooling lowering the panel back-surface temp ~5 deg C.
# Coverage cap 30% of pond area (preserves channel access, bird-strike
# protection, fishery rights).
# Source: PEDA https://www.peda.gov.in/solar-canals-built-in-sidhwan-and-ghaggar
# Pontoon-floating PV (NHPC Omkareshwar 600 MW; CIAL airport reservoir)
# is intentionally OUT OF SCOPE for this district: it needs a wide compact
# reservoir, and Punjab's actual deployment pattern is canal-top. If a
# future thesis run wants to compare, raise `capex_multiplier_vs_ground_mount`
# from 1.10 (canal-top) to 1.18 (pontoon-floating).
# Variable NAME stays `floating_pv` everywhere (back-compat across LP /
# viewer / tests); the YAML below is the canal-top truth.
# ---------------------------------------------------------------------------
floating_pv:
  # NOTE: the variable name stays `floating_pv` for
  # back-compat across the LP, viewer, and tests, BUT the production
  # assumption is **canal-top fixed-tilt** (PEDA Sidhwan + Ghaggar precedent),
  # not pontoon-floating. PEDA deploys a structural steel frame spanning the
  # canal banks with south-facing fixed-tilt panels mounted above the water
  # surface — no pontoons, no mooring. Pontoon-floating would need a wide
  # compact reservoir, which Punjab doesn't have at the district scale.
  # The cluster-of-2-cells `site_selection` filter below biases the LP
  # toward exactly the linear chain geometry a canal occupies.
  eligible_land_uses: [blue_space]
  # per cell was derived for a 200 m (4 ha) pond cell ("30% of 200 m x
  # 200 m pond"); on the 100 m (1 ha) cells the same product implies
  # ~450 kWp/ha =~ 32% areal coverage at ~7 m2/kWp - still inside the
  # 30-40% pond-coverage practice band (NREL FPV benchmark below), so the
  # VALUE stands, but the derivation text predates the re-grid. Registered
  # for the Stage-F extras per-surface-PV audit.
  kwp_per_cell_default: 1500              # x0.30 uptake = 450 kWp per 1-ha pond cell (see flag)
  # Canal-Top fixed-tilt CAPEX premium ~+10% vs ground-mount. Drivers:
  # extra steel frame spanning the canal + concrete pier foundations on
  # the banks - offset by saved-land cost (canal corridor is government-
  # owned, no acquisition).
  # *** CAPACITY CLAIM (register. *** This block
  # said "PEDA Sidhwan 7.5 MW + Ghaggar 7.5 MW + 2.5 MW branches", which
  # CONTRADICTED the density block ~20 lines below - that one was corrected on
  # by actually opening the PEDA page, which says verbatim "2.5 MW
  # Canal Top Solar PV Project ON Sidhwan Branch Canal". The fix
  # corrected one block and missed this one. The page's own programme total is
  # "4 Projects having total capacity of 20 MW", consistent with Sidhwan 2.5 +
  # Ghaggar 2.5 + 2 x 7.5. Corrected below.
  # *** And The +8-12% CAPEX Band Itself IS Still Unverified. *** It is
  # attributed to PEDA, but the PEDA page as quoted carries capacities, land
  # saved and programme context - NO COSTS. So the premium is a
  # engineering assumption wearing a label. Same class as the AEEE
  # and TERI-ETC retractions. peda.gov.in returns a
  # TLS certificate error to the agent -
  # a normal browser) and either source the premium or re-label it.
  # Headline risk is small either way: canal-top is 18.7 MWp by 2055 and the
  # multiplier moves capex only, not the build decision.
  # PEDA Sidhwan 2.5 MW + Ghaggar 2.5 MW + 2 x 7.5
  # MW branches commissioned 2018 confirm the +8-12% band with ~80%
  # performance ratio. Pontoon-floating premium (~+15-20%) is OUT OF
  # SCOPE for this district at this grid resolution.
  capex_multiplier_vs_ground_mount: 1.10  # canal-top fixed-tilt (PEDA precedent)
  yield_multiplier_vs_ground_mount: 1.04  # +4% water-cooling benefit from being over flowing water
  default_uptake_fraction: 0.30           # 30% of cell area can host canal-top PV
  source: "PEDA Sidhwan + Ghaggar canal-top 20 MW (2018) https://www.peda.gov.in/solar-canals-built-in-sidhwan-and-ghaggar; NREL India tracked-PV reports"
  # STAGE- (Q23, -
  # irrigation channel along the NORTHERN greenbelt, row n-2, culverting
  # under road crossings). Canal-corridor cells (BLUE_SPACE tagged
  # amenity_subtype "canal" by layout.canal_corridor.apply_canal_corridor)
  # price at the LINEAR canal-top density instead of the pond
  # per-cell x uptake product:
  #   kwp_per_cell 210 = 2.1 MW per canal-km x 0.1 km per cell.
  #   Density source (, PEDA - the state agency that built them):
  #   https://www.peda.gov.in/solar-canals-built-in-sidhwan-and-ghaggar
  #   *** Basis; The Density Survives And IS
  #   CONSERVATIVE. *** This block said "Sidhwan canal-top ~5.25 MW over
  #   ~2.5 km (~2.1 MW/km)". The PEDA page was opened and says something
  #   different, verbatim: "2.5 MW Canal Top Solar PV Project ON Sidhwan
  #   Branch Canal Near Doraha, Ludhiana (RD 8500 to 12000 ft)".
  #   So it is 2.5 MW - not 5.25 - and the length is RD 8500 to 12000 ft =
  #   3,500 ft = 1.067 km, not 2.5 km. The "2.5" in the old text was the
  #   MEGAWATTS mis-read as KILOMETRES.
  #   RE-DERIVED DENSITY: 2.5 MW / 1.067 km = 2.34 MW/km.
  #   The model uses 2.1 MW/km, which is ~90% of the measured figure, so
  #   kwp_per_cell 210 is CONSERVATIVE against PEDA's own built project.
  #   Value left unchanged on that basis.
  #   Programme context from the same page: MNRE sanctioned 100 MW nationally,
  #   of which 20 MW was allotted to Punjab; "4 Projects having total capacity
  #   of 20 MW have been set up by Punjab Energy Development Agency"; and
  #   "By installing 20 MW on Canal top Solar PV Projects about 110 acres of
  #   agricultural land has been saved" - which is the land-sparing argument
  #   this model makes, stated by the implementing agency.
  #   REC reference case "Comm. India Punjab canals 5.3 MW (2017)"
  #   (Project/Data rec_refcase Pdf).
  # The LP's existing floating-PV decision variable SIZES the build inside
  # the ceiling this creates (register Q23: capacity = decision variable
  # capped by canal length x density); the capex/yield multipliers above
  # already describe canal-top structures, so no separate canal economics
  # block is needed.
  canal:
    kwp_per_cell: 210
  #: floating PV should NOT cover every BLUE_SPACE
  # cell. Restrict deployment to contiguous water bodies so wiring/BOS cost
  # amortises and isolated ornamental ponds stay panel-free.
  # `layout.floating_pv_siting.assign_floating_pv_sites` groups BLUE_SPACE
  # cells into 4-connected clusters; only clusters of size >=
  # `min_cluster_size` get the `is_floating_pv_site` flag, and the LP
  # ceiling reads from those flags via
  # `EnergyNetwork.total_floating_pv_potential_kwp`.
  # Bos rationale: NREL Fpv cost benchmark Q1 2021 (Ramasamy et al.)
  # https://www.nrel.gov/docs/fy22osti/80695.pdf shows fixed BOS dominates
  # at < 5 MW; SECI FPV tenders 2022 confirm pontoon + mooring + combiner
  # is poorly amortised on a single-cell pond. Aesthetic rationale per
  # URDPFI 2014 public-realm guidance treating urban ponds as cool-refuge.
  # Set to 1 to restore the legacy "every BLUE_SPACE cell hosts" behaviour.
  site_selection:
    min_cluster_size: 2

# ---------------------------------------------------------------------------
# Power Purchase Agreements (PPA) — EMBEDDED in production
# model
# case"). Full LP integration is Stage E (N21) — the YAML defines the
# production-default intent; flipping `enabled: true` here will be a
# no-op until Stage E lands the LP variable + revenue + cost wiring.
# Open-access PPA is enabled by Electricity Act 2003 + PSERC Open
# Access Regulations 2011 (amended 2024). Any generator > 1 MW can
# wheel power to a corporate / industrial / data-centre off-taker
# through PSPCL's network on payment of wheeling + cross-subsidy
# charges. No tech-of-origin restriction
# question — answer: NO, any IPP qualifies).
# Three counterparty types modelled.
#   * data_centre_offsite — ENABLED as the production default. A hyperscale
#     hall (AWS / Google / Microsoft) co-locating in NCR-Mohali signs a
#     25-yr PPA to absorb our PV surplus. India hyperscale 1.4 GW (2024)
#     → 9 GW (2030) per CBRE India Data Center Update Q3 2024; 90 %+ of
#     new capacity is RE-PPA backed. Off-site = NO heat-recovery
#     pipeline (>2 km PEX is uneconomic; and India has essentially zero
#     district heating market anyway,. On-site is
#     irrelevant —
#     a district".
#       https://www.cbre.co.in/insights (India Data Centre update; the.com
#       report path 404s as of)
#       ** Tier Downgraded -> Tier 3 (declared). The link is
#       an INSIGHTS LISTING page, not the report, so the 1.4 GW -> 9 GW
#       hyperscale figures are unevidenced by it. CBRE is also a commercial
#       property consultancy, i.e. trade material. **
#: https://www.iea.org/reports/electricity-2024 - UPGRADED
# its executive summary was opened and parsed and carries
#       "460 terawatt-hours (TWh) in 2022... more than 1 000 TWh in 2026"
#       verbatim, so the data-centre growth premise IS sourced even though the
#       India-specific hyperscale split is not.
#   * corporate_industrial — OFF by default. Mohali industrial cluster
#     anchor (e.g. SUNGRACE / Hero MotoCorp). 25-yr PPA tenor standard.
#     Use as a Stage E sensitivity if data-centre PPA fails to clear.
#: Mercom India "Industrial Open Access PPA Review 2024"
#   * group_captive — OFF by default. District-owned consortium with
#     ≥26 % equity in the generating asset. CEA group-captive rules
#     escape cross-subsidy surcharge.
#: CEA Open Access Guidelines 2003 (amended 2024)
# Economic structure of a "proper" PPA (used to derive the numbers
# below from PSERC orders + Mercom + CEA standards):
# REVENUE (per kWh delivered):
#   * tariff_inr_per_kwh — locked-in PPA rate. Real terms, 25-yr fixed.
#     Trade 0.5-1.0 ₹/kWh BELOW grid spot to lock in price stability.
#     2030 anchor: PSPCL ACoS ~6.15 ₹/kWh × 0.85 = 5.2 → round to 5.0.
# OPEX (per kWh delivered, paid by off-taker but netted from gross):
#   * wheeling_charge_inr_per_kwh — PSPCL T&D-use charge (PSERC
#     FY24-25 ARR Ch. 8: 1.27 for HT industrial; captives at 0.50).
#   * cross_subsidy_surcharge_inr_per_kwh — applies to non-captive PPAs
#     only (PSERC FY24-25: 1.20 ₹/kWh for HT industrial open-access;
#     0.0 for group captive at ≥26 % equity).
# CAPEX (one-time, paid by US at PPA signing — annualised over 25 yr
# at the utility actor discount rate via the standard CRF):
#   * interconnection_capex_inr — HT metering panel + bay extension at
#     our 33 kV injection point. PSPCL standard substation tender 2024:
#     ₹70 lakh - 1.15 cr for a 25 MW connection. Central: 1.0 cr.
#   * legal_filing_capex_inr — PSERC open-access application,
#     wheeling agreement, escrow setup, 25-yr legal fees prepaid.
#     Mercom India 2024: 10-20 lakh typical. Central: 15 lakh.
# ANNUAL FIXED:
#   * annual_admin_inr — PSERC OA renewal + metering AMC + dispatch
#     scheduling fees. Central: 1.5 lakh / yr.
# Off-Take Modelling (Stage E LP wiring):
#   * The off-taker contracts a CONSTANT kW (24/7 baseload) — typical
#     hyperscale PPA structure. But our PV is intermittent. The PPA
#     would normally include a "deemed delivery" clause that pays us
#     even when we can't deliver (grid imports cover the gap from the
#     off-taker's perspective).
#     model PPA as Absorbing The Surplus that would otherwise Curtail
#     (i.e. PV - district - storage - grid_export cap). This way the
#     LP doesn't divert from district demand. Net effect: monetises
#     the ~75 GWh/yr curtailment loss from the 60 MW feeder cap.
#   * Aggregate cap: 60 % of district annual demand is a defensible
#     upper bound (the district must remain a net consumer for
#     reliability balance). Used in Stage E as a hard constraint.
ppa:
  # *** What This Block Actually Models - Name IT Accurately.
  # It is labelled "ppa", and the counterparty is a hyperscale data centre, so
  # a reader will assume a bankable 25-year power purchase agreement. IT IS
  # NOT ONE, and the thesis should say so plainly.
  # A real corporate solar PPA is Pay-AS-Produced ON A Dedicated Asset: the
  # buyer takes whatever a NAMED plant generates and covers the rest from the
  # grid. What is modelled here is different and weaker - the buyer takes
  # whatever the Town Has Left Over after serving its own demand and charging
  # its own storage. That is Structured Surplus Export, not a PPA.
  # Why The Weaker Framing Was Chosen Deliberately: the
  # alternative - dedicating a share of the solar farm to the offtaker - makes
  # the contract bankable but removes that generation from the town, which is
  # the opposite of what this thesis is arguing. Selling only genuine surplus
  # keeps the town's self-supply case intact and makes the offtake purely
  # additive.
  # CONSEQUENCE TO STATE: a counterparty pays less for non-firm surplus than
  # for contracted output, so the Rs 5.99 assumed here is, if anything,
  # optimistic for a non-firm product. The offsetting conservatism is that no
  # banking, no firming and no capacity commitment are modelled either (see
  # the RE-concession block). Both directions should be declared rather than
  # netted silently. ***
  # Master switch. Default false because the LP wiring is Stage E
  # (N21) — flipping true here is a NO-OP until then. Once Stage E
  # lands, Flip True and the RE-Concession counterparty engages as the
  # variant is retained as a documented fallback only).
  # ===================================================================
  # Flipped True. The PPA leaves the
  # scenario shelf and enters the production headline.
  # What Changed TO Make This Defensible, in order:
  # 1. The fix let carports and floating PV
  #    build for the first time (18,975 + 18,664 kWp). That created
  #    genuine daytime surplus where had found none.
  # 2. The price was re-derived and VERIFIED: Rs 5.738/kWh via the NRSE
  #    2% concession, quoted verbatim from PSERC Tariff Order FY 2023-24
  #    cl. 7.11 = Open Access Regs 2011 Reg. 25., document opened.
  #    sale to ground/water/parking-mounted PUBLIC solar only. No
  #    rooftop of any kind - private, RWA, EWS or public-building.
  #    offtake 83.06 -> 79.83 GWh (-3.9%), ZERO slice violations across
  #    354 selling slices, and the lifetime saving SURVIVES at
  #    Rs 4.98 bn (vs 5.09 bn unconstrained). Excluding every household
  #    roof costs the deal only 2% - because the eligible public solar
  #    (383,789 kWp) dwarfs the 25 MW contract ceiling, so rooftops were
  #    never needed to serve it.
  # *** The Caveat That Decides Whether This Price IS Real. ***
  # Rs 5.738 requires the off-taker to consume WITHIN PUNJAB (Reg. 25).
  # Research the nearest EXISTING large hall is Anant Raj's
  # Panchkula facility - which is in HARYANA, across the state line, and
  # would NOT qualify. It would fall to the HT-industrial route at
  # Rs 4.13/kWh (still above the ~3.00 export feed-in, so the deal
  # survives, but worth less). The Punjab-side counterparty is the
  # Satyam Data Centre in Mohali IT City - a Gmada 1,700-acre township
  # in SAS Nagar, the SAME district as this site, already hosting
  # Infosys and Tech Mahindra. Punjab also gives data centres 100%
  # electricity-duty exemption for 10 years.
  # SCALE SANITY: 25 MW is a standard hall. Sify's Noida 02 campus runs
  # 25.92 MW IT power (real, operating, North India), and the industry
  # size band is literally "Large <= 25 MW". Hyperscale starts at 4 MW
  # contiguous IT load per tenant. India: 387 MW added in 2025 (2x on
  # 2024), 1.5 GW operational, 4.5-5 GW projected by 2030.
  # HONEST COUNTERWEIGHT: today's Chandigarh-region reality is 2-5 MW
  # "micro edge" sites; Mohali is ~1% of India's operational market and
  # real hyperscale sits in Mumbai / Chennai / Delhi NCR. So this is a
  # 2030+ counterparty, consistent with the model's own horizon - NOT a
  # contract that exists today. State IT That Way.
  # Run The Rs 4.13 Sensitivity before the viva: it is the out-of-state
  # / no-concession case and it is the one an examiner will reach for.
  # ===================================================================
  enabled: true    #; see block above)
  counterparties:
    # *** Where The Data Centre IS, because every charge below depends on it
    #: the hall is NOT inside the district. It is a separate
    # hyperscale site Elsewhere IN Punjab, and the town simply Exports surplus
    # generation to it. That makes this an Intra-State Open Access transaction:
    # the town is the generator/seller, the data centre is the open-access
    # consumer, and PSPCL's network carries the power in between.
    # Why That Matters And IS Not A Detail: the Nrse concession in Reg 25 is
    # conditional on "consumption WITHIN the State". A data centre in Punjab
    # satisfies that; one across a state border would NOT, and the block would
    # then pay "full transmission and wheeling charges" per the same clause.
    # The clause also says the 2% applies "irrespective of the distance", so
    # WHERE in Punjab the hall sits does not change the charge - which is what
    # makes an off-site counterparty workable at all.
    # (Consistent with the existing design note above: off-site means no
    # heat-recovery pipeline, and on-site was rejected outright.)
    # *** All Three Price Terms Audited Against The Primary, Before
    # Stage E Wires This Block. Nothing here computes yet (ppa.enabled: false),
    # which is why this is the right moment to correct them. Source throughout:
    # PSERC Tariff Order FY 2023-24 for PSPCL, 476 pp, downloaded and parsed.
    #   https://pspcl.in/pdfs/currenttariff/sesalesto2023052610211318601062023.pdf
    # 1. TARIFF. The anchor is stated as "PSPCL ACoS x 0.85". The order gives
    #    ACoS explicitly, Table 7.1: "Average Cost of Supply (for Energy Sales
    #    of 59211 MkWh) 704.34 paise/kWh" = Rs 7.0434/kWh.
    #    7.0434 x 0.85 = Rs 5.99/kWh. The value here was 5.0, which implies an
    #    ACoS of 5.88 - about 17% BELOW the determined figure. Corrected to
    #    5.99 so the number matches its own stated derivation.
    # 2. Wheeling. Was 1.27 "PSERC HT industrial 2024", which matches Neither
    #    published basis. Table 7.11 / clause 7.11 determines wheeling two ways:
    #      Long Term / Medium Term OA : Rs 2,58,642 /MW/month
    #      Short Term OA              : Rs 656.91 /MWh  = Rs 0.657/kWh
    #    This field is Rs/kWh, so the short-term ENERGY basis converts directly
    #    and is used. Note For Stage E: a 25-year PPA is formally Long Term, and
    #    the demand basis at high utilisation is CHEAPER (25 MW x 258,642 x 12
    #    / 219 GWh = ~Rs 0.354/kWh at 100% load factor). Because offtake here is
    #    bounded by SURPLUS, not baseload, utilisation is an LP outcome and the
    #    per-kWh demand charge would rise as utilisation falls. Using 0.657 is
    #    therefore the CONSERVATIVE choice and avoids a load-factor assumption.
    # 3. Cross-Subsidy Surcharge 1.20 "PSERC HT OA 2024" - The Determination
    #    Was Found (clause 7.13, see the css_inr_per_kwh block below) And 1.20
    #    Matches NO Category IN IT. PSERC determines Css per consumer category:
    #        FY23-24 (verified):  Large 0.49 | Non-Residential 1.40 |
    #                             Bulk 1.13  | Domestic 0
    #        FY25-26 (reported):  Large 0.57 | Non-Residential 1.11 |
    #                             Bulk 0.85  | Domestic 0
    #    1.20 is not any of these in either year. It sits between Large and
    #    Non-Residential, which suggests it was never taken from a category row.
    #    Which Row Applies IS A Classification Decision, Not A Lookup.
    #    *** RULED BY
    #    Non-Residential (Commercial), Not Large Supply (Industrial). ***
    #    The two readings and what they cost:
    #      Large Supply (industrial) : Css ~0.49-0.57 -> district nets ~4.84/kWh
    #      Non-Residential (commercial): Css ~1.11-1.40 -> district nets ~4.13/kWh
    #    Justification For Taking The More Expensive Reading:
    #      (a) On a plain reading a data centre manufactures nothing. It is a
    #          building full of servers, which is a commercial occupancy. That
    #          is the answer that survives "why did you assume the cheaper
    #          category?" at viva.
    #      (b) It is the PESSIMISTIC choice, so the PPA case above is not
    #          propped up by a favourable classification. The PPA already beats
    #          grid export on this assumption; it would only beat it by more on
    #          the other one.
    #      (c) Several Indian states have granted data centres INDUSTRIAL status
    #          specifically to give them the cheaper tariff. That is a POLICY
    #          concession, not a fact about the load, and Punjab granting it is
    #          not something this model should assume. If Punjab does grant it,
    #          reality comes out BETTER than modelled - the safe direction.
    #    *** Resolved Set TO The Verified FY25-26 Non-Residential
    #    RATE, Rs 1.11/kWh. *** The FY2025-26 circular was located (it was
    #    already on disk; the earlier search missed it because the document
    #    writes "111 paise/kWh" rather than 1.11) and gives Large Supply 57
    #    paise, Domestic 0, Non-Residential 111 paise, Bulk 85 paise, effective
    #    01.04.2025-31.03.2026.
    #    Non-Residential is the applicable row and 1.20 is replaced by 1.11.
    #    Effect ON The Fallback Route Only: HT-industrial net moves
    #    5.99 - 0.657 - 1.11 = Rs 4.22/kWh (was 4.13). The Production Route IS
    #    UNCHANGED - the RE concession carries CSS = 0 by regulation, so the
    #    5.74/kWh figure and the route decision are untouched. ***
    data_centre_offsite:
      # route below is now the production intent. *** Reason:
      # the OFF-TAKER pays wheeling and cross-subsidy on top of the energy
      # price, which is the standard open-access structure. On that basis this
      # route fails the counterparty's own test:
      #     DC all-in = 5.99 + 0.657 + 1.20 = Rs 7.85/kWh
      #     vs PSPCL Large Supply >100 kVA  = Rs 6.96/kVAh
      # A data centre would simply buy from PSPCL. The RE-concession route
      # gives 5.99 + 0.12 + 0 = Rs 6.11/kWh, which saves it ~Rs 0.85/kWh and
      # is therefore the only structure that a real counterparty signs.
      # Kept in the config as a DOCUMENTED FALLBACK and A/B comparator, not
      # deleted, because the contrast is a thesis result in its own right:
      # the RE concession is what makes district-to-datacentre PPAs viable in
      # Punjab, and without it the deal does not happen.
      enabled: false                           # FALLBACK / A-B comparator only
      offtake_kw_constant: 25000               # 25 MW hyperscale hall (declared assumption)
      tariff_inr_per_kwh: 5.99                 # ACoS 7.0434 (PSERC FY23-24 Table 7.1) x 0.85
      wheeling_charge_inr_per_kwh: 0.657       # PSERC FY23-24 cl.7.11, Short Term OA Rs 656.91/MWh
      cross_subsidy_surcharge_inr_per_kwh: 1.11  # PSERC FY25-26 Non-Residential, verified
      interconnection_capex_inr: 10_000_000    # ₹1 cr HT panel + bay extension
      legal_filing_capex_inr: 1_500_000        # ₹15 lakh PSERC + escrow + legal
      annual_admin_inr: 150_000                # ₹1.5 lakh/yr PSERC renewal + AMC
      ppa_capex_lifetime_yrs: 25
      # Modelling-choice flag for Stage E LP: when true, the PPA off-
      # take Var is bounded by AVAILABLE SURPLUS (PV - district demand
      # - storage charge - feeder export). When false (legacy strict
      # baseload), the Var must equal `offtake_kw_constant` × hours.
      bound_by_surplus_not_baseload: true
      source: "CBRE India DC Q3 2024; PSERC FY24-25 ARR Ch.8; Mercom India OA 2024"
    data_centre_offsite_re_concession:
      #: RE intra-state Open-Access variant of the data-centre PPA.
      # Punjab gives NRSE (renewable) power consumed WITHIN the state a concession: combined
      # transmission + wheeling levied at ~2% of energy injected (PSERC Open Access Regs 2011,
      # Reg. 25), with intra-state RE transmission loss ~2.2% in kind. This is the
      # RE-concession alternative to the HT-industrial structure above.
      # *** Economics Restated - The Old Conclusion IS Dead. ***
      # This block used to say the HT-industrial structure "nets only ~2.53/kWh -
      # WORSE than the ~3.0-3.5 feed-in export tariff, so that structure only
      # pays on CURTAILED energy". That rested on tariff 5.0 and wheeling 1.27,
      # BOTH of which the audit found do not match the PSERC determination
      # (ACoS x 0.85 = 5.99 not 5.0; short-term OA wheeling 0.657 not 1.27).
      # On the corrected figures:
      #     HT-industrial route : 5.99 - 0.657 - 1.20       = Rs 4.13/kWh
      #     RE-concession route : 5.99 x (1-0.022) - 0.12   = Rs 5.74/kWh
      #     grid export feed-in :                           ~ Rs 3.00/kWh
      # SO Both PPA Routes Now Beat Grid Export, not just the RE one. The PPA is
      # worth signing for ALL surplus under either structure; the RE concession
      # is simply better by ~Rs 1.6/kWh. The "only pays on curtailed energy"
      # caveat applies to NEITHER route any more.
      # The 60 MW feeder cap is still WHY surplus exists to sell (verified
      # binding at midday) but is no longer why the PPA is worth signing.
      # Caveat: the 1.20 Css on the HT route remains Unverified and is the
      # pessimistic assumption. A lower real CSS improves the HT route further.
      # Verified context: 72.5 GWh/yr currently exported;
      # export power pins at exactly 60.0 MW at midday => curtailment exists above the cap.
      # Interconnection capex is typically borne by the OFF-TAKER (data centre) in a standard
      # PPA -> the district's share can be ~0 (cost-sharing lever for Stage E).
      # PSERC Open Access Regs 2011 Reg.25: https://docs.pspcl.in/docs/cecommercial2520250329184924412.pdf
      # Forum of Regulators, Status of Open Access: https://forumofregulators.gov.in/Data/Reports/FOR%20Status%20of%20Open%20Access-13-01-2020.pdf
      # *** The 2% Nrse Concession IS Now Verified Verbatim Against Reg 25.
      #, PSERC Tariff Order FY 2023-24, clause 7.11: "in case of
      # wheeling of power generated from NRSE project for consumption within
      # the State, transmission and wheeling charges shall be levied @ 2% of
      # the energy injected into the State Grid, irrespective of the distance
      # i.e. additional 2% of the total energy shall be injected at injection
      # point(s)."  So the concession is real, it IS Regulation 25 as this
      # block claimed, and the "irrespective of distance" clause matters for an
      # off-site hall. This is the single most load-bearing citation in the
      # whole PPA case and it holds.
      # One Mechanism Note For Stage E: the 2% is levied IN Kind (extra energy
      # injected), not as a rupee charge. Monetising it as 2% x tariff is
      # arithmetically equivalent only because the energy is valued at the PPA
      # tariff - which it is here - but the LP should ideally apply it as an
      # energy haircut rather than a price adder.
      # Loss Figure, and it Moves Between Orders: FY2023-24 clause 7.12 gives
      # OA loss at 132/220/400 kV = 2.42%; the FY2025-26 circular gives 2.21%.
      # 0.022 matches the CURRENT order. Re-read it if the tariff year moves. ***
      enabled: true                            # the route that a counterparty would actually sign
      offtake_kw_constant: 25000               # 25 MW hyperscale hall (declared assumption)
      # *** Stage E Hard Requirement - Surplus Only, And Only When IT Pays.
      # "the town sold energy first to dc then imported electricity from grid
      # to power homes". That must be impossible by construction. The LP is a
      # cost minimiser, so it will only do this if the PPA is modelled as an
      # OBLIGATION rather than an OPTION - i.e. if the offtake variable is
      # forced to equal offtake_kw_constant x hours.
      # Three Conditions The Stage E Wiring Must Satisfy:
      #   1. BOUNDED BY SURPLUS. offtake_kw(t) <= max(0, own_generation(t)
      #      - district_demand(t) - storage_charge(t)). Never a fixed baseload.
      #      This is what bound_by_surplus_not_baseload below is for; it MUST
      #      be honoured, not just declared.
      #   2. AN Option, Not AN Obligation. offtake_kw_constant is a Ceiling on
      #      what the hall can absorb, never a floor the town must deliver.
      #   3. Never Sell Into AN Import. In any slice where the district is a
      #      net grid importer, PPA offtake must be zero. Selling at a net
      #      Rs 5.87 while re-importing at the loss-grossed retail rate
      #      (~Rs 6.9 on the 6.00 band) destroys value, and no correctly
      #      priced LP should choose it - but the constraint should be
      #      explicit so a mis-priced input cannot resurrect the behaviour.
      # Add A Regression Test AT Wiring Time: assert that in every slice,
      # ppa_offtake_kwh > 0 implies grid_import_kwh == 0. That is the cheapest
      # possible guard against this exact failure recurring.
      #   4. Report The Temporal Match, DO Not Let 25 MW BE Read AS Firm.
      #      The hall runs 24/7; the town's surplus is DAYTIME SOLAR. Midday
      #      is when surplus is largest - residential base load bottoms out at
      #      a 0.4439 daypart multiplier while PV peaks - and it is ZERO every
      #      night by construction. So the town can serve the hall for roughly
      #      6-10 hours a day and PSPCL supplies the rest. Stage E must report
      #      the Share OF The Hall'S Annual Demand actually served, not just
      #      the MWh sold, or a reader will multiply 25 MW by 8,760 h and get
      #      a number three to four times too big.
      # *** What Happens When The Town Has Nothing TO Spare
      # By construction, offtake simply goes to ZERO for that slice. There is
      # no penalty and no obligation, because rule 2 makes this an option. The
      # hall buys from PSPCL that hour, as it does every night anyway. So the
      # model cannot be forced into the sell-then-import failure, and no
      # shortfall cost arises.
      # The Real Exposure IS Commercial, Not Technical, and it should be
      # stated rather than engineered away: a counterparty will not pay a
      # premium for supply that disappears unpredictably. That is precisely
      # why this is framed as Structured Surplus Export rather than a bankable
      # PPA - see the framing note on the parent block.
      # Three Things Would Firm IT UP, none of them modelled here, all worth a
      # sentence in the thesis because they mean this result is CONSERVATIVE:
      #   (a) BANKING. Punjab GEOA explicitly permits monthly banking with a
      #       30% carry-forward cap (verified: PSPCL Banking Procedure
      #       04.09.2025, clause 8.2). This model sets banking to NONE, so
      #       green kWh count only in the slice they arrive. A real
      #       arrangement could smooth month to month; ours cannot.
      #   (b) BATTERY. The model already builds storage (2055-only today), and
      #       firming an offtake contract is a use case it is not currently
      #       asked to serve.
      #   (c) A Smaller Contracted Capacity. 25 MW is a hall size, not a
      #       commitment. Contracting to the reliably-available level instead
      #       would trade volume for firmness.
      # So the honest reading is: this arrangement is modelled at its WEAKEST
      # - no banking, no firming, no capacity commitment - and it still beats
      # grid export. ***
      tariff_inr_per_kwh: 5.99                 # ACoS 7.0434 (PSERC FY23-24 Table 7.1) x 0.85
      wheeling_charge_inr_per_kwh: 0.12        # 2% of 5.99/kWh combined T&W, NRSE intra-state (Reg.25, verified)
      cross_subsidy_surcharge_inr_per_kwh: 0.0 # RE/green open-access concession (no CSS in-state)
      wheeling_loss_fraction: 0.022            # 2.21% NRSE intra-state OA loss, FY2025-26 circular; in kind
      interconnection_capex_inr: 10_000_000    # Rs 1 cr HT panel + bay (often off-taker-funded -> see cost-share note)
      legal_filing_capex_inr: 1_500_000        # Rs 15 lakh PSERC + escrow + legal
      annual_admin_inr: 150_000                # Rs 1.5 lakh/yr PSERC renewal + AMC
      ppa_capex_lifetime_yrs: 25
      bound_by_surplus_not_baseload: true
      source: "PSERC OA Regs 2011 Reg.25 (RE intra-state ~2% T&W, ~2.2% loss); FOR OA status report"
    corporate_industrial:
      enabled: false                           # OFF: Stage E sensitivity
      offtake_kw_constant: 8000
      tariff_inr_per_kwh: 5.5
      wheeling_charge_inr_per_kwh: 1.27
      cross_subsidy_surcharge_inr_per_kwh: 1.20
      interconnection_capex_inr: 7_000_000     # smaller 8 MW connection
      legal_filing_capex_inr: 1_500_000
      annual_admin_inr: 150_000
      ppa_capex_lifetime_yrs: 25
      bound_by_surplus_not_baseload: true
      source: "Mercom India Industrial OA 2024"
    group_captive:
      enabled: false                           # OFF: needs ≥26% equity by district
      offtake_kw_constant: 12000
      tariff_inr_per_kwh: 4.5
      wheeling_charge_inr_per_kwh: 0.50        # captive escapes cross-subsidy
      cross_subsidy_surcharge_inr_per_kwh: 0.0  # captive exempt per CEA 2003
      interconnection_capex_inr: 8_000_000
      legal_filing_capex_inr: 2_000_000        # captive needs equity-purchase contracts
      annual_admin_inr: 150_000
      ppa_capex_lifetime_yrs: 25
      bound_by_surplus_not_baseload: true
      source: "CEA OA Guidelines 2003 (amended 2024); PSERC captive rules"
  # Aggregate cap on PPA-delivered energy (district must stay net
  # consumer of grid for reliability balance). 60 % of annual demand.
  max_ppa_share_of_district_demand: 0.60
  # NO heat-recovery option —
  # India, so unless there's another use there is no point". Confirmed:
  # India has essentially zero district-heating market (only research
  # pilots in IIT Roorkee + ISMC Dholera). On-site data-centre + heat
  # pipeline removed from this block. If a future absorption-chilling
  # opportunity emerges (data-centre heat → AC for nearby cooling-heavy
  # cells), add a separate block then.

# ---------------------------------------------------------------------------
# REGIONAL INTEGRATION - the district in its region as LP
# MECHANICS, not reporting (register supervisor SUP-4 "island" flaw;
# Four blocks. All default enabled: false -> the production pins are Byte-Exact
# killed the merchant SELL side (dc-PPA offtake 0, standing-charge loss-maker);
# these blocks price the BUY side + the boundary itself.
# ---------------------------------------------------------------------------
green_purchase:
  # (a) External open-access Green PPA Purchase as a decision variable:
  # per-period contracted MW (gp_mw) + per-slice delivered energy (gp),
  # solar-shaped (an intra-state Punjab park generates on the same GSA
  # insolation clock as the district's own farm - same-latitude assumption,
  #; drawal bound reuses the farm per-kWp slice yields x tracked mult).
  # Route = intra-state Nrse open access (inter-state pays Full T&W + graded
  # ISTS charges - 25%/50%/75% levied for COD Jul-25/26/27, 100% after
  # Jun-2028, MoP graded-waiver orders via indiatransmission.org + Mercom,
  # - strictly dominated for a Punjab buyer; documented, not built).
  enabled: true   # FLIPPED = the re-baseline
  # Energy price: PSERC-approved PSPCL 400 MW intra-state solar procurement
  # (SAEL Industries, quoted 2.99 reduced to 2.97 on 09.12.2024; PSERC:
  # "commensurate with prevailing market rates in Punjab")..
  #   https://www.mercomindia.com/punjab-regulator-approves-tariff-400-mw-solar-procurement
  #   https://solarquarter.com/2025/03/08/pspcl-secures-approval-for-400-mw-solar-power-procurement-at-%E2%82%B92-97-kwh/
  # Cross-anchors : SECI standalone-solar 2025 low 2.70; solar+4h
  # storage 2.86 (pv-magazine); IEX G-DAM weighted avg 3.15-4.66
  # through 2025 (Mercom monthlies). Real-flat convention matches B2
  # (retail escalation 0.0 real); a 25-y PPA locks the price.
  gen_price_inr_per_kwh: 2.97
  # Combined transmission + wheeling for NRSE generated AND consumed
  # in-state: 2% of energy injected IN KIND, irrespective of distance
  # (PSERC intra-state OA Regs 2011 Reg 25 proviso, restated in the FY25-26
  # charges circular).: PSPCL Commercial Circular 10/2025, Memo
  # 436/440/T.O. 2025-26 dated 29.03.2025 (per PSERC Tariff Order
  # 28.03.2025, Petition 61/2024),
  #   https://docs.pspcl.in/docs/cecommercial2520250329184924412.pdf
  inkind_tw_charge_fraction: 0.02
