  # --- Stage C additions ---

  biomass_chp:
    # 2030-real INR. Sized to Punjab rice-straw availability.
    # =====================================================================
    # (Parasitic Load + AS-Fired Calorific Value).
    # every plant we have to input their energy usage too this is non
    # negotiable". Two corrections, both applied by restating this block
    # Net OF House Load rather than by adding a new term (see Why below).
    # (1) Auxiliary / House Load, 10% of gross generation.
    #     CERC RE Tariff Regulations 2020, Reg 33 (, verbatim): "The
    #     normative auxiliary consumption shall be... a) For projects using
    #     water-cooled condenser 10%... b) air-cooled condenser 12%".
    #     https://www.cercind.gov.in/2020/regulation/159_reg.pdf
    #     CERC RE Tariff Regs 2017 Reg 4(d) names the parasitics explicitly:
    #     "boiler feed pump and the FD/ID fans". Also ash handling, straw
    #     handling and flue-gas treatment. 10% = water-cooled base case;
    #     12% is the air-cooled arm, defensible in water-stressed Punjab -
    #     carry it as a sensitivity, not the base.
    #     Label This Normative, Never Measured. No measured plant-level
    #     auxiliary figure exists for any named Punjab paddy-straw plant;
    #     searched and Expected TO Stay Unsourced.
    # (2) Calorific Value 14.5 -> 12.97 MJ/kg. 14.5 is paddy straw's Dry
    #     Gcv; what belongs in a fuel-cost divisor is the AS-Fired Ncv of
    #     baled straw at field moisture. CERC RE Tariff Regs 2017, Reg 41
    #     (, verbatim): "The Calorific Value of the biomass fuel used
    #     for the purpose of determination of tariff shall be at 3100
    #     kCal/kg" = 12.97 MJ/kg. https://cercind.gov.in/2017/regulation/Noti131.pdf
    #     This was a units-basis error (dry value in a wet-fuel slot), not
    #     merely an optimism.
    # Why Restate The Block Instead OF Adding A `parasitic_fraction` Key.
    # `capacity_cap_kw_e` is read by ELEVEN sites across dispatch.py - the
    # per-slice cap, the monthly fuel ceiling, the greedy sizer, and THREE
    # islanded-resilience expressions (dispatch.py:794, :1694, :3048) that
    # build outage coverage from raw kW_e. A new fraction applied only at
    # the energy injection would leave the resilience result quoting the
    # GROSS fleet and silently contradicting the dispatch result. Restating
    # the cap as Net Sent-Out makes every one of those eleven sites correct
    # for free, with no new code path and no new bug surface.
    # The Plant IS Still Physically 15 MW Gross. Everything below is the
    # net-sent-out restatement of that same plant:
    #   capacity_cap_kw_e     15,000 gross -> 13,500 net   (x 0.90)
    #   electrical_efficiency  0.27  gross -> 0.243 net    (x 0.90)
    #   capex_inr_per_kw_e    90,000/gross kW -> 100,000/net kW
    #                          (SAME total spend Rs 1.350e9; without this
    #                          you buy a 15 MW plant for a 13.5 MW price)
    #   op. emissions          0.05 -> 0.0556 kgCO2/kWh    (/ 0.90)
    #   embodied (L2061)       1,500 -> 1,666.67 kgCO2/kW  (/ 0.90)
    #   The last two matter: without them this "penalty" would quietly
    #   IMPROVE the town's CO2, because the same total tonnes of transport
    #   fuel and construction steel would be spread over fewer kWh.
    # RESULTING PHYSICS (recomputed):
    #   net yield      875.5 kWh per tonne of straw (was 1,087.5)
    #   net generation 13,500 kW x 7,000 h = 94.5 GWh_e/yr (was 105.0)
    #   straw drawn    107,939 t/yr - still INSIDE the 130 kt catchment
    #                  budget, so CAPACITY still binds, not fuel supply
    #   fuel cost      Rs 2.2845/kWh_net (was Rs 1.8391/kWh_gross)
    # Against the deployed Punjab fleet (PEDA Table-I: 608 kWh/t) the model
    # is now 1.44x optimistic, down from 1.79x - and the residual gap is
    # explained by new-build high-pressure plant vs an older, lower-pressure
    # fleet running below design Plf. State That IN The Limitations Chapter.
    # =====================================================================
    capex_inr_per_kw_e: 100000      # per NET kW-e. = Rs 90k/gross kW / 0.90 aux; total spend Rs 1.350e9 UNCHANGED
    opex_fraction_of_capex_per_year: 0.04   # higher than PV due to fuel handling
    lifetime_years: 25
    electrical_efficiency: 0.243    # Net = 0.27 Gross x 0.90 (CERC 2020 Reg 33 aux). Gross 0.27 = high-pressure new build; CERC normative Shr 4200 kCal/kWh = 0.205 for the older fleet
    operating_hours_per_year: 7000  # 80% availability factor
    fuel_cost_inr_per_tonne: 2000   # paddy straw HARVEST-WINDOW delivered price; centre of the
                                    # project-collected band Rs 1,500-2,500/t
                                    # (../Data/zirakpur_data_sources.md row 13, MNRE/Pib
                                    # techno-economic examples). Stored-straw months
                                    # pay the fuel_monthly_cost_multiplier below.
    fuel_calorific_value_mj_per_kg: 12.97  # AS-Fired Ncv. CERC RE Tariff Regs 2017 Reg 41: 3,100 kCal/kg. Was 14.5 = paddy straw Dry Gcv, a units-basis error
    # Operational emissions: biomass CHP is ~near-zero CO2 if rice straw is
    # otherwise burned in the field (avoided emissions). Use 0.05 kg/kWh
    # to reflect transport + processing fuel.
    # restated per NET kWh (0.05 / 0.90 aux). Transport and
    # processing fuel scales with TONNES OF STRAW, not with net kWh, so the
    # same total emissions must now be carried by 10% fewer kWh. Without
    # this the parasitic correction would have silently LOWERED town CO2.
    operational_emission_kgco2_per_kwh: 0.0556
    # REV-5: capacity cap lifted from the dispatch.py literal.
    # 5 MW plant class = the straw-fired unit size the FX-6 catchment can
    # comfortably fuel (35 GWh/yr need vs ~141 GWh_e straw budget below) and
    # the size class of Punjab canal-side/industrial straw CHP references
    # (register N7 sizing decision, resource-bounded).
    # STAGE-: 5000 -> 15000 kW_e at the 250k town scale.
    # Still Inside the Unchanged 130 kt straw budget - the fuel cap binds,
    # not the unit size.
    # (Peda Table-I Correction -.gov.in and
    # supplied the page; the site has a broken TLS chain so agents could not
    # fetch it). Three Claims Above Were Wrong And Are Corrected Here.
    #   (a) "Jalkheri 14.5 MW" is WRONG. PEDA Table-I lists the Jalkheri
    #       project at 10.00 MW (row 11, "M/s. Sukhbir Agro Energy Limited
    #       (PSPCL Jalkheri Project)", Fatehgarh Sahib, 100,000 t straw/yr).
    #       The 14.50 MW plant is M/s. Universal Biomass Energy Pvt. Ltd.,
    #       Village Channu, Malout, Mukatsar (row 3, 170,000 t/yr).
    #   (b) "15 MW = top of the deployed Punjab straw-power class" is WRONG.
    #       The largest deployed units are TWO Sukhbir Agro Energy Limited
    #       plants at 18.00 MW each (rows 9-10: Sedda Singh Wala/Faridkot and
    #       Hukumat Singh Wala/Ferozepur, 220,000 t/yr each). The modelled
    #       15 MW sits INSIDE the deployed range (1.00-18.00 MW), which is
    #       the defensible claim; it is not the top of it.
    #   (c) The old sanity check used 7,500 h while the parameter below is
    #       7,000 h. At 7,000 h the 15 MW unit produces 105.0 GWh_e/yr.
    # PEDA fleet, https://www.peda.gov.in/biomass-power-projects :
    # 11 commissioned paddy-straw projects, 101.5 MW total, 11.70 lakh t
    # straw/yr. NOTE the page contradicts itself elsewhere (97.50 MW /
    # 8.8 lakh t in a later paragraph) - cite the RANGE, not one figure.
    # OWNERSHIP (answers "who builds these?"): TEN of the eleven deployed
    # plants are PRIVATE limited companies (Malwa Power, Dee Development
    # Engineers, Universal Biomass Energy, Green Planet Energy x3, Viaton
    # Energy, Sampuran Agri Venture, Sukhbir Agro Energy x2). The eleventh,
    # Jalkheri, is the former PSPCL state plant now run by Sukhbir Agro
    # Energy. Punjab straw power is therefore an essentially PRIVATE IPP
    # class selling to PSPCL under a PSERC-determined tariff - which is
    # exactly the capital structure CERC's WACC describes (70:30 debt:equity,
    # RoE 14%), so the `utility` actor tier is the right rate for this
    # technology despite the tier's name. See the `discount_rates` block.
    # Straw-Intensity Reality Check (Declared Optimism - read before
    # quoting biomass output). Measured against the same PEDA table, this
    # model is materially more efficient than the deployed fleet:
    #   deployed fleet : 11,527 t straw per MW per year (1,170,000 t / 101.5 MW)
    #   this model     :  6,437 t straw per MW per year (96,552 t / 15 MW)
    #   deployed fleet :   ~608 kWh per tonne of straw (at CERC's 80% PLF norm)
    #   this model     :  1,088 kWh per tonne of straw
    # The model is therefore ~1.79x more optimistic per tonne than the
    # deployed Punjab fleet. The two parameters responsible are
    # `fuel_calorific_value_mj_per_kg: 14.5` (CERC normative is 3,100 kCal/kg
    # = 12.97 MJ/kg as-fired) and `electrical_efficiency: 0.27` (CERC
    # normative station heat rate 4,200 kCal/kWh = 20.5% gross). BOTH are
    # defensible for a NEW best-in-class high-pressure 2030 unit and
    # INDEFENSIBLE if left undeclared - the deployed fleet is older,
    # lower-pressure and runs below design PLF. This model represents a new
    # plant, not the existing fleet. State this in the limitations chapter
    # and carry the CERC-normative case as a sensitivity.
    # IMPORTANT: the straw budget is the surrounding DISTRICT'S field supply
    # (20 km catchment) and does NOT scale with town population - biomass's
    # SHARE of demand therefore FALLS at 250k (honest scarcity; Stage-
    # finding candidate).
    capacity_cap_kw_e: 13500        # Net Sent-Out = 15,000 kW gross x 0.90 (CERC 2020 Reg 33 aux). Plant is still physically 15 MW gross - see the block above
    # -----------------------------------------------------------------
    # FX-6 / N7+: paddy-straw fuel-supply realism.
    # Data Flag Resolved district straw data Arrived
    # (../DATA/zirakpur_straw_and_tracking_pv.md, Perplexity research).
    # Pau/Isadp 2019-20 district Surplus residue (, Statistical
    # Abstract-based, https://www.isadp.in/publication/download-pdf/228):
    # SAS Nagar 178 kt + Patiala 803 + Rupnagar 288 + Fatehgarh Sahib 349
    # kt/yr; paddy CRR 1.20 straw / 0.16 husk (Chauhan 2012 via PAU).
    # After CAQM 2023-25 ex-situ competition (CBG/boilers/power ~4.67 Mt/yr
    # state target CAQM plan), the realistic contractable straw in
    # a 20 km Zirakpur catchment is ~130-250 kt/yr - so the 130 kt cap
    # below is VALIDATED and CONSERVATIVE (kept unchanged; Tier upgraded
    # from 2-3 derived to 1-3 sourced). Delivered price triangulates to
    # Rs 1,500-2,500/t (CAQM common rate Rs 2,500/t; farm-gate baling
    # Rs 900-1,200/t + 20 km haul + handling) - matches the Rs 2,000 base
    # + monthly storage multipliers; DM loss 5-10% good-practice matches
    # the availability profile. Harvest window mid-Oct to mid-Nov confirmed.
    # -----------------------------------------------------------------
    # Annual straw-energy budget (N7): district collection catchment
    # ~20 km radius (baled-straw transport viability 15-30 km, TERI/CII
    # biomass supply-chain studies): pi x 20^2 = 1,257 km2
    # x ~0.83 net-sown fraction (Statistical Abstract of Punjab)
    # x ~0.60 paddy share of kharif in the SAS Nagar/Patiala belt (PAU
    # district crop statistics) = ~62,600 ha paddy
    # x ~5.7 t/ha straw yield (PAU residue-assessment norm)
    # = ~357 kt/yr gross; x ~0.36 surplus available for energy after
    # fodder, in-situ incorporation and the existing CBG/biomass plant
    # pipeline competing in the same catchment (TIFAC/PAU surplus
    # assessments ~45-55% state-wide, discounted for local competition;
    # derived) = ~130 kt/yr.
    # At 14.5 MJ/kg x 27% electrical efficiency this is ~141 GWh_e/yr -
    # NON-BINDING for the current 5 MW fleet (35 GWh/yr at 7,000 h), so it
    # documents the resource budget and caps any future fleet expansion.
    annual_straw_available_tonnes: 130000
    # Monthly availability ceiling fraction of nameplate energy per
    # month): kharif harvest delivers fresh straw Oct-Nov; baled stock is
    # drawn down through the year; the pre-harvest inventory trough plus
    # monsoon wet-straw handling derates plants in Jul-Sep (Punjab straw
    # plants report monsoon PLF dips ~15-20%; PPCB/industry reporting,
    # derived). Months at 1.00 are omitted from the LP (per-slice
    # capacity already binds there).
    fuel_monthly_availability_fraction:
      jan: 1.00
      feb: 1.00
      mar: 1.00
      apr: 1.00
      may: 1.00
      jun: 0.95
      jul: 0.85
      aug: 0.80
      sep: 0.80
      oct: 1.00
      nov: 1.00
      dec: 1.00
    # Monthly fuel-cost multiplier on the harvest-window base price above:
    # covered storage + handling + dry-matter loss accumulate toward the
    # pre-harvest peak; +25% in Sep = +Rs 500/t on the Rs 2,000 base,
    # inside the Rs 400-600/t storage-cost band for 6-9 month straw
    # storage (CII/TERI straw supply-chain studies derived).
    fuel_monthly_cost_multiplier:
      jan: 1.05
      feb: 1.07
      mar: 1.10
      apr: 1.12
      may: 1.15
      jun: 1.17
      jul: 1.20
      aug: 1.22
      sep: 1.25
      oct: 1.00
      nov: 1.00
      dec: 1.02
    # Trj-4 (trajectory batch,): straw Price Competition path.
    # Real (2030-INR) multiplier on the Rs 2,000/t harvest-window base price
    # per representative period - CBG plants, industrial boilers and biomass
    # power compete for the same catchment straw and tighten supply:
    #   - CAQM Punjab Action Plan: ex-situ straw use grew 0.88 Mt (2022) ->
    #     projected 4.1 Mt (2025) in industrial boilers alone; CBG pipeline
    #     (46 plants) adds ~2.80 Mt/yr when fully commissioned; total
    #     ex-situ target ~4.67 Mt/yr vs a state surplus-rice-residue pool of
    #     ~4.31 Mt/yr (Pau/Isadp 2019-20) - i.e. the Entire surplus becomes
    #     contested within the horizon. (official CAQM/PIB):
    #     *** Primary Obtained And Read IN Full,.
    #     "Comprehensive Plan for Prevention and Control of Stubble Burning in
    #     the State of Punjab (2026-27)", Government of Punjab, 86 pp - the plan
    #     submitted to CAQM (section 1.5 "Directions of CAQM"; reporting formats
    #     "as per proforma prescribed by Caqm"). Three Checks, All Verbatim: ***
    #       "Industrial boilers paddy straw consumption grew significantly from
    #        8.8 lakh tonnes in 2022 to a projected 41 lakh tonnes in 2025"
    #          -> 0.88 -> 4.1 Mt CONFIRMED, both endpoints
    #       "Remaining 46 CBG projects (including CBG projects allocated to
    #        Gail, Hpcl, Bpcl)... shall consume about 2.80-million-ton paddy
    #        straw annually"
    #          -> 46 and 2.80 Mt/yr CONFIRMED
    #       "Paddy cultivation, covering approximately 31 lakh hectares, results
    #        in the generation of about 19.5 million tonnes of paddy straw each
    #        year"
    #          -> consistent with the ~20 Mt in the PIB release below
    #     *** "Satat" Removed From The Line Above: it returns Zero hits in the
    #     document. The projects are allocated by Peda to Gail, Hpcl, Bpcl and
    #     others. SATAT is a real MoPNG scheme and these plants may well sit
    #     under it, but this document does not say so. ***
    #     THE ARGUMENT. *** The 2026-27 edition prints the full utilisation
    #     table, Mt/yr:
    #                                        2025 actual   2026 target
    #         in-situ management                  11.40         10.53
    #         EX-SITU, TOTAL                       7.06          7.80
    #           industrial boilers                 4.10          4.50
    #           biomass power plants               1.17          1.17
    #           compressed bio-gas                 0.50          0.33
    #           bio-ethanol                        0.20          0.10
    #           thermal power plants               0.87          1.20
    #           brick kilns                        0.22          0.50
    #         fodder                               0.86          1.13
    #         TOTAL                               19.32         19.46
    #     Ex-situ is already 7.06 Mt, not the 4.67 Mt "target" cited above. The
    #     contest is not approaching; it has arrived and overshot. Restate the
    #     claim against this table, not against the PAU/ISADP 2019-20 pool.
    #     The Sharpest Line IN IT: biomass power is Flat at 1.17 Mt across both
    #     years while industrial boilers go 4.10 -> 4.50. Boilers already burn
    #     3.5x what every biomass power plant in Punjab burns, and boilers are
    #     the ones growing. Any thesis proposing another straw-fired generator
    #     has to answer that.
    #     What IT Lets This Model Say About Its Own Draw. Against
    #     `annual_straw_available_tonnes: 130000` below (a 20 km catchment cap):
    #         0.67%  of Punjab paddy straw generated  (19.5 Mt)
    #         1.84%  of straw already used ex-situ    (7.06 Mt)
    #        11.1%   of all Punjab biomass power      (1.17 Mt)
    #     Under 1% of what the state grows, sourced to the state government
    #     rather than derived. That is the answer to "is there enough straw?".
    #     https://caqm.nic.in/WriteReadData/LINKS/Punjab%20State%20action%20plan%20(1)e4a64b10-7638-490f-9ae8-8c09ce27082f.pdf
    #     https://www.pib.gov.in/pressreleasepage.aspx?prid=1960891&reg=48&lang=2
    #     *** Url Form. The PressReleseDetailm.aspx?Prid=
    #     form returns an empty 171-character page to automated fetches; the
    #     lowercase pressreleasepage.aspx?prid=...&reg=48&lang=2 form returns
    #     the full release. Same discovery as the 24 C setpoint release - this
    #     is a Pib Url-Form problem, not a missing document, and the fix
    #     generalises to every PIB citation in this repo. ***
    #     What IT Actually Says, having opened it: Punjab's State Action Plan
    #     to CAQM for stubble burning, verbatim - "About 20 Million Tonnes (MT)
    #     of paddy straw is estimated to be generated in Punjab during 2023
    #     including 3.3 MT of Basmati straw", plus "Punjab currently has
    #     1,17,672 CRM Machines". That 20 MT GENERATED is consistent with the
    #     ~4.31 Mt Surplus pool cited above from Pau/Isadp - generation and
    #     surplus are different quantities, most straw being incorporated,
    #     used as fodder or already burnt.
    #     Not IN This Release: the "4.1 Mt (2025) in industrial boilers"
    #     figure. Zero hits for "4.1" and "boiler". That figure belongs to the
    #     CAQM State Action Plan cited on the line above, which has not been
    #     opened - it is the remaining gap in this block.
    #   - The "common determined rate" for paddy straw is Rs 2,500/t.
    #     *** Attribution. This IS Haryana'S State Rate,
    #     Not A GoI Rate, And This Model IS Punjab. *** The release was opened
    #     and parsed; Rs 2,500/MT is in it verbatim ("declaring common
    #     determined Rate of Paddy Straw @ Rs 2500/ MT") but the sentence
    #     subject is "The Minister of Government of HARYANA informed the
    #     incentives being provided by the State" at an inter-ministerial
    #     meeting. The block previously called it "The GoI... rate", which
    #     the source does not support.
    #     Kept AS The Value, but now Declared as a cross-state
    #     substitution: Punjab publishes no equivalent determined rate that
    #     this audit could find, and the two states share one straw market and
    #     one harvest window, so Haryana's administered rate is the closest
    #     available anchor. Same class of declared substitution as the CEEW
    #     commute-distance stand-in already on record - the honesty is the
    #     point, not the precision.
    #     ( substitution from a figure, PIB PRID 2068477;
    #     CAQM's long-haul landed benchmark (Rajasthan boilers) is Rs 6,000/t.)
    # Path (, derived from the anchors above, all real terms):
    #   2030 1.00 (= Rs 2,000/t contracted local base, today's delivered band
    #   Rs 1,500-2,500/t); 2042 1.25 (= Rs 2,500/t - the common determined
    #   rate becomes the competitive floor as ex-situ demand saturates the
    #   surplus); 2055 1.50 (= Rs 3,000/t - continued tightening toward, but
    #   still FAR below, the Rs 6,000/t long-haul landed ceiling, since a
    #   20 km contracted catchment retains a transport-cost advantage).
    # Consumed by Economics.biomass_fuel_price_period_multiplier(year) in the
    # multi-period LP; stacks MULTIPLICATIVELY with the monthly storage
    # multiplier above. 2030 = 1.0 keeps the single-period path byte-exact.
    fuel_price_multiplier_by_period:
      2030: 1.00
      2042: 1.25
      2055: 1.50

  tracked_pv:
    # Single-axis tracking add-on for SOLAR_FARM cells.
    # VALIDATION (../DATA/zirakpur_straw_and_tracking_pv.md):
    # yield gain evidence band 15-23% for lat 15-35 (NREL/IRENA-referenced
    # + India project analyses) -> our 1.18 sits mid-band.
    # FX-14 APPLIED (trajectory batch,): capex premium re-sourced
    # 1.25 -> 1.12. Evidence (same file, section 2.2): single-axis trackers
    # add Rs 30-60 lakh/MW vs fixed-tilt structures = 6-15% of the
    # Rs 4.0-4.8 crore/MW EPC (taypro.in EPC breakdown 2024-26;
    # derived %; URL:
    # https://taypro.in/blog/solar-panel-installation-cost-for-utility-scale-in-india).
    # 1.12 sits mid-band; the old 1.25 was conservative-HIGH against
    # tracking, yet the LP already picked 100% tracked - so this
    # re-source strengthens rather than flipping any decision.
    # O&M premium 10-30% and 5-10% LCOE advantage from the same file are
    # consistent with this block.
    capex_multiplier_vs_fixed: 1.12
    yield_multiplier_vs_fixed: 1.18
    # RATIO vs fixed-tilt. Single-axis trackers need wider row pitch to
    # limit inter-row shading during rotation: ground-coverage-ratio (GCR)
    # practice is ~0.33-0.35 for SAT vs ~0.45 for fixed-tilt at Punjab
    # latitudes -> area per kWp ratio ~0.45/0.34 = 1.32. Sources: NREL
    # "Land-Use Requirements for Solar Power Plants" (Ong et al. 2013,
    #, https://www.nrel.gov/docs/fy13osti/56290.pdf packing-factor
    # tables).
    # *** Verified Against The Primary, And The Model IS ON The
    # CONSERVATIVE SIDE. *** The report was obtained and parsed. Section 4.2.1
    # verbatim: "Fixed-tilt systems have a capacity-weighted average packing
    # factor of 47%, followed by 1-axis systems with 34% and 2-axis systems
    # with 25%."
    #   tracking 0.34 -> EXACT match to NREL's measured 1-axis figure
    #   fixed    0.45 -> NREL measures 0.47, so this block is 2 pp LOW
    # Land ratio on NREL's own numbers is 0.47/0.34 = 1.382; adopted
    # 1.33. The Direction Matters For The Decision: a Higher ratio
    # penalises tracking MORE, so using 1.33 rather than 1.382 under-charges
    # tracking for land. The LP still chose 100% fixed-tilt at 1.33, and it
    # would choose it by a wider margin at 1.382 - so the "price of honesty"
    # result is robust, and if anything understated.
    # Honest Transfer Caveat: NREL's packing factors are US projects across a
    # range of latitudes, capacity-weighted. The report gives no India- or
    # Punjab-specific figure, so applying them "at Punjab latitudes" is a
    # declared transfer. The exact agreement on the 1-axis value is
    # what makes it credible, not the label.
    # *** Lbnl "Utility-Scale Solar" Withdrawn AS A Source Here. *** It was
    # cited for "empirical GCR/land data". The edition obtained (U.S.
    # Utility-Scale Solar 2025 Data Update, 84 pp) was parsed and contains
    # ZERO occurrences of "GCR", "packing", "ground cover", "land use" or
    # "acres/MW" - it is the abbreviated cost-and-performance update, not the
    # land-use report. NREL alone carries the numbers, so nothing is lost.
    # India EPC practice ~4.5-5
    # acre/MW tracked vs ~3.5-4 fixed. Ratio itself =
    # derived. Consumed by BOTH Pyomo builders: 1 kWp of tracked consumes
    # `land_ratio` kWp-equivalents of the area-derived farm ceiling
    # (fixed + 1.33 x tracked <= area cap). Pre- the two modes shared
    # one density (demand_norms ground_mount_kwp_per_m2 0.10), so tracked
    # (+18% yield / +12% capex) strictly dominated - "100% tracked"
    # was partly an artifact. Absent key = 1.0 = legacy behaviour.
    # Known Remaining Bias FP-3): the flat 1.18 under-credits
    # tracking's SHAPE value (broader morning/evening output); hourly
    # tracked curves are a post-freeze A/B.
    land_ratio_vs_fixed: 1.33
    opex_fraction_of_capex_per_year: 0.012   # slightly higher than fixed-tilt (motors)
    lifetime_years: 25
    operational_emission_kgco2_per_kwh: 0.0

  # --- Stage C round 2 additions ---

  wte_plant:
    # REV-5: the design population feeding the MSW->capacity
    # cap derivation, lifted from the dispatch.py call-site literal. Matches
    # config/district_composition.yaml site.total_population.
    # STAGE-: 100000 -> 250000 with the town-scale decision
    # (register 0e); the WTE cap re-derives from the Same per-capita Msw
    # chain (0.5 kg/cap/day x 333 kWh/t) -> ~2.0 MW_e (was ~0.81 MW).
    design_population: 250000
    # Waste-to-energy from district MSW. World Bank India MSW 0.45-0.57
    # kg/cap/day (we use 0.5). CV/efficiency RECALIBRATED to
    # Indian as-fired reality: Indian MSW is wet, high-organic, high-inert,
    # so net power yield is ~165-330 kWh/tonne (India 2000 t/d -> 16 MW =
    # ~164 kWh/t; Cpcb/Teri as-fired net Lcv ~4-6 MJ/kg), Not the ~489
    # kWh/tonne that 8.0 MJ/kg x 0.22 implied (global-incinerator level).
    # Set CV 8.0 -> 6.0 MJ/kg (moisture-adjusted) + eta 0.22 -> 0.20
    # => ~333 kWh/tonne => WTE cap ~0.81 MW for 100k pop (was 1.19 MW)..
    capex_inr_per_kw_e: 180000      # ~Rs 180 lakh / MW (higher than biomass; flue gas + auxiliary)
    opex_fraction_of_capex_per_year: 0.06
    lifetime_years: 20
    electrical_efficiency: 0.20
    operating_hours_per_year: 7500   # high — continuous MSW feed
    fuel_cost_inr_per_tonne: 0       # tipping fee or zero; landfill diversion subsidy assumed
    fuel_calorific_value_mj_per_kg: 6.0
    msw_kg_per_cap_per_day: 0.5
    # WTE has higher operational emissions (combustion of mixed waste) but
    # displaces methane emissions from landfill — net climate benefit varies.
    operational_emission_kgco2_per_kwh: 0.20
    # Stage C round 3 caveat-2 fix: WTE plants in India legitimately
    # receive a landfill-diversion credit (~Rs 2-4/kWh) because they
    # prevent methane emissions from landfill decomposition (25x CO2).
    # Subtracted from WTE marginal cost in dispatch.
    landfill_diversion_credit_inr_per_kwh: 3.0

  biogas_plant:
    # Anaerobic digestion of sewage + organic waste. Sewage ~140 L/cap/day
    # yields ~25-50 m^3 biogas / m^3 sewage; ~0.5 MWe realistic AT 100k POP.
    # REV-5: cap lifted from the dispatch.py literal; the value
    # IS the sewage-resource bound derived in the comment above.
    # STAGE-: 500 -> 1250 kW_e with the 250k town-scale
    # decision - sewage feedstock is per-capita, so the resource bound
    # scales linearly (x2.5). Same derivation chain, new population.
    # =====================================================================
    # (Parasitic / House Load, 10% of gross). Digester mixing and
    # heating, gas cleaning, gas compression and genset auxiliaries. Applied
    # by the SAME net-sent-out restatement used for biomass_chp above, for
    # the same reason: `capacity_cap_kw_e` feeds the islanded-resilience
    # expressions (dispatch.py:794, :1694, :3048) alongside biomass and WTE,
    # so derating only the energy injection would leave resilience quoting a
    # gross fleet. Restating the cap fixes every consumer at once.
    # Why 10% And Not CERC'S 12%. CERC RE Tariff Regs 2017 Reg 60 sets 12%
    # for biogas, but that norm is measured on a SUBSTRATE-FED plant (3 kg
    # substrate/kWh) whose solids-handling load does not exist at a sewage
    # STP. 10% is MPERC 2021, a real Indian regulator precedent carried in
    # CERC's own Table 44. Sensitivity triple 0.08 / 0.10 / 0.12.
    # Boundary Warning - Read Before Anyone Raises This Number. The sewage
    # works' OWN aeration, pumping and sludge handling are ALREADY counted
    # on the DEMAND side: demand_norms.yaml:600
    # `water_treatment_kwh_per_capita_per_year: 25.9`, whose derivation
    # comment states the split verbatim ("residual 25.00 - 5.24 = 19.76
    # kWh/cap/yr for Treatment + Distribution Pumping + Sewage"). The 10%
    # here is ONLY the digester-plus-genset island, net of whatever STP load
    # already sits in demand. Scoping it as "the sewage plant's own
    # electricity" would double-count at 250k population. This is why the
    # figure is held at the bottom of the band, not the top.
    # Restatement (total spend Rs 1.375e8 UNCHANGED):
    #   capacity_cap_kw_e   1,250 gross -> 1,125 net    (x 0.90)
    #   capex_inr_per_kw_e  110,000/gross kW -> 122,222/net kW
    #   fuel_cost_inr_per_kwh 0.5 -> 0.5556 (charged per kWh_e, so per NET kWh)
    #   op. emissions       0.02 -> 0.0222 (/ 0.90)
    #   embodied (L2061)    1,200 -> 1,333.33 kgCO2/kW (/ 0.90)
    # Net generation 1,125 kW x 7,800 h = 8.775 GWh_e/yr (was 9.750).
    # =====================================================================
    capacity_cap_kw_e: 1125          # Net Sent-Out = 1,250 kW gross x 0.90 aux
    capex_inr_per_kw_e: 122222       # per NET kW-e; total spend Rs 1.375e8 UNCHANGED
    opex_fraction_of_capex_per_year: 0.045
    lifetime_years: 20
    # INFORMATIONAL ONLY - read by NO code (verified; biogas
    # generation is nameplate x hours, not fuel-limited). Annotated per the
    # precedent so an unread efficiency sitting next to a live
    # auxiliary restatement cannot manufacture a future double-count.
    electrical_efficiency: 0.288     # = 0.32 GROSS x 0.90 aux. INERT.
    operating_hours_per_year: 7800   # very steady feed
    fuel_cost_inr_per_kwh: 0.5556    # per NET kWh_e (= 0.5 / 0.90); net of feedstock handling (low)
    operational_emission_kgco2_per_kwh: 0.0222  # biogenic — near zero; per NET kWh (= 0.02 / 0.90)

  thermal_cold_storage:
    # Chilled-water tank thermal-energy storage for cooling load shifting.
    # Cheap per kWh_thermal but cooling-specific (cannot serve base load).
    # Stage C round 2 wires this as a generic-battery-like additional storage
    # with lower CAPEX; future Stage D will couple it to cooling-load slices only.
    capex_inr_per_kwh_thermal: 4000  # ~₹4k/kWh thermal vs ₹11k/kWh Li-ion
    opex_fraction_of_capex_per_year: 0.015
    lifetime_years: 25
    round_trip_efficiency: 0.80     # chiller COP + tank losses
    operational_emission_kgco2_per_kwh: 0.0
    # FX-1/: chilled-water TES discharges over a 4-6 h cooling
    # peak => ~0.2C (ASHRAE TES design guide typical derived).
    c_rate_per_hour: 0.2
    # targeting refinement (supervisor): TES is only economically
    # viable for buildings with CENTRAL cooling (chiller + chilled-water
    # distribution). Residential split AC + small shops cannot couple to a
    # chilled-water tank without a major HVAC redesign, AND have a
    # fragmented-ownership problem (developer pays for tank, tenants get
    # the savings). Restrict TES deployment to the categories below;
    # potential capped at floor_area * kwh_per_m2 over eligible cells.
    eligible_categories:
      - shopping_centre
      - office
      - hotel_guesthouse
      - healthcare
      - school
      - warehouse_cold_storage
      - retail_highstreet      # marginal - included for malls-as-anchors
      - public_services        # gov / civic with central HVAC
    # Realistic chilled-water tank sizing for India:
    #   ~0.05 kWh_th / m^2 floor for an office, capturing the daytime
    #   cooling load that can be deferred to overnight chiller operation.
    #   For warehouse_cold_storage the value is higher (real cold-chain
    #   demand), but we use the conservative average across all eligible.
    kwh_per_m2_floor_area: 0.05

  # =====================================================================
  # Solar Water Heating (solar thermal),. Flag-Gated, Off.
  # geysers / electric heating, this is perfect for a place like India."
  # He is right, and the model has never had it: every technology in this
  # district produces or stores ELECTRICITY, while water heating is served
  # 100% resistively.
  # *** This Block Was Rewritten After A Pre-Build Verification Found Eight
  # Errors IN Its First Draft. *** The full list is in the header of
  # scripts/patch_solar_thermal_config_20260817.py. The two that mattered
  # most: MNRE Table 8's ambient and inlet columns were read in the wrong
  # order (8.3% too little energy per litre), and a Clear-Day December
  # design figure was multiplied by 280 sunny days as though it were an
  # annual average. A flat number stood where a seasonal derivation belonged.
  # Nothing Reads This Block Yet. Byte-exactness is unaffected.
  # =====================================================================
  solar_thermal:
    # *** SWITCHED ON,. ***
    #: the LP builds 63,226 m2 (12.9% of eligible roof), serves 78.8% of
    # district water heating, saves Rs 23.5 M/yr and 9,729 t CO2/yr, and takes
    # 44% of rooftop PV off the roof because that PV was exporting surplus at
    # Rs 3.00/kWh while the collector displaces imports at Rs 5.92/kWh.
    # Verified before switching: physics audit all-pass with three independent
    # measurement validations, 23/23 tests, and a structural proof that the
    # OFF path is component-for-component identical to the previous model.
    # applied but their chain never ran.
    enabled: true                  # scenario flag `allow_solar_thermal`

    # ---- Technology Choice, And IT IS The Biggest Cost Lever ----------
    # MNRE's handbook is blunt and it decides this:
    #   "the recommended service life of flat plate tube collector is 15
    #    years while that of all glass evacuated tube collector is 5 years"
    # Over a 25-year horizon that is 1.67 replacements against 5. ETC is
    # cheaper per m2 and dominates Indian retail, which makes the naive
    # choice the expensive one. FPC is modelled; ETC is the sensitivity.
    #, MNRE "User's Handbook on Solar Water Heaters" (2010), 36 pp,
    collector_type: flat_plate
    lifetime_years: 15
    lifetime_years_etc_sensitivity: 5

    # ---- COLLECTOR PLANE ----------------------------------------------
    # MNRE Table 8 gives Chandigarh a 46 degree collector inclination at
    # latitude 30.73 - i.e. latitude + 15, the WINTER optimum, because the
    # binding season for hot water is December. Every other solar number in
    # this model is at the Gsa report's Opta 29 deg, which is the Annual
    # optimum and therefore a PV objective. The two planes are NOT
    # interchangeable and the first draft of this block silently mixed them.
    collector_tilt_deg: 46
    pv_reference_tilt_deg: 29
    # What the steeper plane actually buys at this site, derived:
    #   jan +1.7%  dec +3.9%  nov +2.2%   summer -10 to -14%   annual -6.2%
    # The Winter Gain IS Much Smaller Than Latitude+15 Usually Implies, and
    # the reason is specific to Punjab: January here is FOG-DOMINATED, so a
    # large share of winter irradiance is DIFFUSE, and tilting up reduces the
    # sky view factor ((1+cos b)/2 falls 0.937 -> 0.847). The beam gain and
    # the diffuse loss very nearly cancel. Worth stating in the thesis: at a
    # foggy site, winter tilting buys far less than the textbook rule claims.

    # ---- Yield: Derived Per Month, Not Assumed Annual -----------------
    # Derivation: scripts/solar_thermal_yield_derivation.py ( on
    # data), same GSA hourly DNI and same transposition as the PV table.
    # VALIDATED TWICE before being trusted:
    #   CHECK A - reproduces this config's own 29 deg pv monthly_modifier to
    #             within 0.46% worst month, so the transposition is the one
    #             the PV table was built with.
    #   Check B - reproduces MNRE's Measured Chandigarh output on a clear
    #             December day to +3.9%, inside MNRE's stated +/-10%.
    # Physics included: IS 12933 efficiency curve, incidence angle modifier,
    # PM2.5/dust soiling, seasonal collector inlet, and a hard cutoff below
    # which the collector loses more than it gathers.
    monthly_kwh_per_m2_per_day:
      jan: 1.054   # fog trough - the worst month, and demand's best month
      feb: 2.055
      mar: 2.584
      apr: 2.724   # annual peak
      may: 2.421
      jun: 2.014
      jul: 1.591   # monsoon
      aug: 1.870
      sep: 2.330
      oct: 2.490
      nov: 1.834
      dec: 1.427
    annual_kwh_per_m2: 742
    # ---- Bucket Storage Hold Time, Calibrated -------------------------
    # The LP models the tank the same way it models the battery: a per-
    # (month, day-type) energy balance where what is drawn cannot exceed
    # what was collected, times one retention factor. That factor needs an
    # average hold time.
    # *** Deriving IT From The Draw Centroid Gives 10.8 h And IS 3.7%
    # OPTIMISTIC. *** Checked against the hour-by-hour tank in
    # scripts/solar_thermal_match_simulation.py, which carries a cyclic tank
    # state and loses heat continuously: its effective retention is 0.7755,
    # not the 0.8040 the centroid implies. The centroid undercounts because
    # heat arriving EARLY in the collection window waits longer than the
    # centroid suggests, and it is losing the whole time.
    # 12.5 h reproduces the simulation to within 0.0013. Using the
    # calibrated value rather than the tidy geometric one is the
    # conservative choice and keeps the LP honest against the fuller model.
    bucket_average_hold_hours: 12.5
    # ---- Per-Slice Collector Output -----------------------------------
    # kW of useful heat per m2 of aperture, averaged over each 2-hour
    # daypart. Same convention as pv_capacity_factor, so
    #   sum(value x daypart_hours x days_in_month) = annual_kwh_per_m2.
    # Derived by scripts/solar_thermal_yield_derivation.py from the GSA
    # hourly DNI transposed to 46 deg, through the IS 12933 curve with the
    # incidence angle modifier, seasonal collector inlet and soiling, each
    # hour clamped at the cutoff irradiance.
    # *** The Collector'S Day IS Shorter Than PV'S, And That IS Physics. ***
    # January shows zero at 06-08 and 16-18 while PV still generates in
    # those hours. The reason is the cutoff G* = a1 (Ti - Ta) / eta0 =
    # 194 W/m2 in January: a foggy Punjab morning never crosses it, so the
    # collector gathers less than it loses and a real system does not
    # circulate. A shape copied from PV would have quietly invented winter
    # morning hot water that does not exist.
    kw_per_m2_by_month_daypart:
      jan: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0000, "08_10": 0.0346, "10_12": 0.1775, "12_14": 0.2196, "14_16": 0.0953, "16_18": 0.0000, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      feb: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0000, "08_10": 0.1248, "10_12": 0.3370, "12_14": 0.3733, "14_16": 0.1926, "16_18": 0.0000, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      mar: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0000, "08_10": 0.1903, "10_12": 0.4099, "12_14": 0.4385, "14_16": 0.2441, "16_18": 0.0089, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      apr: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0105, "08_10": 0.2168, "10_12": 0.4232, "12_14": 0.4415, "14_16": 0.2515, "16_18": 0.0182, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      may: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0168, "08_10": 0.1945, "10_12": 0.3720, "12_14": 0.3848, "14_16": 0.2211, "16_18": 0.0213, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      jun: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0176, "08_10": 0.1595, "10_12": 0.3043, "12_14": 0.3181, "14_16": 0.1862, "16_18": 0.0212, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      jul: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0120, "08_10": 0.1213, "10_12": 0.2401, "12_14": 0.2571, "14_16": 0.1494, "16_18": 0.0154, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      aug: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0087, "08_10": 0.1448, "10_12": 0.2881, "12_14": 0.3063, "14_16": 0.1739, "16_18": 0.0135, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      sep: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0055, "08_10": 0.1861, "10_12": 0.3704, "12_14": 0.3821, "14_16": 0.2088, "16_18": 0.0123, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      oct: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0000, "08_10": 0.1984, "10_12": 0.4125, "12_14": 0.4188, "14_16": 0.2154, "16_18": 0.0000, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      nov: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0000, "08_10": 0.1273, "10_12": 0.3212, "12_14": 0.3263, "14_16": 0.1422, "16_18": 0.0000, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
      dec: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0000, "08_10": 0.0688, "10_12": 0.2559, "12_14": 0.2770, "14_16": 0.1119, "16_18": 0.0000, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
    # Reference cold inlet for sizing the usable tank store. MNRE Table 8
    # gives Chandigarh 12 C - and note this is the CORRECTED reading: the
    # first draft of this block took 16 C, which is the DAY AMBIENT column.
    reference_inlet_c: 12.0
    # Seasonality IS The Whole Problem: apr/jan = 2.58x, and hot water demand
    # runs the OTHER WAY. A flat annual figure hides this completely. The
    # first draft of this block declared 675 kWh/m2/yr flat and predicted, in
    # words, that "the realised solar fraction will come out materially below
    # what 2.41 kWh/m2/day implies". That prediction is now quantified rather
    # than asserted.
    # Cross-Check, same source: MNRE says a single-collector system saves
    # "1800 KWh at the maximum and 900 KWh at the minimum per year". At 2 m2
    # this derivation gives 1,483 kWh/yr - inside the band, upper half.
    m2_per_100_lpd: 2.0
    tank_litres_per_m2_collector: 50

    # ---- Collector Efficiency Curve -----------------------------------
    # eta = eta0 * K_ta(theta) - a1 * (Ti - Ta) / G     [IS 12933 Part 5]
    # Indian values, from Kadyan (2016) applying IS 12933 Part 5 acceptance
    # thresholds to a 2.33 m2 collector: FR(tau alpha)e > 0.65 and
    # FR.UL < 5.50 W/m2.K. These are ACCEPTANCE THRESHOLDS - the worst a
    # collector may be and still pass - not typical measured performance, so
    # using them is deliberately conservative. European Solar Keymark units
    # are better on BOTH counts and are retained as the optimistic arm.
    eta0: 0.67
    a1_w_per_m2_k: 5.5
    eta0_keymark_sensitivity: 0.73
    a1_keymark_sensitivity: 4.5
    # Incidence angle modifier, K_ta = 1 - b0 (1/cos theta - 1), faired to
    # zero beyond 60 deg. b0 = 0.10 is the standard single-glazed flat-plate
    # value (Duffie & Beckman; equivalently EN 12975 units reporting
    # K(50 deg) ~ 0.94, which inverts to b0 = 0.108).
    # *** The Iam Multiplies The Optical Term, Not G. *** Deflating the
    # irradiance instead would shrink the LOSS term too and overstate
    # cold-morning output. This was missing from the first draft entirely.
    iam_b0: 0.10
    iam_diffuse_effective_angle_deg: 58

    # ---- Collector Inlet Temperature, Derived Not Declared ------------
    # *** The First Draft Put 45 C Here AS A "mid-charge" Guess And IT Was
    # The Single Most Sensitive Number IN The Model. *** +/-5 K moves the
    # December yield by about 9%. A guess was standing where an energy
    # balance belonged.
    # MNRE's own test starts the tank at the cold inlet and ends at the
    # setpoint, so the collector sees a mean inlet of (inlet + setpoint)/2.
    # For their Chandigarh row that is (12+60)/2 = 36 C, and at 36 C this
    # model reproduces their measured 94 litres/day to +3.9%. At the old
    # 45 C it missed by -11.2%, outside their tolerance.
    # So the inlet is now a DERIVED, SEASONAL quantity, which is also
    # physically right: a winter tank runs colder because the water going
    # into it is colder. That RAISES winter efficiency and lowers summer,
    # partly self-correcting the seasonality instead of assuming it away.
    collector_inlet_rule: mean_of_inlet_and_setpoint
    # (inlet(month) is heating_loads.dhw.inlet_temperature_field = t_mean_c,
    #  setpoint is heating_loads.dhw.setpoint_c = 60.0)
    # CUTOFF IRRADIANCE. Below G* = a1 (Ti - Ta) / eta0 the collector loses
    # more than it gathers and a real system stops circulating. At this site
    # that is 194 W/m2 in January and 114 in June - which is the single
    # biggest reason winter output collapses, because a foggy Punjab morning
    # never crosses it. The yield derivation clamps at zero per hour.
    # *** DO Not Evaluate The Curve AT A Fixed 60 C Tank Temperature. *** A
    # first pass did exactly that, at 400 W/m2, and produced "January
    # efficiency = 0.02", i.e. the collector does not work at all in winter.

    # ---- SOILING ------------------------------------------------------
    # The collector takes the RAW A19 PM2.5/dust multiplier. Note this is the
    # raw one, NOT the renormalised `pv_soiling_yield_multiplier_for_month`:
    # that renormalisation exists because the PV anchor is GSA
    # PVOUT_specific, a simulated SYSTEM output already derated 3.5% for
    # soiling. The solar-thermal level is
    # anchored to Gsa Gti, which is Irradiance and carries no such derate,
    # so the raw multiplier is correct here. Ranges 0.937 (jan) to 1.000
    # (monsoon, rain-washed).
    apply_soiling: true

    # ---- Row Spacing: A Declared Bias IN This Technology'S Favour -----
    # MNRE: "In an assembly of collector banks, installation should be done
    # in such a way that the shadow on one collector bank does not fall on
    # the other", with a design target of "a shadow free area at least for
    # 3 to 4 hours on either side of the noon".
    # At this latitude on the winter solstice, 3 h from noon, that implies a
    # ground coverage of 0.558 at 29 deg and 0.486 at 46 deg - the steeper
    # collector loses 12.8% MORE roof to self-shading than a PV panel would.
    # NEITHER technology applies row spacing in this model: rooftop PV is
    # flush at kWp = roof_area x acceptance x 0.1930 ("1 kWp = 1/eta m2 of
    # module"), and its own comment confirms row spacing lives in
    # ground_mount_kwp_per_m2 instead. The collector is modelled on the SAME
    # 1:1 convention so the comparison is like for like.
    # *** But The Omission IS Not Symmetric And IT Changes A Conclusion. ***
    # On cost per useful kWh, solar thermal is 9.7% CHEAPER than subsidised
    # rooftop PV; charge it the 12.8% and it becomes 3.7% DEARER. So
    # "cheaper per kWh than PV" is NOT a robust claim and must not be the
    # argument. See the timing note below for the claim that is.
    row_spacing_gcr_at_collector_tilt: 0.486
    row_spacing_gcr_at_pv_tilt: 0.558
    apply_row_spacing_penalty: false     # sensitivity switch

    # ---- Why IT Wins, And IT IS Not The Reason First Given ------------
    # A kWh is not a kWh. This model's own import tariff by daypart:
    #   08-16, when PV generates      Rs 4.80/kWh
    #   06-08, morning shower         Rs 6.00/kWh
    #   18-20                         Rs 6.00-8.00/kWh
    #   20-22, evening peak           Rs 6.00-9.50/kWh
    #   export, if rooftops saturate  Rs 3.00/kWh
    # PV makes its energy in the CHEAPEST daylight band and dumps the surplus
    # at Rs 3.00. Hot water is drawn morning and evening, in the DEAREST
    # bands. Solar thermal collects at midday and carries the heat there in
    # an insulated tank. SO IT IS Not Really A Generator Competing With PV -
    # IT IS A Store, And IT Competes With The Battery:
    #   li-ion, 1 kWh/day into the evening peak   Rs 5.56 per kWh shifted
    #   the tank that ships with 1 m2 of collector Rs 0.86 per kWh shifted
    # i.e. hot water storage is ~6.5x cheaper per kWh shifted, at a
    # comparable round trip (85.1% over an 8 h hold vs the battery's 90%).
    # CAVEAT, and it is not small: a battery serves ANY load, a tank serves
    # only hot water. They are not substitutes in general. For THIS job they
    # are, and says this district builds no battery at all until 2042.

    # ---- CAPEX --------------------------------------------------------
    # Indian retail, installed, 2025-26 (, trade; several suppliers
    # agree within about 15%):
    #   100 Lpd  Fpc  Rs 24,000-32,000     Etc  Rs 17,000-25,000
    #   200 Lpd  Fpc  Rs 30,000-39,000     Etc  Rs 22,000-30,000
    #   300 Lpd  Fpc  Rs 55,000-70,000     Etc  Rs 38,000-50,000
    #   installation adds Rs 2,000-6,000
    # At 2 m2 per 100 LPD the FPC mid-point is ~Rs 14,000/m2 installed.
    capex_inr_per_m2: 14000
    capex_inr_per_m2_low: 12000
    capex_inr_per_m2_high: 17500
    tank_share_of_system_capex: 0.35     # used only by the storage comparison
    # *** DO Not Use The MNRE Benchmark AS A Current Price. *** MNRE's
    # published benchmark is Rs 3,000/m2 (ETC) and Rs 3,300/m2 (FPC), which
    # is roughly a QUARTER of observed retail. It is a subsidy-calculation
    # basis from an older price era and collector-only. Quoting it as capex
    # would understate the technology's cost four-fold.
    mnre_benchmark_inr_per_m2_fpc_historic: 3300

    # ---- The Geyser IT Replaces ---------------------------------------
    # A solar water heater is ONE appliance with an integral booster, not a
    # solar tank plus a separate geyser. MNRE's standard specification table,
    # item 09, is "Electrical back up - XX KW booster heater", and the FAQ:
    #   "All solar systems have back up heating devices for meeting these
    #    contingencies."
    # So the geyser capex IS avoided. MNRE: "The saving in terms of capital
    # cost for two geysers may be up to Rs. 10000 to 12000"..
    # An earlier draft of this block wrongly assumed two appliances and so
    # refused the credit;. The credit is real.
    avoided_geyser_capex_inr_per_system: 11000
    backup_element_kw: 2.0
    # What IS *Not* Avoided: the electricity. The booster still runs on
    # cloudy days and winter mornings. Capex saved, energy not. Keeping
    # these two straight is the single easiest way to overstate the case.

    # ---- OPEX ---------------------------------------------------------
    # Punjab groundwater is hard (CGWB 2025: stage of extraction 136.75%,
    # 63.64% of units over-exploited), so scaling in collectors and tanks is
    # a real maintenance cost rather than a rounding error. MNRE also notes
    # that "auxiliary heating elements... require replacement at times" and
    # that "some rubber or plastic components may not last beyond 10 years".
    # No Indian O&M study for domestic SWH was found. DECLARED.
    opex_fraction_of_capex_per_year: 0.02
    pump_parasitic_kwh_per_m2_per_year: 0.0
    # Zero, and sourced twice: MNRE specifies thermosiphon below 3,000 LPD,
    # and Ardente's system "does not need pumps and it does not cause power
    # energy consumption". Every system in this district is below that size.
    tank_standing_loss_frac_per_hour: 0.02
    # DECLARED. No published Indian BIS UA figure was found; 2%/h sits
    # inside the 1-3%/h band that EN 12976 / ISO 9459 practice and Duffie &
    # Beckman quote for small well-insulated domestic cylinders.

    # ---- EMBODIED CARBON ----------------------------------------------
    # 338.5 kgCO2/m2. Ardente et al. (2005), "Life cycle assessment of a
    # solar thermal collector", Renewable Energy 30(7) 1031-1054: Table 16
    # gives GWP 721 kg CO2-eq for the system, and section 2.1 gives the
    # functional unit as 2.13 m2 INCLUDING tank and support, thermosiphon,
    # no pump - the same architecture as an Indian domestic unit, so it
    # transfers without adjustment. 721 / 2.13 = 338.5.
    # An earlier DERIVED guess of 270 was 25% LOW; getting the paper moved
    # the number AGAINST the technology, which is why it was worth getting.
    # Table 13 also shows 88% of it is raw materials rather than
    # manufacturing energy, so the figure is robust to which grid built it.
    # Honest Caveat: Ardente's system is Italian. Indian manufacturing is
    # more coal-intensive, so 338.5 probably UNDERSTATES the burden. No
    # India scaling factor was invented.
    # MATERIALITY: 338.5 / (742 x 15) = 30.4 gCO2 per kWh delivered, against
    # a 510.6 g/kWh grid = 6.0%. A 50% error cannot change the sign.
    embodied_kgco2_per_m2: 338.5

    # ---- Who IS Required TO Have IT, And Who IS Not -------------------
    # Punjab mandates BIS-marked solar water heating in: residential
    # buildings on plots of 500 square yards and above within Municipal
    # Committee / Corporation and PUDA areas; hospitals and nursing homes;
    # government buildings, hostels, residential schools, colleges and
    # universities; tourism complexes; and industries needing process hot
    # water. PEDA is the approved supply channel. (State direction).
    # *** The Mandate Does Not Reach This District'S Housing. *** The
    # Stage- kothi is a 250 m2 plot (12,000 m2 floor / 40 kothis, net FAR
    # 1.2) = 299 square yards, about 40% under the 500 sq yd trigger. So the
    # mandate binds only on healthcare, public_services, school and
    # hotel_guesthouse here.
    # Consequence, And IT IS The Honest Framing: extending solar thermal to
    # all housing including EWS is a DESIGN
    # Choice That Goes Beyond The Statutory Minimum, not compliance. Say so.
    mandate_plot_threshold_sq_yd: 500
    mandated_categories:
      - healthcare
      - public_services
      - school
      - hotel_guesthouse

    # ---- SUBSIDY ASYMMETRY -------------------------------------------
    # *** The First Draft OF This Block Made A False Claim Here. *** It said
    # subsidies "are kept out of the engineering optimum everywhere else in
    # this config". They Are Not. `grid.rooftop_pv_capex_subsidy_fraction`
    # is 0.30 and LIVE in the production LP; its own comment reads "Effect
    # on current LP: reduces effective rooftop CAPEX by 30%".
    # So rooftop PV in this model is ALREADY subsidised and solar thermal
    # would not be. That asymmetry is a Fact About India IN 2026 rather than
    # a modelling artefact - PM Surya Ghar is live and large (up to
    # Rs 78,000/household) and MNRE's historical 30% solar-thermal capital
    # subsidy could NOT be confirmed as current - but it has to be declared,
    # not accidental.
    # PRACTICAL EFFECT: any solar-thermal build the LP chooses is chosen
    # against the SUBSIDISED PV price (Rs 2.085/kWh, not Rs 2.858), i.e.
    # against the harder target. That is the conservative direction.
    apply_subsidy_asymmetry: false   # true = also subsidise solar thermal 30%
    pv_pm_surya_ghar_cap_inr: 78000

    # ---- OWNERSHIP ----------------------------------------------------
    # Physically the same asset class as rooftop PV - roof-mounted, owned by
    # whoever owns the roof - so it reuses the SAME four owner classes and
    # the SAME actor discount rates, with weights recomputed for where hot
    # water is actually drawn. MNRE settles the apartment question directly:
    #   "A number of systems of smaller capacity were installed on the
    #    terrace of the multistory building... Each system is installed to
    #    meet the capacity requirement of apartments connected to a common
    #    pipe shaft."
    # So flats get a SHARED terrace system per riser (the RWA owns it),
    # kothis get their own. Precedent: Vikas Palm, Thane, 16,200 LPD
    # thermosiphon for 54 flats on a G+17 = 300 LPD per flat.
    # ---- Who Pays, Weighted BY Where The Hot Water Actually IS -------
    # Mirrors rooftop_owner_weights exactly: one blended cost of capital for
    # a technology with four different owners. Weights are the MEASURED
    # per-category share of district water heating
    # eligible categories and renormalised - 0.50% of the draw sits in
    # office / retail / religious buildings that are not eligible.
    # Blended real rate 8.9221%, against rooftop PV's ~8.82%. The two land
    # close together because it is the same roofs and the same owners, which
    # is a useful check that the ownership map was not invented.
    owner_weights:
      rwa_pooled: 0.4983            # mid-income flats, shared terrace system
      private_high_income: 0.4205   # kothis + hotels + restaurants
      social_ews: 0.0756            # EWS/LIG, government-financed
      social_planner: 0.0056        # schools, healthcare, public services
    owner_actors:
      low_income_residential: social_ews         # 6.0% - government-financed
      mid_income_residential: rwa_pooled         # 8.5% - shared terrace system
      high_income_residential: private_high_income  # 10.0% - one per kothi
      school: social_planner
      healthcare: social_planner
      public_services: social_planner
      hotel_guesthouse: private_high_income
      restaurant_food_service: private_high_income

    # (, from
    # much solar thermal on each rooftop"). HOW the roof competition is
    # written:
    #   false (legacy): PV_area(ALL categories) + ST <= ELIGIBLE roof
    #   true  (pair):   ST <= ELIGIBLE roof;  PV_area + ST <= TOTAL roof
    # The legacy form makes office/retail/warehouse PV (177,000 m2 of
    # non-eligible roof of their own) compete for hot-water roof it never
    # occupies. Measured on the pins it binds EXACTLY:
    # 428,628.5 m2 PV + 63,226.0 m2 ST = 491,854.5 m2 = the eligible roof
    # to the decimal - so this constraint, not economics, is what stops
    # rooftop PV at 64% of its cap. The pair conserves the TOTAL accepted
    # roof (668,854.5 m2) and reserves collectors to hot-water categories,
    # which is the physical truth at the aggregate level the LP works at
    # (per-cell siting is Stage D's job). Same shared-surface defect family
    roof_pair_constraint: true   # re-pin

    # ---- ELIGIBILITY --------------------------------------------------
    # Where hot water is actually drawn. NOTE the non-residential shares are
    # the largest in `heating_loads.dhw_share_of_peak_by_category`
    # (restaurant 0.80, hotel 0.75, healthcare 0.70), and those are exactly
    # the buildings the mandate compels. A residential-only implementation
    # would miss the strongest part of the case: a hotel draws hot water all
    # day, so its solar fraction beats a house that draws at 07:00 and 20:00.
    eligible_categories:
      - low_income_residential
      - mid_income_residential
      - high_income_residential
      - school
      - healthcare
      - public_services
      - hotel_guesthouse
      - restaurant_food_service

# ---------------------------------------------------------------------------
# Carbon-cost weighted objective (Stage C — promotes Stage B's diagnostic
# emissions reporting to a second objective for the Pareto sweep).
# The MILP / fallback minimises:
#   (1 - alpha) * annual_cost_inr   +   alpha * carbon_price_inr_per_kgco2 * annual_emissions_kgco2
# alpha ranges over [0, 1] in 5 points (0 = pure cost; 1 = pure carbon).
# `carbon_price_inr_per_kgco2` scales emissions into INR so the two terms
# are commensurate. India's CERC clean-energy levy proxy is ~₹2.5/kgCO2;
# higher values represent stronger climate policy.
# ---------------------------------------------------------------------------
carbon_objective:
  # 11-point sweep gives a smooth Pareto curve (matches UES Fig 3.1 style).
  # Convention: alpha = carbon weight in [0, 1]. alpha=0 -> pure cost min;
  # alpha=1 -> pure carbon min (model pays anything to zero emissions).
  # REGULARISED. The previous list was
  #   [0.0, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.65, 0.80, 0.92, 1.0]
  # whose spacing ran 0.05, 0.05, 0.10, 0.10, 0.10, 0.10, 0.15, 0.15, 0.12,
  # 0.08 - irregular, and 0.65 / 0.92 in particular had NO recorded
  # justification anywhere in the config, the register or FINDINGS. It looks
  # like points chased by hand. A viva question of the form "why 0.92?" had no
  # honest answer other than "no reason", so the ladder is now a plain 0.1
  # grid that needs no defending.
  # 0.6, 0.7 and 0.9 are the three points this change adds; 0.05, 0.65 and
  # 0.92 are dropped. The step in the frontier sits between 0.7 and 0.8 (the
  # battery build jumps forward from the 2042 vintage to 2030), so the regular
  # grid still brackets it - see scripts/alpha_step_probe.py.
  alphas: [0.0, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 1.0]
  # (A1 — thesis-methodology disclaimer,
  # audit): carbon_price 2.5 INR/kgCO2 is a Shadow Price modelling
  # construct, Not a published India 2030-2055 trajectory. CERC Ccc
  # Regulations 2026 (https://cercind.gov.in/regulations/205-Noti.pdf,
  #) define floor + forbearance prices CONCEPTUALLY but did
  # NOT publish a numeric band as of April 2026. Analyst commentary
  # suggests Rs 600-1500/tCO2e early-phase band ( only, no
  # peer-review). Sensitivity range: 0.6 / 1.2 / 2.5 / 5.0 INR/kgCO2.
  carbon_price_inr_per_kgco2: 2.5
  # When true, the dispatch counts embodied carbon (annualised) AND
  # operational emissions in the carbon objective. Stage G whole-life-carbon
  # for building materials remains separate.
  include_embodied_carbon: true

# ---------------------------------------------------------------------------
# Embodied carbon per tech (one-time at install; annualised over lifetime).
# *** This Blanket Source Line IS Itself A Risk Pattern. ***
# It read: "Sources: IEA Pvps Task 12, ecoinvent v3.9, Ucs Li-ion Lca,
# IRENA bioenergy" - four institutions attributed to a whole block of
# values, with no URL and no value-to-source mapping. That is exactly
# the shape that let `rooftop_pv_kgco2_per_kwp: 80` sit here for months
# while the measured figure was 810 - a reader saw four real bodies
# named and assumed the number beneath them had been checked.
# STATUS OF EACH, honestly:
#   IEA Pvps Task 12 - Linked. Lca methodology guidelines:
#     https://iea-pvps.org/wp-content/uploads/2020/07/IEA_Task12_LCA_Guidelines.pdf
#     Module-recycling LCA (the end-of-life question):
#     https://iea-pvps.org/wp-content/uploads/2020/01/Life_Cycle_Assesment_of_Current_Photovoltaic_Module_Recycling_by_Task_12.pdf
#   ecoinvent v3.9   - Not Linked, and it is a Paid database, so no
#     public document backs any specific number here. Treat every
#     value attributed to it as UNVERIFIED until read.
#   Ucs Li-ion Lca   - Not Linked. The battery 100 kgCO2/kWh was
#     separately cross-checked against a published 74-134 range and
#     sits inside it, so the VALUE is defensible even though this
#     attribution is not.
#   IRENA bioenergy  - Not Linked. The biomass/WTE/biogas embodied
#     figures below are Already declared Not Found after two sourcing
#     passes, so this line should not imply otherwise.
# The PV figures beneath now carry their own direct Fraunhofer link
# and do not rely on this header.
# Stage G adds building-material embodied (concrete / steel / brick).
# ---------------------------------------------------------------------------
embodied_carbon:
  # Caveat-12 fix: end-of-life decommissioning + recycling
  # adds ~10% on top of manufactured embodied carbon (PV panel disposal,
  # Li recovery, plant demolition). Applied as multiplier in
  # Economics.annualised_embodied_kgco2.
  end_of_life_carbon_fraction: 0.10
  # =====================================================================
  # *** PV Embodied Carbon Was Wrong BY ~10x.. ***
  # It read `rooftop_pv_kgco2_per_kwp: 80  # IEA PVPS Task 12 (~80 tCO2/MWp
  # manufactured)`. The units convert correctly (80 tCO2/MWp IS 80 kgCO2/kWp),
  # so the error is in the FIGURE, not the arithmetic.
  # Measured, verbatim, Fraunhofer Ise (Wcpec-8 conference paper, peer
  # reviewed, PDF parsed):
  #   "Glass-backsheet (glass-glass) modules produced in China, Germany or
  #    the EU are linked to 810 (750), 580 (520) and 480 (420) kg CO2-eq/kWp,
  #    respectively."
  #   Reichel et al., "CO2 Emissions OF Silicon Photovoltaic Modules -
  #   Impact OF Module Design And Production Location", Wcpec-8, 8th
  #   World Conference on Photovoltaic Energy Conversion, Milan,
  #   26-. LINKED (named-source sweep -
  #   Fraunhofer was named here and never linked, the same prose-only
  #   pattern that produced the Aeee / CGWB / Teri retractions; unlike
  #   those three this one RESOLVES and says exactly what is quoted):
  #   https://www.ise.fraunhofer.de/content/dam/ise/de/documents/publications/conference-paper/wcpec-8/Reichel_5DV234.pdf
  #   Fraunhofer ISE press summary of the same result:
  #   https://www.ise.fraunhofer.de/en/press-media/press-releases/2021/european-glass-glass-photovoltaic-modules-are-particularly-climate-friendly.html
  # Three Independent Cross-Checks, all agreeing the old 80 was far too low:
  #   Fraunhofer, Chinese modules (what India installs)   810 kgCO2/kWp
  #   Best-in-class modern production (0.17 kgCO2/W)      170 kgCO2/kWp
  #   Energy basis: 30 gCO2/kWh x 1,516 kWh/kWp/yr x 25y ~1,140 kgCO2/kWp
  # Note Fraunhofer's figure EXCLUDES balance-of-system, so it is a floor for
  # the installed system, not a ceiling.
  # *** And IT Now Declines Across The Periods
  # 810 for 2030 but then 400-500 in the future timelines"). *** This is the
  # right call and it is evidenced: module carbon intensity fell from
  # 0.61 to 0.17 kgCO2/W (-72%) over the recent survey period, driven by
  # thinner wafers, higher efficiency and cleaner manufacturing power. A town
  # building panels between 2030 and 2055 does not buy 2023 Chinese modules
  # for 25 years.
  #   2030  810   today's Chinese production, taken exactly from Fraunhofer
  #   2042  550   interpolating toward the EU/best-in-class band
  #   2055  450   mid of the 400-500 band
  # Applied PER VINTAGE, not to the cumulative fleet - a panel built in 2042
  # carries 2042's embodied carbon for its whole life, exactly as it carries
  # its own vintage CAPEX. See Economics.embodied_kgco2_per_unit_at.
  # STILL CONSERVATIVE at the far end: 450 in 2055 is well above the 170
  # that current best-in-class already achieves.
  # =====================================================================
  rooftop_pv_kgco2_per_kwp: 810        # 2030 vintage; see by-period table below
  solar_farm_kgco2_per_kwp: 810        # same modules; mounting differs, not the cell
  tracked_pv_extra_kgco2_per_kwp: 10   # incremental for tracker hardware
  # Per-vintage decline for the PV family. Keys are build years; values are
  # kgCO2 per kWp for capacity BUILT in that year. Absent tech -> flat.
  by_build_year:
    rooftop_pv_kgco2_per_kwp:   {2030: 810, 2042: 550, 2055: 450}
    solar_farm_kgco2_per_kwp:   {2030: 810, 2042: 550, 2055: 450}
  # VERIFIED IN RANGE - manufacturing footprint of Li-ion is
  # published at 74-134 kgCO2/kWh (LFP ~55, NMC ~78-101; recent cell
  # production 58-92 kgCO2-eq/kWh depending on electrode stack). 100 sits
  # inside that range, at the NMC end, so it is defensible and mildly
  # conservative for an Lfp-leaning grid battery. Not Changed.
  # Ucs Linked-Ish And The Value Verified, (named-source sweep).
  # The attribution said "UCS 2023 estimate". The UCS work on battery
  # manufacturing emissions is Nealer et al., "Cleaner Cars from Cradle
  # to Grave" (Union of Concerned Scientists) - a 2015 white paper, NOT
  # 2023. The year in the old comment appears to be wrong.
  # What Matters IS That 100 IS Inside The Published Range, from three
  # independent bodies:
  #   61-146 kgCO2e/kWh   full literature spread, central band 61-100
  #   72.8 kgCO2e/kWh     EU average battery production
  #   175 kgCO2e/kWh      ICCT 2018 central estimate (see attribution note)
  #   https://theicct.org/wp-content/uploads/2021/06/EV-life-cycle-GHG_ICCT-Briefing_09022018_vF.pdf
  #   https://www.europarl.europa.eu/RegData/etudes/STUD/2023/733112/IPOL_STU(2023)733112_EN.pdf
  # 100 sits at the TOP of the central band and below ICCT, i.e. mildly
  # conservative. The spread is driven by manufacturing grid mix, which
  # is why a single "correct" figure does not exist.
  # ATTRIBUTION, PDF supplied by.
  # This line previously read "150-200 kgCO2e/kWh ICCT 2018 (the high end)".
  # The 150-200 IS in the Icct briefing, but it is Romare & Dahllof's row in
  # ICCT's Table 1, not ICCT's own figure - so the range was being attributed
  # to the body that surveyed it rather than the body that produced it. Two
  # things the document actually says, verbatim:
  #   * the survey spans "56 to 494 kilograms of carbon dioxide per
  #     kilowatt-hour of battery capacity (kg CO2/kWh)", i.e. WIDER than the
  #     61-146 spread named above;
  #   * ICCT's own working figure is "the central estimate from Romare et al.
  #... of 175 kg CO2e/kWh".
  # Using 175 makes the comparison cleaner AND more conservative in the
  # model's favour: 100 is 43% below ICCT's central estimate rather than
  # merely below the bottom of a band. Value unchanged at 100; this corrects
  # the attribution only, so it is byte-neutral.
  # ACTION: fix the "2023" to 2015 or drop the year - do not restate a
  # date that cannot be sourced.
  li_ion_battery_kgco2_per_kwh: 100    # inside published 61-146; see note
  # =====================================================================
  # The Remaining Five: Not Found IN Two Independent Search Passes, And
  # Cross-Checked Instead.
  # against a source; the honest answer is that no accessible source states
  # them, and here is what was done about it rather than leaving it there.
  # What Was Looked For And Not Found: embodied carbon per kW Installed for
  # biomass CHP, waste-to-energy and biogas plant, and per UNIT for a
  # bidirectional EV charger. Both a Perplexity evidence pass and a direct
  # search pass returned NOT FOUND. The reason is structural, not laziness:
  # the Lca literature for these technologies reports Lifecycle Intensity Per
  # kWh GENERATED (e.g. wood-pellet CHP at 0.055 kgCO2e/kWh, electricity-only
  # 0.13 kgCO2e/kWh), because fuel dominates and the construction materials
  # are a small remainder. Nobody publishes the remainder on its own.
  # EV-charger EPDs exist (Alfen publishes one) but expose no figure.
  # SO They Were Cross-Checked From The Other Direction. Taking published
  # CHP lifecycle intensity and attributing 5-10% of it to construction
  # materials, over each plant's own capacity factor and 25-year life:
  #     biomass_chp   implied  361 - 723 kgCO2/kW   model 1,500
  #     wte           implied  512 - 1,024          model 2,200
  #     biogas        implied  361 - 723            model 1,200
  # *** The Model Sits 2-4x Above The Implied Range IN All Three Cases. ***
  # That direction matters: these are the TOWN'S OWN plants, so overstating
  # their embodied carbon makes the town's CO2 look WORSE. The figures are
  # unsourced but they are conservative, and they should be described that
  # way rather than as estimates of unknown sign.
  # Size OF The Whole Exposure: these five together contribute ~1.3 M
  # kgCO2/yr against a town total of ~111 M - about 1%. Halving them all
  # would move the CO2 headline by under half a percentage point.
  # DECLARE AS:, derived, conservative, and quantified. Do not claim
  # a source for them.
  # =====================================================================
  v2g_charger_kgco2_per_unit: 250      # NOT FOUND; EPDs exist but expose no figure
  # biomass and biogas restated PER NET kW-e (/ 0.90) to match
  # the parasitic-load restatement of their technology blocks. Embodied CO2
  # is a fixed tonnage of steel and concrete per PHYSICAL plant, so when the
  # rated capacity is restated net the per-kW figure must rise by the same
  # factor or the total silently drops 10%. Totals are unchanged:
  #   biomass 1,500 x 15,000 = 1,666.67 x 13,500 = 22.50 M kgCO2
  #   biogas  1,200 x  1,250 = 1,333.33 x  1,125 =  1.50 M kgCO2
  # WTE is NOT restated - its 0.20 efficiency was left unchanged (the
  # config's own "net power yield" wording may already be net; applying a
  biomass_chp_kgco2_per_kw_e: 1666.67  # Not Found; ~2-4x the cross-checked range. Per Net kW-e
  wte_plant_kgco2_per_kw_e: 2200       # NOT FOUND; ~2-4x the cross-checked range
  biogas_plant_kgco2_per_kw_e: 1333.33 # Not Found; ~2-4x the cross-checked range. Per Net kW-e
  thermal_storage_kgco2_per_kwh: 15    # NOT FOUND; tank steel + insulation, declared
  # =====================================================================
  # The District'S Own Internal Network - Cables, Substation, Distribution
  # Why IT Had TO BE Added. The same batch started Charging the
  # internal network in production (electrical_network.cost_in_production).
  # Costing the concrete and copper while ignoring its carbon is an
  # asymmetry a reviewer would find in one question, so it is closed here.
  # Note this is a DIFFERENT thing from the grid-infrastructure exclusion
  # documented immediately below: that is the NATIONAL transmission network
  # outside the boundary, this is the district's own kit inside it.
  # CABLES -, a UK DNO's own published embodied-carbon calculator.
  # Electricity North West, "EC - Designer Calculation - Hutton End",
  # embodied-carbon calculations for substation projects:
  # https://www.enwl.co.uk/globalassets/about-us/regulatory-information/documents/environment-report/embodied-carbon-calculations-for-substation-projects/ec---designer-calculation---hutton-end.pdf
  # Verbatim rows: "Cable 6.6 / 11kV 3 Phase : weight @ 13.65kg/m" and
  # "Cable 33kV : weight @ 3.66kg/m", both at an A1-3 product-stage factor
  # of 3.81 tCO2e/tonne. The sheet states the factor's basis verbatim:
  # "the ECF value for New Copper is used for Power Cables".
  # Reproduced From The Sheet'S Own Worked Example: 200 m of 11 kV -> 2.73 t
  # -> A1-3 10.401 tCO2e. 2.73 x 3.81 = 10.401 EXACTLY.
  #   11 kV 3-phase: 13.65 t/km x 3.81 = 52.0 tCO2e/km
  #   33 kV: the row is SINGLE-CORE (3.66 kg/m cannot be a 3-core cable when
  #     the 11 kV 3-core is 13.65), so a 3-phase circuit is 3 x 3.66 =
  #     10.98 t/km x 3.81 = 41.8 tCO2e/km. THAT x3 IS AN INTERPRETATION,
  #     declared as such - it affects 6.5 km of 65.7 and moves the district
  #     total by under 0.6%.
  # DECLARED SUBSTITUTION: this is a UK copper-cable spec. Indian practice
  # is aluminium - lighter per km but a higher factor per kg - so the two
  # partly offset. No Indian cable EPD was found. source as
  # applied here.
  # TRANSFORMERS -. Liu, Miao, Li, Yu, Yuan, Cao, Yu & Yang, "Life
  # cycle CO2 emissions of various transformers under different scenarios
  # with multiple functional units", Global Energy Interconnection (2025),
  # https://www.sciencedirect.com/science/article/pii/S1674927825001145
  # (preprint https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5036631).
  # Reports 6955.40 kgCO2eq/MVA, with manufacturing ~99.9% of the total, on
  # a 30-year European basis. Material intensity given as 1030 kg/MVA steel
  # + 66.1 kg/MVA copper. Sanity Check, independent: a ~3.5 t/MVA unit at
  # the 2-3.5 tCO2e/t range for electrical steel gives 7-12 tCO2e/MVA, so
  # 6.96 sits at the LOW end - i.e. this is not an inflated figure.
  # *** Claim-Verified. The paywall note below is Discharged. ***
  #; both were
  # parsed in full locally (12 pp and 29 pp). All three attributed figures
  # appear verbatim, in both versions:
  #   "the average emissions are 6955.40 kgCO2eq/MVA, 9.83 kgCO2eq/(MVA kV),
  #    81.08 kgCO2eq/kWh and 1.36 x 10^-4 kgCO2eq/(MWh kV)"
  #   "most emissions occur during the production phase, accounting for about
  #    99.9% of the total emissions"
  #   "over a 30-year period... in Europe's electricity structure"
  # NOT CONFIRMED, and therefore not to be quoted from this source: the
  # "1030 kg/MVA steel + 66.1 kg/MVA copper" material intensities, which do
  # not appear in either PDF in that form. Either drop them or find them in
  # the paper's own tables before citing.
  # METHOD NOTE: the first automated pass scored four hits on "6955" in the
  # preprint. All four were a PHONE NUMBER in the author block,
  # +86 13808226955. A bare digit string is not a verification - the search
  # was redone anchored to the unit, which is what produced the quotes above.
  # (Superseded: "PAYWALL: abstract-level figures only, the full PDF was not
  # opened. Flag as DOC-verified, not CLAIM-verified.")
  # Size OF The Term, stated up front so nobody oversells it: ~223 tCO2/yr
  # against the town's ~117,163 tCO2/yr = 0.19%, and it is charged at
  # PARITY so BAU carries the same tonnes on a 2.6x bigger base. Net effect
  # on vs-BAU CO2 is about -0.05 pp. It is added for COMPLETENESS, not
  # because it changes the answer - and the fact that it does not change
  # the answer is itself the defensible result.
  internal_network:
    cable_11kv_kgco2_per_km: 52000.0     # 13.65 t/km x 3.81 tCO2e/t (ENWL)
    cable_33kv_kgco2_per_km: 41800.0     # 3 x 3.66 t/km x 3.81 (see note)
    transformer_kgco2_per_mva: 6955.4    # Liu et al. 2025, manufacturing 99.9%
    # Substation transformers use the SAME per-MVA figure: the source's
    # functional unit is MVA of transformation, which is what both the
    # 33/11 kV primary units and the 11 kV/415 V distribution units are.
    substation_kgco2_per_mva: 6955.4
  # =====================================================================
  # Why *National Grid* Infrastructure IS Excluded - And IT Was Tested.
  # infra like transmission lines + power stations for both models".)
  # The Asymmetry IS Real And Worth Naming: this block charges the town for
  # the embodied carbon of every panel, battery and plant it builds, while
  # BAU - which builds nothing locally - carries zero. But BAU leans entirely
  # on a grid whose power stations and transmission lines also had to be
  # manufactured, and the CEA emission factor (0.5106 kgCO2/kWh) is a
  # Generation-Side Combustion factor that excludes all of it.
  # SO IT WAS QUANTIFIED. Published transmission-network embodied carbon is
  # ~11 gCO2-eq/kWh transmitted (Great Britain transmission LCA, 40-year
  # basis; the same study puts network raw-material CO2 at ~3% of total
  # system emissions against 85% for losses). Adding that to BOTH scenarios:
  #     BAU  imports 609 GWh  ->  paid on 609 GWh
  #     town imports ~240 GWh ->  paid on 240 GWh   (it self-generates ~56%)
  # generates locally uses less of the transmission network, so charging per
  # IMPORTED kWh IS the decentralisation credit - no separate term is needed.
  # Result OF The Test, across the full plausible range (0.03-0.05
  # kgCO2/kWh grid infrastructure, town import 200-280 GWh):
  #     vs-BAU CO2 lands between 60.0% and 61.2%
  #     against 60.62% with the PV fix alone and NO grid infrastructure
  # ***** IT Cancels. BAU imports ~2.5x what the town does, so BAU picks up
  # ~2.5x the infrastructure charge, and that offsets the town's larger
  # on-site embodied carbon almost exactly. Including it changes the headline
  # by under 0.1 pp. *****
  # THEREFORE EXCLUDED - but the thesis claim is now "we tested this
  # exclusion and it does not change the result", which is a far stronger
  # position than declaring it a conservatism. Modelling it would add a
  # sourced-only-from-GB-data term to both sides to move the answer by less
  # than the width of the uncertainty on any input feeding it.
  # Not Captured, And IT Costs The Town: the interconnection is charged
  # at PARITY to every scenario, yet BAU pushes 2.5x the energy through it
  # and would in reality need a bigger connection. Logged, not modelled -
  # fixing it needs a sizing rule and it moves the result in the town's
  # favour, so leaving it is the conservative choice.
  # =====================================================================
  # Stage G placeholders for building materials (NOT included in Stage C):
  # concrete_kgco2_per_kg: 0.4
  # steel_rebar_kgco2_per_kg: 2.0
  # burnt_brick_kgco2_per_kg: 0.25
  # fly_ash_brick_kgco2_per_kg: 0.05

# ---------------------------------------------------------------------------
# Reliability multiplier (Stage C addition).
# India grid averages 4-8 outage hours per month in Punjab. Batteries and
# V2G have hidden value during outages because they displace diesel-genset
# kWh (otherwise burned at ~₹15-20/kWh + ~0.27 kgCO2/kWh).
# ---------------------------------------------------------------------------
reliability:
  # =====================================================================
  # (uncited-value sweep). BOTH diesel figures were
  # wrong and one was PHYSICALLY IMPOSSIBLE. Neither had a citation.
  # *** 0.27 kgCO2/kWh Could Not Happen. *** Diesel combustion releases
  # 2.68 kg CO2 per litre (standard chemistry; DEFRA/IPCC fuel factor).
  # An emission factor of 0.27 kgCO2/kWh therefore implies
  #     0.27 / 2.68 = 0.101 L/kWh  ->  9.9 kWh from ONE LITRE of diesel.
  # A litre of diesel contains ~9.8-10.0 kWh of chemical energy, so the old
  # value asserted a generator running at ~100% thermal efficiency. Real
  # gensets deliver 3.3-4.0 kWh/litre.
  # RE-DERIVED: 2.68 kgCO2/L x 0.28 L/kWh = 0.75 kgCO2/kWh.
  #   Measured band : 0.8-1.3 kgCO2/kWh for smaller gensets at 50%
  #   loading, with ~1.0 used as a conservative default -
  #   https://www.seforall.org/system/files/2021-08/SEforALL_Carbon-emissions-methodology-note.pdf
  #   0.75 sits BELOW that band because 0.28 L/kWh is an efficiently-loaded
  #   set, which is the right assumption for a planned district backup
  #   running during a scheduled outage rather than a small idling unit.
  #   Choosing the low end is the conservative direction here - see below.
  # *** Rs 17/kWh Was Below The Fuel Cost. *** At Indian pump prices and
  # the same 0.28 L/kWh:
  #     Rs 87.62/L (Delhi, Jun-2024) x 0.28 = Rs 24.53/kWh FUEL ALONE
  #     Rs 92/L                      x 0.28 = Rs 25.76/kWh FUEL ALONE
  # and that is before maintenance, which the old comment claimed was
  # included. Indian trade reporting puts all-in DG generation at
  # Rs 25-30/kWh (Power Line Magazine trade) and Rs 18-22/kWh at
  # 75% load. https://powerline.net.in/2024/07/30/cost-benefits-key-factors-driving-diesel-genset-uptake/
  # SET TO 25.0 - fuel at the 2024 Delhi price plus a thin maintenance
  # allowance, at the bottom of the reported all-in range.
  # *** Direction OF Effect - Read This Before Quoting The Result. ***
  # Under symmetric diesel the town's CHP fleet covers 100% of
  # its critical outage load, so the TOWN pays and emits ZERO here and only
  # BAU burns diesel. Raising both figures therefore makes BAU look Worse
  # and IMPROVES the town's vs-BAU numbers. This is a correction that
  # flatters the thesis, which is exactly the kind that needs the physics
  # argument above stated in full - the justification is that 0.27 was
  # thermodynamically impossible, not that a bigger gap is nicer.
  # Both figures are set at the LOW end of their evidenced ranges for that
  # reason.
  # Sourced And Raised: 60 -> 120 h/yr.
  # The 60 was uncited, claiming "~5 h/month Punjab average" with no
  # document behind it. The nearest measured figure is the ALL-INDIA
  # SAIDI average of 116.12 hours for 2022 (System Average Interruption
  # Duration Index - hours of supply lost per consumer per year). 120 is
  # Qualitative Punjab context from the same sourcing pass: urban feeders
  # see cuts of "an hour and a half to three hours"; rural Punjab sees
  # "6 to 8 hours" during shortages.
  # *** Two Warnings, Both OF Which Must Travel With This Number. ***
  # 1. Direction OF Effect. Under symmetric diesel the town's CHP fleet
  #    covers 100% of its critical outage load, so the town pays and emits
  #    Zero here and only BAU burns diesel. Doubling this doubles BAU's
  #    diesel penalty and therefore IMPROVES the town's vs-BAU numbers.
  #    This is the third change in two days that flatters the thesis
  #    (see also the diesel EF and cost corrections above) - which is
  #    reason for more scrutiny, not less.
  # 2. IT May BE Too High For AN Urban Site. Saidi 116 is an All-India
  #    average that includes rural feeders, which the same sources say are
  #    several times worse than urban ones. An urban Punjab town would
  #    plausibly sit BELOW the national average, i.e. nearer the old 60.
  #    The honest position is that the true value lies somewhere in
  #    60-120 and this end of it is the generous one.
  # Therefore: Run A 60 / 120 Sensitivity And Report The Band. Quoting a
  # single figure from a contested range is what the citation audit exists
  # to prevent.
  # =====================================================================
  outage_hours_per_year: 120               # All-India SAIDI 116.12 (2022), rounded
  diesel_genset_cost_inr_per_kwh: 25.0     # Rs 87.62/L x 0.28 L/kWh + maintenance
  diesel_genset_emission_kgco2_per_kwh: 0.75   # 2.68 kgCO2/L x 0.28 L/kWh
  # Fraction of outage hours that batteries / V2G can actually cover:
  # critical loads (~25-35% of demand) for the duration of the outage.
  # Caveat-6 fix: reduced 0.30 -> 0.20 to be conservative
  # given critical-load coverage is not enforced as a binding constraint.
  reliability_coverage_fraction: 0.20

  # =====================================================================
  # SYMMETRIC DIESEL. Closes the longest-standing structural
  # asymmetry in the model, listed in CLAUDE.md as "diesel is asymmetric:
  # the town is CREDITED for displacing it, the baselines are never CHARGED
  # for burning it".
  # What Was Wrong. The town's battery + V2G earned a reliability Credit
  # subtracted from its cost, on the argument that storage displaces diesel
  # during outages. BAU has no storage, so it earned no credit - but it was
  # never charged for the diesel it must actually burn either. Punjab has
  # ~60 outage hours a year; a grid-only town runs gensets through them.
  # The comparison therefore rewarded the town for avoiding a cost the
  # baseline was never made to pay.
  # And A Second Defect The Fix Also Closes, which matters more for the LP:
  # The Old Credit Was Unbounded. It was linear in battery_kwh with no
  # ceiling, so an arbitrarily large battery earned arbitrarily large diesel
  # credit - including far more diesel than the town would ever have burned.
  # That is a free money term pointing straight at oversized storage.
  # What Replaces IT. Every scenario, BAU included, now pays for the
  # critical load it cannot cover from storage during outages:
  #     critical outage energy  E = annual demand x (outage_hours / 8760)
  #                                 x reliability_coverage_fraction
  #     covered by storage      C = (battery_kwh + V2G energy)
  #                                 x outage_hours / 24
  #                                 x reliability_coverage_fraction
  #     diesel backup          D >= E - C,  D >= 0   (an LP Var, so the
  #                                 max(0,.) is exact and stays linear)
  #     cost += diesel_genset_cost x D
  #     CO2  += diesel_genset_emission x D
  # `C` keeps the OLD credit's expression exactly, so nothing about the
  # storage side is re-derived here - the only change is that the term is
  # now a bounded charge on everyone instead of an unbounded credit to one.
  # town cost was (base - diesel x C); it becomes (base + diesel x E
  # - diesel x C). BAU was (base); it becomes (base + diesel x E). Both Rise
  # BY The Same Constant diesel x E, so the absolute saving is unchanged and
  # only the RATIO moves - the vs-BAU percentage falls slightly because the
  # denominator grew. Expected ~ -0.1 pp on the headline, which is the
  # conservative direction and matches the estimate carried in CLAUDE.md.
  # At 2030 demand: E = 522 GWh x 60/8760 x 0.20 = 715 MWh, x Rs 17/kWh =
  # ~Rs 1.22 crore added to every scenario.
  # EMISSIONS: `diesel_genset_emission_kgco2_per_kwh` above was DEAD - it is
  # defined in this block and read by an accessor but was never added to any
  # emissions expression. So BAU's CO2 omitted its diesel entirely, which
  # understated BAU emissions and therefore UNDERSTATED the town's CO2
  # saving. Now live on the same D term.
  # Flag kept so the change is provable rather than asserted: forcing it off
  # must reproduce the pre- numbers exactly (the pattern).
  symmetric_diesel_backup:
    enabled: true
    # *** Corrected Same Day, And. ***
    # The first cut of this term counted ONLY battery + V2G as "covered",
    # because that is all the legacy Stage-C reliability credit had ever
    # counted. On that definition the town covered 0.25% of its critical
    # outage load in 2030 and was charged for the other 99.75% of diesel.
    # That IS Wrong, And Finding Already Proved IT Wrong. Res-1 re-solved
    # the frozen build under a month-long total grid cut (import = export = 0)
    # and found the CRITICAL layer served **100.0% in all six blackout
    # solves**, with an independent 72-hour chronological simulation
    # confirming critical never drops below 100% - explicitly "including
    # 2030, which has ZERO battery". The town's blackout resilience does not
    # come from storage at all. It comes from the Dispatchable CHP Fleet:
    # biomass 15 MW_e + WTE 2.03 + biogas 1.25 = 18.28 MW_e, which notes
    # "happens to cover the critical layer with margin".
    # So the coverage term must include local dispatchable generation, or the
    # model charges the town for diesel it demonstrably never burns.
    #   CHP contribution = (biomass + wte + biogas kW_e) x outage_hours
    #                      x chp_outage_availability
    # At 18.28 MW_e x 60 h that is 1,096.8 MWh against a critical outage need
    # of 729.7 MWh - so the town covers it with ~50% margin and pays ZERO
    # diesel, while BAU (no plants, no storage) pays the lot. That is the
    # correct asymmetry, and it now AGREES with instead of contradicting
    # it.
    # NO rel_cov ON The Supply Side: reliability_coverage_fraction defines the
    # critical SHARE OF DEMAND and is already inside E. Applying it again to
    # capacity would be a second haircut on the same idea. The legacy storage
    # term keeps its rel_cov unchanged, so nothing about the old credit's
    # storage arithmetic is re-derived here.
    # AVAILABILITY: 1.0. These are fuel-fed dispatchable plants and the event
    # is 60 hours a year; measured that a 72-hour event burns ~0.6% of the
    # annual straw budget and that the budget alone could sustain
    # critical-only service for ~4-6 YEARS. Fuel is not the binding
    # constraint over 60 hours. Declared here rather than buried so it can be
    # stressed - and the compound case (CAQM straw ban + outage together) is
    # exactly what flags as the real worst case.
    chp_outage_availability: 1.0

# ---------------------------------------------------------------------------
# Dynamic (Octopus-Agile-style) Retail Tariff — New.
# Opt-in alternative to the fixed 5-band ToU below. Retail price is PEGGED to the
# IEX Day-Ahead Market (Dam) wholesale price. The district is a price-Taker (its
# own load can't move the national market), so the signal is EXOGENOUS — no LP
# circularity. Per-slice price is built as:
#   wholesale(month, daypart) = monthly_rtc[month] x intraday_band_mult[daypart]
#                               (band mult normalised so the daily mean = 1.0)
#   retail(slice) = wholesale x 1/(1-tnd_loss) + network_charge + css + duty
#   clamp to [retail_floor, retail_cap]
# Calibrated so the annual-average retail ≈ the fixed-ToU average (~6 Rs/kWh) so
# the bill LEVEL stays realistic while the SHAPE becomes dynamic. Export is also
# wholesale-pegged ("Outgoing Agile") instead of the flat ToU export.
# Activate with scenarios.*.tariff_mode: dynamic_agile (or force in code).
# Sources (see DATA/iex_punjab_dam_tariff_notes.md):
#   - IEX Dam snapshot (15-min Mcp): https://www.iexindia.com/market-data/day-ahead-market/market-snapshot
#   - CERC Short-Term Power Market 2022-23 (DAM wtd-avg 6.03 Rs/kWh; 50% < 5):
#     https://cercind.gov.in/2023/market_monitoring/Annual%20Report%202022-23.pdf
#   - Intraday band shape from IEX worked example 9-Aug-25 (day 2.32 / night 5.13 /
#     peak 9.18 vs RTC 4.78 -> 0.49x / 1.07x / 1.92x) (LinkedIn).
#   - Cap 10 Rs/kWh since 10-Apr-2023 (CERC Order 05/SM/2023), floor 0 (no negatives).
#   - Retail stack: 11 kV OA losses ~7%, STU+wheeling ~0.66-0.69, domestic CSS 0,
#     duty ~5% (PSPCL OA + PSERC FY25-26 circulars).
dynamic_tariff:
  enabled_default: false                 # active only when a scenario sets tariff_mode: dynamic_agile (or forced in code)
  # Representative 12-month wholesale RTC level (Rs/kWh), anchored to CERC FY22-23
  # (6.03) discounted ~CY24 -17% + recent months (Apr25 5.20 / May25 4.12 / Feb25
  # 4.38 / Q2FY26 3.93); summer/monsoon higher. derived series.
  monthly_rtc_inr_per_kwh:
    1: 4.4
    2: 4.4
    3: 4.6
    4: 5.2
    5: 5.6
    6: 5.8
    7: 5.2
    8: 4.6
    9: 4.6
    10: 4.8
    11: 4.4
    12: 4.4
  # Intraday multiplier vs monthly RTC by 2-h daypart (normalised in code so the
  # hours-weighted daily mean = 1.0). Solar dip midday, evening super-peak..
  intraday_band_multiplier:
    "00_02": 1.05
    "02_04": 1.00
    "04_06": 1.05
    "06_08": 0.92
    "08_10": 0.82
    "10_12": 0.55
    "12_14": 0.48
    "14_16": 0.55
    "16_18": 0.95
    "18_20": 1.70
    "20_22": 1.92
    "22_24": 1.18
  tnd_loss_fraction: 0.07                # 11 kV open-access total losses ~7% (PSPCL OA circular)
  network_charge_inr_per_kwh: 0.70       # STU transmission + distribution wheeling (~0.66-0.69)
  cross_subsidy_inr_per_kwh: 0.0         # domestic CSS = 0 (PSERC FY25-26)
  duty_fraction: 0.05                    # electricity duty ~5% of energy charge (scenario assumption)
  retail_cap_inr_per_kwh: 11.0           # IEX wholesale cap 10 -> ~11 retail after adders
  retail_floor_inr_per_kwh: 1.5          # network+duty floor even at ~0 wholesale
  export_pegged_to_wholesale: true       # Outgoing-Agile: export price = wholesale (vs flat 3.5 ToU)
  # Scales the monthly RTC so the Agile annual-average RETAIL matches the
  # prevailing fixed-ToU average (~5.9 Rs/kWh). This isolates the tariff SHAPE
  # (dynamic vs flat) from any LEVEL shift, so a fixed-vs-Agile comparison is
  # apples-to-apples. Standard practice when comparing tariff structures.
  level_calibration_multiplier: 0.95

# ---------------------------------------------------------------------------
# Grid: ToU tariffs (5 bands) and emission factor.
# ---------------------------------------------------------------------------
grid:
  # =====================================================================
  # ToD BANDS. Restructured (audit +
  # WITHDRAWN - see below). Every level here is now anchored to one of two
  # documents, and the SHAPE changed while the LEVEL did not.
  # SOURCE A - the national rule. Electricity (Rights of Consumers)
  # Amendment Rules 2023, rule 8A, notified (MoP;
  # reproduced verbatim in UERC's Concept Paper on ToD Tariff for Solar and
  # Non-Solar Hours, https://cdnbbsr.s3waas.gov.in/s3cf05968255451bdefe3c5bc64d550517/uploads/2026/01/20260102144277158.pdf ):
  #   - "tariff for solar hours of the day... shall be atleast twenty
  #     percent less than the normal tariff for that category of consumers"
  #   - peak "shall not be less than 1.20 times the normal tariff" (C&I) or
  #     "1.10 times" (other consumers)
  #   - "'solar hours' means the duration of eight hours in a day as
  #     specified by the State Commission"
  #   - "the duration of peak hours shall not be more than solar hours"
  #   - mandatory for all non-agricultural consumers from 1 APRIL 2025,
  #     five years before this model's 2030 base year.
  # *** The Applicability Clause IS Now Verified Verbatim, And IT
  # IS The Clause The Whole Model Leans ON. *** Rule 8A, first paragraph:
  #   "The Time of Day tariff for Commercial and Industrial consumers having
  #    maximum demand more than ten Kilowatt shall be made effective from a
  #    date not later than 1st April, 2024 and for other consumers except
  #    agricultural consumers, the Time of Day tariff shall be made effective
  #    not later than 1st April, 2025 and a Time of Day tariff shall be made
  #    effective immediately after installation of smart meters, for the
  #    consumers with smart meters:"
  # Confirmed on TWO independent routes: the Gazette text reproduced at
  # legitquest.com/act/electricity-rights-of-consumers-amendment-rules-2023,
  # and PIB PRID 1934673 which paraphrases it identically ("for all other
  # consumers except agricultural consumers, latest from 1st April, 2025").
  # Why This Matters Enough TO Write Out. This model charges One time-varying
  # import tariff to All district demand, Households Included, and a great
  # deal rests on that: DSR, battery arbitrage, PV self-consumption and above
  # all V2G only have value if the price actually moves during the day.
  # Source B below (the PSERC order) restricts ToD to *"Nrs/BS consumers with
  # sanctioned Contract Demand exceeding 100 kVA, all LS/MS consumers... and
  # EV charging stations"* - i.e. NOT domestic - so read alone it would say
  # the model gives households a price signal they never see.
  # RULE 8A RESOLVES IT: "other consumers except agricultural consumers"
  # INCLUDES domestic, and the deadline is. This model's base
  # year is 2030. So district-wide ToD is the legally mandated position for
  # every period the model runs, and the PSERC order simply predates the
  # obligation.
  # State IT AS AN Assumption Anyway, because implementation is the State
  # Commission's and is tied to the smart-meter rollout: no PSERC/PSPCL order
  # notifying a DOMESTIC ToD tariff has been located as of (looked
  # for; recorded as NOT FOUND, not as absent). The defensible claim is
  # "national rule mandates it from 2025, Punjab had not yet notified it when
  # this model was built, and the model assumes compliance by 2030" - NOT
  # "Punjab charges households a ToD tariff today".
  # SOURCE B - what Punjab actually does. PSERC Tariff Order FY 2024-25 for
  # PSPCL, General Conditions of Tariff section 15 (,
  # https://docs.pspcl.in/docs/cecommercial2420240614200653433.pdf ),
  # carried unchanged into FY 2025-26:
  #     1 Apr-15 Jun   06-18 Normal | 18-22 Normal      | 22-06 Normal -0.75
  #     16 Jun-15 Oct  06-18 Normal | 18-22 Normal+2.00 | 22-06 Normal
  #     16 Oct-31 Mar  06-18 Normal | 18-22 Normal      | 22-06 Normal -1.00
  # IS Withdrawn And The Model Was Right. The audit called the
  # four-month evening peak a defect, reasoning from the national rule
  # without the state order in hand. PSERC's evening premium runs 16 Jun -
  # 15 Oct; this model runs jun-sep. The band windows match too. The
  # seasonal_tod block below already cited this exact order. Nothing to fix.
  # What Was Actually Wrong +: the price Valley was in the
  # wrong place. The model's cheapest hour was 03:00 (Rs 3.50) and its
  # daylight hours sat at 1.02x the daily average. Rule 8A puts the valley
  # at midday. PSERC's own table has NO solar-hours band at all - it
  # predates the obligation - so the model was faithfully reproducing a
  # pre-2025 structure that a 2030 baseline may not use.
  # The Solar Window is the Commission's to specify and Punjab has not yet
  # specified one. Taken here as the eight hours that actually carry the
  # solar, which is what the rule intends. Measured on this district's own
  # PV profile: 08:00-16:00 carries 90.6% of annual output, against 76.0%
  # for 06-14 and 79.4% for 10-18. Derived, not chosen.
  # LEVELS. "Normal" stays at 6.00, so the blended average moves only
  # 5.569 -> 5.553 Rs/kWh (-0.3%) and the PSPCL reconciliation at line 565
  # still holds. Only the shape changes.
  #   solar     0.80 x normal   - rule 8A's ceiling, taken exactly
  #   night     normal - 0.61   - PSERC's own rebate, year-round weighted:
  #                               -1.00 for 5.5 winter months, -0.75 for
  #                               2.5 summer months, 0 in the 4 paddy
  #                               months = -0.615 Rs/kWh
  #   normal    6.00            - unchanged
  #   peak      normal + 2.00   - PSERC's paddy-season premium, exactly
  #   super_peak normal + 3.50  - the retained intra-evening gradient
  #                               (, the model's own convention)
  # Spread compresses 2.71x -> 1.98x, still well above rule 8A's implied
  # 1.375x floor for non-C&I, and now derived rather than asserted.
  # `super_off_peak` (02-04 at Rs 3.50) is DELETED. PSERC has no 02-04
  # sub-band; it was the model's own invention and it was what put the
  # daily price minimum at 3am. 02-04 now sits in off_peak with the rest of
  # the night.
  # =====================================================================
  import_tariff_inr_per_kwh:
    solar:          4.80   # 08-16, = 0.80 x normal (MoP rule 8A)
    off_peak:       5.40   # 00-06, 22-24, = normal - 0.61 (PSERC rebate)
    shoulder:       6.00   # 06-08, 16-18 = PSERC "Normal Tariff"
    peak:           8.00   # 18-20, = normal + 2.00 (PSERC paddy premium)
    super_peak:     9.50   # 20-22, = normal + 3.50 (retained gradient)
  # UNCITED. 3.0 = the utility-scale solar market band the district's exports
  # (majority farm MWp) actually clear at: SECI solar auctions Rs 2.5-2.7/kWh
  # FY23-25 (, CERC/SECI results) + solar-hour exchange prices ~Rs 3
  # (IEX market data). The PSERC rooftop-prosumer rate (~Rs 2.25,
  # Mercom on the 3rd amendment) is the conservative bound - appendix
  # sensitivity export_price_sweep.md: 2.25 -> +9.48%, 3.00 -> +2.26%.
  # Crit-2c / Convention: this feed-in is Flat-Real for
  # all periods in the multi-period objective (import tariffs escalate at
  # tariff_escalation_real_annual; the export line does NOT) - duck-curve
  # reality for solar-hour feed-in is flat-to-falling, so escalating it
  # with imports flattered 2042/2055; the DEM-3 A/B hook models the
  # falling path.
  # Answer: IT Already Does Carry A Period Decision - it is deliberately held
  # an oversight, and the note above records why. The import tariff escalates
  # at `tariff_escalation_real_annual` and the export line does not, because
  # feed-in for Solar-Hour energy is flat-to-Falling as grid solar saturates -
  # every extra megawatt of Indian solar arrives at the same midday hour and
  # is worth less. Escalating the feed-in alongside imports would have
  # flattered 2042 and 2055 by paying the town more for exports precisely when
  # exports become least valuable.
  # The Falling Path IS Available AS A Sensitivity, not invented as a base
  # case: the DEM-3 duck-curve A/B hook (`duck_curve_drift`) applies a
  # per-period export multiplier, so the "feed-in collapses" scenario can be
  # run without asserting it in production. Flat-real is the middle of the
  # three (rising / flat / falling) and the only one with a stated reason.
  export_tariff_inr_per_kwh: 3.0
  # (Phase 3C —: Punjab industrial
  # tariff carries an EMBEDDED cross-subsidy surcharge of ₹0.86-1.22/kWh
  # above ACoS (Mercom FY26-27 + PSERC FY24-25 ARR). Industrial / warehouse
  # consumers pay more than residential so the state government can
  # subsidise agriculture (43 % of PSPCL sales). Applied as an additive
  # surcharge on top of the band tariff for industrial-coded cells.
  # Source: PSERC FY24-25 Chapter 7 ARR, Mercom open-access surcharge ₹1.29
  # (open-access wheeling separately). Midpoint ₹1.05/kWh.
  # *** Upgraded TO A Tier 1 Primary,. *** The per-category
  # cross-subsidy surcharges rested on two TRADE-PRESS articles (SolarQuarter
  # + Mercom), NEITHER of which could be opened - the audit
  # recorded "NO Article Body Retrieved; None OF The Figures Present".
  # PSPCL's own commercial circular carries all four verbatim; downloaded and
  # parsed locally (WebFetch could not decode the FlateDecode
  # streams, pypdf could):
  #   "3. Cross subsidy surcharge:- As per Regulation 26(2) of PSERC (Terms
  #    and Conditions for Intra-state Open Access) Regulations, 2011, the
  #    cross-subsidy surcharge for various categories of consumers is
  #    determined as under:-  Large Supply: 57 paise/kWh   Domestic Supply:
  #    0 paise/kWh   Non-Residential supply: 111 paise/kWh   Bulk Supply:
  #    85 paise/kWh... not exceeding the 20% of the average cost of Supply"
  #   https://docs.pspcl.in/docs/cecommercial2520250329184924412.pdf
  # All Four Match the values this config uses. Tier 4 -> Tier 1.
  # Note The Host: docs.pspcl.in serves real documents and is the same host
  # that carries the verified FY2025-26 tariff schedule. pspcl.in and
  # pserc.gov.in serve navigation pages. Seek Punjab utility citations at
  # docs.pspcl.in first.
  # Open Item: PSERC set the Additional surcharge at Rs 1.22/kWh (full open
  # access) and Rs 0.83/kWh (partial) for 1 Apr -. This block
  # carries Rs 1.29, which appears to be an earlier period. Check which
  # period the model intends before quoting it.
  industrial_cross_subsidy_inr_per_kwh: 1.05
  industrial_categories:
    - light_industry
    - warehouse_cold_storage
  # FX-5/B1: PSPCL-vs-national EF premium. The EF tables here
  # and in price_trajectories.yaml are NATIONAL (CEA) figures; Punjab's
  # delivered mix is more thermal-heavy than the national average (PSPCL
  # own thermal fleet + thermal-dominated drawal; agriculture-driven summer
  # imports). Derived ~x1.07 from CEA CO2 Baseline Database weighted-average
  # build-margin/operating-margin vs the Punjab supply mix (CEA CDM CO2
  # Baseline Database v19/v20, https://cea.nic.in/cdm-co2-baseline-database/,
  # source; x1.07 derivation - register row B1). Applied
  # multiplicatively at ALL EF resolution points (static, trajectory,
  # per-period) in energy/costs.py. Set 1.0 to disable. Headline effect at
  # the pre-FX-2..6 baseline: ~ +2.7 ktCO2/yr on grid-import emissions.
  pspcl_premium_factor: 1.07
  emission_factor_kgco2_per_kwh: 0.55   # static fallback ONLY - see note below
  # ⚠️: in Production the Active Price Scenario
  # (config/price_trajectories.yaml, default nep_policy_push) OVERRIDES both the
  # static value above and the table below. Effective production EF: 0.477 (2030),
  # 0.27 (2042) - NOT 0.55. Docs/thesis must quote the price-scenario trajectory.
  # Time trajectory per CEA Nep-2023 + CEEW projections. The MILP uses the
  # project-lifetime-weighted average when `use_grid_decarb_trajectory: true`.
  emission_factor_trajectory_kgco2_per_kwh:
    "2025": 0.70
    "2030": 0.55
    "2035": 0.45
    "2040": 0.35
    "2050": 0.20
  use_grid_decarb_trajectory: true
  project_lifetime_years: 25       # Pareto cost / carbon are over this horizon
  # STAGE-: 200 MW -> 600 MW at the 250k town scale (demand
  # ~3x the frozen 100k model; 2055 peak ~440 MW needs headroom). Same
  # sizing convention as the export cap below (CEA/PSPCL substation
  # classes): a 250k town is fed by 2-3 132/33 kV substations rather than
  # one - proportional scaling of the convention.
  import_capacity_limit_kw: 600000

  # (Item 5 — PSPCL/CEA feeder reverse-flow cap,:
  # Lowered from a non-binding 100 MW placeholder to 60 MW (the value that
  # bites the 2030 LP). Descending-cap sweep showed unconstrained 2030 peak
  # export = 116.9 MW (full_stack alpha=0); the 100 MW value just touched
  # the peak with no cost penalty. 60 MW is the realistic PSPCL/CEA feeder
  # reverse-flow ceiling for a 25 km² peri-urban district at this scale.
  # Sizing derivation (: regulatory standard + utility convention):
  #   * 2 x 31.5 MVA = 63 MVA gross transformer capacity for the urban/
  #     peri-urban distribution substation.
  #     *** RE-SOURCED. The two URLs previously here evidenced
  #     nothing: the trade portal 403s and was never opened, and the CEA
  #     construction-regulations PDF was found on to be a
  #     Coincidental Number Match With Different Units. Replaced with CEA's
  #     own planning criteria, fetched and parsed (158 pp): ***
  #     CEA, "Electricity Distribution Network Planning Criteria", Central
  #     Electricity Authority, 2023. Verbatim:
  #       "Generally, each 33/11 kV, 33/22 kV, 22/11 kV Sub-stations, subject
  #        to space constraints, should have two or more transformers and two
  #        or more incoming feeders from two different sources for meeting
  #        N-1 contingency for reliability considerations."
  #       "As per latest CEA (Technical Standards for Construction of
  #        Electrical Plants & Electric Lines) Regulations 2022, the maximum
  #        capacity of 33/11 kV, 33/22 kV and 22/11 kV Sub-stations shall be
  #        as 100 MVA, 75 MVA and 75 MVA respectively."
  #       "in case, the loading of 33/11 kV... power transformer reached
  #        beyond 70% of its capacity, some of the load may be shifted"
  #     https://cea.nic.in/wp-content/uploads/notification/2024/01/Final_Approved__Revised_Distribution_Planning_Criteria.pdf
  #     What This Does And Does Not Evidence, stated plainly: it confirms the
  #     Two-Transformer N-1 convention, the 100 MVA ceiling for 33/11 kV (the
  #     same ceiling already used) and the 70% loading trigger. It does
  #     Not name 31.5 MVA specifically. So the Structure is; the
  #     particular rating is convention. Do not claim CEA specifies
  #     31.5 MVA.
  #     *** SHARPENED, and the earlier wording was too generous.
  #     It called 31.5 MVA "a standard IS transformer rating", which is true
  #     in general and Misleading Here: CEA Regulation 54(3) gives the
  #     preferred ratings for 33/11 kV as 1, 1.6, 3.15, 5, 6.3, 8, 10, 16
  #     and 20 MVA - the list stops at 20 and does not contain 31.5.
  #     31.5 MVA is standard at 66/11 kV and 132/33 kV, confirmed by CEA's
  #     own Transformer Manual, Cbip, Iit Roorkee and PSPCL/Pstcl tender
  #     practice. Corroborating 33/11 kV practice sits at 8, 12.5 and
  #     2 x 12.5 MVA (TP Ajmer, HSIIDC), i.e. inside the 1-20 band.
  #     Consequence: "2 x 31.5 MVA at 33/11 kV" is Not a standard
  #     configuration and must not be written as though it were. The
  #     capacity is not in question - the model uses 3 x 100 MVA, each at
  #     the CEA 2024 ceiling - only this illustrative pairing. Either drop
  #     the 2 x 31.5 illustration or restate it at 66/11 kV.
  #   * A 25 km² / 100k-pop peri-urban district (Zirakpur class) is
  #     typically fed by one such 132/33 kV substation OR 2x 33/11 kV
  #     substations of 2x16 MVA each (also ~64 MVA aggregate). Cross-
  #     ref PSPCL substation inventory (e.g. 66 kV substation
  #     Veehla Teja, Mohali sub-circle):
  #     https://www.pspcl.in/Otherlinks/66-kv-substation-veehla.aspx
  #   * Reverse-flow capability derated from 63 MVA gross to 60 MW (~95%)
  #     for voltage-rise headroom + N-1 contingency. MNRE rooftop solar
  #     interconnection guidelines limit reverse flow to <=100% of
  #     transformer rating with OLTC re-tap, <=30% without; 60 MW sits
  #     well below the OLTC-equipped ceiling but above the no-OLTC band.
  #   * Note: export PEAKS in 2030 and FALLS in 2042/2055 as demand
  #     grows 1.0 -> 1.75x and absorbs more PV. So the 60 MW cap is
  #     sized for the 2030 bite-point; it is non-binding in 2042/2055.
  # Sweep evidence (, scripts/export_cap_sweep.py;
  #   cap=1e9 (non-binding): cost 1,115.8 M / lifetime 49.43 B / max-export 116.9 MW
  #   cap=100k (was prod):   cost 1,115.8 M / lifetime 49.43 B / max-export 100.0 MW
  #   cap= 80k:              cost 1,198.9 M / lifetime 49.51 B / max-export  80.0 MW
  #   cap= 60k (old prod):   cost 1,277.4 M / lifetime 50.01 B / max-export  60.0 MW
  #   cap= 50k:              cost 1,315.4 M / lifetime 50.48 B / max-export  50.0 MW
  # Capacity response at 60 MW cap: rooftop / carport / floating PV / farm
  # all UNCHANGED (still at geometric ceiling). Battery still 0 (storage
  # paradox holds; battery only deploys below ~20 MW cap, see sweep).
  # STAGE-: 60 MW -> 180 MW at the 250k town scale. The PV
  # fleet (farm 225 MWp + rooftop/carport ~scaled) and demand both grow
  # ~2.5-3x, so 180 MW preserves the SAME relative bite the 60 MW cap had
  # on the 100k model (0.51x the unconstrained 116.9 MW export peak).
  # Physical narrative scales identically: a 250k town is fed by 2-3
  # 132/33 kV substations (2 x 31.5 MVA class each, CEA spec above), i.e.
  # ~158-190 MVA gross reverse-flow capability with the same ~95% OLTC/
  # N-1 derating. scaling of the sizing convention;
  export_capacity_limit_kw: 180000

  # (D3 —:
  # PSERC net-metering 1 MWp per-consumer cap NOT modelled.
  # Would become binding if (a) a single parcel's rooftop >1 MWp, or (b)
  # SolShare clustering aggregates >1 MWp behind one meter (Stage F).
  # Source: PSERC consolidated net-metering regulations + 2024
  # notice (web:297, web:279, web:302 per Round-2 research).
  # *** Headroom RE- (register Aud-Cfg-1). The Decision
  # STANDS; its stated number was 4x stale. *** The old text read "largest
  # current parcel ~150 kWp", which belonged to the 100k / 200 m model. On
  # the current 250k / 100 m layout the largest ROOFTOP consumer parcel is
  # shopping_centre at 595.0 kWp (then light_industry 425.0, office 390.0,
  # retail_highstreet 330.0, residential_high 308.0). Still below the 1,000
  # kWp cap, so non-binding as claimed - but the margin is 1.7x, not 6.7x.
  # (The one 1,000.0 kWp parcel in the layout is a SOLAR_FARM cell, which is
  # utility-scale generation under open access, NOT a net-metered consumer,
  # so it is outside this cap by definition.)
  # RE-CHECK THIS IF: commercial floor area per cell rises, tiers get taller,
  # or RWA/SolShare pooling is modelled behind one meter - route (b) above is
  # the realistic path to breaching it, since pooling several 300-595 kWp
  # roofs passes 1 MWp immediately.
  net_metering_cap_kwp_per_consumer: 1000   # documented, non-binding (headroom 1.7x, re-
  net_metering_cap_binding: false

  #: Punjab AAP Mukh Mantri Bijli Bill
  # Mafi Yojana (active 2022-): every domestic consumer gets up to 300
  # kWh/month FREE; above 300 the normal slab tariff applies.
  # UPDATE: defaulted to 0.0 in production. Reasoning:
  # 1. AAP is a State policy tied to the AAP party government in Punjab.
  #    Term ends March 2027. Indian state-level free-electricity schemes
  #    have 5-10 year political churn cycles (Delhi AAP, Karnataka Gruha
  #    Jyoti, Telangana Gruha Jyothi all started 2014-2023 -- none have
  #    multi-decade durability commitments).
  # 2. Model horizon is 2030-2055 (25 years). Basing the production
  #    baseline on a 2-year-old state subsidy is not defensible for a
  #    25-year capacity-planning study.
  # 3. The initial 0.175 implementation created an LP arbitrage artifact
  #    (subsidized off-peak import 2.89 INR/kWh < export tariff 3.5
  #    INR/kWh, so the LP imported dirty power purely for resale and
  #    emissions exploded +60 %). This is NOT real-world AAP behaviour
  #    -- in reality AAP applies to net residential consumption, not
  #    grid arbitrage by utility-scale entities.
  # Set to 0.175 for the AAP-sensitivity case in the policy chapter; keep
  # at 0.0 for the production baseline. Stage F: per-cell residential-
  # vs-commercial tariff split would let the subsidy apply only to net
  # residential consumption and avoid the arbitrage artifact.
  import_tariff_subsidy_fraction: 0.0

  #: PM Surya Ghar Muft Bijli Yojana
  # (Pradhan Mantri Surya Ghar Muft Bijli Yojana, launched Feb 2024)
  # is the CENTRAL-government scheme for residential rooftop PV. Multi-
  # party central ratification, 10 GW national residential target by
  # 2027, more durable than state-level free-electricity schemes.
  # Sources: MNRE PM-Surya Ghar Guidelines 2024, PIB Feb 2024 press
  # release, MNRE Annual Report 2024-25.
  # Cfa Structure (verified from MNRE / Pib / Ibef, 2024-2026):
  # Central Financial Assistance is a FIXED rupee amount per system
  # size band, NOT a % of household CAPEX:
  #   1 kW: Rs 30k         (60% of MNRE benchmark Rs 50k/kWp = Rs 30k/kWp)
  #   2 kW: Rs 60k         (60% on each of 2 kW = Rs 30k/kWp avg)
  #   3 kW: Rs 78k         (60% on first 2 kW + 40% on 3rd kW = Rs 26k/kWp avg)
  #   >3 kW: Rs 78k flat   (HARD CAP, per-kW subsidy drops as size grows)
  # Plus: 300 kWh/month free electricity for PV-installing households
  # (overlaps with AAP free-power in Punjab; PMSGY component still
  # applies if AAP is later withdrawn).
  # Plus: Rs 18k/kW for RWA / housing-society common-area systems up to
  # 500 kW (apartment cells -- couples with SolShare uptake).
  # Per Our model's CAPEX Rs 35k/kWp (which is below MNRE benchmark Rs
  # 50k/kWp): the Cfa covers a High Fraction of our actual CAPEX:
  #   1 kW: Rs 30k / Rs 35k = 86% of CAPEX
  #   2 kW: Rs 60k / Rs 70k = 86%
  #   3 kW: Rs 78k / Rs 105k = 74%
  #   5 kW: Rs 78k / Rs 175k = 45%
  #   10 kW: Rs 78k / Rs 350k = 22%
  # Typical per-tier system sizes (Vasudha Foundation 2025 Varanasi
  # study + IEEFA + CEEW Residential Energy Survey 2024):
  #   Low-income     1-2 kWp -> effective ~86% subsidy (huge fractional)
  #   Mid-income     2-3 kWp -> effective ~74-86% subsidy (Varanasi
  #                            72% of beneficiaries are 2-4 kW)
  #   High-income    3-5+ kWp -> effective ~45-74% subsidy (cap binds
  #                            beyond 3 kW)
  # ADOPTION-EFFECT note: although high-income households get
  # MORE ABSOLUTE rupees subsidy (because their systems are larger),
  # adoption rate is driven by FRACTIONAL subsidy. Wealthier households
  # have lower marginal utility of money. So PMSGY IS effectively
  # PROGRESSIVE in adoption terms -- it boosts low/mid-income adoption
  # more than it boosts high-income adoption per kWp deployed. This
  # matches Vasudha's empirical finding that PMSGY "primarily caters
  # to low/medium-load residential consumers".
  # Implementation Friction (Ieefa July 2025): application-to-
  # installation conversion rate is 22.7 % (mid-2025) growing to ~39 %
  # (early 2026). Non-financial barriers (awareness, bureaucracy,
  # vendor delays) bias actual uptake AWAY from low-income households.
  # So the DE-FACTO realized subsidy across all eligible rooftops is
  # roughly 30 % blended -- the conservative value we use below.
  # Optimistic future scenarios (no friction): 50-70 % blended.
  # The 0.30 value below is a blended average across the tier mix +
  # system-size distribution -- a reasonable single-value approximation
  # at the LP single-bus resolution. Stage F: when per-cell tariff
  # differentiation lands, replace this with per-tier values
  # (rooftop_pv_capex_subsidy_by_tier: low 0.60, mid 0.55, high 0.35)
  # so the LP sees the true per-tier economics.
  # Effect on current LP: reduces effective rooftop CAPEX by 30% ->
  # rooftop deployment hits layout ceiling more easily -> grid imports
  # drop -> emissions decrease. Disable by setting to 0.0.
  rooftop_pv_capex_subsidy_fraction: 0.30

  # (D2 —: PMSGY continuation scenario for the
  # LIFETIME-cost projection. The 0.30 above is the 2030 SNAPSHOT the
  # annual LP sees; this block defines how the subsidy decays across the
  # 25-yr horizon. `Economics.effective_pmsgy_lifetime_avg_fraction`
  # returns the trapezoidal time-average of this profile (~0.078) and
  # `pmsgy_lifetime_capex_uplift_factor` rescales the rooftop-CAPEX
  # portion of lifetime_cost_inr only -- the 2030 annual alpha=0 LP is
  # untouched. Remove this block to restore static-0.30 lifetime behaviour.
  pmsgy_continuation_scenario:
    scenario: "decay_linear_to_2040"
    hold_years: 3                  # 2030-2032 inclusive
    fade_start_year: 3
    fade_end_year: 10              # 2040 zero point
    fraction_2030_2032: 0.30       # hold value
    fraction_2040_onwards: 0.0     # fade endpoint
    # (D2: MNRE FY27 budget +29 % YoY
    # signals continuation through 2027; BNEF + TERI 2030-2035 PV
    # cost-decline projects grid parity without subsidy by ~2035.

# ===========================================================================
# Equity + P2P Trading Report  (Phase 4 —, Opus 4.8) — Report-Only.
# ===========================================================================
# These parameters are consumed ONLY by `energy/equity_report.py` to compute the
# per-owner / per-tier equity + trading story (who saves, who trades, EWS bills).
# A retail tariff or a P2P trade price is a TRANSFER between actors, NOT a system
# resource cost: in the social-planner cost-minimisation LP the buyer's payment
# and the seller's receipt cancel to zero, so none of these can move the optimum.
# => They are NOT read by `solve_dispatch_pyomo`; the production headline stays
# byte-exact (1,402,369,939.69 / 82,573,979 / 57,199,879,508). This is the
# concrete realisation of FINDINGS ("equity shows in per-owner reporting, not
# the aggregate") and the CLAUDE.md baseline-integrity rule.
# (PV module-mix as an LP Var) is a genuine System-Cost change, so it is Not
# here — it is DEFERRED to Stage F; ~0.2-0.3% headline, and
# the calibrated mono-dominant mix is more realistic than a pure cost-min mix).
equity_report:
  # --- / D-ews: per-consumer-class retail tariffs (INR/kWh) ---------------
  # EWS minimal SOCIAL tariff — the resident-facing transfer that makes the
  # gov-owned-EWS equity visible. Gov landlord owns the building + roof + PV
  # (financed at discount_rates.social_ews = 6%); EWS tenants pay this flat rate
  # on metered consumption (council-housing / social-rental model).
  ews_social_tariff_inr_per_kwh: 3.0
  #   Anchor: SECI RESCO model "L1" discovered solar tariff ~Rs 2.97/kWh on
  #   government buildings (SECI RESCO tenders, 2024; ~1 GW draft / 14 buildings),
  #   rounded to 3.0 as the EWS social-rental rate. (agency/trade press).
  #   https://www.seci.co.in  (RESCO tenders); cross-ref MNRE RESCO guidelines.
  # Standard PSPCL domestic first-slab — the "what a poor consumer would
  # otherwise pay" comparator for the EWS equity-discount headline.
  # Verified Against The Primary. PSPCL Schedule of
  # Tariff FY2025-26 as approved by PSERC, Schedule VI "Domestic Supply",
  # clause SVI.3.1 verbatim: "Load upto 2kW | i) Upto 300 kWh 5.40/kWh |
  # 50/kW". So 5.40 is exactly the first-slab energy charge for the smallest
  # domestic connection, which is the right comparator for an EWS household.
  #   https://docs.pspcl.in/docs/cecommercial2520250329183246514.pdf
  # This Deep Link Replaces the two homepage citations that previously
  # carried this figure (the bare pspcl.in and pserc.punjab.gov.in roots -
  # deliberately written WITHOUT the URL prefix so the register scraper does
  # not re-import the very links this is retiring; the permanent record of
  # A homepage cannot evidence a tariff; this schedule can, and does.
  # Note The Slab Structure Changed between orders - FY2023-24 used 100/300
  # kWh breakpoints (4.19 / 6.64 / 7.75 for load upto 2 kW), FY2025-26 uses a
  # single 300 kWh breakpoint at 5.40. So 5.40 is CURRENT-order specific and
  # must be re-checked, not assumed, if the tariff year is ever moved.
  pspcl_domestic_first_slab_inr_per_kwh: 5.40
  #   PSPCL domestic supply, first slab. (regulator order).
  # against the primary - this block previously said
  #   "first slab (0-100 kWh/month), PSERC Tariff Order FY2024-25" and cited
  #   two HOMEPAGES. All three were wrong or unusable:
  #     - the slab is 0-300 kWh/month, not 0-100. The 0-100 breakpoint was the
  #       FY2023-24 structure (where the rate for load upto 2 kW was 4.19, not
  #       5.40); FY2025-26 replaced it with a single 300 kWh breakpoint.
  #     - the order carrying 5.40 is FY2025-26, not FY2024-25.
  #     - a homepage cannot evidence a tariff.
  #   Now cited to the schedule itself, Schedule VI clause SVI.3.1 verbatim:
  #   "Load upto 2kW | i) Upto 300 kWh 5.40/kWh | 50/kW".
  #   https://docs.pspcl.in/docs/cecommercial2520250329183246514.pdf
  # Non-EWS residential (mid/high), commercial + public consumers pay the model's
  # per-slice ToU import bands (grid.import_tariff_inr_per_kwh — PSPCL TOD 2024,
  # already cited in the price audit) as their retail tariff. Industrial adds the
  # cross-subsidy surcharge (grid.industrial_cross_subsidy_inr_per_kwh = 1.05).
  # ⚠ DOC ONLY - no code reads this (verified). The behaviour it
  # describes is HARDCODED and correct: equity_report.py:235 uses the per-slice
  # ToU import tariff for every non-EWS class. Kept as a record of the
  # convention; setting it false would change nothing.
  use_tou_bands_for_non_ews: true
  # Optional commercial/NRS premium over the domestic ToU (PSPCL Non-Residential
  # Supply runs ~Rs 2/kWh above domestic). Default 0 = commercial on the ToU
  # bands (keeps the headline cited); set >0 for a commercial sensitivity.
  commercial_tariff_premium_inr_per_kwh: 0.0   # PSPCL NRS FY24-25 ~+2
  # BAU "savings vs business-as-usual" comparator: a consumer with NO rooftop,
  # NO P2P, paying the standard retail tariff for ALL consumption.
  # ⚠ DOC ONLY - no code reads this, and the "first_slab" alternative it offers
  # Does Not Exist (verified). What equity_report.py:235 actually
  # does is better than either label: it charges the ACTUAL per-slice ToU band,
  # not a flat annual average. Corrected here rather than left advertising a
  # choice that cannot be made.
  # Naming Warning, worth stating for the write-up: this is the Equity report's
  # BAU (a household with no rooftop and no P2P, paying full retail) and it is
  # NOT the `scenarios.bau` behind the headline vs-BAU percentage (a town with
  # no local generation at all). Two different comparators, same word.
  bau_residential_tariff_basis: "per_slice_tou"  # DOC ONLY; describes the hardcoded behaviour
  # --- P2P market participation ---------------------------------------------
  # P2P peers face the ToU retail and own behind-the-meter rooftop: NON-EWS
  # building cells (mid/high residential, commercial, public, industrial). EWS
  # are protected by the lower Rs 3 social tariff (< the Rs 4.5 P2P price), so
  # they are NOT P2P buyers — their equity comes via the social-tariff transfer.
  # A trade clears only when export_tariff < p2p_price < import_tariff(slice)
  # (mutually beneficial), which concentrates trading in the midday shoulder.
  # (P2P price itself = stage_d.p2p_trading_tariff_inr_per_kwh = 4.5.)
  p2p_exclude_ews: true
  # ---//: PMSGY per-tier subsidy ATTRIBUTION (report-only) ---------
  # The production LP uses the blended grid.rooftop_pv_capex_subsidy_fraction
  # (0.30). For the equity report we attribute the REAL per-tier EFFECTIVE
  # subsidy: the Rs 78k CFA cap is progressive (covers a bigger share of a small
  # system). Derived from the grid.* PMSGY block above (MNRE PM-Surya-Ghar
  # Guidelines 2024 + Vasudha Foundation 2025 Varanasi study + IEEFA 2025).
  # B20c FIX (,; subsidy should DECREASE as
  # income rises"): the old 86/74/45 divided the CFA rupee caps by OUR
  # blended Rs 35k/kWp capex - a LARGE-SYSTEM/C&I rate. Real 1-3 kW
  # HOUSEHOLD installs cost ~Rs 45-55k/kWp (MNRE benchmark ~50k for the
  # residential segment; BridgeToIndia rooftop pricing), and the CFA pays
  # rupee caps Against The Benchmark, so the honest effective fractions
  # on household-scale systems are:
  #   low  ~1-2 kW: Rs 30k/kW CFA / Rs 50k = 0.60
  #   mid  ~2-3 kW: Rs 78k cap / Rs 150k  = 0.52 (band 0.52-0.60 -> 0.55)
  #   high ~4-5 kW: Rs 78k cap / Rs 225k  = 0.35 (cap binds, size grows)
  # Strictly DECREASING with income (the Rs 78k hard cap does it naturally)
  # - matching Vasudha 2025's "primarily caters to low/medium consumers".
  # Sources: MNRE PM Surya Ghar Guidelines 2024
  # https://pmsuryaghar.gov.in
  # ** Tier Split was badged "" against a scheme Portal
  # HOMEPAGE. MNRE is a publisher; the homepage is not a access
  # path and evidences no subsidy figure. Treat the numbers taken from it as
  # TIER 3 (declared) until the Guidelines PDF itself is cited. Note this
  # block is REPORT-ONLY - the LP keeps a blended 0.30 - so nothing in the
  # optimisation moves on it. **
  #; MNRE benchmark costs; Vasudha Foundation
  # Varanasi 2025; IEEFA 2025. Report-only (LP keeps blended 0.30).
  # Corrected owner-finance effect: mid IRR 67% -> ~35-45%, payback
  # ~2.5-3 y = the documented PMSGY band.
  pmsgy_effective_subsidy_by_tier:    # (CFA caps vs MNRE benchmark)
    low: 0.60      # 1-2 kWp: Rs 30k/kW CFA vs Rs 50k/kWp household benchmark
    mid: 0.55      # 2-3 kWp: Rs 78k cap vs Rs 130-150k (0.52-0.60 band)
    high: 0.35     # 4-5 kWp: Rs 78k cap vs Rs 200-250k (cap binds)
  #: PM-Surya-Ghar RWA / group-housing common-area subsidy (apartment
  # stacking) — Rs 18,000/kW up to 500 kW for society common facilities.
  pmsgy_rwa_common_area_inr_per_kw: 18000   # MNRE PM-Surya-Ghar Ghs/Rwa
  #: 300 kWh/month free-electricity bundle for PV-installing households.
  pmsgy_free_kwh_per_month: 300             # MNRE PM-Surya-Ghar (PIB Feb 2024)

# ---------------------------------------------------------------------------
# Calendar: month-day counts and day-type weights (Punjab 2030 indicative).
# Total must sum to 365 days = 8760 hours.
# Caveat-15 fix: Punjab gazetted holidays (~15-20/yr per
# PSPCL/Centre lists) are heavily concentrated Mar-Apr (Holi, Ram Navami,
# Baisakhi, Good Friday) and Oct-Nov (Dussehra, Diwali, Bhai Dooj,
# Gurpurab); summer (May-Jul) and Feb have very few. Redistributed
# festival counts to match: total stays 22 festival-days / 365.
# Source: Perplexity calibration table, Punjab Holidays 2025 lists.
# ---------------------------------------------------------------------------
calendar:
  months:
    jan: {days: 31, weekday: 21, weekend: 8, festival: 2}    # Republic Day, Lohri
    feb: {days: 28, weekday: 20, weekend: 8, festival: 0}    # quiet month
    mar: {days: 31, weekday: 21, weekend: 8, festival: 2}    # Holi
    apr: {days: 30, weekday: 19, weekend: 8, festival: 3}    # Baisakhi, Ram Navami, Good Friday
    may: {days: 31, weekday: 22, weekend: 8, festival: 1}    # quiet
    jun: {days: 30, weekday: 22, weekend: 8, festival: 0}    # quiet
    jul: {days: 31, weekday: 22, weekend: 8, festival: 1}
    aug: {days: 31, weekday: 21, weekend: 8, festival: 2}    # Independence Day, Janmashtami
    sep: {days: 30, weekday: 21, weekend: 8, festival: 1}
    oct: {days: 31, weekday: 19, weekend: 8, festival: 4}    # Gandhi Jayanti, Dussehra, Karva Chauth, Maharishi Valmiki
    nov: {days: 30, weekday: 17, weekend: 8, festival: 5}    # Diwali, Govardhan, Bhai Dooj, Gurpurab, Chhath
    dec: {days: 31, weekday: 22, weekend: 8, festival: 1}    # Christmas

# ---------------------------------------------------------------------------
# Daypart schedule (12 × 2-hour bins).  tariff_band indexes grid.import_tariff.
# ---------------------------------------------------------------------------
dayparts:
  #: 08-16 is the eight-hour SOLAR window required by MoP
  # rule 8A - derived from this district's own PV profile (90.6% of annual
  # output, against 76.0% for 06-14 and 79.4% for 10-18). 02-04 loses its
  # invented super_off_peak sub-band and rejoins the night.
  - {id: "00_02", start_h:  0, end_h:  2, tariff_band: off_peak}
  - {id: "02_04", start_h:  2, end_h:  4, tariff_band: off_peak}
  - {id: "04_06", start_h:  4, end_h:  6, tariff_band: off_peak}
  - {id: "06_08", start_h:  6, end_h:  8, tariff_band: shoulder}
  - {id: "08_10", start_h:  8, end_h: 10, tariff_band: solar}
  - {id: "10_12", start_h: 10, end_h: 12, tariff_band: solar}
  - {id: "12_14", start_h: 12, end_h: 14, tariff_band: solar}
  - {id: "14_16", start_h: 14, end_h: 16, tariff_band: solar}
  - {id: "16_18", start_h: 16, end_h: 18, tariff_band: shoulder}
  - {id: "18_20", start_h: 18, end_h: 20, tariff_band: peak}
  - {id: "20_22", start_h: 20, end_h: 22, tariff_band: super_peak}
  - {id: "22_24", start_h: 22, end_h: 24, tariff_band: off_peak}

# ---------------------------------------------------------------------------
# FX-4: SEASONAL time-of-day windows (replaces the year-round
# evening peak; / register A4 / audit section 11 "1 distinct peak set").
# Source : PSPCL ToD schedule FY2025-26, approved by PSERC
# (https://docs.pspcl.in/docs/cecommercial2520250329183246514.pdf, captured
# in../DATA/iex_punjab_dam_tariff_notes.md section 7.1):
#   * 16 Jun - 15 Oct (paddy season): 18:00-22:00 = normal + Rs 2.00 -> the
#     ONLY evening premium of the year. Model: peak (8.0 = shoulder 6.0
#     + 2.0 exactly) at 18-20 plus the existing super_peak 20-22 gradient
#     (GoI ToD-rules style intra-evening differentiation, retained).
#   * 1 Apr - 15 Jun (summer) and 16 Oct - 31 Mar (winter): NO evening
#     premium -> evenings re-stamped shoulder via the overrides below.
#   * Night rebates (22:00-06:00: -0.50 summer / -1.00 winter / none in
#     paddy season) are NOT seasonalised here - the existing year-round
#     off_peak / super_off_peak night bands already carry a deeper
#     GoI-ToD-style night discount; the residual +/- Rs 0.5-1.5/kWh
#     night-depth seasonality is a documented simplification.
# Month-granular approximation of the half-month season edges: jun is
# assigned TO the paddy season (premium starts 16 Jun; June carries the
# heatwave design day), oct to winter (premium ends 15 Oct). Domestic
# consumers are not yet on ToD in Punjab (slab tariffs); a 2030 district
# on ToD follows the GoI Electricity (Rights of Consumers) ToD amendment
# 2023 (mandatory non-agri ToD from Apr 2025) with PSERC's
# seasonal window template.
# Months/dayparts not listed keep the year-round default above; setting
# enabled: false reproduces the pre-FX-4 slices byte-exactly.
# ---------------------------------------------------------------------------
seasonal_tod:
  enabled: true
  overrides_by_month:
    jan: {"18_20": shoulder, "20_22": shoulder}
    feb: {"18_20": shoulder, "20_22": shoulder}
    mar: {"18_20": shoulder, "20_22": shoulder}
    apr: {"18_20": shoulder, "20_22": shoulder}
    may: {"18_20": shoulder, "20_22": shoulder}
    # jun-sep: paddy-season evening premium -> keep default peak/super_peak
    oct: {"18_20": shoulder, "20_22": shoulder}
    nov: {"18_20": shoulder, "20_22": shoulder}
    dec: {"18_20": shoulder, "20_22": shoulder}

# ---------------------------------------------------------------------------
# Design-day slices for capacity sizing (NOT in the cost objective; used as
# feasibility constraints on the worst-case slices).
# ---------------------------------------------------------------------------
design_days:
  - {id: heatwave_afternoon,         month: jun, daypart: "14_16", demand_uplift: 1.40, pv_factor: 1.0}
  - {id: festival_evening,           month: nov, daypart: "18_20", demand_uplift: 1.25, pv_factor: 1.0}
  - {id: monsoon_cloudy_afternoon,   month: jul, daypart: "14_16", demand_uplift: 1.10, pv_factor: 0.3}
  - {id: winter_cold_snap_morning,   month: jan, daypart: "06_08", demand_uplift: 1.25, pv_factor: 0.1}
  - {id: pre_monsoon_dust_afternoon, month: may, daypart: "14_16", demand_uplift: 1.20, pv_factor: 0.6}
  - {id: winter_fog_morning,         month: dec, daypart: "06_08", demand_uplift: 1.20, pv_factor: 0.1}

# ---------------------------------------------------------------------------
# PV capacity factor table (multiplicative, monthly_modifier x daypart_shape).
# The monthly modifiers carry the irradiance seasonality only (cloud +
# climatological aerosol). Event-scale physics is applied SEPARATELY per
# month in energy/network.py: temperature derating (A2, pv_inverter block),
# PM2.5 + dust-storm soiling (A19), and fog (A19) - so this table must NOT
# bake those in (double-count risk).
# ---------------------------------------------------------------------------
pv_capacity_factor:
  # (Stage- Solar Single-Source,: the monthly
  # SHAPE is now derived EXCLUSIVELY from the Global Solar Atlas site report
  # (../DATA/GSA_Report_Punjab.{pdf,xlsx}, World Bank/Solargis;
  # site 30.639183 N / 76.820097 E, OPTA 29 deg) - ONE citable provider for
  # every solar-resource number in the model. Version lineage:
  #   v1 A24: GSA monthly DNI proxy - right about foggy Jan
  #     (0.563) but NO diffuse term -> exaggerated beam months (oct/jun +34%).
  #   v2 FX-2: Pvgis-ERA5 Gti - fog-blind in the Igp.
  #   Pvgis Linked (named-source sweep): Jrc Photovoltaic
  #   Geographical Information System, European Commission Joint
  #   Research Centre - https://re.jrc.ec.europa.eu/pvg_tools/en/
  #   (, EC/JRC; free, no registration, global coverage.)
  #   Note the model does Not use Pvgis in production - it was
  #   superseded precisely BECAUSE its ERA5 reanalysis is fog-blind
  #   over the Indo-Gangetic Plain, which matters at this latitude.
  #   The link is here so the rejected option is checkable too.
  #   v3 FX-2b: NASA Power Ceres satellite shape - fog-aware,
  #     multi-source (NASA shape on a GSA anchor).
  #   v4 (This Table): Gsa-only. GTI_m = DNI_m x <cos theta_i>_m + DIF_m x
  #     (1+cos 29deg)/2, where DNI_m = the report's monthly DNI,
  #     <cos theta_i>_m = the DNI-energy-weighted incidence factor computed
  #     from the report's OWN average hourly DNI profiles (mid-month solar
  #     geometry; fixes v1's missing-diffuse/over-beam flaw), and DIF_m =
  #     the report's annual DIF 875.2 kWh/m2 spread by extraterrestrial
  #     availability (days x H0; slightly conservative in the monsoon).
  #     Ground-reflected (~3%) omitted, as in all prior versions.
  #     Derivation script: scripts/f1_gsa_monthly_shape.py ( step on
  # data). Derived annual GTI 1,817 vs the report's GTI_opta
  #     1,925.4 (-5.6%, isotropic-diffuse conservatism) - SHAPE-ONLY, the
  #     gap does not enter: the annual anchor below re-normalises.
  # ANNUAL anchor (unchanged since A24): GSA PVOUT_specific 1517.4 kWh/kWp.
  #   modifier[m] = 1517.4 * (GTI_m / sum_m GTI_m) / (5.18 h * days_m).
  # Fog Retired: Gsa's satellite Dni already contains fog
  #   attenuation (jan DNI 78.4 vs mar 147.5 - the IGP fog trough is IN the
  #   data), so the A19 fog-day multiplier is disabled via climate.yaml
  #   (fog_days renamed fog_days_observed_unused; accessor returns 1.0).
  #   Temperature derating (A2) and PM2.5/dust SOILING (A19) remain: panel-
  #   level physics not present in irradiance data.
  # Soiling Double-Count - The Sentence Above Was The
  #   Error. It is true of Irradiance data, but this anchor is Not
  #   irradiance: GSA PVOUT_specific is a simulated PV SYSTEM output that
  #   Solargis/World Bank have ALREADY derated for soiling. World Bank/ESMAP
  #   methodology, verbatim: "The simulation assumes a loss of 3.5% due to
  #   dirt and soiling." The A19 multiplier was applied ON TOP, costing a
  #   further 2.341% energy-weighted (recomputed from this config), for an
  #   effective combined soiling of 1 - 0.965 x 0.97659 = 5.759%.
  #   This is the SAME reasoning used to zero
  #   dc_loss_fraction and switch off the absolute temperature derate; the
  #   audit simply missed soiling, and it is the fourth instance of this one
  #   error class on this one anchor.
  #   "Punjab is dirtier than the global default" does NOT rescue the stack:
  #   the model's own soiling term (2.341%) is BELOW GSA's global 3.5%, so
  #   the correct treatment is to REPLACE, not to add.
  #   FIX: the YIELD path now renormalises the A19 multiplier so its annual
  #   energy-weighted mean is exactly 1.0, preserving the SEASONAL SHAPE
  #   (jan -6.3%, monsoon 0% after rain washing) - which is real information
  #   GSA's flat 3.5% does not carry - while removing the double-charged
  #   LEVEL. Worth +2.397% on PV yield, ~+11.9 GWh/yr in the base year.
  #   Implemented as a SEPARATE getter
  #   (Economics.pv_soiling_yield_multiplier_for_month) so the raw A19
  #   function keeps its unit tests and so pm25_period_soiling_relief, which
  #   divides two of its values, is untouched.
  soiling_renormalise_to_gsa_anchor: true
  # CROSS-SOURCE validation (kept for the viva): jun/jan = 1.573 here vs
  #   1.51 (NASA v3) - two independent satellite sources agree on
  #   the fog winter; jan modifier 0.5417 vs 0.5608 (NASA) vs 0.563 (v1).
  #   oct/jun = 1.015 here vs 1.098 (NASA) - both inside the audit band
  #   (flag > 1.15); October's per-day edge over June largely evaporates
  #   once the diffuse term is included. Audit section 2 re-anchors to
  #   jun/jan ~1.57 / oct/jun ~1.02 / per-day peak in APRIL at this table.
  monthly_modifier:
    jan: 0.5417   # Gti 104.2 kWh/m2/mo (3.36/day) - fog trough (in Gsa Dni)
    feb: 0.7845   # GTI 137.5 (4.87/day)
    mar: 0.9491   # GTI 182.5 (5.89/day)
    apr: 1.0214   # GTI 190.1 (6.34/day) - per-day annual peak
    may: 0.9727   # GTI 187.0 (6.03/day)
    jun: 0.8522   # GTI 158.6 (5.29/day) - monsoon onset ~28 Jun
    jul: 0.7241   # GTI 139.2 (4.49/day) - peak monsoon
    aug: 0.7723   # GTI 148.5 (4.79/day)
    sep: 0.8477   # GTI 157.8 (5.26/day) - monsoon retreat
    oct: 0.8652   # GTI 166.4 (5.37/day) - clear month; diffuse-corrected
    nov: 0.6945   # Gti 129.2 (4.31/day) - stubble haze (in Gsa Dni)
    dec: 0.6037   # GTI 116.1 (3.74/day) - fog season begins
  # NOTE: monthly x daypart gives the absolute slice capacity factor (output /
  # nameplate) directly. We do NOT also multiply by `base_annual_capacity_factor`
  # - that field is informational only.
  # (v4): annual sum across the slices returns the GSA anchor
  # 1517.4 kWh/kWp (shape-only + annual-neutral, same convention as
  # A24/FX-2/FX-2b before it; verified in scripts/f1_gsa_monthly_shape.py).
  # (v5,: PER-MONTH daypart shapes
  # from the Same Gsa report's Hourly tables (../Data/GSA_Report_Punjab_v2_hourly.xlsx,
  # report; hourly DNI carries the REAL diurnal cloud/fog timing).
  # Derivation (scripts/f1_gsa_daypart_shape.py on data):
  # hourly GTI = DNI_h x cos(theta_i) + monthly-DIF spread by sky visibility,
  # bucketed to the 12 dayparts, each month normalised to the SAME 5.18
  # equivalent-full-sun-hours convention -> the v4 monthly modifiers and the
  # 1,517.4 annual anchor are UNCHANGED by construction. Fixes the flat
  # all-months curve's seasonal error (it gave January dawn 15x too much:
  # 06_08 jan 0.036 real vs 0.08 flat; winter is midday-squeezed, summer has
  # long tails - affects battery/evening-peak sizing and export-cap bites).
  # Validated against Gsa's own hourly Generation table: daypart shares agree
  # within ~1-4 pp every month (their afternoons run slightly higher = their
  # baked-in temperature/inverter shape, which OUR chain applies separately
  # via A2 - documented overlap, second-order).
  # The flat `daypart_shape` below is RETAINED as the back-compat fallback
  # (legacy fixtures/tests without the by-month table).
  daypart_shape_by_month:
    jan: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0360, "08_10": 0.3773, "10_12": 0.7369, "12_14": 0.8276, "14_16": 0.5320, "16_18": 0.0802, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
    feb: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0465, "08_10": 0.4047, "10_12": 0.7369, "12_14": 0.7914, "14_16": 0.5075, "16_18": 0.1030, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
    mar: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.0841, "08_10": 0.4217, "10_12": 0.7108, "12_14": 0.7483, "14_16": 0.4945, "16_18": 0.1306, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
    apr: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0000, "06_08": 0.1241, "08_10": 0.4304, "10_12": 0.6907, "12_14": 0.7146, "14_16": 0.4791, "16_18": 0.1511, "18_20": 0.0000, "20_22": 0.0000, "22_24": 0.0000}
    may: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0087, "06_08": 0.1469, "08_10": 0.4273, "10_12": 0.6682, "12_14": 0.6875, "14_16": 0.4722, "16_18": 0.1705, "18_20": 0.0087, "20_22": 0.0000, "22_24": 0.0000}
    jun: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0165, "06_08": 0.1634, "08_10": 0.4197, "10_12": 0.6436, "12_14": 0.6668, "14_16": 0.4743, "16_18": 0.1892, "18_20": 0.0165, "20_22": 0.0000, "22_24": 0.0000}
    jul: {"00_02": 0.0000, "02_04": 0.0000, "04_06": 0.0160, "06_08": 0.1715, "08_10": 0.4123, "10_12": 0.6335, "12_14": 0.6673, "14_16": 0.4770, "16_18": 0.1964, "18_20": 0.0160, "20_22": 0.0000, "22_24": 0.0000}
