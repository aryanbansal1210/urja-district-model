# ---------------------------------------------------------------------------
# Cooling-tech mix per residential income class.
# Each tech: w_per_m2_peak + monsoon_effectiveness (fan / desert cooler ineffective
# in humid monsoon; AC unchanged).
# ---------------------------------------------------------------------------
# FIX. The `w_per_m2_peak` values below are
# TECHNOLOGY properties, but the FX-3 derivation that produced the headline
# 16 W/m2 was tied to a SPECIFIC dwelling size: "High-income ~200 m2 with 4
# bedroom/living units... 4 x 1.05 x 0.76 / 200 = 16 W/m2". On the
# plotted kothis, and this derivation was never re-run. Applying 16 W/m2 to
# 300 m2 hands each household 4.79 kW of AC input, which back-solves to
# 6.0 units - two more than the citation bought.
# Correction, stated as units rather than hidden in a W/m2:
#   reference (cited): 4 units / 200 m2
#   actual (this fix): 5 units / 300 m2
#   factor = (5/300) / (4/200) = 0.8333
# Why 5 and not 4, and not 6: rooms scale with dwelling area but SUB-linearly,
# so mechanically re-using the 200 m2 unit count at 300 m2 would be the mirror
# image of the original error. A 300 m2 G+3 kothi has ~4 bedrooms plus a
# living room; 1.5x the area buying 1.25x the units is the defensible step.
# The 0.76 evening coincidence already handles simultaneity, so this is
# INSTALLED units, not running units.
# HONESTY: no source gives AC count against dwelling floor area for Indian
# housing (searched; expected to stay unsourced - see
# PERPLEXITY_PROMPT_AUDIT_GAPS_20260806.md item 6). The unit count is a
# Declared Modelling Assumption, not a citation. What IS cited is the 1.05 kW
# BEE 5-star input and the 0.76 coincidence, both unchanged.
# Effect: high-income cooling intensity 16.00 -> 13.33 W/m2, i.e. 4.79 ->
# 3.99 kW/HH (-16.7%). Mid income is NOT corrected: 16.80 W/m2 x 100 m2 =
# 1.68 kW/HH back-solves to 2.1 units, which is right for a 100 m2 flat.
cooling_intensity_dwelling_correction:
  high_income_residential: 0.8333

cooling_technologies:
  # (FX-3 Option C,: the "Path A" intensities are
  # REVERTED to bottom-up cited values. Path A had bumped these peaks
  # (inverter 12->16->22, window 18->22, cooler 6->8->10) explicitly "to
  # bring annual demand from 215 GWh -> ~350 GWh (target 3.5 MWh/cap-yr per
  # CEEW / NSSO urban India)" - i.e. a top-down target-chase. The
  # critique found the resulting demand is 1.8x the project's own
  # Punjab anchor (PANJ ~2,000 kWh/cap) with per-HH cooling peaks of 2.17 kW
  # (mid) / 4.35 kW (high) - equivalent to 136 / 272 m2 dwellings at a
  # demand land bottom-up (~3,235 kWh/cap; -9.1% district demand).
  # Bottom-up derivation of the peaks (per BUILT-UP dwelling m2, with
  # within-dwelling unit diversity at system peak):
  #   - inverter_ac_5star 16 W/m2: BEE 5-star 1.5TR inverter split draws
  #     ~1.0-1.1 kW input. RE-SOURCED (value unchanged). This was
  #     cited to the bare beestarlabel.com portal, which was opened and found
  #     to be a NAVIGATION PAGE - zero occurrences of "air conditioner",
  #     "ISEER" or "kW" - so it evidenced nothing. Replaced by the Pib/BEE
  #     notification release, which publishes the official ISEER band (,
  #     PIB Delhi, notification dated):
  #       "the Indian Seasonal Energy Efficiency Ratio (ISEER) as per the new
  #        standards will range from (3.30 - 5.00) for split and (2.70 - 3.50)
  #        for window air conditioners"
  #     A 5-star split sits at the TOP of that band, ISEER 5.00, so:
  #       1.5 TR x 3.517 kW/TR = 5.2755 kW cooling; 5.2755 / 5.00 = 1.055 kW
  #     which lands inside the 1.0-1.1 kW used here. source
  #     arithmetic, and it replaces a homepage with a document.
  #     Units Caveat, stated rather than buried: ISEER is a Seasonal ratio
  #     integrated over ISO 16358 bin hours, not a rated-point COP. The
  #     rated-point input at design conditions is typically somewhat HIGHER
  #     than the seasonal average, so using 1.05 kW in a PEAK W/m2 term is a
  #     mild UNDER-statement of peak draw, not an over-statement. Conservative
  #     in the direction that matters for a capacity calculation.
  #     https://www.pib.gov.in/pressreleasepage.aspx?prid=1598508&reg=48&lang=2
  #     High-income ~200 m2 with 4
  #     bedroom/living units at ~0.72-0.76 evening coincidence:
  #     4 x 1.05 x 0.76 / 200 = 16 W/m2 ( derived; multi-AC
  #     ownership per CEEW India Cooling Action / IRES).
  #     *** Root Domain Replaced - `ceew.in/publications` is an
  #     index and evidences nothing. IRES 2020 is a real, locatable survey
  #     (~15,000 households, 1,210 villages, 614 wards, 152 districts,
  #     21 states) and its own documents are: ***
  #       questionnaire   https://www.ceew.in/sites/default/files/CEEW-IRES-Questionnaire-7Oct20.pdf
  #       design/quality  https://www.ceew.in/sites/default/files/CEEW-IRES-Design-and-data-quality-4Oct20.pdf
  #       unit-level data https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/U8NYUP
  #     *** And A Contradiction TO Resolve Before The Cooling Shares Are
  #     DEFENDED - flagged, NOT acted on (register. *** A
  #     sweep surfaced a claim that NFHS-5 (2021) reports 70.2% of URBAN
  #     mid-income AC 100% -> 80% precisely BECAUSE it read urban Punjab AC
  #     ownership as ~17-30% today (CEEW IRES). 70.2% vs ~25% cannot both be
  #     AC-only. The most likely explanation is a DEFINITION difference -
  #     NFHS-style questions often combine "air conditioner OR cooler", which
  #     would reconcile ~25% AC + ~45% cooler with a 70% combined figure. DO
  #     NOT quote either number until the NFHS-5 Punjab factsheet question
  #     wording is read directly. If NFHS-5 really is AC-only,'s premise
  #     inverts and 80% mid-income AC in 2030 is CONSERVATIVE, not aggressive.
  #   - window_ac_3star 18 W/m2: BEE 3-star 1.5TR window unit ~1.4-1.5 kW
  #     input ( label data). Mid ~100 m2, 2 units at ~0.62
  #     coincidence: 2 x 1.45 x 0.62 / 100 = 18 W/m2 ( derived).
  #   - desert_cooler 8 W/m2: 170-230 W per cooler (market spec sheets,
  #); EWS/LIG blend ~43 m2 with 1-2 units: 1.7 x 0.2 / 0.0427
  #     = 8 W/m2 ( derived).
  #   - monsoon_effectiveness 0.60 for coolers kept (partial humid-season
  #     use, not near-useless; unchanged from the documented calibration).
  fan_only:
    w_per_m2_peak: 1.0       # fans are baseload, not cooling per se
    monsoon_effectiveness: 1.0
    cop: 0.0                 # informational
  desert_cooler:
    w_per_m2_peak: 8.0           # FX-3 revert (was 10): 1-2 coolers x ~200 W over EWS/LIG 43 m2
    monsoon_effectiveness: 0.60  # was 0.30; partial use, not near-useless
    cop: 8.0                 # very efficient when humid air available
  window_ac_3star:
    w_per_m2_peak: 18.0          # FX-3 revert (was 22): 2 x 1.45 kW BEE-3star over mid 100 m2, 0.62 diversity
    monsoon_effectiveness: 1.0
    cop: 2.8
  inverter_ac_5star:
    #: 16.0 -> 17.5 W/m2.
    # 4 x 1.15 kW over high-income 200 m2 at 0.76 diversity = 17.48.
    # WHY. The old 1.05 kW came from 5.2755 kW cooling / ISEER 5.00. The block
    # above Already warned that ISEER is a Seasonal ratio and the rated-point
    # input is "typically somewhat Higher" - this change puts a Measured Number
    # on "somewhat". Two 2025 BEE-label 1.5 T 5-star units, manufacturer
    # datasheets, rated cooling / Rated Power Input / ISEER:
    #     Blue Star IE518PNU  5,100 W / 1,280 W / 5.05   -> rated COP 3.98
    #     Blue Star B-series  5,110 W / 1,300 W / 5.05   -> rated COP 3.93
    #     mean rated input 1,290 W; mean rated Cop ~3.96, Not the ISEER 5.05
    # A third unit (Panasonic CS/CU-NU18AKY5WX, ISEER 5.20) publishes only
    # 759.55 kWh/yr, which over BEE's 1,600 test hours is 475 W - the SEASONAL
    # AVERAGE, less than half the rated input. That is exactly the quantity
    # ISEER-division recovers, and exactly the wrong one for a peak.
    # The 1.15 kW IS A Stated 2030 Fleet Assumption, not the 2025 measurement:
    # 1.29 kW measured today, improved ~2%/yr to 2030 (BEE tightened the star
    # bands for 2026, so a 2030 5-star unit genuinely is better than a 2025
    # one). Keeping 1.05 would have required ~3.5%/yr for five years, faster
    # than AC efficiency has ever moved - that is the part that was not
    # defensible, and it is why this moved.
    # Also Correcting The Label Above: understating Peak draw was described as
    # "conservative... for a capacity calculation". It is the opposite - a low
    # peak UNDER-sizes the connection and the battery. It is conservative for
    # the vs-BAU ratio (both sides move together) but optimistic for sizing.
    # SENSITIVITY OWED: 1.05 / 1.15 / 1.29 kW (= 16.0 / 17.5 / 19.6 W/m2).
    # https://consumer.bluestarindia.com/products/inverter-split-ac-p-series-1-5-ton-5-star
    # *** BEE Schedules Retrieved - The Method Argument IS Now
    # Tier 1, Even Though The Value Stays Datasheet-Anchored. ***
    # obtained BEE Schedule 3 (Room Air Conditioners, Rev. 26.05.2016,
    # https://www.beestarlabel.com/Content/Files/Schedule3A-RAC9jun.pdf ) and
    # Schedule 19 (Variable Capacity / inverter ACs). Three things they
    # establish, all verbatim:
    #  (1) Rated Input IS A Separate Published Parameter From The Efficiency
    #      RATIO. Schedule 3's scope list reads "1. Rated power (input).
    #      2. Rated capacity (output). 3. Energy Efficiency Ratio (EER) for
    #      cooling. 4. Star rating." So the scheme itself distinguishes the
    #      rated point from the ratio - which is the whole basis of this fix.
    #  (2) ISEER IS Explicitly Seasonal. Schedule 19: "Method of evaluation of
    #      Cstl, Csec and ISEER is based on bin temperature range of 24-43 C
    #      and 1600 operating hours for cooling per annum", and ISEER is
    #      defined as annual heat removed / annual energy consumed. Dividing a
    #      rated cooling capacity by ISEER therefore yields a Seasonal Average,
    #      not a peak. This is the error the old 1.05 kW derivation made.
    #      IT Also Validates The Cross-Check: the Panasonic unit's 759.55
    #      kWh/yr over BEE's own 1,600 h = 475 W, i.e. ~2.7x BELOW the
    #      measured rated input of 1,280-1,300 W. The 1,600 h is BEE's figure,
    #      not an assumption of ours.
    #  (3) COHERENCE CHECK against the last published band: Schedule 3 Table
    #      2.6 (label period 01-01-2016 to 31-12-2017) sets the 5-star SPLIT
    #      floor at EER >= 3.50 W/W. The two measured 2025 units give rated
    #      COP 3.98 and 3.93 - about 13% above that floor, which is the right
    #      direction and magnitude for nine years of improvement.
    # What The Schedules DO **Not** Give, stated plainly: Schedule 3 stops at
    # label period 2017 and Schedule 19 at 2019. **NO OFFICIAL 2025 OR 2026
    # ISEER Band Table Was Found**, and neither schedule lists a rated input
    # for a specific ~5.2 kW 5-star unit. So the 1.15 kW VALUE remains
    # anchored on the two manufacturer datasheets  plus a stated
    # 2%/yr improvement; only the METHOD is now. Do not claim BEE
    # publishes this number. Register.
    w_per_m2_peak: 17.5
    monsoon_effectiveness: 1.0
    # Note `cop` is Dead Config - no production code reads it (verified
    #); only `w_per_m2_peak` is consumed. Kept as documentation of
    # the assumed machine, and it should read ~3.96 rated, not 4.5.
    cop: 4.5

cooling_tech_mix_by_category:
  # CHANGED - this documents what the 0.75 already IS, rather than leaving it
  # to look like a single measured figure. ***
  # demographics.yaml carries Four income bands (EWS 0.20 / LIG 0.20 /
  # MIG 0.45 / HIG 0.15) but the energy model collapses EWS + LIG into the one
  # `residential_low` land use, because splitting them would need a 4th
  # residential land use and would disturb the FROZEN seed-42 layout.
  # So `desert_cooler: 0.75` below is NOT an EWS ownership rate. It is the
  # 50:50 Population-Weighted Blend of two bands that differ in what they can
  # afford, and the implied split behind it is roughly:
  #       EWS  ~60% desert cooler   (the rest fan-only)
  #       LIG  ~90% desert cooler
  #       0.5 x 0.60 + 0.5 x 0.90 = 0.75
  # Why IT IS Documented Rather Than Split: no EWS-specific cooling-ownership
  # figure exists in any source checked. CEEW builds wealth deciles but uses
  # them for PURCHASE decisions, not stock ownership. Splitting the tier would
  # therefore mean inventing an EWS number AND paying the layout cost, i.e.
  # more precision on screen and no more evidence behind it.
  # The Honest Viva Answer, which this comment exists to make available:
  # "the poorest 20% and the next 20% share one energy tier; the 75% is their
  # blend, the implied EWS rate is ~60%, and it is an assumption not a
  # measurement." An examiner asking "what about the poorest?" gets that,
  # instead of a number that silently implies EWS households are as equipped
  # as LIG ones.
  #: Low Income Gets 10% Box AC. It previously had exactly
  # ZERO air conditioning, and a hard 0% floor for 40% of the town's households
  # will own a window unit, and Punjab's 300 free units/month removes most of
  # the running cost that would otherwise stop them. Taken from the cooler
  # share, not the fan share, because the household upgrading is the one that
  # already cools.
  #   was  {fan 0.25, cooler 0.75, window 0.00}  = 6.25 W/m2
  #   now  {fan 0.20, cooler 0.70, window 0.10}  = 7.60 W/m2  (+21.6%)
  # Town-Wide AC Ownership Goes 51% -> 55% IN 2030. State that plainly: it is
  # *** Pnas Attribution Unverified, (named-source sweep). ***
  # A sourcing pass could Not locate a Pnas paper giving ~40% National
  # Indian AC prevalence in 2050. The closest verifiable figure is
  # GLOBAL, not Indian: household AC share rising 27% -> 41% by
  # mid-century (scenario range 33-48%), with China, India and
  # Indonesia together accounting for half of all AC units by 2050 -
  # Nature Communications (2024),
  # https://www.nature.com/articles/s41467-024-52028-8.
  # So the ~40% may be a GLOBAL figure re-labelled as Indian. That is
  # "India ~40% by 2050 (PNAS)" until the paper is produced.
  # The ARGUMENT this line supports still holds on the verifiable
  # figure: current Indian urban AC ownership is ~10% on average and
  # 20-25% in higher-income groups, so this model's 51% in 2030 is
  # aggressive either way and does not need headroom.
  # already above India's projected ~40% NATIONAL prevalence in 2050 (PNAS
  # 2023, SSP585), and this pushes it further. The defence is that this is an
  # affluent planned urban development in a hot region and national figures
  # include rural and cooler states - NOT that the figure is conservative,
  # because it is not.
  # Note The Direction IT Moves The Ratio: up. It was applied because 0%
  # is indefensible, not to improve that number, and the ratio was already at
  # 0.6% before this change. Whatever it lands on gets reported.
  low_income_residential:    {fan_only: 0.20, desert_cooler: 0.70, window_ac_3star: 0.10, inverter_ac_5star: 0.0}
  # window 0.40 + inverter 0.60, no cooler, no fan-only share. That is a 2030
  # assumption against roughly 17-30% urban AC ownership in Punjab today, and it
  # is the single most aggressive growth assumption in the model. Cut to 80% AC.
  # The freed 20% goes to a DESERT COOLER rather than a bare fan: a mid-income
  # Punjab household without AC in 2030 owns an evaporative cooler, not nothing.
  # The 40:60 window:inverter split within the AC share is preserved.
  #   80% AC + 20% cooler = 15.04 W/m2 (was 16.80, a 10.5% cut)
  #   80% AC + 20% bare fan would have given 13.64 - rejected as unrealistic
  # Note for whoever reads land_use.py: This Table Wins. The
  # `cooling_load_w_per_m2_peak` and `has_ac` fields in core/land_use.py are
  # DEAD for these categories - `_weighted_cooling_w_per_m2` builds the peak
  # from this mix and never reads them. That is why low income shows
  # `cooling_load_w_per_m2_peak=0.0` yet still draws cooling: it has 75% desert
  # cooler here, giving 6.25 W/m2.
  mid_income_residential:    {fan_only: 0.0,  desert_cooler: 0.20, window_ac_3star: 0.32, inverter_ac_5star: 0.48}
  high_income_residential:   {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.0,  inverter_ac_5star: 1.0}
  school:                    {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.50, inverter_ac_5star: 0.50}
  office:                    {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.30, inverter_ac_5star: 0.70}
  shopping_centre:           {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.20, inverter_ac_5star: 0.80}
  retail_highstreet:         {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.50, inverter_ac_5star: 0.50}
  restaurant_food_service:   {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.40, inverter_ac_5star: 0.60}
  hotel_guesthouse:          {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.30, inverter_ac_5star: 0.70}
  healthcare:                {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.20, inverter_ac_5star: 0.80}
  light_industry:            {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.50, inverter_ac_5star: 0.50}
  warehouse_cold_storage:    {fan_only: 0.0,  desert_cooler: 0.0,  window_ac_3star: 0.0,  inverter_ac_5star: 1.0}
  public_services:           {fan_only: 1.0,  desert_cooler: 0.0,  window_ac_3star: 0.0,  inverter_ac_5star: 0.0}
  religious:                 {fan_only: 1.0,  desert_cooler: 0.0,  window_ac_3star: 0.0,  inverter_ac_5star: 0.0}

# ---------------------------------------------------------------------------
# Heating load (north India winter; electric only).
# Per category peak W/m^2 + heating factor (multiplicative by month + daypart).
# ---------------------------------------------------------------------------
heating_loads:
  # Path A calibration: Punjab winter heating was understated.
  # Real Indian middle-income geyser-+-room-heater peak is closer to 8-10
  # W/m^2 (1.5 kW geyser + 2 kW heater per 250 m^2 = 14 W/m^2 effective)
  # but only running in Dec-Feb mornings. Modest bumps to reflect reality.
  per_category_peak_w_per_m2:
    # Everything Except Water Heating. Base load carries an explicit x1.34 CEA
    # NEP 2030 uplift; EV has a declared "2030-stock ownership model"; cooling
    # assumed AC in every mid and high income home, against ~17-30% in urban
    # Punjab today. Water heating alone still sat on a PRESENT-DAY measurement:
    # low 19% and mid 30%, which is roughly CEEW's ~19% estimate for Punjab in
    # 2020 (67% of Punjab households use hot water for bathing, but only ~28% of
    # those do it electrically - most use the LPG cookstove).
    # The Argument IS Internal Consistency, Not Optimism. An air conditioner
    # costs Rs 30,000+, a storage geyser about Rs 8,000, an immersion rod about
    # Rs 300. A model cannot assume the SAME 2030 mid-income household owns an
    # air conditioner with certainty but has only a 30% chance of owning a
    # geyser. Whatever income growth delivers universal AC delivers water
    # heating first, because it is four times cheaper and needed every winter.
    # Punjab-specific reinforcement: domestic consumers receive 300 free units a
    # month, which removes the RUNNING cost that CEEW identifies as the real
    # barrier ("households using geyser typically earn twice than those using
    # chulha"). With the appliance cheap and the marginal electricity free, the
    # remaining barrier to electric water heating is close to zero.
    # low  -> 60% immersion-rod ownership (Rs 300 appliance, free marginal
    #         electricity; still short of universal because the poorest tier
    #         retains cookstove habits)
    # mid  -> 100%, matching the AC-ownership assumption the model already makes
    # high -> UNCHANGED at 108%; it was already effectively universal
    # Space heating is held CONSTANT in absolute kW for both tiers (see the
    # dhw_share entries), so this changes water heating only.
    # =================================================================
    # *** Was Over-Applied TO Low Income.. ***
    # raised electric water heating to a "2030 basis" on this
    # argument, quoted verbatim from its own note below:
    #   "A model cannot assume the SAME 2030 mid-income household owns an
    #    air conditioner with certainty but has only a 30% chance of owning
    #    a geyser."
    # That IS AN Argument About Mid Income. It was applied to Low income as
    # well (19% -> 60%), and **low income has NO AIR CONDITIONING in this
    # model at all** - its cooling mix is 25% fan / 75% desert cooler /
    # 0% AC. There was no inconsistency to fix in that tier, so the tier
    # that received the largest proportional raise is the one the
    # justification does not cover.
    # What The Evidence Says, and note it is the config's Own prior figure:
    #   low   15-25% geyser/fixed-heater ownership; most use portable
    #         immersion rods. This BRACKETS the 19% that overwrote,
    #         which came from CEEW (67% of Punjab households use hot water,
    #         only ~28% of those electrically). Two independent reads
    #         agreeing on ~19-20% against a model value of 60%.
    #   mid   90-95% own at least one geyser - so the model's 100% is only
    #         slightly high, and was substantially RIGHT here.
    #   high  ~100%, and typically More Than One (see the note on
    #         dhw_share_of_peak_by_category below - this tier may be
    #         UNDERSTATED, and it is deliberately left alone rather than
    #         guessed).
    # Arithmetic OF The Change (floor areas: low 42.7 m2, mid 100 m2):
    #   low   water 60% x 1 kW immersion / 42.7 m2 = 14.05 -> 20% = 4.68
    #         space leg unchanged at 0.40      total 14.45 -> 5.08 W/m2
    #   mid   water 100% x 2 kW / 100 m2 = 20.0 -> 92% = 18.4
    #         space leg unchanged at 2.0       total 22.0  -> 20.4 W/m2
    # Low income is ~40% of households and takes a 64% cut to its heating
    # peak, so this is the material half of the change.
    # *** Not Tuned TO The Benchmark. *** This is corrected because the
    # justification did not apply to low income and two sources say ~20%,
    # not because it moves the PSPCL seasonality ratio. It happens to move
    # it toward 1.708; that is a consequence, and's standing rule is
    # that nothing is ever tuned to that number.
    # =================================================================
    low_income_residential:   5.08  # 20% immersion rod (CEEW ~19%; was 60%, over-applied)
    mid_income_residential:  20.4   # 92% geyser ownership (was 100%)
    # 3.600 kW/HH, which the note below reads as 108% geyser + 72% room-heater
    # ownership. The 72% Has NO Source. BEE 2024 - the same survey this block
    # cites - reports only 46 of 4,321 households owning a room heater (1.06%),
    # calls ownership "negligible across both segments", and says only that it is
    # "higher among the upper class" WITHOUT a figure. No Punjab-specific survey
    # was found (the one candidate, Kumar et al. IOPscience 2023, is rural-only
    # and explicitly excludes electric heating).
    # So the 18% here is DERIVED from this block's own cited BEE finding that
    # "geysers [are] roughly 6x commoner than room heaters": 108% / 6 = 18%.
    #   water  0.60 x 3.600 = 2.160 kW/HH  (= 108% x a 2 kW geyser, unchanged)
    #   space  0.18 x 2.0   = 0.360 kW/HH  (was 1.440 = 72%)
    #   total               = 2.520 kW/HH -> 2.520 x 1000 / 300 = 8.40 W/m2
    # dhw_share_of_peak_by_category.high_income_residential moves 0.60 -> 0.857
    # to keep the water leg at 2.160 kW. Low and Mid are Not touched: low's
    # implied 1.07% lands on BEE's national 1.06% almost exactly, and mid's 10%
    # is inside what BEE's "higher among the upper class" supports.
    high_income_residential: 8.4    # 108% geyser + 18% room heater (BEE 2024 derived)
    school:                  4.0    # was 3
    office:                  5.0    # was 4
    shopping_centre:         2.0
    retail_highstreet:       2.0
    restaurant_food_service: 5.0    # was 4
    hotel_guesthouse:        8.0    # was 6; guest-room heating peak
    healthcare:              7.0    # was 5; space + medical hot water
    light_industry:          0.0
    warehouse_cold_storage:  0.0
    public_services:         2.0
    religious:               1.0

  # (Realism audit B3): when `heating_baseline_c` is set AND
  # `config/climate.yaml` is loaded, the heating factor for each month is
  # computed as a heating-degree-day (HDD) proxy: factor = max(0,
  # baseline_c - climate.t_min_c) / max_hdd_across_year, so January
  # (coldest t_min) maps to ~1.0 and warm months naturally fall to 0.
  # The hardcoded table below is the LEGACY fallback used when climate
  # data is absent (keeps existing tests passing on small grids).
  heating_baseline_c: 18.0    # standard HDD baseline for residential thermal comfort
  heating_factor_by_month:
    jan: 1.00
    feb: 0.85
    mar: 0.40
    apr: 0.10
    may: 0.00
    jun: 0.00
    jul: 0.00
    aug: 0.00
    sep: 0.00
    oct: 0.10
    nov: 0.50
    dec: 0.95

  # LEGACY single shape. Kept ONLY as the fallback for small-grid / no-climate
  # tests. Superseded by the HEAT-1 split below - see
  # `Economics.heating_split_factor`. Do not add to it.
  heating_daypart_shape:
    "00_02": 0.40
    "02_04": 0.50
    "04_06": 0.80
    "06_08": 1.00     # morning geyser peak
    "08_10": 0.60
    "10_12": 0.20
    "12_14": 0.10
    "14_16": 0.10
    "16_18": 0.30
    "18_20": 0.70
    "20_22": 0.80
    "22_24": 0.60

  # =====================================================================
  # HEAT-1 SPLIT. Audit findings + + +
  # + are ONE defect in five places: a single set of dials
  # drove two physically different loads.
  #   WATER HEATING  a geyser. Runs a short burst when someone bathes.
  #                  Needed EVERY month of the year, because the energy is
  #                  proportional to (bath temperature - inlet temperature)
  #                  and that is never zero. Has a real thermal store, so
  #                  it is the load that can genuinely be shifted.
  #   SPACE HEATING  a room heater. Runs in the evening and overnight, in
  #                  winter only. No store: shifting it does not move the
  #                  load, it removes the heating.
  # The old model gave both the same daily curve (geyser load at 02:00,
  # which nobody draws), the same season (hot water exactly ZERO for seven
  # months), the same peak, and put all of it in the shiftable pool.
  # What Did Not Change: `per_category_peak_w_per_m2` above.
  # survey and they hold up as ownership x a real appliance:
  #   low  0.213 kW/HH = ~19% of homes x a 1 kW immersion rod
  #   mid  0.800 kW/HH = ~30% of homes x a 2 kW storage geyser
  #   high 3.600 kW/HH = ~108% of homes x a 2 kW storage geyser
  #   room heaters, same read: low 1%, mid 10%, high 72%
  # BEE 2024 national is 6% geyser and 1.06% room heater, with 97% of
  # geysers in middle/upper class. Punjab sits in BEE's COMPOSITE zone and
  # has real winters, so the model reading above the national figure is
  # expected - and the low-income room-heater read of 1% lands on BEE's
  # national 1.06% almost exactly. Source:
  # Bureau of Energy Efficiency, "Residential Energy Consumption Patterns
  # and Appliance Ownership in India: Insights from a 2024 Household
  # Survey", May 2026, pp. 13-14 (design, n=4,321) and pp. 26-27
  # (ownership). https://beeindia.gov.in/WriteReadData/L45218/2878513814676762.pdf
  # WITHDRAWN: recommended restoring the "un-derated" 14-16 W/m2,
  # worth +32.6 GWh. Its mechanism critique was right (deriving a peak and
  # then discounting it for a season the month factor already applies IS a
  # double derate) but its magnitude assumed universal ownership. BEE says
  # ownership is nowhere near universal, so the recommendation is dropped.
  # =====================================================================

  # How each category's heating peak divides between the two loads.
  # Ownership-weighted, NOT nameplate-weighted: the config's old 1.5 kW
  # geyser + 2.0 kW heater arithmetic implied 43% water heating, but that
  # weights by what the appliances DRAW, not by how many households own
  # them. BEE finds geysers roughly 6x commoner than room heaters, and the
  # gap is widest at the bottom of the income scale - a household that
  # cannot afford a room heater still boils water. So the water share
  # FALLS as income rises., derived from the BEE ownership reads
  # above.
  dhw_share_of_peak_by_category:
    # recomputed to hold each tier's SPACE-heating leg constant in
    # absolute kW while the water leg falls (low 60%->20%, mid 100%->92%).
    #   low   water 4.68 of 5.08 total  -> 0.9213   (space stays 0.40 W/m2)
    #   mid   water 18.4 of 20.4 total  -> 0.9020   (space stays 2.0  W/m2)
    # Same discipline as: this is arithmetic to hold space heating
    # fixed, not a change of view about room heaters.
    low_income_residential:  0.9213 # holds space heating at 0.40 W/m2
    mid_income_residential:  0.9020 # holds space heating at 2.0 W/m2
    #: 0.60 -> 0.857. The heating PEAK for this tier fell
    # 3.600 -> 2.520 kW/HH when the unsourced 72% room-heater ownership was cut
    # to a BEE-derived 18%. The water leg is unchanged in absolute terms
    # (2.160 kW), so its SHARE of the smaller peak rises: 2.160/2.520 = 0.857.
    # Not a change of view about geysers - arithmetic to hold them constant.
    # *** High Income Carries Its Extra Bathrooms IN Hours, Not IN Units -
    # Read This Before "Fixing" IT (note. *** The water leg
    # here is 2.160 kW, which reads as ~1.08 geysers, and on a 300 m2 kothi
    # with three bathrooms that looks obviously too few. It is not. The extra
    # bathrooms are represented through RUNNING HOURS:
    #     dhw_running_hours   low 2.338   mid 1.428   HIGH 2.698 h/day
    # so the daily water-heating ENERGY is 2.160 kW x 2.698 h = 5.83 kWh/day,
    # against mid income's 1.840 x 1.428 = 2.63 kWh/day - high income uses
    # 2.2x the water-heating energy of a mid-income flat.
    # Cross-Checked Against The Obvious Alternative Framing
    # "3 toilets, on average 2.5 used daily, on for about 1 hour"):
    #     2.5 geysers x 1 h x 2 kW = 5.00 kWh/day
    #     the model already delivers 5.83 kWh/day, i.e. 17% MORE.
    # Two different mental models - count units, or count hours - land within
    # 17% of each other, and the model is on the higher side. So there is
    # nothing to fix, and raising the UNIT count without cutting the hours
    # would double-count the same showers.
    high_income_residential: 0.857  # geysers in several baths; heaters now 18%
    school:                  0.20
    office:                  0.25
    shopping_centre:         0.20
    retail_highstreet:       0.20
    restaurant_food_service: 0.80   # kitchen hot water dominates
    hotel_guesthouse:        0.75   # guest showers
    healthcare:              0.70   # the config's own comment: "space + medical hot water"
    public_services:         0.25
    religious:               0.30
    light_industry:          0.00   # peak is 0 anyway
    warehouse_cold_storage:  0.00

  # ---- WATER HEATING --------------------------------------------------
  dhw:
    # SEASON. Normalised so the coldest month = 1.00, then multiplied by
    # the peak. Ballot 3b: 60 C, the anti-Legionella storage standard and
    # the midpoint of the defensible band. IS 2082:1993 (,
    # https://law.resource.org/pub/in/bis/S05/is.2082.1993.pdf) sets the
    # standard's own test basis at 22 C inlet -> 72 C stored, a 50 K rise,
    # with a +/- 10 C thermostat tolerance.
    # DECLARED CONSERVATISM, and the viva answer worth knowing. Work the
    # mixing algebra and the setpoint CANCELS: to draw L litres of bath
    # water at 40 C you take L x (40 - inlet)/(setpoint - inlet) litres
    # from the tank, and the energy is L x (40 - inlet) whatever the
    # thermostat says. So the physically exact season for USEFUL draw runs
    # on (40 - inlet), which is sharper: 210 weighted days a year against
    # the 276 this 60 C basis gives. We keep 60 C because a storage tank
    # also loses heat to the room 24/7 on a (60 - ambient) basis, which
    # this crudely absorbs, and because it is the CONSERVATIVE choice - it
    # holds summer demand UP and so understates the size of our own
    # correction. Being able to say "the thermostat cancels; what matters
    # is the temperature people bathe at" is a stronger answer than any
    # setpoint assumption.
    setpoint_c: 60.0
    # Bath draw temperature. A human comfort constant, not a thermostat
    # setting - this is the number the energy actually depends on.
    bath_temperature_c: 40.0
    # Cold-water inlet proxied by monthly mean AIR temperature, the
    # standard Dhw convention (Iso 9459-2; BEE Ecbc 2017 service water
    # heating method,
    # https://beeindia.gov.in/en/programmesbuildings/ecbc ).
    # *** Code Named Wrongly,. Ecbc IS The Commercial
    # CODE. *** BEE's own "Handbook of Replicable Designs for Energy Efficient
    # Residential Buildings" (2021) states it plainly: "The commercial sector
    # among buildings has been addressed through Energy Conservation Building
    # Code (ECBC) for Commercial Buildings", and names the residential code as
    # **Eco Niwas Samhita (Ecbc-R)**. Citing Ecbc 2017 for a Residential hot
    # water convention is therefore the wrong instrument, and it is an easy
    # hit to take at viva.
    # NO VALUE IS AT RISK: the inlet convention is generic building physics
    # (ISO 9459-2 carries it independently), and the water-heating quantities
    # in this block are sourced to the MNRE "User's Handbook on Solar Water
    # parsed. Read this ECBC reference as a method pointer only; if it is
    # retained at all, name Eco Niwas Samhita instead.
    # *** Code Named Wrongly,. Ecbc IS The Commercial
    # CODE. *** BEE's own "Handbook of Replicable Designs for Energy Efficient
    # Residential Buildings" (2021) states it plainly: "The commercial sector
    # among buildings has been addressed through Energy Conservation Building
    # Code (ECBC) for Commercial Buildings", and names the residential code as
    # **Eco Niwas Samhita (Ecbc-R)**. Citing Ecbc 2017 for a Residential hot
    # water convention is therefore the wrong instrument, and it is an easy
    # hit to take at viva.
    # NO VALUE IS AT RISK: the inlet convention is generic building physics
    # (ISO 9459-2 carries it independently), and the water-heating quantities
    # in this block are sourced to the MNRE "User's Handbook on Solar Water
    # parsed. Read this ECBC reference as a method pointer only; if it is
    # retained at all, name Eco Niwas Samhita instead.
    # CONSERVATIVE for Indian summer: most Punjabi homes feed from a roof
    # tank in direct sun, so real July inlet runs WARMER than air, which
    # would push summer demand lower still.
    inlet_temperature_field: t_mean_c

    # HOW MUCH. Litres of hot water per person per day, at the 40 C bath
    # temperature above.
    # This block used to say IS 1172:1993 "allocates 20 lpcd to BATHING out
    # of its 135 lpcd domestic total". The standard was downloaded from the
    # exact Url cited and parsed in full. Both Halves Are Wrong. (a) There
    # is no bathing allocation anywhere in it; the only end-use split in the
    # document is flushing, clause 4.1.1 verbatim: "Out of the 150 to 200
    # litres per head per day, 45 litres per head per day may be taken for
    # flushing requirements and the remaining quantity for other domestic
    # purposes". Searching the text for "55" or "washing clothes" returns
    # zero hits, so the end-use breakdown that circulates online is not from
    # this standard. (b) 135 lpcd is not "its domestic total" - it is the
    # Reduced figure for LIG/EWS housing. For a town this size IS 1172 says
    # "For communities with population above 100 000 together with full
    # flushing system 150 to 200 lphd". Same failure mode as the AEEE
    # retraction: real standard, right topic, live URL, claim not in it.
    # Replacement Source, opened and parsed (, MNRE, Govt of India):
    # "User's Handbook on Solar Water Heaters" (2010), 36 pp, retained at
    # https://prod-qt-images.s3.amazonaws.com/indiawaterportal/import/sites/default/files/iwp2/Users_Handbook_Solar_Water_Heater_MNRE_2010.pdf
    # It is a better fit than IS 1172 ever was because its Table 4 is stated
    # "at 40 degree centigrade", the SAME basis as bath_temperature_c above.
    # Table 4, litres/person/day, bathing / all uses:
    #     high end bungalows in cities   80 / 125
    #     high end residential flats     60 /  95
    #     average residential flats      40 /  65
    #     semi urban households          40 /  50
    #     rural households               40 /  40
    # and p.18: "the average hot water requirement per person per day in an
    # average household in India is around 40 liters".
    # Why The Model Sits Well Below MNRE And The Values Did Not Change.
    # MNRE's table is a SIZING guide for solar water heaters, so it is
    # biased high by construction: under-sizing is the failure it exists to
    # prevent, and it describes households that have chosen to install a
    # solar system, not a population average. The binding check here is
    # MEASURED consumption, not design guidance. removed a geyser
    # from the eMARC base-load anchors worth 1.44 kWh/day scaled by tier
    # (mid 1.44 x 1.34 x 1.3 = 2.51, high 1.44 x 1.34 x 1.8 = 3.47), and
    # the litres below put back 2.86 kWh/day at mid and 5.40 at high in the
    # peak month. So this leg is already AT or ABOVE what eMARC measures,
    # and raising it toward MNRE would double-count the geyser a second
    # time. Measured beats design: the values stand. NOTE the high-income
    # leg puts back ~56% more than removed, which is logged as an
    # open question rather than silently trimmed.
    # step across income: low takes a 15 lpcd bucket-bath basis, mid
    # 20 lpcd, high 40 lpcd for showers across several bathrooms. This is
    # where INCOME enters the water side: the same appliance, used
    # differently because a bucket costs less to heat than a shower.
    hot_water_lpcd_by_category:
      low_income_residential:  15.0
      mid_income_residential:  20.0
      high_income_residential: 40.0
    # Occupancy, so litres/person becomes litres/household. Taken from the
    # model's OWN occupants_per_cell / households_per_cell in
    # core/land_use.py - not a new assumption.
    people_per_household_by_category:
      low_income_residential:  4.91   # 2300 / 468
      mid_income_residential:  4.50   #  900 / 200
      high_income_residential: 4.25   #  170 /  40
    # Appliance rating, which converts daily energy into RUNNING HOURS -
    # and running hours are the whole of the fifth HEAT-1 fault. The old
    # single daypart shape delivered 12.2 hours per day per unit of peak.
    # A thermostatic geyser runs 1-3 hours. Income enters again through
    # the appliance: an immersion rod is what a low-income household
    # actually owns, and it is half the power of a storage geyser.
    appliance_kw_by_category:
      low_income_residential:  1.0    # immersion rod
      mid_income_residential:  2.0    # storage geyser (IS 2082 15-25 L class)
      high_income_residential: 2.0    # storage geyser
    # Non-residential has no household count, so its equivalent full-load
    # hours per day are given directly (, occupancy-derived).
    running_hours_by_category:
      school:                  1.0
      office:                  1.0
      shopping_centre:         1.0
      retail_highstreet:       1.0
      restaurant_food_service: 3.0
      hotel_guesthouse:        3.0
      healthcare:              3.0
      public_services:         1.0
      religious:               1.0

    # WHEN. Unit-sum profiles; the code scales them to the running hours
    # above, so these say only "at what time of day", never "how much".
    # Income enters a third time, as duration: a low-income household
    # heats one bucket before work, a kothi runs geysers morning and
    # evening across several bathrooms.
    daypart_profile_by_class:
      low:
        "06_08": 0.70
        "08_10": 0.15
        "18_20": 0.10
        "20_22": 0.05
      mid:
        "04_06": 0.05
        "06_08": 0.45
        "08_10": 0.15
        "16_18": 0.05
        "18_20": 0.15
        "20_22": 0.12
        "22_24": 0.03
      high:
        "04_06": 0.06
        "06_08": 0.34
        "08_10": 0.16
        "10_12": 0.05
        "12_14": 0.03
        "14_16": 0.03
        "16_18": 0.06
        "18_20": 0.13
        "20_22": 0.11
        "22_24": 0.03
      commercial:
        "06_08": 0.15
        "08_10": 0.15
        "10_12": 0.12
        "12_14": 0.14
        "14_16": 0.12
        "16_18": 0.10
        "18_20": 0.12
        "20_22": 0.10

  # ---- SPACE HEATING --------------------------------------------------
  space_heating:
    # SEASON. Ballot 4b: standard heating degree days on the daily MEAN
    # temperature.: base 18 is a mean-temperature construct (CIBSE
    # TM41 "Degree Days: Theory and Application"; ASHRAE 90.1 and
    # IMD both use base 18.3 C = 65 F on the mean). Applying 18 against
    # the daily MINIMUM, as the model did, raises the effective balance
    # point by about 5.5 K and stretches the heating season roughly 1.9x
    # too long.
    hdd_baseline_c: 18.0
    hdd_temperature_field: t_mean_c
    # A room heater is 2 kW whatever type it is. BEE 2024 Figure 21 gives
    # the mix among owning households: fan heater 65%, halogen/quartz 33%,
    # oil-filled radiator 2% - all of them 2 kW class.
    appliance_kw: 2.0
    # HOW LONG it runs, per owning household, on a design winter day. This
    # is an affordability decision as much as a comfort one, which is why
    # it is graded by income: at Punjab tariffs a 2 kW heater costs about
    # Rs 14 an hour, so a low-income household runs it while the family is
    # in one room before bed, and a high-income household leaves it on.
    #, declared.
    # FIX. The residential hours below were and the
    # high-income 6.0 was TWICE the only measured figure available. CEEW's India
    # Residential Energy Survey (IRES) 2020 - ~15,000 households, 152 districts,
    # 21 states, and the survey BEE's own report cites - measures it directly:
    #   "On average, households use electric room heaters for three hours a day
    #    during winter months."
    # (Awareness and Adoption of Energy Efficiency in Indian Homes
    #  reputable research org, MEASURED.)
    #  https://www.ceew.in/sites/default/files/CEEW-IRES-Awareness-and-adoption-of-EE-in-Indian-homes-07Oct20.pdf
    # *** VERIFIED by downloading and parsing the report (80 pp).
    # The quote is verbatim: "On average, households use electric room heaters
    # for three hours a day during winter months." Survey scale confirmed too:
    # ~15,000 households, 152 districts, 21 states.
    # Url UN-Wrapped IN The Same Edit: this citation used to be split across two
    # comment lines, and scripts/citation_register_build.py truncates a URL at
    # the line break - so the register had been recording it as the bare
    # directory "ceew.in/sites/default/files/" and counting it among the
    # root-domain defects. It was never a bad citation; it was a line wrap. Once
    # joined, the PDF fetches fine (HTTP 200) even though ceew.in 403s at the
    # section level. Keep Long URLs ON One Line.
    # Bonus Figure Not Currently Used, worth knowing for: the same figure
    # reports space-heating users as "Punjab [Users: 12.7%]". The model assumes
    # 18% room-heater ownership for HIGH income, which sits sensibly above a
    # The INCOME GRADING is kept - running a 2 kW heater at Punjab tariffs costs
    # about Rs 14/hour, so it is a cost decision and the rich do leave it on -
    # but it is now CENTRED on the measured 3.0 instead of running away from it:
    # mid income takes the measured average, high sits one step above it rather
    # than at double it, low one step below. The grading itself stays;
    # the level it is anchored to is now measured.
    # Why CEEW and not BEE for this: BEE 2024 surveyed 4,321 households
    # nationally and reports room-heater ownership as "negligible" without a
    # state or income breakdown. CEEW is 3x larger, State-Resolved, and gives
    # Punjab explicitly - 12-14% of Punjab households use space heating, "most
    # of them economically well-off", ~60% of those with electric room heaters.
    # That is the population this model's high-income tier represents.
    running_hours_by_category:
      low_income_residential:  2.0    # below the measured mean (cost-constrained)
      mid_income_residential:  3.0    # = CEEW IRES 2020 measured mean
      high_income_residential: 4.0    # above the mean, was 6.0 (2x measured)
      school:                  4.0
      office:                  5.0
      shopping_centre:         5.0
      retail_highstreet:       5.0
      restaurant_food_service: 4.0
      hotel_guesthouse:        6.0
      healthcare:              8.0    # 24 h wards, but only partly heated
      public_services:         4.0
      religious:               2.0

    # WHEN. Unit-sum, same convention as DHW. Note these DO keep load
    # overnight - unlike a geyser, a room heater legitimately runs at
    # 02:00, and the richer the household the longer it stays on. That is
    # the half of that was never wrong.
    daypart_profile_by_class:
      low:
        "18_20": 0.45
        "20_22": 0.45
        "22_24": 0.10
      mid:
        "06_08": 0.15
        "16_18": 0.10
        "18_20": 0.28
        "20_22": 0.30
        "22_24": 0.17
      high:
        "00_02": 0.10
        "02_04": 0.09
        "04_06": 0.10
        "06_08": 0.13
        "08_10": 0.05
        "16_18": 0.07
        "18_20": 0.14
        "20_22": 0.16
        "22_24": 0.16
      commercial:
        "06_08": 0.15
        "08_10": 0.20
        "10_12": 0.15
        "12_14": 0.12
        "14_16": 0.12
        "16_18": 0.15
        "18_20": 0.11

# ---------------------------------------------------------------------------
# Cooling factor (multiplicative by month + daypart) — drives the cooling
# part of demand for AC-equipped categories.
# ---------------------------------------------------------------------------
cooling_factors:
  # =====================================================================
  # FIX. The twelve numbers below were
  # Hand-Typed with no source, no Url, no tier and no derivation, and they
  # scale ~32% of district demand - the largest uncited quantity in the
  # model. In the same realism audit the HEATING month factor, a
  # load 3.7x smaller, was upgraded from a hand-typed table to a
  # climate-derived degree-day proxy. The rigour was applied to the small
  # load and withheld from the big one. It is now applied to both.
  # `cooling_base_c` switches the month factor to cooling degree days
  # computed in `Economics.cooling_factor_for_month` from climate.yaml. The
  # table below survives ONLY as the no-climate fallback for small-grid
  # tests. Delete `cooling_base_c` to return to it.
  # Base 24 C IS A Regulation, Not A Modelling Choice. The Ministry of Power
  # notification of makes 24 C the mandatory factory-default
  # setpoint for every BEE star-labelled room air conditioner sold in India
  # from, up to 10,465 W cooling capacity (,
  # https://www.pib.gov.in/PressReleasePage.aspx?PRID=1598508 ). It is also
  # the CONSERVATIVE end of the range: a building's cooling balance point
  # sits BELOW its thermostat because of internal and solar gains, so a
  # physically derived base would be lower and would give MORE cooling than
  # this.
  # Second, Independent Tier 1 Line,
  # document). The MoP notification above is a regulation about EQUIPMENT: it
  # sets the factory default on an air conditioner. This one is a modelling
  # convention for BUILDINGS, which is closer to what this model does. BEE,
  # "Handbook of Replicable Designs for Energy Efficient Residential
  # Buildings" (2021, Indo-German Energy Programme with GIZ), section 4.2.2
  # "Comfort Standards", verbatim:
  #   "The modelling methodology adopts the comfort standard used for the
  #    Residential Building Energy labelling program being developed by BEE
  #    viz. Approximately 25% of the building is considered to be air
  #    conditioned with a set point temperature of 24 deg C for cooling and
  #    21 deg C for heating, while the remaining regularly occupied spaces
  #    work in mixed mode operation with set point temperatures based on the
  #    India Model for Adaptive Comfort (IMAC)."
  # Two independent routes now support the single parameter that sets
  # the largest end use in this district. Note the handbook also assumes only
  # ~25% of floor area is conditioned, which is a DIFFERENT quantity from this
  # model's per-tier ownership assumptions and must not be conflated with
  # them.
  # Second, Independent Tier 1 Line,
  # document). The MoP notification above is a regulation about EQUIPMENT: it
  # sets the factory default on an air conditioner. This one is a modelling
  # convention for BUILDINGS, which is closer to what this model does. BEE,
  # "Handbook of Replicable Designs for Energy Efficient Residential
  # Buildings" (2021, Indo-German Energy Programme with GIZ), section 4.2.2
  # "Comfort Standards", verbatim:
  #   "The modelling methodology adopts the comfort standard used for the
  #    Residential Building Energy labelling program being developed by BEE
  #    viz. Approximately 25% of the building is considered to be air
  #    conditioned with a set point temperature of 24 deg C for cooling and
  #    21 deg C for heating, while the remaining regularly occupied spaces
  #    work in mixed mode operation with set point temperatures based on the
  #    India Model for Adaptive Comfort (IMAC)."
  # Two independent routes now support the single parameter that sets
  # the largest end use in this district. Note the handbook also assumes only
  # ~25% of floor area is conditioned, which is a DIFFERENT quantity from this
  # model's per-tier ownership assumptions and must not be conflated with
  # them.
  # Method: degree days from daily Max and Min (Cibse TM41 / UK Met Office
  # triangular form), not degree days on the monthly mean. This is the whole
  # reason the audit refused to name a direction for. Zirakpur's March
  # mean is 21.4 C but its mean daily max is 28.0 C; October is 25.2 / 32.0.
  # Degree days on the mean call both months ZERO cooling, which is plainly
  # wrong for north India - Jensen's inequality, logged separately as.
  # The triangular form recovers them (mar 0.12, oct 0.32, nov 0.09).
  # WHAT IT DOES. Cooling 264.44 -> 243.64 GWh (-7.9%); district demand
  # -2.50%. Sensitivity on the base, same method: 26 C -> -5.16% district,
  # 28 C -> -8.62%. On the mean-temperature method the same bases give
  # -5.35% / -9.12% / -14.15%, i.e. the Jensen defect alone is worth about
  # 3 percentage points of district demand.
  # NOTE the hand-typed table was not far off: it sits within 7.9% of a
  # base-24 triangular derivation. Like and this was a roughly
  # right answer with no working shown - which is still a viva problem on
  # the single largest number in the model.
  # ===== Validated Against Punjab'S Actual Billing =====
  # The audit asked for exactly this check and could not find the data:
  # "cite it against measured PSPCL monthly domestic sales seasonality".
  # It exists. PSERC Tariff Order FY 2023-24 for PSPCL, Table 69 p.84,
  # "Category-wise metered energy sales projected by PSPCL for FY 2022-23"
  # (, https://pspcl.in/pdfs/currenttariff/sesalesto2023052610211318601062023.pdf ).
  # The order defines the halves on p.82: H1 = actual April-September,
  # H2 = October-March.
  #                        H1        H2      ratio
  #   PSPCL Domestic   10,561     6,184      1.708   MkWh, FY 2022-23
  #   this model        343.61    209.35     1.641   GWh, residential
  #                                          -3.9%
  # The season derived above reproduces the summer-to-winter shape Punjab's
  # own utility bills its domestic customers, to within four percent, on the
  # largest single quantity in the model.
  # Caveats, and they run in our favour: PSPCL Domestic covers All of Punjab
  # including rural, while this town is entirely urban with far higher AC
  # penetration - which would push our ratio ABOVE theirs, so sitting 3.9%
  # under is the conservative side. Punjab's 300 units/month domestic subsidy
  # distorts behaviour in ways this cannot separate. Ours is 2030 design
  # demand, theirs FY 2022-23. Table 69 is a projection built on six months of
  # actuals plus a CAGR, though Table 67 p.82 gives six years of ACTUAL H2
  # domestic sales (5,647 / 5,453 / 5,614 / 5,596 / 6,147 / 5,889 MkWh) which
  # bracket the 6,184 used here closely.
  # Why This Matters Beyond: it defends the Result independently of the
  # 24 C base. Even if the AC-setpoint citation below were challenged, the
  # season it produces is confirmed by measured billing.
  cooling_base_c: 24.0
  # ---- LEGACY hand-typed fallback (no-climate tests only) -------------
  cooling_factor_by_month:
    jan: 0.00
    feb: 0.05
    mar: 0.25
    apr: 0.55
    may: 0.90
    jun: 1.00
    jul: 0.80    # monsoon reduces cooling
    aug: 0.75
    sep: 0.65
    oct: 0.40
    nov: 0.15
    dec: 0.00

  # PROVENANCE. Twelve hand-set numbers shaping ~32% of
  # district demand, previously with no source. Tier 4 - Expert Judgement,
  # declared. Not one value is changed here; a citation is not retro-fitted to
  # numbers that were not derived from it.
  # What The Curve Says, and it is physically right: cooling peaks at 14:00-16:00
  # (1.00), NOT at solar noon. That two-hour lag behind peak irradiance is the
  # thermal mass of Indian masonry construction re-radiating into the evening,
  # and it is the same effect the config already models for the monsoon
  # variant. The curve then decays slowly overnight (0.55 at 22-24, still 0.40
  # at 00-02) rather than switching off, which is what a bedroom AC on a
  # thermostat actually does. A curve that peaked at noon and hit zero at
  # midnight would be the tell-tale of a shape nobody had thought about.
  # CORROBORATION for the lag and the evening persistence: the model's own
  # heat-wave and monsoon cooling treatments (Realism audit A1), and the BEE
  # star-label duty-cycle basis already cited for the cooling W/m2 intensities.
  # The monthly ENVELOPE this shape sits inside is now fully derived - see
  # `cooling_base_c` above, - so the seasonal half of cooling is
  # anchored even though the diurnal half remains judgement.
  # UPGRADE PATH: measured Indian residential AC duty-cycle data by hour. The
  # Prayas eMARC dataset separates air-conditioned from non-air-conditioned
  # households in its 10:00-18:00 analysis and is the closest public source.
  # =====================================================================
  # Fix. Residential Cooling IS A Different Load From
  # Commercial Cooling, IN Both Shape And Duration.
  # The single `cooling_daypart_shape` below served a bedroom air
  # conditioner, an office air conditioner and a refrigerated warehouse
  # alike. It is an OFFICE curve - it peaks at 14:00-16:00 and it runs
  # 14.4 equivalent full-load hours a day. Both are wrong for a home, and
  # the second is wrong by more than the first.
  # ---- WHEN: measured, four ways ----
  # Prayas eMARC, Harvard Dataverse doi:10.7910/DVN/YJ5SP1 (,
  # MEASURED): 12.7M 15-minute blocks from 143 mainline smart meters at five
  # Indian locations, Jan 2018 - Jun 2020, households pre-classified by AC
  # ownership. Taking (AC homes - Basic homes) in summer MINUS the same
  # difference in winter - winter being a natural control, since the ACs are
  # off and what remains is the wealth difference - isolates the load that
  # appears only when it is hot:
  #     22:00-06:00  79.2%      12:00-18:00  11.5%
  # Corroborated independently three times over:
  #     Ramapragada et al. 2022, Hyderabad, 25 metered homes:  84% night
  #     Hisham et al. 2021, Malaysia, 20 dwellings:            79% night
  #     CSE Delhi: residential midnight peak 5,256 MW against the
  #       commercial afternoon peak 5,280 MW - within 0.5%
  # The Punjab Adjustment, Declared. The profile below runs 67% night, not
  # the measured 79%. Two reasons, both stated so they can be challenged:
  #   (a) the eMARC AC households are all Maharashtra - the north India
  #       subset (Kanpur rural, Gonda) contains ZERO air-conditioned homes.
  #       Zirakpur runs +2.8 C hotter than Pune by day AND +2.8 C by night,
  #       i.e. uniformly, so the SPLIT should transfer - but Punjab's 38.6 C
  #       May afternoons will drive some daytime cooling that Pune's do not.
  #   (b) the high-income tier is a 300 m2 plotted kothi, more likely to be
  #       occupied during the working day than a Pune flat.
  # adjustment from a measurement. If challenged, the honest
  # answer is that the measurement says 79% and we chose 67%.
  # ---- HOW LONG: the bigger error ----
  # The old curve integrates to 7.20 x 2 h = 14.4 Equivalent Full-Load Hours
  # PER DAY. A room air conditioner runs 6.2 h/day measured (Ramapragada
  # 2022). This is the same defect class as HEAT-1, which ran geysers 12.2
  # hours against a real 1-3.
  # Equivalent hours AT The Coincident Peak are higher than the per-unit
  # runtime, because the peak is diversified:
  #     equivalent hours = units x unit_kW x runtime / peak_kW
  #                      = runtime / coincidence factor
  # so the correction is GRADED by tier, hitting hardest where the
  # coincidence factor is highest:
  #     tier  units  unit kW  coinc  peak kW  runtime  equiv h   was
  #     low    1.70    0.200   0.80    0.273     9.0h   11.21   14.40
  #     mid    2.26    1.210   0.62    1.695     6.2h   10.00   14.40
  #     high   5.10    1.050   0.76    4.057     6.2h    8.18   14.40
  # Bottom-up June cooling per household falls to 3.06 / 16.95 / 33.20
  # kWh/day from 3.59 / 24.23 / 57.82.
  # Desert coolers (low income) get 9 h rather than 6.2: they are cheap to
  # run, have no thermostat, and are commonly left on through the night.
  # Why This Matters Beyond The Energy: cooling at midnight does not
  # coincide with rooftop solar. This REDUCES PV self-consumption, which is
  # the mechanism the vs-BAU case rests on. It is the fix that costs us most.
  # =====================================================================
  residential_cooling:
    # unit-sum profile - says WHEN only. Scaled by the hours below.
    daypart_profile:
      "00_02": 0.21
      "02_04": 0.18
      "04_06": 0.12
      "06_08": 0.03
      "08_10": 0.02
      "10_12": 0.02
      "12_14": 0.02
      "14_16": 0.03
      "16_18": 0.04
      "18_20": 0.07
      "20_22": 0.10
      "22_24": 0.16
    # equivalent full-load hours per day in the PEAK month, at the
    # coincident peak. Derived above, not assumed.
    # =================================================================
    # *** RE-DERIVED. WAS 11.21 / 10.00 / 8.18. ***
    # The table above computes EFLH = runtime / diversity. That only gives
    # the right Energy if the Peak it multiplies uses the Same diversity.
    # It did not. Two places in this config disagreed about desert coolers:
    #   * `desert_cooler.w_per_m2_peak: 8.0` is derived as
    #     1.7 units x 0.2 kW / 42.7 m2 - NO diversity factor, i.e. 1.0
    #   * the derivation table above applied 0.80 diversity to the same
    #     coolers
    # The model takes the PEAK from the first and the HOURS from the second,
    # so the cancellation fails and cooling is inflated for exactly the two
    # tiers that own coolers.
    # Proof The Method IS Right, not just different: re-deriving High income
    # - 100% inverter AC, nothing to blend - returns 8.158 against the 8.18
    # in use, a 0.3% match. The method reproduces the tier it cannot get
    # wrong, and only the cooler-owning tiers move.
    # RE-DERIVATION, energy-weighted over the CURRENT mixes, using each
    # technology's own embedded diversity (cooler 1.00, window AC 0.62,
    # inverter AC 0.76) and runtime (cooler 9.0 h, AC 6.2 h Ramapragada):
    #     EFLH = SUM_t [ (w_t / diversity_t) x runtime_t ] / SUM_t w_t
    #   low   (fan.25 / cooler.75, 6.25 W/m2)   11.21 -> 9.00  (x0.803)
    #   mid   (cooler.20 / win.32 / inv.48)    10.00 -> 8.95  (x0.895)
    #   high  (inverter 1.00, 16 W/m2)             8.18 -> 8.16  (x0.997)
    # Physically The NO-Diversity Reading IS The Right One: a desert cooler
    # has no thermostat and is left running, so every cooler that is on
    # draws full power at the same time - its diversity really is ~1.0. An
    # AC cycles, so it diversifies. The 0.80 in the old derivation table had
    # no source.
    # EFFECT: residential cooling falls ~7.5%, about -1.5% of district
    # demand. It CUTS demand, so it makes the absolute cost of both the town
    # and BAU smaller; the vs-BAU ratio is barely affected.
    # Ramapragada's measured 6.2 h/day is STILL fully encoded - that was
    # verified end to end on and is not what changed here.
    # =================================================================
    # low re-derived AGAIN after the 10% box-AC addition changed
    # its mix: fan 0.20x1.0 + cooler 0.70x8.0 + window 0.10x18.0 = 7.60 W/m2,
    # and the AC leg carries 0.62 diversity where fan and cooler carry 1.00.
    #   [ (0.2/1.00)x9.0 + (5.6/1.00)x9.0 + (1.8/0.62)x6.2 ] / 7.60 = 9.24
    equivalent_full_load_hours:
      low_income_residential:   9.24
      mid_income_residential:   8.95
      high_income_residential:  8.16
    # NOTE: no monsoon daypart variant for residential. The monsoon month
    # FACTOR still applies; what is not modelled is a monsoon-specific
    # RESHAPING of the residential day. Humid monsoon nights would if
    # anything push residential cooling further into the night, so omitting
    # it is conservative for the direction this fix already moves.

  # ---- NON-RESIDENTIAL cooling: unchanged, and correctly so -----------
  # Offices, retail, schools and cold stores DO peak in the afternoon, and
  # the 14:00-16:00 peak with its two-hour lag behind solar noon (thermal
  # mass re-radiating) is right for them. LBNL-6674E confirms the commercial
  # sector peaks in summer afternoons. Only the residential half was wrong.
  cooling_daypart_shape:
    "00_02": 0.40
    "02_04": 0.30
    "04_06": 0.20
    "06_08": 0.20
    "08_10": 0.40
    "10_12": 0.70
    "12_14": 0.90
    "14_16": 1.00     # peak afternoon cooling
    "16_18": 0.95
    "18_20": 0.85
    "20_22": 0.75
    "22_24": 0.55

  # (Realism audit A1): monsoon dayparts have a different
  # shape than dry months. During Jun-Sep:
  #   - midday cloud cover dampens 10-14h cooling demand
  #   - humid evenings (RH ~75-85%) drive higher 18-22 demand because
  #     stagnant humid air feels much hotter and sleep AC ramps up
  #   - early morning (02-06) demand stays high (warm humid nights)
  # Applied to months in `monsoon_months` below when the table is
  # present. Defaults to the non-monsoon `cooling_daypart_shape` otherwise.
  monsoon_months: ["jun", "jul", "aug", "sep"]
  cooling_daypart_shape_monsoon:
    "00_02": 0.55      # warm humid nights = sleep AC stays on
    "02_04": 0.50
    "04_06": 0.40
    "06_08": 0.30
    "08_10": 0.45
    "10_12": 0.60      # cloud cover muffles midday solar gain
    "12_14": 0.70      # was 0.90 outside monsoon
    "14_16": 0.80      # was 1.00 outside monsoon
    "16_18": 0.85
    "18_20": 1.00      # post-rain humid evening = peak cooling
    "20_22": 0.95
    "22_24": 0.75

# ---------------------------------------------------------------------------
# Base (non-cooling, non-heating) demand profile per category — daypart × daytype.
# All values are fractions of category peak occupancy.
# FX-4: residential FESTIVAL evenings (18_20 / 20_22 /
# 22_24) lifted ABOVE the 1.00 weekday cap (1.05 / 1.05 / 1.00): festive
# lighting + cooking + guests extend and raise the evening plateau
# (../DATA/india_lighting_wfh_festivals.md: decorative lighting until
# 23:30-00:30, evening-cooking bumps derived). The Diwali patch
# (behavioural_864.festival_diwali_evening, x1.15 oct-nov) stacks ON TOP,
# giving ~ +21% Diwali residential evenings - inside the file's cited
# 10-20%+ local-distribution band for dense peri-urban areas. NOTE the
# district-TOTAL fest/wd daily ratio staying ~0.98-1.0 is REALISTIC:
# school/office/industry closure offsets the residential bump (same
# source: Diwali-day system peaks can run BELOW nearby working days).
# ---------------------------------------------------------------------------
# =============================================================================
# Provenance. The Audit'S Headline Finding.
# These 504 numbers (14 categories x 3 day-types x 12 dayparts) drive 57.8% of
# district demand, and together with `cooling_daypart_shape` and the heating
# shapes they drive 98.6% of it. They had NO Source OF Any Kind.
# The contrast was the real problem. Everything bolted ON TOP of these shapes
# is cited to a high standard: lighting_evening_peak to BESCOM 2022,
# wfh_day_of_week to NASSCOM 2024-25, festival_diwali_evening to CPCB Punjab,
# the cooling W/m2 intensities to the BEE star-label database, smart charging
# to IEA Geo and the Bses/Isgf pilots, the PV monthly shapes to the Gsa hourly
# report. Those are +/-15% patches. The 100% substrate they multiply carried
# nothing. An examiner asking "where does this curve come from?" about any
# figure on any chart would have reached this block.
# What This Fix IS And IS Not. Not a single number below is changed - the
# audit's own finding was that these shapes are PLAUSIBLE and UNSOURCED, not
# wrong. Nor is a citation retro-fitted to them, which would be worse than
# none: they were not derived from Prayas or CEA or anything else. They are
# declared for what they are, corroborated against real sources, and given an
# upgrade path.
# Tier 4 - Expert Judgement, hand-set. Stated plainly.
# CORROBORATION. Independent measured Indian residential load research agrees
# with the SHAPE these curves describe - twin morning and evening peaks, a
# deep midday trough that shallows as air-conditioning ownership rises, and a
# night floor well above zero:
#   - Prayas (Energy Group) eMARC: minute-resolution smart-meter data from
#     115-116 households across Pune city, Pune rural, Aurangabad, Kanpur
#     rural and Gonda, Jan 2018 - Jun 2020, published as average hourly load
#     curves.. https://energy.prayaspune.org/our-work/article-and-blog/electricity-load-patterns
#   - Prayas, "Residential Electricity Consumption in India: What do we know?"
#     - compiles measured load curves from Gujarat (summer and winter),
#     Tamil Nadu feeder analysis and BESCOM..
#     https://energy.prayaspune.org/images/pdf/residential_electricity_consumption_in_india.pdf
#   - BESCOM residential load curve, already cited in this file for the
#     lighting_evening_peak patch..
# What Our Curves Actually Say, so the corroboration can be checked rather
# than taken on trust (weekday, residential):
#   morning peak 06-08   low 0.85   mid 0.80   high 0.85
#   midday trough 14-16  low 0.40   mid 0.30   high 0.40
#   evening peak 18-22   low 0.95   mid 1.00   high 1.00
#   night floor 02-04    low 0.45   mid 0.40   high 0.50
#   evening-to-trough    low 2.37x  mid 3.33x  high 2.50x
# The mid tier has the deepest trough because it is the tier that empties
# during the working day; the high tier's trough is shallower because a kothi
# retains daytime occupancy. That is a claim a reader can now test.
# NON-RESIDENTIAL categories follow occupancy-schedule convention rather than
# metered data. ECBC 2017 (BEE / Ministry of Power,
# https://beeindia.gov.in/en/programmesbuildings/ecbc ) fixes potential daylit
# time at 09:00-17:00 for all building types, which is the window these
# schedules ramp across.
# UPGRADE PATH, stated so the gap is bounded rather than open-ended: replacing
# with needs measured half-hourly Indian residential load data
# disaggregated by income - the eMARC dashboard is the closest public source,
# and CEA publishes state-level load curves. Neither is currently in a form
# that maps onto 14 categories x 3 day-types. Until then this is expert
# judgement, declared.
# Symmetry Note, and it is why this was a Defensibility item and not a
# Correctness item: BAU and the designed town use the Same shapes, so
# the headline -37.5% / -55.5% ratio is structurally insulated from any error
# here. Verified, not assumed - the pin-discovery scripts pass the identical
# `net` object to both solves.
# =============================================================================
