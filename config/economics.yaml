# ---------------------------------------------------------------------------
# EV adoption (NEW). Adds an EV-charging load to the relevant categories.
# Default: middle of 2030 forecast.  Run sensitivity to compare.
# Charging window 18:00-06:00 dominant for residential; office adds 08:00-18:00.
# ---------------------------------------------------------------------------
ev_adoption:
  # Path A calibration: bumped 2030_default fleet_share 0.12 -> 0.20
  # and household_adoption 0.10 -> 0.18 to align with Punjab EV Policy 2022's
  # 25% new-registrations target + EV30@30 national stock-flow expectations.
  # Sources: Punjab EV Policy 2022 (extended to Feb 2027); EV30@30; CEEW EV
  # transition assessment. 2030_slow / 2030_fast bracket bumped accordingly.
  #: OF The Three Fields IN This Ladder, Only
  # `fleet_share` IS READ, and only for OFFICE EV - 0.173 GWh, 0.021% of
  # district demand. Verified by grep:
  #   fleet_share           1 read   (office EV only)
  #   household_adoption    0 reads  (was the residential fallback before the
  #                                   by-income table; removed the last
  #                                   path that could reach it)
  #   v2g_capable_fraction  0 reads  (V2G fleet comes from
  #                                   ev_vehicle_ownership.v2g_willingness_
  #                                   by_income x cars per household)
  # So switching 2030_slow -> 2030_fast moves district demand by ~0.026%. The
  # ladder reads as a headline scenario axis and is very nearly decorative.
  # Kept because `fleet_share` is live and the slow/fast bracket is a real
  # sensitivity on office charging - but the thesis must not present this as
  # an EV adoption scenario for the town. The town's EV adoption lives in
  # `ev_vehicle_ownership.ev_car_share_by_period`, which is cited and does
  # ramp.
  default_scenario: 2030_default
  scenarios:
    2030_slow:     {fleet_share: 0.08, household_adoption: 0.07, v2g_capable_fraction: 0.20}
    2030_default:  {fleet_share: 0.20, household_adoption: 0.18, v2g_capable_fraction: 0.35}
    2030_fast:     {fleet_share: 0.35, household_adoption: 0.30, v2g_capable_fraction: 0.55}
    # household_adoption and v2g_capable_fraction above are DEAD (0 reads).
    # Left in place only so the three scenarios stay structurally parallel;
    # do not add to them and do not cite them.

  # /: `ev_kwh_per_household_per_day: 10.0` used to
  # sit here. Nothing read it - the residential load came from charge_mult -
  # so it was dead config that nonetheless documented a 50 km/day basis and
  # was cited in comments elsewhere as if it were live. Deleted. The live
  # figure is `ev_vehicle_ownership.ev_car_kwh_per_day` (6.0, CEEW-anchored).
  ev_kwh_per_office_employee_per_day: 2.5     # workplace top-up (was 2.0)
  # ^ also unread today dead-field inventory): office EV comes from
  #   fleet_share x the charger-type mix below, not from this per-employee
  #   norm. Left in place with this warning because the office EV rebuild is
  # a separate finding, and deleting it now would strand that fix.

  # (Realism audit A4): replace the office magic `* 0.30` scalar
  # (previously hardcoded in `ev_demand_multiplier`) with a charger-type mix
  # that captures real heterogeneity in office charging. Three archetypes:
  #   - fast:  22 kW AC charger, 30 min top-up window, 5 kWh per session
  #   - slow:  7 kW AC charger, 4-h workday window, 12 kWh per session
  #   - phev:  3 kW residential-grade, ~2-3 kWh midday top-up
  # - REWRITTEN HONESTLY. This used to end: "Calibrated so
  # the aggregate ~ 0.30 of residential equivalent (matches the legacy magic
  # number) but the mix lets us audit-defend the choice." That sentence
  # describes fitting a justification to a number that was already there, and
  # then says so. It is the most quotable line in the config and it would have
  # been read aloud at a viva.
  # What IS Actually True. The 0.30 came first, as an undocumented scalar. The
  # three archetypes below were then chosen so their share-weighted duty cycles
  # reproduce it. The archetypes are individually plausible - 22 kW fast, 7 kW
  # workplace AC, 3 kW PHEV top-up are real charger classes - but their SHARES
  # were not measured, they were solved for. This is a reverse-derived
  # decomposition of a number, and calling it "audit-defendable" was
  # wrong: a decomposition inherits the provenance of what it decomposes.
  # Why IT IS Not Fixed Here, only relabelled. Office EV is 0.173 GWh, 0.021%
  # of district demand. The honest rebuild is to derive office charging from
  # employee counts x `ev_kwh_per_office_employee_per_day` (which sits unread
  # a few lines above), and that is a real change to a term worth two
  # hundredths of a percent. Recorded as the remaining half of rather
  # than done now.
  # The RESIDENTIAL side no longer has this problem: rebuilt it from a
  # declared vehicle stock, and made its baseline genuinely unmanaged.
  ev_charger_type_mix_office:
    fast:  {share: 0.20, kwh_per_session: 5.0,  duty_cycle: 0.50}
    slow:  {share: 0.65, kwh_per_session: 12.0, duty_cycle: 0.25}
    phev:  {share: 0.15, kwh_per_session: 2.5,  duty_cycle: 0.20}
  # Effective multiplier = sum(share * duty_cycle) ~ 0.30., reverse-derived.
  # =====================================================================
  # Fix. The Dumb Baseline Was Not Dumb.
  # This table is labelled below as "the DUMB-charging baseline (plug in ->
  # charge at full rate)". It used to put 40% of EV energy into 00:00-04:00
  # and only 30% into 18:00-22:00, i.e. it peaked at 2am.
  # Dumb charging peaks when people PLUG IN, which is arrival time. A profile
  # that peaks at 2am is timer-driven or tariff-driven behaviour - it is
  # already managed. The model then switched on `smart_charging` with
  # `shiftable_fraction_residential: 0.60` and let the LP move 60% of that
  # energy off-peak AGAIN. The benefit of managed charging was being measured
  # against a baseline that already contained most of the benefit.
  # This is a METHOD defect more than an energy one. EV is ~0.6% of district
  # demand, so the kWh at stake are small; but every thesis claim about the
  # value of a managed-charging programme rests on this comparison, and it is
  # ASYMMETRIC - `allow_ev_smart_charging` is off in the BAU and pv_* runs, so
  # the designed town takes the credit and BAU does not.
  # NOW: arrival-peaked, as a genuinely unmanaged profile is. Commuters reach
  # home 17:00-21:00 and plug in; the charger draws immediately at full rate
  # and tapers as packs fill. The overnight tail is late arrivals and long
  # charges, not a timer.
  #   before   00-04  0.40    18-22  0.30
  #   after    00-04  0.05    18-22  0.65
  # 08:00-16:00 Stays Exactly Zero, deliberately. The Rev-2 smart-charging
  # design defines the plug-in window as the support of this shape - "energy
  # can only move between hours where cars are demonstrably plugged in" - and
  # residential cars are at work. Putting any load in those dayparts would
  # silently widen the plug-in window to 24 hours and hand the LP flexibility
  # that does not physically exist.
  # DIRECTION: this INCREASES the measured value of smart charging, because
  # the LP now has a real evening peak to shift instead of a pre-shifted one.
  # It also raises the EV contribution to the evening system peak, which is
  # the hour that sizes the battery and the import connection. Fixing this
  # makes our own managed-charging result look BETTER, which is exactly why it
  # needed fixing rather than leaving - a favourable number obtained from a
  # rigged baseline is not a result.
  # Sums to 1.000; `ev_kw_per_household` normalises by the sum in any case, so
  # this table sets TIMING only and cannot change daily EV energy.
  # (arrival-time reasoning); the energy it distributes is CEEW-anchored.
  # =====================================================================
  ev_charging_daypart_shape_residential:
    "00_02": 0.03
    "02_04": 0.02
    "04_06": 0.02
    "06_08": 0.03
    "08_10": 0.00
    "10_12": 0.00
    "12_14": 0.00
    "14_16": 0.00
    "16_18": 0.13
    "18_20": 0.37
    "20_22": 0.28
    "22_24": 0.12
  ev_charging_daypart_shape_office:
    "00_02": 0.00
    "02_04": 0.00
    "04_06": 0.00
    "06_08": 0.05
    "08_10": 0.20
    "10_12": 0.25
    "12_14": 0.20
    "14_16": 0.15
    "16_18": 0.10
    "18_20": 0.05
    "20_22": 0.00
    "22_24": 0.00

  # ---------------------------------------------------------------------
  # Rev-2 (trajectory batch,): EV Smart Charging. The daypart
  # shapes above are the DUMB-charging baseline (plug in -> charge at full
  # rate). A managed-charging programme can RESCHEDULE part of that energy
  # within each vehicle's plug-in window; the LP gets bounded shift
  # variables (ev_shift_out / ev_shift_in per slice and charging class,
  # conserved per (month, day-type) bucket - the FX-1 DSR bucket pattern).
  # The plug-in WINDOW = the support of the cited daypart shapes above
  # (residential ~16:00-08:00 overnight, workplace ~06:00-20:00): energy
  # can only move between hours where cars are demonstrably plugged in.
  # Shiftable fractions (share of EV energy the programme can move):
  #   - IEA Global EV Outlook (grid-integration chapter): managed charging
  #     can move 50-70% of light-vehicle charging energy out of peak hours
  #     where overnight home charging dominates (,
  #     https://www.iea.org/reports/global-ev-outlook-2024).
  #   - India pilots: BSES Delhi (BRPL) smart-charging / managed-EV pilots
  #     and the ISGF EV-grid integration roadmap report high headroom for
  #     residential overnight shifting; workplace sessions are shorter so
  #     the movable share is lower (,
  #     https://indiasmartgrid.org/reports.php [ISGF EV grid integration]).
  #     *** Bses Link Dropped. *** It pointed at
  #     bsesdelhi.com/web/brpl/press-release, a press-release INDEX. It was
  #     fetched and parsed on 3,835 characters of helpline
  #     numbers, menu links and a WhatsApp signup, with no pilot content and
  #     no shifting figure. Removing a citation that evidences nothing makes
  #     the claim stronger, not weaker.
  #     What Now Carries This Parameter: the Tpddl Delhi pilot, which
  #     measured ~10% of peak and is what actually moved the value on.
  #     Note the ISGF link above is also a listing page - if this fraction is
  #     ever challenged, TPDDL is the only thing behind it.
  # Central values (, derived from the band): residential 0.60
  # (13-16 h plugged vs ~1.5 h needed at 7 kW -> most energy reschedulable;
  # 60% = mid of the 50-70% pilot band), workplace 0.50 (4-8 h sessions,
  # lower automation enrolment). The per-slice shift-IN bound reuses the
  # same fraction (post-shift load <= (1+f) x dumb-charging load in any
  # slice) - the-class anti-spike guard.
  # program_cost_inr_per_kwh: aggregator/platform fee per SHIFTED kWh
  # (managed-charging OpEx; small vs the Rs 2-6/kWh tariff spread it
  # arbitrages derived from managed-charging programme economics
  # in the IEA/ISGF sources above). Also kills degenerate zero-value
  # shuffles in the LP.
  # NOTE (documented overlap): the DSR aggregate_shiftable_fraction is
  # cited for APPLIANCE flexibility on TOTAL demand; EV energy also sits
  # inside that total. The two pools could in principle double-count a
  # small overlap (~1-2% of demand); treated as an upper-bound-of-
  # flexibility convention and stated in the thesis methods (REV-6 style).
  # The Pyomo builders consume this block; the heuristic fallback ignores
  # it (documented, like other LP-only features e.g. A18 module mix).
  smart_charging:
    enabled: true
    shiftable_fraction_residential: 0.60
    shiftable_fraction_workplace: 0.50
    program_cost_inr_per_kwh: 0.10

# ---------------------------------------------------------------------------
# EV vehicle ownership BY INCOME. Replaces the flat
# household_adoption with a 2030-stock ownership model that differs by income.
# Low income own ~no cars (cycles / occasional e-2W); cars are a high-income
# asset (~25% of richest urban quintile, <10% overall). V2G is CARS-ONLY
# (2-wheeler batteries too small / often removable). derivations:
#   - Niti/Rmi EV30@30: 30% car + 80% 2W of New Sales 2030 -> ~12-15% EV-car
#     / ~25-30% e-2W STOCK by 2030 (fleet turnover).
#       https://www.niti.gov.in/sites/default/files/2025-08/Electric-Vehicles-WEB-LOW-Report.pdf
#   - Ownership by income: Data For India / CEEW (cars ~25% richest urban
#     quintile; 2W >50% of households). https://www.dataforindia.com/vehicle-ownership/
#   - Battery: manufacturer specs (Nexon EV ~30 kWh; Ola/Ather/Activa-e ~3 kWh).
#   - V2G willingness: 84% of Indian EV owners willing if it lowers bills (Zoho
#     2025, n=1000) -> discounted ~50% for intention-action gap + battery concern;
#     gradient by price-sensitivity. https://www.zoho.com/survey/studies/ev-adoption-india-2025.html
ev_vehicle_ownership:
  by_income:
    # 2030 baseline per; ev_car_share bumped from
    # 0.04/0.01 to 0.07/0.02 — Bain: 15-20% EV penetration of NEW 4W sales by 2030,
    # https://www.bain.com/insights/electric-vehicles-are-poised-to-create-a-$100-billion-opportunity-in-india-by-2030/
    # high-income are early adopters so their STOCK share runs above market avg:
    # ~30% car ownership x ~25% EV ~ 7%). ev_car_share/e2w_share = fraction of HH
    # owning that EV type.
    #: `charge_mult` (0.03 / 0.15 / 0.40) WAS here and was
    # documented as "EV-charging load added as a fraction of residential peak".
    # It was multiplied by a CELL's peak_base_kw while the fleet it represents
    # is counted per HOUSEHOLD, so a high-income household drew 15.7x a
    # low-income one purely because high-income cells hold 40 households and
    # low-income cells hold 480. The implied use was 24.3 kWh/car/day = 121
    # km/day in a 5 x 5 km town. The charging load is now built BOTTOM-UP from
    # the two shares below (see `Economics.ev_kwh_per_household_per_day`), so
    # charge_mult is deleted rather than left as dead-but-documented config.
    low:  {ev_car_share: 0.00, e2w_share: 0.05}
    mid:  {ev_car_share: 0.02, e2w_share: 0.18}
    high: {ev_car_share: 0.07, e2w_share: 0.12}
  # Per-period ev_car_share RAMP for the multi-period model (2030/2042/2055).
  # Claude 1 to wire the period-year lookup into v2g_units(econ, year) +
  # ev_demand_multiplier for the multi-period dispatch (2030 = by_income above).
  # 2042/2055 ramp toward saturation as EV-car penetration matures.
  ev_car_share_by_period:
    2030: {low: 0.00, mid: 0.02, high: 0.07}
    2042: {low: 0.02, mid: 0.15, high: 0.30}
    2055: {low: 0.10, mid: 0.40, high: 0.55}
  battery_kwh:
    ev_car: 30        # Tata Nexon EV class (manufacturer spec)
    e2w: 3            # Ola S1 / Ather 450 / Activa-e class
  # Daily charging energy per owned vehicle. Since these two numbers ARE
  # the residential EV load: kWh/HH/day = cars/HH x ev_car_kwh_per_day
  # + e2w_share x e2w_kwh_per_day, distributed over the day by the cited
  # charging daypart shape. The per-period ramp falls out of ev_car_share_by
  # _period on its own, so no separate ramp factor is needed.
  # ev_car_kwh_per_day: 6.0 kWh = 30 km/day at 200 Wh/km.
  # from 10.0, which assumed 50 km/day.
  #   Anchor: CEEW, "How Urban India Moves" (n=3,682 urban dwellers) finds
  #   ~70% of urban Indians travel under 10 km one-way for work/education,
  #   mean one-way travel time 27 minutes (,
  #   https://www.ceew.in/publications/how-urban-india-moves ).
  #   Derivation (, one step): a sub-10 km one-way commute is under
  #   20 km/day; a conventional 40-60% uplift for non-commute trips
  #   (shopping, school runs, social) gives 25-35 km/day. 30 km/day is the
  #   midpoint, and it is generous for a 5 x 5 km self-contained new town.
  #   Declared Gap: CEEW measures Commute distance across All Modes, not a
  #   car odometer. No direct measurement of Indian urban private-car daily
  #   kilometres was found; the MoRTH Road Transport Year Book publishes
  #   vehicle STOCKS, not utilisation.
  #   https://morth.gov.in/road-transport-year-books
  #   *** DOMAIN MIGRATED,: morth.nic.in 301-redirects to
  #   morth.gov.in. The "60 characters" the register recorded was the redirect
  #   stub, not a dead link. Check Every Other.nic.in Citation For The Same. ***
  #   (URL un-wrapped it was split across two comment lines, and
  #   the register scraper truncates at the break, so it was being recorded as
  #   the malformed "morth.nic.in/road-transport-" and counted as a defect. The
  #   citation was always fine. Keep long URLs on one line.)
  #   The substitution is named rather than hidden, and the
  #   figure is labelled derived, not measured.
  #   Sensitivity: EV is ~0.6% of district demand, so the full 25-35 km/day
  #   band moves total demand by about +/-0.1 pp.
  #   e2w_kwh_per_day: ~1 kWh = ~30 km/day at ~30-35 Wh/km (3 kWh battery,
  #     Ola/Ather spec; partial daily charge).
  #     *** SPEC SHEET, replacing the storefront. Ather 450X
  #     specification sheet, downloaded and parsed locally, verbatim:
  #       "Battery | Installed capacity 2.9 kWh | Usable capacity 2.6 kWh |
  #        Lithium-ion, 21700 cell"
  #     https://assets.atherenergy.com/Ather450X-SpecificationsSheet.pdf
  #     The model uses 3 kWh, i.e. 3% above installed - it does not understate
  #     the load. (manufacturer), but for a hardware capacity the
  #     manufacturer IS the primary source. ***
  #     ** TIER 3 (declared),. The URL is the manufacturer's
  #     HOMEPAGE, which evidences no battery capacity. A manufacturer spec
  #     SHEET would be reasonable provenance for its own product, but a
  #     storefront is not one, and the 30-35 Wh/km efficiency and the
  #     "partial daily charge" assumption are this project's, not Ather's.
  #     To close: cite a specific model's spec page. Low stakes - e2w is a
  #     small term and the EV block is ~0.6% of district demand. **
  ev_car_kwh_per_day: 6.0
  e2w_kwh_per_day: 1.0
  # V2G is CARS ONLY (low income has no cars). Level ~45-50%.
  # *** Derivation Restated One Half IS Sourced, The Other IS AN
  # Assumption, And The Block Now Says SO. ***
  # It used to read "midpoint of India stated willingness 84% (Zoho 2025) and
  # actual pilot enrolment ~27% (best US program)". Checking both:
  #   84% Stated Willingness - Verified verbatim in the Zoho study: "A
  #     majority of respondents said they'd be open to letting EVs feed
  #     electricity back to the grid in exchange for lower energy bills (84%)".
  #     (Note the source says "respondents", not "EV owners" - it is a general
  #     EV-adoption survey, so the base is broader than current owners.)
  #   ~27% Actual Enrolment - Not IN Its Cited Source. The NC State piece was
  #     opened and parsed: zero hits for "27%", "enrol", "enroll", "uptake" or
  #     "opt-in". It is a QUALITATIVE study - "researchers conducted interviews
  #     with 42 stakeholders" - and it supports the EXISTENCE of a
  #     stated-versus-actual gap ("EV owners are unlikely to participate in V2G
  #     programs if they don't know how they will be compensated") but gives no
  #     participation rate at all.
  # SO The 45-50% IS A Declared Tier 3 Assumption, not a sourced midpoint: an
  # intention-action discount of roughly half applied to a verified 84% stated
  # willingness, on the qualitative evidence that such a gap is real. The 27%
  # is withdrawn as a number. Value unchanged; only the claim about where it
  # comes from is corrected.
  # Income gradient (mid > high, price-sensitivity) is a assumption.
  # Sources:
  #   https://www.zoho.com/survey/studies/ev-adoption-india-2025.html (84% stated)
  #   https://news.ncsu.edu/2026/03/vehicle-to-grid-obstacles/ (stated-vs-actual gap)
  v2g_willingness_by_income:
    low: 0.00
    mid: 0.50
    high: 0.45
  #: multi-car ownership. ev_car_share is the fraction of
  # households owning AT LEAST ONE EV-car; cars_per_owning_household scales that
  # to TOTAL EV-cars (so a 2-car affluent household contributes 2 V2G units +
  # ~2x car-charging load). derivation: 25% of the richest urban quintile
  # own a car (Data For India, https://www.dataforindia.com/vehicle-ownership/);
  # multi-car is an affluent-metro minority — assume ~20-25% of high-income
  # car-owning households own 2+, giving ~1.25 cars/owning-HH; mid ~1.05; low 1.0.
  # (CEEW vehicle-ownership-to-2050 saturation context:
  # https://www.ceew.in/publications/how-will-indias-private-and-passenger-vehicle-ownership-grow-by-2050)
  cars_per_owning_household:
    low: 1.00
    mid: 1.05
    high: 1.25

# ---------------------------------------------------------------------------
# Street lighting (NEW, Task 5). Night-heavy daypart shape used by
# EnergyNetwork.demand_by_slice_kw to distribute the GRID-lit road cells'
# street-lighting energy (per-capita norm in demand_norms.yaml x population x
# grid-lit road share) across the 2-hour dayparts. Streetlights run dusk->dawn
# (~18:00-06:00), so the daily energy is split ~equally over the six dark
# dayparts and 0 in daylight. Fractions sum to 1.0. Solar (off-grid) road cells
# carry NO grid load. (operational dusk-dawn schedule; ESMAP India street
# lighting + ANERT off-grid specs cited in config/demand_norms.yaml).
street_lighting:
  daypart_shape:
    "00_02": 0.167
    "02_04": 0.167
    "04_06": 0.167
    "06_08": 0.000
    "08_10": 0.000
    "10_12": 0.000
    "12_14": 0.000
    "14_16": 0.000
    "16_18": 0.000
    "18_20": 0.167
    "20_22": 0.166
    "22_24": 0.166
  # (Part 4): MONTHLY burn-hour modifier. Streetlights run dusk→dawn,
  # so the nightly burn window varies with daylength: Zirakpur (lat 30.64) winter
  # nights are ~14.0 h vs summer ~10.0 h (a 3.9 h / ±17 % swing). The daypart_shape
  # above is the FIXED daily SHAPE; this modifier scales each month's total
  # streetlight energy by dark_hours(month) / annual-mean-dark (11.98 h), so the
  # SEASONAL load profile is honest while the ANNUAL total is unchanged (mean = 1.0).
  # Values = dark_hours[month] / 11.98, computed from the model's own solar-geometry
  # (energy/solar_geometry.sun_position, sun-altitude>0 = daylight) at the Zirakpur
  # site lat/lon. (astronomical daylength; same engine as the PV shading model).
  # (trajectory batch, V-1 alignment): ENABLED. Was opt-in-OFF
  # solely because the -0.00024% headline move (-Rs 2,895) was not worth a
  # seasonal shape now rides the same regen at zero extra cost. This aligns
  # the demand model with the viewer's new seasonal civil-twilight lighting
  # summer-light while the ANNUAL total is unchanged (mean-normalised).
  # Convention Note (thesis): this modifier normalises Sunset-TO-Sunrise
  # dark hours (sun altitude < 0); the viewer switches lights at CIVIL
  # TWILIGHT (sun altitude < -6 deg, ~25-30 min later/earlier). Both derive
  # from the same energy/solar_geometry.py engine; the convention gap
  # compresses the winter/summer ratio by <3% relative and has ZERO effect
  # on annual energy (normalised), so the sunset-based table is kept.
  monthly_modifier_enabled: true
  monthly_modifier:
    jan: 1.152
    feb: 1.094
    mar: 1.019
    apr: 0.935
    may: 0.877
    jun: 0.835
    jul: 0.852
    aug: 0.910
    sep: 0.985
    oct: 1.060
    nov: 1.127
    dec: 1.169

# ---------------------------------------------------------------------------
# Microclimate coupling (Stage A → B): per-cell cooling load adjustments.
# Read by `energy.network.from_grid` using the cell's spatial context.
# ---------------------------------------------------------------------------
microclimate:
  # SOURCED (uncited-value sweep). Both values were uncited and
  # both STAND. The model gives a cell 2.5% cooling relief per green
  # neighbour, so a cell surrounded on all four sides gets 10%, capped at
  # 12%. Measured anchors:
  #   * a single mature (25 ft) tree cuts a typical residence's annual
  #     heating+cooling by 8-12% - Arboriculture & Urban Forestry, "Energy
  #     Conservation Potential of Urban Tree Planting"
  #     https://auf.isa-arbor.com/content/19/6/321. The model's
  #     12% ceiling is the TOP of that measured range, and only reachable
  #     with green on all four sides.
  #   * canopy-to-temperature: +10% canopy = -0.3 C ambient, and in
  #     heat-prone areas 10/20/30% more canopy = -0.8/-1.1/-1.5 C -
  #     npj Urban Sustainability (2025)
  #     https://www.nature.com/articles/s42949-025-00277-x.
  # Not Claimed: this is an Energy relief fraction, not a temperature
  # model. The two anchors bound its magnitude; they do not derive the
  # per-neighbour gradation, which stays a linear assumption.
  vegetation_cooling_reduction_per_neighbour_fraction: 0.025   # up to ~12% if all 4 neighbours are green
  vegetation_max_reduction: 0.12
  blue_space_proximity_reduction: 0.05      # additional 5% if within 1 cell of BLUE_SPACE
  wind_alignment_reduction_max: 0.08        # up to 8% if cell is fully wind-aligned
  # --- Street / Avenue Trees on Road cells ---
  #: this header used to end "Not Yet Read BY Code". It is
  # read, at energy/network.py:1232-1251, and it REMOVES 11.09 GWh of cooling
  # demand - trees shading a cell's road neighbours cut that cell's cooling
  # load, capped by `street_tree_cooling_max`. The per-cell `has_street_trees`
  # flag comes off the layout at network.py:1515. Labelling a live 11 GWh
  # effect as unread is the same defect class as below: a comment that
  # would lead a reader to discount a term the model is actually applying.
  # Tree-lined streets cool road-ADJACENT built cells via shade + evapotranspiration.
  # Evidence: Bangalore street-tree study — treed segments up to 5.6 C cooler air,
  # 27.5 C cooler road surface (Vailshery et al. 2013); continuous tree row
  # ~1.4 C ambient in a tropical canyon; WRI: +10% canopy ~ -0.3 C.
  # Conservative derivation: 1-2 C local cooling x ~8-10%/C cooling sensitivity
  # (DATA/punjab_power_and_demand_notes.md B.6.2) -> ~6% cooling-load cut per treed
  # road neighbour, capped ~12%. derivation.
  #   https://www.sciencedirect.com/science/article/abs/pii/S1618866713000289
  #   https://www.wri.org/insights/urban-trees-cooling-potential
  # ACTIVATION: wire into energy/network.py cooling calc + set values below -> re-dispatch.
  street_tree_cooling_reduction_per_treed_road_neighbour_fraction: 0.06
  street_tree_cooling_max: 0.12
  party_wall_reduction_per_built_neighbour: 0.015
  party_wall_max_reduction: 0.06
  # (Realism audit B4): when true, the party-wall reduction
  # term scales with shared-wall AREA (not just a binary 4-neighbour
  # count). For neighbour pair (h_me, h_nb), shared facade height is
  # min(h_me, h_nb), shared area is `shared * cell_size_m`. The reduction
  # per neighbour = (shared / (4 * my_height)) * party_wall_max_reduction,
  # so 4 equal-height neighbours sum to party_wall_max_reduction (matches
  # the legacy binary-count maximum). Falls back to the legacy binary
  # count when set false.
  party_wall_area_weighted: true

# ---------------------------------------------------------------------------
# Inverter clipping + curtailment + thermal-derating realism.
# (Realism audit A2): added PV temperature derating. Punjab
# panels run 40-50 C in summer vs STC 25 C; missing derating was ~8-12%
# yield overestimate per the audit. Per-slice derating = -derating_per_C
# x (panel_temperature_at_slice - 25). The slice panel temperature is
# the ambient design temperature + a NOCT uplift of 25 C (standard rule
# of thumb for crystalline-Si).
# Coefficients calibrated for India 2030 c-Si modules (NREL India 2024).
# ---------------------------------------------------------------------------
pv_inverter:
  # ⚠ The Next Two Keys Are Documentation, Not Model Inputs (verified
  # by grep: no production code reads either one).
  # IS Inverter Clipping IN The Model? Yes - inside the anchor, not as an
  # explicit term, and it MUST stay that way. The `pv_capacity_factor` annual
  # anchor is GSA PVOUT_specific 1517.4 kWh/kWp, which Solargis defines as AC
  # electricity delivered by the PV system, after their whole loss chain.
  # Solargis KB: "All listed losses (except unavailability) flow into the
  # final PVOUT specific figure" - https://kb.solargis.com/docs/pv-system-losses
  # The note at `apply_absolute_temperature_derate` below names the six terms
  # that live inside the anchor rather than in our chain, and CLIPPING is one
  # of them (angular, spectral, clipping, mismatch, AC cabling, transformer).
  # Corroboration: PVOUT / GTI_opta = 1517.4 / 1925.4 = a performance ratio of
  # 0.788, which is only consistent with a full chain INCLUDING clipping - a
  # chain that excluded it would land nearer 0.81-0.82.
  # SO: applying `clipping_loss_at_peak` explicitly would DOUBLE-COUNT, exactly
  # as found for dc_loss_fraction and the absolute temperature derate.
  # Both keys are retained to record the assumed system configuration, and
  # become live inputs only if the anchor is ever re-based onto GTI_opta.
  dc_ac_ratio: 1.20             # DOC ONLY - assumed array/inverter sizing
  clipping_loss_at_peak: 0.03   # Doc Only - already inside the Gsa Pvout anchor
  # FIX: was 0.004, which is the poly_si value applied to a
  # fleet that `technologies.rooftop_pv.module_types` declares is 65% mono-PERC.
  # 0.003525 is the share-weighted blend of that same table
  # (0.65x0.0035 + 0.25x0.0040 + 0.10x0.0025), making module_types the single
  # source of truth for module physics.
  temperature_derating_per_celsius: 0.003525   # share-weighted across module_types
  # Fix: the Absolute temperature derate is switched Off
  # because it is already inside the GSA PVOUT anchor - Solargis runs De Soto's
  # single-diode model on a cell temperature from their transient thermal
  # correction (https://kb.solargis.com/docs/solargis-evaluate-simulation-chain).
  # The Coefficient above is deliberately Retained, because Trj-5
  # (`pv_warming_period_derate`) needs it to compute the MARGINAL effect of
  # climate-drift warming in 2042/2055 - and that is NOT in the anchor, which
  # is built on historical climate. Absolute derate = double-count; marginal
  # derate = a real and separate effect. Set this true only if the anchor is
  # ever re-based onto GTI_opta AND the six missing Solargis loss terms
  # (angular, spectral, clipping, mismatch, AC cabling, transformer) are added.
  apply_absolute_temperature_derate: false
  ambient_temperature_c_by_month:
    jan: 14    # winter cold
    feb: 17
    mar: 22
    apr: 29
    may: 34    # pre-monsoon peak; panel reaches ~60 C cell temp
    jun: 33    # monsoon onset (cloudy + humid)
    jul: 30    # active monsoon
    aug: 30
    sep: 28
    oct: 26
    nov: 20
    dec: 15
  noct_temperature_uplift_c: 25   # panel cell temp above ambient under load (c-Si NOCT rule-of-thumb)
curtailment:
  enabled: true                  # if true, surplus PV beyond export cap is reported as lost (not negative cost)

# ---------------------------------------------------------------------------
# Scenario presets (unchanged, but discount rate now actor-dependent).
# ---------------------------------------------------------------------------
scenarios:
  bau:
    allow_rooftop_pv: false
    allow_solar_farm: false
    allow_battery: false
    allow_v2g: false
  pv_only:
    allow_rooftop_pv: true
    allow_solar_farm: true
    allow_battery: false
    allow_v2g: false
  pv_battery:
    allow_rooftop_pv: true
    allow_solar_farm: true
    allow_battery: true
    allow_v2g: false
  pv_battery_v2g:
    allow_rooftop_pv: true
    allow_solar_farm: true
    allow_battery: true
    allow_v2g: true
  pv_battery_v2g_biomass:
    allow_rooftop_pv: true
    allow_solar_farm: true
    allow_battery: true
    allow_v2g: true
