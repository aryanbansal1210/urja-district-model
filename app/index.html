<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale + user-scalable=no: this is an installed app, not a web page,
     and pinch-zooming a fixed 430px phone layout only ever breaks it. Note iOS
     has ignored user-scalable=no in Safari TABS since iOS 10 (an accessibility
     decision, and the right one) - it is honoured in STANDALONE mode, which is
     where it matters. touch-action in styles.css blocks the double-tap zoom
     that the viewport tag alone does not catch. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#EFEDE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Urja — your energy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div id="sheet"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* Offline is a requirement, so a failure here must be visible: the state lands
   on <html data-offline> and in the console rather than being swallowed. */
(function () {
  var root = document.documentElement;
  if (!("serviceWorker" in navigator)) { root.dataset.offline = "unsupported"; return; }
  if (location.protocol === "file:") { root.dataset.offline = "file-url"; return; }
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      root.dataset.offline = reg.active ? "ready" : "installing";
      if (reg.installing) reg.installing.addEventListener("statechange", function () {
        if (this.state === "activated") root.dataset.offline = "ready";
      });
    }).catch(function (err) {
      // A host that refuses registration outright (sandboxed preview frames) is
      // not an app fault: warn, don't error.
      var refused = err && (err.name === "AbortError" || err.name === "SecurityError" || err.name === "NotSupportedError");
      root.dataset.offline = refused ? "unavailable" : "failed";
      var msg = (err && err.message) || String(err);
      if (refused) console.warn("[urja] offline cache not available in this host:", msg);
      else console.error("[urja] offline cache failed to install:", msg);
    });
  });
})();
</script>
</body>
</html>
